<style>
:root {
  --bg: #fbfaf8; --panel: #f2f0ec; --text: #1d1f23; --muted: #646a73; --line: #dedad3;
  --accent: #007d9c; --accent-soft: #e0f1f5; --code: #f4f2ee; --done: #2e7d32; --warn: #a15c00;
  --sidebar: 300px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --panel: #1c1f23; --text: #e4e6e9; --muted: #9aa1ab; --line: #2e3238;
    --accent: #4fc3e0; --accent-soft: #163640; --code: #1f2226; --done: #66bb6a; --warn: #f0a640;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; }
a { color: var(--accent); }
code, pre { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }

/* sidebar */
#side { width: var(--sidebar); flex: none; height: 100vh; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 16px 12px 40px; }
#side h1 { font-size: 17px; margin: 0 4px 2px; }
#side .sub { color: var(--muted); font-size: 12px; margin: 0 4px 12px; }
#overall { margin: 0 4px 12px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--done); width: 0; transition: width .3s; }
#overall small { color: var(--muted); font-size: 12px; }
#filter { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); margin-bottom: 10px; font: inherit; font-size: 13px; }
.nav a { display: block; text-decoration: none; color: var(--text); padding: 3px 8px; border-radius: 5px; font-size: 13.5px; }
.nav a:hover { background: var(--accent-soft); }
.nav a.active { background: var(--accent); color: #fff; }
.nav .top { font-weight: 600; }
details.mod { margin: 2px 0; }
details.mod > summary { cursor: pointer; list-style: none; padding: 4px 8px; border-radius: 5px; font-size: 13.5px; font-weight: 600; display: flex; gap: 6px; align-items: baseline; }
details.mod > summary::-webkit-details-marker { display: none; }
details.mod > summary::before { content: "▸"; color: var(--muted); font-size: 11px; transition: transform .15s; }
details.mod[open] > summary::before { transform: rotate(90deg); }
details.mod > summary:hover { background: var(--accent-soft); }
summary .count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
summary .count.full { color: var(--done); }
.mod .items { padding-left: 14px; border-left: 1px solid var(--line); margin-left: 12px; }
.items a .tick { display: inline-block; width: 14px; color: var(--done); }
.items .kind { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px 0; }

/* main */
#main { flex: 1; height: 100vh; overflow-y: auto; }
#content { max-width: 880px; margin: 0 auto; padding: 28px 40px 80px; }
.crumbs { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.crumbs a { color: var(--muted); }
#content h1 { font-size: 28px; line-height: 1.25; margin: 0 0 16px; }
#content h2 { font-size: 21px; margin-top: 2em; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
#content h3 { font-size: 17px; margin-top: 1.6em; }
#content pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; line-height: 1.45; }
#content :not(pre) > code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
#content table { border-collapse: collapse; display: block; overflow-x: auto; margin: 1em 0; }
#content th, #content td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
#content th { background: var(--panel); }
#content blockquote { margin: 1em 0; padding: 4px 16px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin: 16px 0; background: var(--panel); }
.card h3 { margin: 0 0 8px; font-size: 15px; }
.cmd { display: flex; gap: 8px; align-items: stretch; margin: 6px 0; }
.cmd code { flex: 1; min-width: 0; background: var(--code); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; overflow-x: auto; white-space: nowrap; }
button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.doc { white-space: pre-wrap; font-family: inherit; margin: 0; }
.files { list-style: none; padding: 0; margin: 0; columns: 2; }
.files li { font-size: 13px; padding: 1px 0; break-inside: avoid; }
.done-toggle { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; cursor: pointer; user-select: none; }
.done-toggle input { width: 18px; height: 18px; accent-color: var(--done); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin: 16px 0; }
.grid a.tile { display: block; text-decoration: none; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--panel); }
.grid a.tile:hover { border-color: var(--accent); }
.tile .num { color: var(--accent); font-weight: 700; font-size: 12px; }
.tile .t { font-weight: 600; margin: 2px 0 8px; }
.toc { font-size: 13px; margin: 0 0 20px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 8px; }
.toc strong { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.toc ol { margin: 4px 0 0; padding-left: 20px; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); }
.pager a { text-decoration: none; max-width: 48%; }
.pager small { display: block; color: var(--muted); font-size: 12px; }
.warn { border-color: var(--warn); }
.warn h3 { color: var(--warn); }
.offline { color: var(--warn); font-size: 13px; }
/* snippet runner */
.snip { margin: 1em 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--code); }
#content .snip pre { margin: 0; border: 0; border-radius: 0; }
.snip pre code[contenteditable] { outline: none; display: block; min-height: 1.4em; }
.snip.editing { border-color: var(--accent); }
.snip-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 5px 8px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); }
.snip-bar button { padding: 3px 10px; font-size: 12px; }
.snip-bar .hint { margin-right: auto; }
.snip-bar .tag { color: var(--warn); }
.snip-out { border-top: 1px solid var(--line); background: var(--bg); padding: 8px 12px; font-size: 13px; }
.snip-out .status { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.snip-out .status.bad { color: var(--warn); }
.snip-out .status.ok { color: var(--done); }
#content .snip-out pre { margin: 4px 0 0; padding: 8px 10px; background: var(--code); border: 1px solid var(--line); border-radius: 6px; max-height: 360px; overflow: auto; white-space: pre-wrap; }
.snip-out .notes { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.snip-out details { margin-top: 6px; font-size: 12px; }
.snip-out details summary { cursor: pointer; color: var(--muted); }
.snip-out .help code { font-size: 12px; }
#menu { display: none; }
.hljs-keyword, .hljs-built_in { color: #a626a4; } .hljs-string { color: #50a14f; } .hljs-comment { color: var(--muted); font-style: italic; }
.hljs-number, .hljs-literal { color: #986801; } .hljs-title, .hljs-title.function_ { color: #4078f2; } .hljs-type { color: #c18401; }
@media (prefers-color-scheme: dark) {
  .hljs-keyword, .hljs-built_in { color: #c678dd; } .hljs-string { color: #98c379; } .hljs-number, .hljs-literal { color: #d19a66; }
  .hljs-title, .hljs-title.function_ { color: #61afef; } .hljs-type { color: #e5c07b; }
}
@media (max-width: 800px) {
  body { display: block; }
  #side { position: fixed; z-index: 10; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s; width: 85vw; }
  body.nav-open #side { transform: none; }
  #main { height: auto; }
  #content { padding: 56px 16px 60px; }
  #menu { display: block; position: fixed; top: 10px; left: 10px; z-index: 11; }
  .files { columns: 1; }
}
</style>

<script>
const DATA = {"root": "/home/csmith/Workspace/tools/go-course", "readme": "# Go, Hands-On: An Instructor-Led Course\n\nA self-paced but **instructor-reviewed** Go course. Each module has an in-depth lesson, a few short exercises (5-20 min each) with tests already written, and a project you can finish in under an hour. When you finish one, ask Claude to review it. You'll get feedback on best-practice violations, plus two alternatives for comparison: a **readable** solution and a **faster but less readable** one.\n\n## How to work through it\n\n**Start with [module 00](modules/00-setup/)**: it sets up Go on your machine\n(Option A) or in a Docker container (Option B). Either way works for the whole\ncourse.\n\nOn the host:\n\n```bash\ncd go-course\ncat modules/01-basics/README.md               # 1. read the lesson\n$EDITOR modules/01-basics/exercises/\u2026         # 2. implement the stubs\ngo test ./modules/01-basics/...               # 3. make the tests pass\ngo vet ./modules/01-basics/... && gofmt -l modules/01-basics\n```\n\nOr in the container. Every module has a `compose.yaml`:\n\n```bash\ndocker compose -f modules/01-basics/compose.yaml run --rm test    # tests, with -race\ndocker compose -f modules/01-basics/compose.yaml run --rm vet     # gofmt + go vet\ndocker compose -f modules/01-basics/compose.yaml run --rm shell   # a shell with Go 1.24.2\n```\n\n4. Ask for a review: *\"Review my work in modules/03-types-interfaces/\"*. Passing tests is the minimum bar. The review looks at idiom, API design, error handling, naming, allocations and test quality.\n5. Then compare your work with `solutions/<module>/`. **Don't open it before you've attempted the module.** Each solutions folder has a `REVIEW.md` with the readable vs. optimized discussion.\n\nUseful flags: `go test -run TestName -v`, `go test -race`, `go test -bench=. -benchmem`, `go test -cover`.\n\nTo browse the course as a web page with navigation and progress tracking, open\n`index.html` in your browser. Rebuild it after course changes with\n`python3 scripts-build-site.py`.\n\n**Run the lesson snippets in the page.** Start the local runner from the course root and open\n<http://localhost:8090/>:\n\n```sh\ngo run ./cmd/runner                                  # Go on your host\ndocker compose run --rm --service-ports runner       # or in the course container\n```\n\nEvery Go code block then gets a **\u25b6 Run** button. Click a block to edit it, and press Ctrl+Enter to run it.\nSnippets are often fragments, so the runner wraps them in `package main` / `func main` and adds missing\nstandard-library imports. The page shows the exact program that ran. Every block runs as written. A few are\n*meant* to fail (a compile error, a panic, a deadlock) and are labelled that way on the page. Some project\nsnippets import your own package, so their output changes as you finish the exercise. The runner listens on\nlocalhost only and accepts runs only from its own page.\n\n## Syllabus\n\n| # | Module | Topics | Exercises (`exercises/`) | Project (\u2264 60 min) |\n|---|--------|--------|-----------|--------------------|\n| 00 | [Setup & First Program](modules/00-setup/) | installing Go (host), Docker + Compose (container), editor/`gopls`, how the course module works, testable `main` with `flag.FlagSet` | `hello` | `envcheck`: hello world + environment report |\n| 01 | [Basics](modules/01-basics/) | slices, maps, strings/runes/UTF-8, `slices`/`maps` pkgs | `reverse`, `dedupe`, `wordfreq`, `anagram`, `chunk` | Text Analyzer (`textstats`) |\n| 02 | [Errors](modules/02-errors/) | sentinel/typed errors, `%w`, `errors.Is/As/Join`, panic vs error | `configparse`, `lookup`, `validate`, `safediv`, `closeerr` | Bank Ledger (`ledger`) |\n| 03 | [Types & Interfaces](modules/03-types-interfaces/) | methods, receivers, embedding, small interfaces, options | `shapes`, `stack`, `describe`, `logging`, `server` | Inventory Manager |\n| 04 | [Testing](modules/04-testing/) | *you* write the tests: table tests, fakes, golden files, fuzzing, examples, benchmarks, coverage | `csvline`, `paginate`, `concat`, `reminder`, `report` (each with planted bugs) | SemVer parser with 4 planted bugs (`semver`) |\n| 05 | [I/O](modules/05-io/) | `io.Reader/Writer`, `bufio`, files, CSV, JSON | `rot13`, `linecount`, `csvjson`, `tail`, `config` | Log Analyzer (`loganalyzer`) |\n| 06 | [Generics & Iterators](modules/06-generics/) | type params, constraints, `iter.Seq`, range-over-func | `funcs`, `set`, `stackqueue`, `numeric`, `iterx` | Generic LRU Cache |\n| 07 | [Concurrency](modules/07-concurrency/) | goroutines, channels, `sync`, worker pools, pipelines, leaks, `-race` | `counter`, `parallelsum`, `workerpool`, `pipeline`, `fetcher` | Duplicate File Finder (`dupfind`) |\n| 08 | [Context & HTTP](modules/08-http/) | `context`, 1.22 `ServeMux` routing, middleware, `slog`, `httptest`, graceful shutdown | `health`, `jsonio`, `middleware`, `routes`, `client` | URL Shortener API (`shortener`) |\n| 09 | [Performance](modules/09-performance/) | benchmarks, `pprof`, escape analysis, allocations | `appendints`, `dedupe`, `lineenc`, `csvline`, `semver` | Optimize the Log Parser (`logstats`) |\n| 10 | [Capstone](modules/10-capstone/) | everything | the three milestones | Mini Key-Value Store `kvd` (3 \u00d7 \u22641h milestones) |\n\nSuggested pace: one module per sitting or two. Module 00 is setup (under an hour). Modules 01\u201303 are foundations. 04 (Testing) assumes 02 (`errors.Is`) and 03 (interfaces, for fakes). 05 and 06 can be taken in either order. 07\u201310 build on everything before them.\n\n## Toolchain note\n\nThe course targets **Go 1.24** (pinned to `go1.24.2` in `go.mod` and in the container image) and uses only the standard library. As of October 2026, Go 1.24 is out of support; 1.26 and 1.27 are current. Everything here also works on newer versions, and an older Go (1.21+) downloads 1.24.2 automatically. Module 00 explains both setups; [`docs/RESOURCES.md`](docs/RESOURCES.md) lists the newer features worth knowing about.\n\nContainer files: [`docker/`](docker/) (image and the shared compose service), [`compose.yaml`](compose.yaml) (course-wide tasks), `modules/NN-*/compose.yaml` (per module) and [`.devcontainer/`](.devcontainer/) (VS Code).\n\n## Reference\n\n- [`docs/RESOURCES.md`](docs/RESOURCES.md): style guides, official docs, tooling install commands, what's new since 1.24.\n- [`CONVENTIONS.md`](CONVENTIONS.md): how modules are laid out, and the style rules the course code follows (and that reviews hold you to).\n", "resources": "# Go Resources\n\nA reference page to keep open while you work through the course. Every link here was checked in\nOctober 2026.\n\n> **About the course's Go version.** The course targets **Go 1.24** (`go 1.24.2` in `go.mod`).\n> Go releases twice a year and supports only the two newest major versions. As of October 2026,\n> those are **Go 1.27** (August 2026) and **Go 1.26** (February 2026). Go 1.24 still works fine,\n> but it no longer gets security fixes. Everything you learn here carries forward unchanged.\n> See [What's new since Go 1.24](#whats-new-since-go-124) for what's been added since.\n\n---\n\n## 1. Official documentation\n\n| Resource | What it's for |\n|---|---|\n| [A Tour of Go](https://go.dev/tour/) | Interactive intro to the language |\n| [Documentation hub](https://go.dev/doc/) | Index of all official docs and tutorials |\n| [How to Write Go Code](https://go.dev/doc/code) | Modules, packages, `go` command basics |\n| [The Go Programming Language Specification](https://go.dev/ref/spec) | The definitive language rules. Short and readable |\n| [The Go Memory Model](https://go.dev/ref/mem) | What concurrent reads and writes are guaranteed to see. Read it before the concurrency modules |\n| [Go FAQ](https://go.dev/doc/faq) | The \"why is Go like this?\" answers (no exceptions, nil interfaces, ...) |\n| [Standard library](https://pkg.go.dev/std) / [pkg.go.dev](https://pkg.go.dev/) | API docs for the stdlib and every public module |\n| [Go Playground](https://go.dev/play/) | Run and share snippets in the browser |\n| [Release history](https://go.dev/doc/devel/release) | Every release and point release, with dates |\n| [Go Toolchains](https://go.dev/doc/toolchain) | How the `go` and `toolchain` lines in `go.mod` select a Go version |\n| [Managing dependencies](https://go.dev/doc/modules/managing-dependencies) | `go get`, `go mod tidy`, versions |\n| [Organizing a Go module](https://go.dev/doc/modules/layout) | Official guidance on project layout |\n| [Go Doc Comments](https://go.dev/doc/comment) | How to write doc comments that render well |\n| [Go blog](https://go.dev/blog/) | In-depth articles from the Go team |\n\nOffline docs: `go doc fmt.Printf`, `go doc -all strings`, or `go doc -src sync.Once`.\n\n## 2. Style guides and idioms\n\nRead these in this order. The first two are what your code will be reviewed against.\n\n1. **[Effective Go](https://go.dev/doc/effective_go)**: the classic guide to idiomatic Go. It was\n   written in 2009, so it doesn't cover modules or generics, but its core idioms (naming, errors,\n   interfaces, concurrency) still hold.\n2. **[Go Code Review Comments](https://go.dev/wiki/CodeReviewComments)**: a checklist of common\n   review feedback, such as receiver names, error strings, `context` placement and\n   \"accept interfaces, return structs\". Its companion is\n   [Go Test Comments](https://go.dev/wiki/TestComments).\n3. **[Google Go Style Guide](https://google.github.io/styleguide/go/)**: the most thorough modern\n   guide. It has three parts:\n   [Style Guide](https://google.github.io/styleguide/go/),\n   [Style Decisions](https://google.github.io/styleguide/go/decisions) and\n   [Best Practices](https://google.github.io/styleguide/go/best-practices).\n4. **[Uber Go Style Guide](https://github.com/uber-go/guide/blob/master/style.md)**: practical,\n   example-heavy guidance (guidelines, performance, patterns). Some of it is Uber-specific\n   preference, so where it differs from the guides above, follow those.\n5. **[Go Proverbs](https://go-proverbs.github.io/)**: Rob Pike's one-liners, e.g. \"Don't communicate\n   by sharing memory; share memory by communicating\", \"The bigger the interface, the weaker the\n   abstraction\", \"Errors are values\", \"Clear is better than clever\".\n\n### Common mistakes\n\n- **[100 Go Mistakes and How to Avoid Them](https://100go.co/)** by Teiva Harsanyi. The website\n  summarises every mistake for free. The book is published by\n  [Manning](https://www.manning.com/books/100-go-mistakes-and-how-to-avoid-them).\n- [Go Wiki: Common Mistakes](https://go.dev/wiki/CommonMistakes)\n\n### Must-read Go blog articles\n\n| Topic | Article |\n|---|---|\n| Errors | [Errors are values](https://go.dev/blog/errors-are-values) \u00b7 [Working with Errors in Go 1.13](https://go.dev/blog/go1.13-errors) |\n| Concurrency | [Pipelines and cancellation](https://go.dev/blog/pipelines) \u00b7 [Context](https://go.dev/blog/context) \u00b7 [Concurrency patterns talk (2012)](https://go.dev/talks/2012/concurrency.slide) |\n| Maps | [Go maps in action](https://go.dev/blog/maps) \u00b7 [Swiss table maps (1.24)](https://go.dev/blog/swisstable) |\n| Generics | [An Introduction to Generics](https://go.dev/blog/intro-generics) \u00b7 [When to Use Generics](https://go.dev/blog/when-generics) \u00b7 [Generic interfaces](https://go.dev/blog/generic-interfaces) \u00b7 [Tutorial](https://go.dev/doc/tutorial/generics) |\n| Iterators | [Range over function types](https://go.dev/blog/range-functions) |\n| Loops | [Fixing for loops in Go 1.22](https://go.dev/blog/loopvar-preview) |\n| HTTP | [Routing enhancements (1.22)](https://go.dev/blog/routing-enhancements) |\n| Logging | [Structured logging with slog](https://go.dev/blog/slog) |\n| Testing | [More predictable benchmarking with `testing.B.Loop`](https://go.dev/blog/testing-b-loop) \u00b7 [Fuzzing tutorial](https://go.dev/doc/tutorial/fuzz) \u00b7 [Data race detector](https://go.dev/doc/articles/race_detector) |\n| Files | [Traversal-resistant file APIs (`os.Root`)](https://go.dev/blog/osroot) |\n| Performance | [Profiling Go programs](https://go.dev/blog/pprof) \u00b7 [Diagnostics](https://go.dev/doc/diagnostics) \u00b7 [GC guide](https://go.dev/doc/gc-guide) \u00b7 [PGO](https://go.dev/doc/pgo) |\n| Security | [Security best practices](https://go.dev/doc/security/best-practices) |\n\n## 3. Tooling\n\n### Built into the `go` command\n\n```sh\ngo fmt ./...            # format (runs gofmt -l -w on packages)\ngofmt -s -l .           # list unformatted files; -s also simplifies code\ngo vet ./...            # catch suspicious code (printf args, copied locks, bad struct tags, ...)\ngo test ./...           # run tests\ngo test -race ./...     # run tests with the data race detector\ngo test -cover ./...    # coverage summary\ngo test -coverprofile=c.out ./... && go tool cover -html=c.out\ngo doc <pkg>[.<sym>]    # documentation in the terminal\ngo mod tidy             # sync go.mod/go.sum with imports\n```\n\n### External tools (optional, not needed for the course)\n\nThe course uses only the standard library, but these are what Go teams use day to day:\n\n| Tool | What it does | Install |\n|---|---|---|\n| [goimports](https://pkg.go.dev/golang.org/x/tools/cmd/goimports) | `gofmt` plus adding and removing imports | `go install golang.org/x/tools/cmd/goimports@latest` |\n| [gopls](https://go.dev/gopls/) | The official language server, used by VS Code (Go extension), Neovim, Emacs and other LSP editors | `go install golang.org/x/tools/gopls@latest` (your editor usually installs it for you) |\n| [staticcheck](https://staticcheck.dev/) | High-signal static analysis: bugs, simplifications, deprecated APIs | `go install honnef.co/go/tools/cmd/staticcheck@latest`, then `staticcheck ./...` |\n| [govulncheck](https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck) | Reports known vulnerabilities that your code actually calls ([tutorial](https://go.dev/doc/tutorial/govulncheck)) | `go install golang.org/x/vuln/cmd/govulncheck@latest`, then `govulncheck ./...` |\n| [golangci-lint](https://golangci-lint.run/) | Runs many linters at once (staticcheck, errcheck, revive, gosec, ...) | Binary (recommended): `curl -sSfL https://golangci-lint.run/install.sh \\| sh -s -- -b $(go env GOPATH)/bin v2.14.0`, or `brew install golangci-lint`. Then `golangci-lint run ./...` |\n| [benchstat](https://pkg.go.dev/golang.org/x/perf/cmd/benchstat) | Statistically compares benchmark runs | `go install golang.org/x/perf/cmd/benchstat@latest` |\n\n> **Heads-up for Go 1.24 users:** the latest releases of these tools require Go \u2265 1.26 to *build*.\n> With the default `GOTOOLCHAIN=auto`, `go install ...@latest` quietly downloads a newer Go\n> toolchain to build the tool, and that works. The tools still analyze your Go 1.24 code fine. If\n> you've set `GOTOOLCHAIN=local`, the install fails with \"requires go >= 1.26.0\". In that case,\n> either unset it or pin an older tool version.\n\nA minimal **golangci-lint v2** config, `.golangci.yml` (v1 configs need\n`golangci-lint migrate`):\n\n```yaml\nversion: \"2\"\nlinters:\n  default: standard     # standard | all | none | fast\n  enable:\n    - revive\n    - gosec\nformatters:\n  enable:\n    - gofmt\n    - goimports\nrun:\n  timeout: 5m\n```\n\n### Profiling and performance\n\n```sh\n# Benchmarks: -run='^$' skips tests; -benchmem shows B/op and allocs/op\ngo test -run='^$' -bench=. -benchmem ./path/to/pkg\ngo test -run='^$' -bench=WordCount -benchtime=2s -count=10 ./path/to/pkg\n\n# Compare before and after with benchstat (use at least 10 runs)\ngo test -run='^$' -bench=. -count=10 ./pkg > old.txt\n#   ...make your change...\ngo test -run='^$' -bench=. -count=10 ./pkg > new.txt\nbenchstat old.txt new.txt\n\n# CPU and memory profiles from benchmarks (one package at a time)\ngo test -run='^$' -bench=. -cpuprofile=cpu.out -memprofile=mem.out ./pkg\ngo tool pprof -top cpu.out                 # hottest functions\ngo tool pprof -list='WordCount' cpu.out    # annotated source\ngo tool pprof -http=:8080 cpu.out          # interactive web UI (flame graph, graph, source)\ngo tool pprof -sample_index=alloc_space mem.out\n\n# Escape analysis: why does this allocate?\ngo build -gcflags=-m ./pkg                 # \"moved to heap: x\", \"... escapes to heap\", inlining\ngo build -gcflags='-m -m' ./pkg            # verbose reasons\n\n# Execution trace (goroutine scheduling, GC, blocking)\ngo test -trace=trace.out ./pkg && go tool trace trace.out\n```\n\n**Profile-guided optimization (PGO):** save a production CPU profile as `default.pgo` in your main\npackage's directory. `go build` uses it automatically (since 1.21), which usually gives a 2\u20137%\nspeedup. See [the PGO guide](https://go.dev/doc/pgo).\n\nLive servers: `import _ \"net/http/pprof\"` exposes `/debug/pprof/` (e.g.\n`go tool pprof 'http://localhost:6060/debug/pprof/profile?seconds=30'`). Never expose it publicly.\n\n## 4. Modern Go features you'll use (by version)\n\nAll of these are available in Go 1.24.\n\n| Version | Feature |\n|---|---|\n| 1.18 | Generics (`[T any]`, constraints, `comparable`), fuzzing (`go test -fuzz`), workspaces |\n| 1.20 | `errors.Join` and multiple `%w`, `context.WithCancelCause`, `strings.CutPrefix/CutSuffix`, `time.DateOnly` |\n| 1.21 | `min`/`max`/`clear` builtins; `slices`, `maps`, `cmp`, `log/slog` packages; `sync.OnceFunc/OnceValue`; `context.AfterFunc/WithoutCancel`; PGO |\n| 1.22 | **Each loop iteration gets a fresh variable** (if `go.mod` says \u2265 1.22); `for i := range 10`; `http.ServeMux` patterns like `\"GET /items/{id}\"` with `r.PathValue(\"id\")`; `math/rand/v2`; `cmp.Or`; `slices.Concat` |\n| 1.23 | Range-over-func **iterators** and the `iter` package; `slices.Collect/Sorted/Chunk`, `maps.Keys/Values/All` (these return iterators); `unique` |\n| 1.24 | Generic type aliases; `for b.Loop()` benchmarks; `t.Context()`, `t.Chdir()`; `os.Root` (sandboxed file access); `strings.Lines/SplitSeq/FieldsSeq`; `json:\",omitzero\"`; `weak`, `runtime.AddCleanup`; `tool` directive in `go.mod` |\n\nNote: `testing/synctest` exists in 1.24 only as an experiment (`GOEXPERIMENT=synctest`). The\nstable API is from 1.25 and is different, so the course doesn't use it.\n\n## 5. What's new since Go 1.24\n\nYou won't need these in the course, but you'll see them in newer codebases.\n\n**Go 1.25** (Aug 2025, [notes](https://go.dev/doc/go1.25), [blog](https://go.dev/blog/go1.25))\n- `wg.Go(func() { ... })` on `sync.WaitGroup`, which replaces the `Add(1)` / `defer Done()` dance.\n- `testing/synctest` is stable: `synctest.Test(t, func(t *testing.T) { ... })` runs concurrent code\n  on a fake clock ([blog](https://go.dev/blog/synctest)).\n- GOMAXPROCS respects container CPU limits.\n- `encoding/json/v2` is available as an experiment ([blog](https://go.dev/blog/jsonv2-exp)).\n- `net/http.CrossOriginProtection` (CSRF), plus new `go vet` checks for misplaced `wg.Add` and for\n  building `host:port` strings with `Sprintf`.\n\n**Go 1.26** (Feb 2026, [notes](https://go.dev/doc/go1.26), [blog](https://go.dev/blog/go1.26))\n- `new` accepts an expression: `Age: new(yearsSince(born))`, which is handy for optional pointer fields.\n- The **Green Tea garbage collector** is on by default and cuts GC overhead by 10\u201340%\n  ([blog](https://go.dev/blog/greenteagc)).\n- `errors.AsType[*MyErr](err)` is the generic, type-safe form of `errors.As`.\n- `go fix` was rewritten around \"modernizers\" that update code to current idioms\n  ([blog](https://go.dev/blog/gofix)).\n- `slog.NewMultiHandler`, a faster `io.ReadAll`, and pprof's web UI opening on a flame graph.\n\n**Go 1.27** (Aug 2026, [notes](https://go.dev/doc/go1.27), [blog](https://go.dev/blog/go1.27))\n- **Generic methods:** methods can now declare their own type parameters (interface methods\n  can't).\n- `encoding/json` now runs on the v2 implementation, and `encoding/json/v2` / `jsontext` are\n  stable. Old code keeps working.\n- A new `uuid` package, `strings.CutLast`, and `synctest.Sleep`.\n- The goroutine-leak profile (`/debug/pprof/goroutineleak`) is stable.\n\nTo try a newer Go without changing your system install, run\n`go install golang.org/dl/go1.27.2@latest && go1.27.2 download`.\n\n## 6. Books and learning sites\n\n- *The Go Programming Language*, Donovan & Kernighan ([gopl.io](https://www.gopl.io/)). Still the\n  best deep treatment of the core language (pre-generics).\n- *100 Go Mistakes and How to Avoid Them*, Teiva Harsanyi ([100go.co](https://100go.co/)).\n- *Learning Go* (2nd ed., covers generics), Jon Bodner, O'Reilly.\n- *Concurrency in Go*, Katherine Cox-Buday, O'Reilly.\n- *Let's Go* / *Let's Go Further*, Alex Edwards ([lets-go.alexedwards.net](https://lets-go.alexedwards.net/)).\n  Building web apps and APIs with the standard library.\n- [Learn Go with Tests](https://quii.gitbook.io/learn-go-with-tests): learn by doing TDD.\n- [Go by Example](https://gobyexample.com/): short annotated programs for each feature.\n", "modules": [{"slug": "00-setup", "compose": "modules/00-setup/compose.yaml", "services": ["test", "vet", "envcheck", "shell", "solutions"], "title": "Module 00 \u2014 Setup & First Program", "lesson": "# Module 00 \u2014 Setup & First Program\n\nBefore you write any Go, you need an environment you trust: the right\ntoolchain, an editor that understands Go, and a one-command way to run the\ntests. This module sets that up in one of two ways, or both:\n\n- **Option A: on your host.** Install Go directly on your machine. This is the\n  fastest day-to-day loop and gives the best editor integration.\n- **Option B: in a container.** Run Go 1.24.2 from the course's Docker image\n  with Docker Compose. Nothing is installed on your machine except Docker,\n  and everyone gets exactly the same toolchain.\n\nThen you prove that the setup works by building a small program: a greeting\nfunction and an `envcheck` command that reports which Go, OS and CPU count\nit runs on and whether it is inside a container. Run it both ways, and the\noutput tells you which environment you are in.\n\n## Goals\n\nAfter this module you will be able to:\n\n- Install Go 1.24 on Linux, macOS or Windows, verify it, and explain what `GOROOT`, `GOPATH`, `GOMODCACHE`, `GOCACHE` and `GOTOOLCHAIN` do.\n- Set up an editor with `gopls` so that formatting, imports and errors are handled as you type.\n- Run the whole course in a container with Docker Compose: tests, `-race`, benchmarks, fuzzing, and servers with published ports.\n- Explain how this course repository is organized as one Go module, and run any package's tests from the course root.\n- Write a **testable `main`**: a tiny `main` that calls `Run(args, stdout, stderr)`, with flags parsed by a `flag.FlagSet` and proper exit codes.\n- Use the everyday commands: `go test`, `go run`, `go build`, `go vet`, `gofmt`, `go doc`.\n\n## Concepts\n\n### 1. What you are installing\n\n\"Installing Go\" means installing the **toolchain**, a single directory that\ncontains:\n\n| Piece | What it does |\n|---|---|\n| `go` | The one command for everything: `build`, `run`, `test`, `vet`, `mod`, `doc`, `env`, `install`\u2026 |\n| `gofmt` | The formatter. Go has exactly one code style, and `gofmt` enforces it. |\n| The compiler and linker | Called by `go build`; you never run them directly. |\n| The standard library source | `net/http`, `encoding/json`, `testing`\u2026 The library is the source; you can read all of it. |\n\nTwo caches appear the first time you build:\n\n- the **build cache** (`GOCACHE`): compiled packages and test results. This is\n  why the second `go test` run is instant and prints `(cached)`.\n- the **module cache** (`GOMODCACHE`): downloaded third-party modules. This\n  course uses only the standard library, so it stays nearly empty.\n\nThe **editor support** is a separate program, `gopls` (the Go language\nserver). Your editor talks to it for completion, go-to-definition, rename,\ninline errors and format-on-save.\n\n### 2. Which version\n\nThe course targets **Go 1.24** and pins **1.24.2** in its `go.mod`:\n\n```\nmodule gocourse\n\ngo 1.24.2\n```\n\nThat `go` line is the **minimum** version that can build the module. Since Go\n1.21, the `go` command manages toolchains for you (`GOTOOLCHAIN=auto` is the\ndefault):\n\n- **Your Go is newer** (1.26, 1.27): it builds the course as is. Go keeps\n  backward compatibility, so everything here works unchanged.\n- **Your Go is older but at least 1.21**: the first `go` command in the course\n  directory **downloads go1.24.2 automatically** and uses it for this module.\n  You need a network connection once.\n- **Your Go is older than 1.21**: it refuses to build. Upgrade.\n\nGo 1.24 is out of support as of 2026 (1.26 and 1.27 are current). The course\npins it so that every example, benchmark number and error message matches\nwhat you see. Newer releases are mentioned in prose where they matter; see\n[`docs/RESOURCES.md`](../../docs/RESOURCES.md).\n\n### 3. Option A: install Go on your host\n\nDownload installers from **https://go.dev/dl/**. Pick go1.24.2, or a newer\nrelease (see above).\n\n#### Linux\n\nThe official tarball is the recommended way. Distribution packages (`apt\ninstall golang`) are often several releases behind.\n\n```bash\ncd /tmp\ncurl -LO https://go.dev/dl/go1.24.2.linux-amd64.tar.gz     # arm64: go1.24.2.linux-arm64.tar.gz\nsha256sum go1.24.2.linux-amd64.tar.gz                      # compare with the checksum on go.dev/dl\nsudo rm -rf /usr/local/go                                  # never untar over an old install\nsudo tar -C /usr/local -xzf go1.24.2.linux-amd64.tar.gz\n```\n\nThen put the `go` command, and the programs you later `go install`, on your\n`PATH`. Add these lines to `~/.profile` (or `~/.bashrc` / `~/.zshrc`), then\nopen a new terminal:\n\n```bash\nexport PATH=\"$PATH:/usr/local/go/bin:$HOME/go/bin\"\n```\n\n#### macOS\n\nEither run the `.pkg` installer from go.dev/dl, which installs to\n`/usr/local/go` and adds it to your `PATH` through `/etc/paths.d/go`, or use\nHomebrew:\n\n```bash\nbrew install go        # installs the latest release, which builds the course fine\n```\n\nAdd `$HOME/go/bin` to your `PATH` for tools you install with `go install`.\n\n#### Windows\n\nRun the `.msi` installer from go.dev/dl, or:\n\n```powershell\nwinget install --id GoLang.Go\n```\n\nThe installer sets up `PATH`. Open a **new** terminal afterwards. For this\ncourse, **WSL 2 (Ubuntu) is strongly recommended**: the course scripts are\nbash, Docker works best there, and file paths match every example. Inside WSL,\nfollow the Linux steps.\n\n#### Several versions side by side\n\nTo try another release without replacing your main install:\n\n```bash\ngo install golang.org/dl/go1.24.2@latest   # a small wrapper command\ngo1.24.2 download                          # fetches that toolchain into ~/sdk/\ngo1.24.2 version                           # use it like `go`\n```\n\n#### Verify\n\n```bash\ngo version\n# go version go1.24.2 linux/amd64     (or newer)\n\ngo env GOROOT GOPATH GOMODCACHE GOCACHE GOTOOLCHAIN\n# /usr/local/go\n# /home/you/go\n# /home/you/go/pkg/mod\n# /home/you/.cache/go-build\n# auto\n```\n\nWhat these mean:\n\n- `GOROOT`: where the toolchain lives. Don't set it yourself; `go` works it out.\n- `GOPATH`: defaults to `~/go`. Today it only holds the module cache\n  (`pkg/mod`) and binaries from `go install` (`bin`). **Your code does not\n  go in GOPATH.** That was the pre-2018 way. Modules live anywhere, like this\n  course does.\n- `GOMODCACHE`, `GOCACHE`: the caches from section 1. `go clean -cache`\n  empties the build cache if you ever suspect it.\n- `GOTOOLCHAIN`: `auto` lets `go` switch toolchains as described in section 2.\n\nFinally, from the course root:\n\n```bash\ngo test ./modules/00-setup/...\n```\n\nIt **fails**: the exercise is not written yet. Failing tests with no\nbuild errors mean your setup works. If you see `go: command not found`, fix\nyour `PATH`. If you see `cannot find main module`, you are not in the course\ndirectory.\n\n#### Editor\n\nPick one; all of them use `gopls` underneath.\n\n- **VS Code** with the official **Go** extension (`golang.go`). On first open\n  it offers to install `gopls` and friends: accept. Format-on-save and\n  organize-imports are on by default.\n- **GoLand** (JetBrains): Go support built in.\n- **Neovim / Vim / Emacs / Helix**: configure the LSP client for `gopls`.\n  Install it with:\n\n  ```bash\n  go install golang.org/x/tools/gopls@latest     # lands in ~/go/bin\n  ```\n\nWhatever you choose, make sure **saving a file runs `gofmt` (or `goimports`)**.\nYou should never format Go code by hand.\n\nOptional extra tools, mentioned throughout the course but not required:\n`staticcheck` (a stricter `go vet`), `govulncheck` (known-vulnerability\nscanner) and `golangci-lint` (a runner for many linters).\n\n### 4. Option B: run everything in a container\n\n#### Why (and why not)\n\n| | Host install | Container |\n|---|---|---|\n| Toolchain | Whatever you installed | Exactly go1.24.2, same for everyone |\n| Changes to your machine | Go in `/usr/local/go`, caches in `~` | None except Docker images and volumes |\n| Speed | Fastest | First build downloads the Go image (about 850 MB on disk); then near-native on Linux, slower bind mounts on macOS/Windows |\n| Editor | Native `gopls` | Needs the dev container (below) or a host `gopls` |\n| Matches CI / production | Rarely exactly | Same mechanism most CI systems use |\n\nMany people use both: the host for the edit-test loop, and the container to\ncheck that things work on a clean, pinned toolchain.\n\n#### Install Docker\n\n- **Linux:** Docker Engine plus the Compose plugin (docs.docker.com/engine/install/).\n  To run `docker` without `sudo`, add yourself to the `docker` group\n  (`sudo usermod -aG docker $USER`, then log out and in). Be aware that\n  membership of that group is equivalent to root access.\n- **macOS / Windows:** Docker Desktop (Windows: enable the WSL 2 backend).\n\nCheck that you have **Compose v2**, the `docker compose` subcommand (with a\nspace), not the retired `docker-compose` script:\n\n```bash\ndocker --version\ndocker compose version\n```\n\n#### The files\n\n```\ndocker/\n  Dockerfile            # the course image: golang:1.24.2-bookworm + cache dirs + a gopher user\n  compose.base.yaml     # the shared \"go\" service every compose file extends\ncompose.yaml            # course-wide tasks: shell, verify, solutions\nmodules/NN-*/compose.yaml   # one per module: test, vet, bench, cover, shell, ...\n.devcontainer/devcontainer.json  # optional: VS Code \"Reopen in Container\"\n```\n\n**`docker/Dockerfile`**, abridged:\n\n```dockerfile\n# Debian (bookworm): includes gcc, so cgo and -race work\nFROM golang:1.24.2-bookworm\nENV GOCACHE=/cache/go-build \\\n    GOMODCACHE=/cache/mod \\\n    GOTOOLCHAIN=local \\\n    HOME=/tmp\nRUN mkdir -p /cache/go-build /cache/mod /data && chmod 1777 /cache/go-build /cache/mod /data\nWORKDIR /course\n```\n\n- **`bookworm`, not `alpine`.** `go test -race` needs cgo, and cgo needs a C\n  compiler. The Alpine image has none, so `-race` fails there.\n- **`GOTOOLCHAIN=local`** stops `go` from downloading any other toolchain:\n  inside the container it is always 1.24.2.\n- The **cache directories** are mounted as named volumes (next file), so the\n  build cache survives between runs and the second `go test` is fast.\n\n**`docker/compose.base.yaml`** defines one service, `go`, which the other\ncompose files extend:\n\n```yaml\nservices:\n  go:\n    build: .\n    image: gocourse-dev:1.24.2\n    working_dir: /course\n    user: \"${UID:-1000}:${GID:-1000}\"\n    volumes:\n      - ..:/course                  # the course directory, live (bind mount)\n      - gomod:/cache/mod            # named volumes shared by all modules\n      - gobuild:/cache/go-build\n```\n\n- The **bind mount** means the container sees your edits instantly. You edit\n  on the host, and the container compiles and tests.\n- **`user:`** runs the container as your user, not root, so files it creates\n  (fuzz corpora, golden files, binaries) are yours. If `id -u` and `id -g`\n  are not both 1000 on your machine, add this to your `~/.bashrc` (or\n  `~/.zshrc`):\n\n  ```bash\n  export UID; export GID=\"$(id -g)\"\n  ```\n\n**Each module's `compose.yaml`** extends `go` and adds that module's tasks:\n\n| Service | Runs | Profile |\n|---|---|---|\n| `test` | `go test -race ./modules/NN-*/...` | (default) |\n| `vet` | `gofmt -l` (must print nothing) and `go vet` | `tools` |\n| `bench` | `go test -run='^$' -bench=. -benchmem` | `tools` |\n| `cover` | `go test -cover` | `tools` |\n| `shell` | an interactive `bash` in `/course` | `tools` |\n| `solutions` | the reference solutions' tests | `instructor` |\n| `envcheck` | module 00 only: your project, `-v` | `tools` |\n| `fuzz` | module 04 only: one fuzz target (see that module) | `tools` |\n| `kvd` | module 10 only: your capstone server on `localhost:8080` | `app` |\n\n**Profiles** keep the extra services out of `docker compose up`.\n`docker compose run <service>` starts any service by name, profile or not,\nso you rarely need to think about them.\n\n#### Using it\n\nFrom the course root, point `-f` at a module's file:\n\n```bash\ndocker compose -f modules/00-setup/compose.yaml run --rm test\ndocker compose -f modules/00-setup/compose.yaml run --rm envcheck\ndocker compose -f modules/00-setup/compose.yaml run --rm shell    # then: go test ./modules/00-setup/... -v\n```\n\nOr `cd` into the module and leave out `-f`:\n\n```bash\ncd modules/04-testing\ndocker compose run --rm test\nFUZZ_TARGET=FuzzSplit docker compose run --rm fuzz\n```\n\n- **`run --rm`** starts a one-off container and deletes it when the command\n  ends. Use it for everything except long-running servers.\n- The **first** run builds the image (a minute or two). Later runs start in\n  about a second.\n- Any command works: `docker compose run --rm test go doc strings.Cut`.\n  Arguments after the service name replace its default command.\n\nCourse-wide tasks use the root `compose.yaml`:\n\n```bash\ndocker compose run --rm shell        # a shell with Go 1.24.2, at /course\ndocker compose run --rm solutions    # every reference solution, with -race\n```\n\n#### Servers in containers\n\nTwo rules matter for any server you run in a container (module 10's `kvd`\nservice follows both):\n\n1. **Listen on `0.0.0.0`, not `127.0.0.1`.** Inside a container, `127.0.0.1`\n   is the *container's* loopback; the published port can't reach it. The\n   compose file then publishes the port only on your machine's loopback:\n   `ports: [\"127.0.0.1:8080:8080\"]`.\n2. **Make your program PID 1, and handle SIGTERM.** `docker compose stop`\n   sends SIGTERM, waits (`stop_grace_period`), then sends SIGKILL. The\n   service builds the binary and then `exec`s it, so the server itself, not a\n   shell, receives the signal and can shut down gracefully.\n\n```bash\ncd modules/10-capstone\ndocker compose --profile app up kvd        # Ctrl-C (or `docker compose stop kvd`) \u2192 graceful shutdown\n```\n\n#### Dev container (optional, VS Code)\n\nWith the **Dev Containers** extension installed, open the course folder and\nrun **\"Dev Containers: Reopen in Container\"**. VS Code builds the same image\nand runs its terminal, `gopls` and test runner inside it, as user `gopher`\nremapped to your UID. Your editor then needs no Go install at all.\n\nThe dev container sets `GOTOOLCHAIN=auto` (the compose services keep\n`local`). Current `gopls` releases need a newer Go to build, and `auto` lets\nthe Go extension download one just for that, while the course still compiles\nwith 1.24.2 because `go.mod` asks for it. To install a tool from a compose\nshell, do the same thing by hand:\n\n```bash\ndocker compose run --rm -e GOTOOLCHAIN=auto shell go install golang.org/x/tools/gopls@latest\n```\n\n#### Cleaning up\n\n```bash\ndocker compose -f modules/10-capstone/compose.yaml --profile app down     # stop and remove containers\ndocker volume rm gocourse-gomod gocourse-gobuild gocourse-kvd-data        # caches and kvd data\ndocker image rm gocourse-dev:1.24.2\n```\n\n### 5. How this course repository works\n\nThe whole course is **one Go module** named `gocourse`, defined by the\n`go.mod` at its root. A **package** is a directory of `.go` files. A\npackage's **import path** is the module path plus the directory:\n\n```\ngo-course/                                   module gocourse\n  go.mod\n  modules/00-setup/exercises/hello/          import \"gocourse/modules/00-setup/exercises/hello\"\n  modules/00-setup/project/envcheck/         import \"gocourse/modules/00-setup/project/envcheck\"\n  modules/00-setup/project/cmd/envcheck/     package main: a command\n  solutions/00-setup/...                     the same layout, solved\n```\n\nConsequences you will use every day:\n\n- **Run commands from the course root.** `go` finds `go.mod` by walking up\n  from the current directory, and the course's commands all start with\n  `./modules/...`.\n- **`./...` means \"this directory and everything below it\"**:\n  `go test ./modules/00-setup/...` tests both packages in the module.\n- **The package name is the last element of the import path**\n  (`.../exercises/hello` declares `package hello`). Code that imports it\n  writes `hello.Greeting`.\n- A **command** is a `package main` with a `func main()`. By convention it\n  lives under `cmd/<name>/`, which is the name `go build` gives the binary.\n- **Test files** (`*_test.go`) sit next to the code they test and are only\n  compiled by `go test`.\n\n### 6. Your first program: a testable `main`\n\nA naive Go program puts everything in `main`: it parses flags with the\nglobal `flag` package, prints with `fmt.Println`, and exits with `os.Exit`.\nThat works, but **you can't test it**. `main` takes no arguments, writes to\nthe real terminal, and `os.Exit` would kill the test process.\n\nThe fix, used throughout this course, is to make `main` a two-line adapter\nand put the program in a function you can call:\n\nIn the project, `main` lives in `cmd/envcheck/main.go` and `Run` in\n`envcheck.go`. Here they share one file so you can run it. It imports *your*\n`hello` package, so the greeting stays empty until you finish that exercise.\n\n```go\nimport \"gocourse/modules/00-setup/exercises/hello\"\n\n// Env describes the machine. The project's Env has more fields.\ntype Env struct{ GoVersion string }\n\n// cmd/envcheck/main.go is just:\n//\n//\tfunc main() {\n//\t\tos.Exit(envcheck.Run(os.Args[1:], envcheck.DetectEnv(), os.Stdout, os.Stderr))\n//\t}\n//\n// This main calls Run the way a test would instead.\nfunc main() {\n\tvar stdout, stderr bytes.Buffer\n\tcode := Run([]string{\"-name\", \"Ada\"}, Env{}, &stdout, &stderr)\n\tfmt.Printf(\"exit %d, stdout %q\\n\", code, stdout.String())\n\n\tstdout.Reset()\n\tcode = Run([]string{\"-bogus\"}, Env{}, &stdout, &stderr)\n\tfmt.Printf(\"exit %d, stderr starts %q\\n\", code, strings.SplitN(stderr.String(), \"\\n\", 2)[0])\n}\n\n// envcheck.go\nfunc Run(args []string, env Env, stdout, stderr io.Writer) int {\n\tfs := flag.NewFlagSet(\"envcheck\", flag.ContinueOnError) // return errors, don't exit\n\tfs.SetOutput(stderr)                                    // usage and errors go to stderr\n\tname := fs.String(\"name\", \"\", \"who to greet\")\n\tif err := fs.Parse(args); err != nil {\n\t\tif errors.Is(err, flag.ErrHelp) {\n\t\t\treturn 0 // -h was asked for: not an error\n\t\t}\n\t\treturn 2 // usage error; flag already printed the message\n\t}\n\tfmt.Fprintln(stdout, hello.Greeting(*name))\n\treturn 0\n}\n```\n\nWhy each piece:\n\n- **`args []string`** instead of reading `os.Args`: a test passes\n  `[]string{\"-name\", \"Ada\"}`.\n- **`stdout, stderr io.Writer`** instead of `os.Stdout`: a test passes a\n  `*bytes.Buffer` and checks exactly what was printed.\n- **`flag.NewFlagSet(..., flag.ContinueOnError)`** instead of the global\n  `flag.Parse()`. The global set calls `os.Exit(2)` on a bad flag and is shared\n  state between tests. A local set returns an error.\n- **An exit code, returned**, and `os.Exit` only in `main`. `os.Exit` skips\n  deferred calls, so keep it at the very top of the program. Conventions:\n  `0` success, `1` failure, `2` usage error.\n- **`env Env` as a parameter**: anything that differs between machines (time,\n  environment, the OS) is passed in, so tests are deterministic. Modules 03\n  and 04 develop this idea further.\n\nYou will see this shape again in module 08's servers and in the module 10\ncapstone's `kvd`.\n\n### 7. Everyday commands\n\n| Command | Does |\n|---|---|\n| `go test ./modules/00-setup/...` | Run all tests in the module |\n| `go test -run TestRun/name -v ./modules/00-setup/project/envcheck/` | One test or subtest, verbose |\n| `go test -race ./...` | With the data race detector |\n| `go test -count=1 ./...` | Ignore cached test results |\n| `go run ./modules/00-setup/project/cmd/envcheck -v` | Build and run a command |\n| `go build -o bin/envcheck ./modules/00-setup/project/cmd/envcheck` | Build a binary |\n| `gofmt -l modules/00-setup` | List unformatted files (should print nothing); `-w` fixes them |\n| `go vet ./modules/00-setup/...` | Catch suspicious code (wrong `Printf` verbs, copied locks, \u2026) |\n| `go doc strings.TrimSpace` | Documentation for any symbol, offline |\n| `go env` | Show the toolchain's configuration |\n\nEach works the same in the container: put `docker compose run --rm test` in\nfront of it (for example `docker compose run --rm test go doc strings.TrimSpace`),\nor run it inside `shell`.\n\n## Idioms & Best Practices\n\n- **Install from go.dev, not your distro.** Old packaged versions cause\n  confusing errors. Go upgrades are painless: delete `/usr/local/go`, untar\n  the new one.\n- **Format on save, always.** Any Go code you read was produced by `gofmt`.\n  Unformatted code in a review is the first comment you'll get.\n  ```bash\n  gofmt -l modules/00-setup     # good: prints nothing\n  ```\n- **Run from the module root with `./...` paths.**\n  ```bash\n  go test ./modules/00-setup/...          # good\n  cd modules/00-setup/exercises/hello && go test   # works, but every course command assumes the root\n  ```\n- **Keep `main` tiny.** It wires real dependencies (`os.Args`, `os.Stdout`, the\n  real environment) into a testable `Run` and calls `os.Exit` once.\n- **Use `flag.NewFlagSet` with `ContinueOnError`**, never the global `flag`\n  package, in anything you want to test.\n- **Write errors and usage to stderr, results to stdout**, so\n  `envcheck > out.txt` captures only the result.\n- **Pin toolchains where reproducibility matters**: the `go` line in `go.mod`\n  for everyone, and a pinned image tag (`golang:1.24.2-bookworm`, not\n  `golang:latest`) for containers.\n- **Use `docker compose run --rm`** for one-off tasks, so stopped containers\n  don't pile up.\n\n## Common Pitfalls\n\n- **`go: command not found` after installing.** `PATH` was changed in a file\n  your current shell never read. Open a new terminal, or `source ~/.profile`.\n- **Untarring over an old Go.** Files from both versions mix and you get odd\n  compile errors. Always `rm -rf /usr/local/go` first.\n- **Putting the course inside `~/go/src`.** That is the GOPATH layout from\n  before modules, and it is not needed. Keep the course wherever it is.\n- **`go: cannot find main module`.** You ran `go` outside the course\n  directory. `cd` to the folder that contains `go.mod`.\n- **\"Toolchain not available\" offline.** An older host Go tried to download\n  go1.24.2 (section 2). Connect once, or install 1.24.2 or newer.\n- **`-race requires cgo` / `C compiler \"gcc\" not found`.** You are on an\n  Alpine image or have `CGO_ENABLED=0`. The course image is Debian-based for\n  this reason. On a host, install `gcc` (on Linux, for example\n  `sudo apt install gcc`).\n- **Root-owned files in your checkout.** A container ran as root. The course\n  compose files set `user:`, so if you see this, export `UID`/`GID`\n  (section 4) or check for a custom `docker run` without `--user`.\n- **`docker-compose: command not found`, or YAML errors from an old Compose.**\n  Use `docker compose` (v2).\n- **The server works in the container, but `curl localhost` fails.** It is\n  listening on `127.0.0.1` inside the container, or the port isn't\n  published. Listen on `0.0.0.0` and add `ports:`.\n- **The container takes 10 seconds to stop.** The program never got SIGTERM\n  (a shell was PID 1) or ignores it, so Docker waited and sent SIGKILL. `exec`\n  the binary and handle the signal.\n- **\"Found orphan containers (gocourse-kvd-1)\" warnings.** All the course's\n  compose files share one project, `gocourse`, so that they share the cache\n  volumes. While a server such as `kvd` runs, commands from other modules\n  mention it. This is harmless. Don't add `--remove-orphans`: it would remove\n  the running server. To silence it, `export COMPOSE_IGNORE_ORPHANS=true`.\n- **`go install \u2026@latest` fails in the container with \"requires go >= 1.2x\".**\n  The image pins `GOTOOLCHAIN=local`. Prefix the command with\n  `GOTOOLCHAIN=auto` (section 4, dev container).\n- **Slow tests on macOS or Windows containers.** Bind mounts cross a VM\n  boundary there. Keep the build cache in the named volume (the course does),\n  or work on the host or in WSL 2.\n\n## Exercises\n\n### hello: prove the toolchain works (\u2248 5 min)\n\n`exercises/hello/hello.go` declares `Greeting(name string) string`. Implement\nit so the tests pass. Read `hello_test.go` first: it is the specification\n(white space handling, the default name, Unicode).\n\nOn the host:\n\n```bash\ngo test ./modules/00-setup/exercises/hello/\ngo test -v -run 'TestGreeting/empty' ./modules/00-setup/exercises/hello/   # one subtest\n```\n\nIn the container:\n\n```bash\ndocker compose -f modules/00-setup/compose.yaml run --rm test\n```\n\nAlso notice `ExampleGreeting` in the test file. Its `// Output:` comment is\nchecked by `go test`, and it appears in `go doc` output as an example.\n\n## Project\n\n**`envcheck`: hello world, environment edition (\u2264 30 min).** Implement\n`Run` in `project/envcheck/envcheck.go`: a command that greets you (using\nyour `hello.Greeting`) and, with `-v`, reports the Go version, platform, CPU\ncount and whether it is running in a container. `DetectEnv` and `main` are\nprovided. The spec and acceptance criteria are in\n[project/README.md](project/README.md).\n\nWhen it passes, run it both ways and compare:\n\n```bash\ngo run ./modules/00-setup/project/cmd/envcheck -v                     # container: no\ndocker compose -f modules/00-setup/compose.yaml run --rm envcheck     # container: yes\n```\n\n## Submitting for Review\n\nWhen the tests pass, on the host or in the container, ask your instructor\n(Claude) to review `modules/00-setup/`. Mention which setup you chose (host,\ncontainer or both) and paste the output of `envcheck -v`, so the review can\ncheck your environment too. Before asking:\n\n```bash\ngofmt -l modules/00-setup        # must print nothing\ngo vet ./modules/00-setup/...\ngo test -race ./modules/00-setup/...\n```\n\n## Further Reading\n\n- [Download and install Go](https://go.dev/doc/install): official instructions for every OS.\n- [All releases](https://go.dev/dl/) and [release notes](https://go.dev/doc/devel/release).\n- [Go toolchains](https://go.dev/doc/toolchain): how `GOTOOLCHAIN` and the `go` line work.\n- [Tutorial: Get started with Go](https://go.dev/doc/tutorial/getting-started) and [How to Write Go Code](https://go.dev/doc/code): modules, packages, `go install`.\n- [`gopls` documentation](https://go.dev/gopls/) and the [VS Code Go extension](https://github.com/golang/vscode-go).\n- [`flag` package](https://pkg.go.dev/flag): `FlagSet`, `ContinueOnError`, `ErrHelp`.\n- [Official `golang` Docker image](https://hub.docker.com/_/golang): tags and variants.\n- [Docker Compose file reference](https://docs.docker.com/reference/compose-file/), including [`extends`](https://docs.docker.com/compose/how-tos/multiple-compose-files/extends/) and [profiles](https://docs.docker.com/compose/how-tos/profiles/).\n- [VS Code Dev Containers](https://code.visualstudio.com/docs/devcontainers/containers).\n", "units": [{"kind": "exercise", "name": "hello", "dir": "/home/csmith/Workspace/tools/go-course/modules/00-setup/exercises/hello", "doc": "Package hello is the first package you write in this course. Its job is to\nprove that your toolchain, editor and test runner all work, on your host or\nin the course container.", "readme": "", "files": [{"name": "hello.go", "path": "/home/csmith/Workspace/tools/go-course/modules/00-setup/exercises/hello/hello.go"}, {"name": "hello_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/00-setup/exercises/hello/hello_test.go"}], "cmd": "go test ./modules/00-setup/exercises/hello/", "id": "modules/00-setup/exercises/hello"}, {"kind": "project", "name": "project", "dir": "/home/csmith/Workspace/tools/go-course/modules/00-setup/project", "doc": "", "readme": "# Project: `envcheck`, hello world, environment edition\n\n**Time:** \u2264 30 minutes. **Prerequisite:** the `hello` exercise passes (the\nproject imports it).\n\nA traditional first program prints \"Hello, World!\". This one does that and\nthen reports the environment it runs in, so you can see at a glance that your\nhost setup and the course container both work, and tell which one you are in.\n\n```console\n$ go run ./modules/00-setup/project/cmd/envcheck -v -name Ada\nHello, Ada!\nYour Go environment works.\n\ngo version: go1.24.2\nplatform: linux/amd64\ncpus: 8\ncontainer: no\n```\n\n## What is provided\n\n- `cmd/envcheck/main.go`: the complete `main`. It only calls\n  `envcheck.Run(os.Args[1:], envcheck.DetectEnv(), os.Stdout, os.Stderr)` and\n  exits with the result. Read it, but don't change it.\n- `envcheck/envcheck.go`: the `Env` type and `DetectEnv`, complete. `DetectEnv`\n  reads the values from the `runtime` package and decides `InContainer` by\n  looking for `/.dockerenv` (Docker) or `/run/.containerenv` (Podman).\n- `envcheck/envcheck_test.go`: the tests, complete.\n\n## What you implement\n\n`Run(args []string, env Env, stdout, stderr io.Writer) int` in\n`envcheck/envcheck.go`.\n\n### Flags\n\n| Flag | Meaning |\n|---|---|\n| `-name string` | who to greet; empty or blank means \"World\" (use `hello.Greeting`) |\n| `-v` | also print the environment report |\n| `-h` | print usage to stderr and exit 0 (the `flag` package does this for you) |\n\nParse them with `flag.NewFlagSet(\"envcheck\", flag.ContinueOnError)` and\n`fs.SetOutput(stderr)`, **not** the global `flag` functions.\n\n### Output (stdout)\n\n```\nHello, <name>!\nYour Go environment works.\n```\n\nWith `-v`, followed by a blank line and:\n\n```\ngo version: <env.GoVersion>\nplatform: <env.OS>/<env.Arch>\ncpus: <env.CPUs>\ncontainer: yes|no\n```\n\nUse the `env` argument, **not** `runtime` directly. That is what makes the\noutput testable: the tests pass a fixed `Env` and expect exact text.\n\n### Errors and exit codes\n\n| Situation | Exit code | stdout | stderr |\n|---|---|---|---|\n| success | 0 | the output above | nothing |\n| `-h` | 0 | nothing | usage |\n| unknown flag, or a flag missing its value | 2 | nothing | the `flag` package's message and the usage |\n| any positional argument (`envcheck Ada`) | 2 | nothing | `envcheck: unexpected argument \"Ada\"`, then the usage (`fs.Usage()`) |\n\n## Acceptance criteria\n\n- [ ] `go test -race ./modules/00-setup/...` passes (exercise and project).\n- [ ] `gofmt -l modules/00-setup` prints nothing; `go vet ./modules/00-setup/...` is clean.\n- [ ] `Run` never calls `os.Exit`, never touches `os.Stdout`/`os.Stderr`/`os.Args`, and doesn't use the global `flag` functions.\n- [ ] It works on the host **and** in the container, and `container:` differs:\n\n```bash\ngo run ./modules/00-setup/project/cmd/envcheck -v\ndocker compose -f modules/00-setup/compose.yaml run --rm envcheck\n```\n\n## Test commands\n\n```bash\ngo test ./modules/00-setup/project/...\ngo test -v -run TestRunUsageErrors ./modules/00-setup/project/envcheck/\ndocker compose -f modules/00-setup/compose.yaml run --rm test      # same, in the container\n```\n\n## Hints\n\n- `flag.ErrHelp` is the error `Parse` returns for `-h`. Compare with\n  `errors.Is`.\n- After `Parse`, `fs.NArg()` and `fs.Arg(0)` give the leftover positional\n  arguments.\n- When `Parse` fails, the `flag` package has **already** printed the error and\n  the usage to the writer you gave `SetOutput`. Just return 2.\n- `fmt.Fprintln(stdout, ...)` and `fmt.Fprintf(stdout, ...)` write to any\n  `io.Writer`.\n\n## Stretch goals\n\n1. Add `-json`: print the report as a JSON object (`encoding/json`, struct\n   tags) instead of text, and add a test for it.\n2. Report whether the race detector would work: build a second `Env` field\n   from `go env CGO_ENABLED` by running `exec.Command(\"go\", \"env\",\n   \"CGO_ENABLED\")`. Keep it testable by passing a function, not calling\n   `exec` inside `Run`.\n3. Build a real binary and run it outside `go run`:\n   `go build -o bin/envcheck ./modules/00-setup/project/cmd/envcheck && ./bin/envcheck -v`.\n   Then check its exit code for a bad flag: `./bin/envcheck -x; echo $?`.\n", "files": [{"name": "README.md", "path": "/home/csmith/Workspace/tools/go-course/modules/00-setup/project/README.md"}, {"name": "cmd/envcheck/main.go", "path": "/home/csmith/Workspace/tools/go-course/modules/00-setup/project/cmd/envcheck/main.go"}, {"name": "envcheck/envcheck.go", "path": "/home/csmith/Workspace/tools/go-course/modules/00-setup/project/envcheck/envcheck.go"}, {"name": "envcheck/envcheck_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/00-setup/project/envcheck/envcheck_test.go"}], "cmd": "go test ./modules/00-setup/project/...", "id": "modules/00-setup/project"}], "review": "# Module 00 \u2014 Setup & First Program: Instructor Review Guide\n\nThis module's goal is a **working environment**, not clever code. Review in\nthis order:\n\n1. **The environment.** Ask for the output of `envcheck -v` on the host and\n   in the container (`docker compose -f modules/00-setup/compose.yaml run --rm envcheck`).\n   Check: `go version` is 1.24.2 or newer, `container:` is `no` on the host and\n   `yes` in the container, and `gofmt -l` and `go vet` are clean (which proves\n   the editor formats on save).\n2. **The code**, against the checklists below.\n\nBenchmark numbers are from go1.24.2 linux/amd64 (20 logical CPUs),\n`-count=5`, medians, rounded.\n\n---\n\n## Exercise: `hello`\n\n### Readable solution\n\n```go\nfunc Greeting(name string) string {\n\tname = strings.TrimSpace(name)\n\tif name == \"\" {\n\t\tname = \"World\"\n\t}\n\treturn \"Hello, \" + name + \"!\"\n}\n\nfmt.Printf(\"%q %q %q\\n\", Greeting(\"Ada\"), Greeting(\"  Ada \\n\"), Greeting(\"\\t\")) // \"Hello, Ada!\" \"Hello, Ada!\" \"Hello, World!\"\n```\n\n`strings.TrimSpace` handles spaces, tabs and newlines (any Unicode white\nspace), so `\" \\t \"` and `\"\"` share one branch. The function reassigns its\nparameter instead of introducing a second variable, a common and accepted Go\nidiom for normalizing input.\n\n### Optimized solution\n\nThere is little to optimize. `+` on three operands compiles to a single\n`runtime.concatstrings` call, so one allocation. `fast.go` compares the\nalternatives people write:\n\n| Variant (`fast.go`) | ns/op | B/op | allocs/op |\n|---|---|---|---|\n| `Greeting` (`+`) | ~37 | 24 | 1 |\n| `GreetingBuilder` (pre-sized `strings.Builder`) | ~33 | 24 | 1 |\n| `GreetingSprintf` (`fmt.Sprintf(\"Hello, %s!\", name)`) | ~89 | 40 | 2 |\n\n```bash\ngo test ./solutions/00-setup/exercises/hello/ -run='^$' -bench=. -benchmem\n```\n\n### Trade-off\n\n`+` is the right answer: as clear as `Sprintf` and within ~10% of the\nhand-built `Builder`. `Sprintf` costs about 2.4\u00d7 more time and an extra\nallocation (the argument is boxed into an `interface{}`). That is irrelevant\nfor one greeting but a habit worth noticing in hot loops. **Don't ask a student\nto change `Sprintf` here.** Mention the cost as information.\n\n### Review checklist\n\n- [ ] Uses `strings.TrimSpace`, not a hand-written loop or `strings.Trim(name, \" \")` (which misses tabs and newlines).\n- [ ] Tests pass the `only white space` and `tabs and newline` cases. Those catch `Trim(\" \")`.\n- [ ] Doc comment intact and starting with `Greeting`.\n- [ ] No `fmt.Println` debugging left behind.\n- [ ] gofmt-clean. If not, the editor isn't formatting on save: fix the setup, not just the file.\n\n---\n\n## Project: `envcheck`\n\n### Readable solution\n\n`solutions/00-setup/project/envcheck/envcheck.go`:\n\n```go\nimport \"gocourse/solutions/00-setup/exercises/hello\"\n\ntype Env struct {\n\tGoVersion   string // e.g. \"go1.24.2\"\n\tOS, Arch    string // e.g. \"linux\", \"amd64\"\n\tCPUs        int\n\tInContainer bool\n}\n\nfunc main() { // try a few argument lists\n\tenv := Env{GoVersion: \"go1.24.2\", OS: \"linux\", Arch: \"amd64\", CPUs: 8}\n\tfor _, args := range [][]string{{\"-name\", \"Ada\"}, {\"-v\"}, {\"extra\"}} {\n\t\tfmt.Printf(\"$ envcheck %s\\n\", strings.Join(args, \" \"))\n\t\tfmt.Printf(\"(exit %d)\\n\\n\", Run(args, env, os.Stdout, os.Stdout))\n\t}\n}\n\nfunc Run(args []string, env Env, stdout, stderr io.Writer) int {\n\tfs := flag.NewFlagSet(\"envcheck\", flag.ContinueOnError)\n\tfs.SetOutput(stderr)\n\tname := fs.String(\"name\", \"\", \"who to greet (default: World)\")\n\tverbose := fs.Bool(\"v\", false, \"also report the Go environment\")\n\tif err := fs.Parse(args); err != nil {\n\t\tif errors.Is(err, flag.ErrHelp) {\n\t\t\treturn 0\n\t\t}\n\t\treturn 2 // the flag package already printed the error and usage\n\t}\n\tif fs.NArg() > 0 {\n\t\tfmt.Fprintf(stderr, \"envcheck: unexpected argument %q\\n\", fs.Arg(0))\n\t\tfs.Usage()\n\t\treturn 2\n\t}\n\n\tfmt.Fprintln(stdout, hello.Greeting(*name))\n\tfmt.Fprintln(stdout, \"Your Go environment works.\")\n\tif *verbose {\n\t\tcontainer := \"no\"\n\t\tif env.InContainer {\n\t\t\tcontainer = \"yes\"\n\t\t}\n\t\tfmt.Fprintf(stdout, \"\\ngo version: %s\\nplatform: %s/%s\\ncpus: %d\\ncontainer: %s\\n\",\n\t\t\tenv.GoVersion, env.OS, env.Arch, env.CPUs, container)\n\t}\n\treturn 0\n}\n```\n\nPoints to look for:\n\n- **Dependency injection at the edges.** `args`, `stdout`, `stderr` and\n  `env` come in as parameters, and `main` supplies the real ones. This is\n  why `TestRun` can check exact output on any machine, including CI and the\n  container, where `cpus` and `container:` differ.\n- **Usage errors return before anything reaches stdout**, so a script\n  piping `envcheck` never sees half a result.\n- **Reuse** of `hello.Greeting` through its import path\n  `gocourse/modules/00-setup/exercises/hello`: the first taste of how packages\n  in one module use each other.\n\n### Optimized solution\n\nNone is warranted, and it's worth saying so explicitly in review. `Run` does\na handful of writes once per process. Process start-up (~1 ms) dwarfs it by\nfour orders of magnitude, so any \"optimization\" (a single `Fprintf`, a\n`bufio.Writer`) only costs readability. The one performance-adjacent habit to\nreinforce is **building the output with `Fprint*` to the injected writer**,\nrather than concatenating a big string and printing it at the end. It is\nclearer, and it streams for large outputs.\n\n### Trade-off\n\nThe only real design decision is **how much to inject**. Passing `Env`\nmakes the output testable; the alternative (calling `runtime.Version()`\ninside `Run`) forces tests to compute expected values with the same calls,\nwhich tests nothing. The cost is one extra parameter. Go code makes this\ntrade almost always: dependencies at the edges, as plain parameters or small\ninterfaces.\n\n### Review checklist\n\n- [ ] `main` unchanged: one `os.Exit(envcheck.Run(...))` line.\n- [ ] `Run` uses `flag.NewFlagSet(..., flag.ContinueOnError)` + `SetOutput(stderr)`; **no** global `flag.String`/`flag.Parse`.\n- [ ] `flag.ErrHelp` checked with `errors.Is` and mapped to exit 0.\n- [ ] Parse errors return 2 *without* printing the error a second time (the `flag` package already did).\n- [ ] Positional arguments rejected with the exact message, followed by `fs.Usage()`.\n- [ ] Uses the `env` parameter, not `runtime.*` or `DetectEnv()`, inside `Run`.\n- [ ] No `os.Exit`, `os.Stdout`, `os.Stderr`, `log.Fatal` or `panic` inside `Run`.\n- [ ] Output to `stdout`, diagnostics to `stderr`.\n- [ ] Environment verified both ways (host `container: no`, compose `container: yes`).\n\n### Common student mistakes\n\n| Mistake | Symptom | Comment to give |\n|---|---|---|\n| Global `flag.String` + `flag.Parse()` | Tests panic \"flag redefined\" or exit the test binary | \"The global FlagSet is process-wide state, and on error it calls `os.Exit(2)`. Use a local `FlagSet`.\" |\n| `fmt.Println` instead of `Fprintln(stdout, \u2026)` | `TestRun` sees empty stdout | \"Write to the writer you were given. That's what lets the test capture it.\" |\n| Printing `err` after a failed `Parse` | Error message appears twice in stderr | \"`flag` already reported it to `stderr`.\" |\n| `return 1` for usage errors | `TestRunUsageErrors` fails | \"Convention: 2 means 'you called me wrong', 1 means 'I failed'.\" |\n| Calling `DetectEnv()` inside `Run` | `TestRun` \"verbose\" cases fail on most machines | \"That's why `env` is a parameter: tests decide the environment.\" |\n\n---\n\n## Environment review checklist (both setups)\n\n- [ ] `go version` is 1.24.2 or newer on the host (or the student uses only the container).\n- [ ] The student runs commands from the course root with `./modules/...` paths.\n- [ ] Editor formats on save (no gofmt findings, imports grouped by the tool).\n- [ ] Container: `docker compose ... run --rm test` passes; files created in the checkout are owned by the student, not root.\n- [ ] They can explain why the image is `bookworm` and not `alpine` (`-race` needs cgo).\n", "solDir": "/home/csmith/Workspace/tools/go-course/solutions/00-setup", "dir": "/home/csmith/Workspace/tools/go-course/modules/00-setup"}, {"slug": "01-basics", "compose": "modules/01-basics/compose.yaml", "services": ["test", "vet", "bench", "cover", "shell", "solutions"], "title": "Module 01: Types, Slices, Maps, Strings", "lesson": "# Module 01: Types, Slices, Maps, Strings\n\nMost Go bugs that new Gophers write are not exotic. They come from four everyday\ntypes (slices, maps, strings and constants) behaving differently from their\nlook-alikes in other languages. This module explains how each one actually works\nunderneath, so you can predict their behaviour instead of memorising rules.\n\n> The course pins **Go 1.24**. Everything below compiles with go1.24.2. Where\n> newer releases changed something relevant, the text says \"in Go 1.25+\".\n\n## Goals\n\nBy the end of this module you will be able to:\n\n- Explain **zero values** and design code that uses them instead of fighting them.\n- Draw the **slice header** (pointer, length, capacity), predict when `append`\n  reuses or reallocates a backing array, and use the **full slice expression**\n  `s[lo:hi:max]` to prevent aliasing bugs.\n- Use **maps** safely: nil-map behaviour, comma-ok lookups, `map[K]struct{}`\n  sets, and producing **deterministic output** despite randomised iteration.\n- Tell **bytes, runes and strings** apart, iterate UTF-8 correctly, and build\n  strings efficiently with `strings.Builder`.\n- Define typed constants and enumerations with **`iota`**.\n- Reach for the standard **`slices`, `maps` and `cmp`** packages and the\n  **`min`, `max`, `clear`** built-ins instead of hand-rolling loops.\n\n---\n\n## Concepts\n\n### 1. Zero values: every variable starts out usable\n\nIn Go, every variable is initialised. A declaration without a value gets the\ntype's **zero value** ([spec: The zero value](https://go.dev/ref/spec#The_zero_value)):\n\n| Type | Zero value |\n|---|---|\n| `bool` | `false` |\n| numeric types | `0` |\n| `string` | `\"\"` |\n| pointer, func, interface, slice, map, channel | `nil` |\n| array, struct | every element / field set to *its* zero value |\n\n```go\nvar n int          // 0\nvar s string       // \"\"\nvar p *int         // nil\nvar xs []int       // nil slice: len 0, cap 0, safe to append to and range over\nvar m map[string]int // nil map: safe to READ, panics on WRITE (see below)\nvar sb strings.Builder // ready to use, no constructor needed\nvar mu sync.Mutex      // unlocked mutex, ready to use\n\nfmt.Println(n, s == \"\", p == nil, xs == nil, len(xs), m == nil, m[\"x\"]) // 0 true true true 0 true 0\nsb.WriteString(\"works\")\nmu.Lock()\nmu.Unlock()\nfmt.Println(sb.String())\n```\n\n**Why it matters:** Go's standard library is designed so that the zero value is\nuseful (\"Make the zero value useful\" is one of the\n[Go Proverbs](https://go-proverbs.github.io/)). `bytes.Buffer`, `strings.Builder`,\n`sync.Mutex` and `sync.WaitGroup` all work straight away. When you design your\nown types, aim for the same thing. It removes a whole class of \"forgot to call\n`New`\" bugs.\n\n`var x T` is the idiomatic way to say \"I want the zero value\". Use `x := T{...}`\nwhen you are actually filling in fields.\n\n### 2. Arrays are values; slices are views\n\nAn **array** has its length as part of its type (`[3]int` and `[4]int` are\ndifferent types). Arrays are *values*, so assigning or passing one copies every\nelement:\n\n```go\narr := [3]int{1, 2, 3}\narr2 := arr   // full copy\narr2[0] = 100\nfmt.Println(arr, arr2) // [1 2 3] [100 2 3]\n```\n\nYou rarely use arrays directly. Their main job is to be the storage underneath\n**slices**. A slice is a small struct, the **slice header**:\n\n```\ntype sliceHeader struct {   // conceptually; see runtime/slice.go\n    ptr *T  // points at some element of a backing array\n    len int // number of elements you can index: s[0] .. s[len-1]\n    cap int // number of elements from ptr to the end of the backing array\n}\n```\n\nCopying a slice copies the *header* (three words), **not the elements**. Two\nslices can therefore point into the same backing array, and that is both what\nmakes slices cheap and what makes them surprising.\nRead [Go Slices: usage and internals](https://go.dev/blog/slices-intro) once;\nit is short and pays for itself many times over.\n\n#### Slicing shares memory\n\n```go\na := []int{1, 2, 3, 4}\nb := a[:2]                 // b = [1 2], len 2, cap 4: same backing array\nfmt.Println(len(b), cap(b)) // 2 4\n```\n\n```\na: ptr \u2500\u2510 len 4 cap 4\nb: ptr \u2500\u2524 len 2 cap 4\n        \u25bc\n      [ 1 | 2 | 3 | 4 ]   \u2190 one backing array\n```\n\n#### `append` reuses capacity, which causes the classic aliasing bug\n\n`append(s, v)` checks whether `len(s) < cap(s)`. If so, it writes `v` into the\n**existing** backing array at index `len(s)` and returns a header with `len+1`.\nOnly when capacity runs out does it allocate a new, larger array and copy.\n\n```go\na := []int{1, 2, 3, 4}\nb := a[:2]\nb = append(b, 99)  // len(b)=2 < cap(b)=4, so it writes into a[2]!\nfmt.Println(a, b)  // [1 2 99 4] [1 2 99]\n```\n\n`a` changed even though we never touched it. This is mistake #25 in\n[100 Go Mistakes](https://100go.co/#unexpected-side-effects-using-slice-append-25).\n\n#### The full slice expression caps capacity\n\n`s[lo:hi:max]` creates a slice with `len = hi-lo` and **`cap = max-lo`**\n([spec: Full slice expressions](https://go.dev/ref/spec#Slice_expressions)).\nSetting `max == hi` means the result has no spare capacity, so the next `append`\n*must* allocate and can't clobber anyone else's data:\n\n```go\na := []int{1, 2, 3, 4}\nc := a[:2:2]       // len 2, cap 2\nc = append(c, 42)  // no room, so a new array is allocated\nfmt.Println(a, c)  // [1 2 3 4] [1 2 42]   a is untouched\n```\n\nUse it whenever you hand out sub-slices of a buffer you still own. The\n`chunk` exercise is built around it. If you need an independent copy instead\nof a capped view, use `slices.Clone(s)`.\n\n#### Always use the result of `append`\n\n```go\ns := make([]int, 2, 10)\nx := 7\n// append(s, x)    // compile error: the result is not used (uncomment to see)\ns2 := append(s, x) // compiles, but now s and s2 share memory (cap was 10)\ns = append(s, 8)   // the idiom\nfmt.Println(s, s2) // [0 0 8] [0 0 8]: the second append overwrote s2[2]\n```\n\nBecause `append` may or may not reallocate, the only safe mental model is\n\"`append` returns *the* slice; the old header is stale\".\n\n#### Growth and preallocation\n\nWhen `append` reallocates, it grows capacity geometrically (roughly doubling for\nsmall slices, more gently for large ones; the exact policy is an\nimplementation detail, see `runtime.growslice`). Watch it happen:\n\n```go\nvar s []int\nfor i := range 10 {\n    s = append(s, i)\n    fmt.Print(cap(s), \" \")\n}\n// 1 2 4 4 8 8 8 8 16 16\n```\n\nEach reallocation copies every element and leaves garbage behind. If you know\n(or can bound) the final size, **preallocate** with `make([]T, 0, n)`:\n\n```go\ntype user struct{ Name string }\nusers := []user{{\"Ada\"}, {\"Grace\"}, {\"Linus\"}, {\"Rob\"}, {\"Ken\"}}\n\n// BAD: up to log2(n) reallocations\nvar bad []string\nfor _, u := range users {\n\tbad = append(bad, u.Name)\n}\n\n// GOOD: one allocation\ngood := make([]string, 0, len(users))\nfor _, u := range users {\n\tgood = append(good, u.Name)\n}\nfmt.Println(cap(bad), cap(good)) // 8 5: bad grew 1, 2, 4, 8\n```\n\nWatch out for the most common preallocation bug. `make([]T, n)` makes a slice of\n**length** n (n zero values). Appending to it adds *after* those zeros:\n\n```go\nx := make([]int, 3)\nx = append(x, 1)\nfmt.Println(x) // [0 0 0 1]   oops\n```\n\nUse either `make([]T, n)` + index assignment `x[i] = v`, **or**\n`make([]T,
