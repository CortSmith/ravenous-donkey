tfmt.Println(SumSquares(ctx, []int{1, 2, 3}, 2)) // 0 context canceled\n}\n```\n\n**Why it's idiomatic**:\n- Each stage closes its output channel when it returns.\n- Every blocking operation (send, receive) also checks `ctx.Done()`.\n- `Merge` uses `sync.WaitGroup` to wait for all senders before closing the merged channel.\n- A private context in `SumSquares` allows orchestration without affecting the caller's context.\n\n### Key Pattern: Every Blocking Op Needs a Cancel Case\n\nThe most important lesson: in a concurrent pipeline, every `case` that could block must have a matching `case <-ctx.Done()`.\n\n```go\nfunc produce(ctx context.Context, out chan<- int, value int) {\n\t// BAD would be a send with no other case: it blocks forever if no one is\n\t// receiving and ctx is not done.\n\t//\n\t//\tout <- value\n\n\t// GOOD: can exit on cancellation\n\tselect {\n\tcase out <- value:\n\tcase <-ctx.Done():\n\t\tfmt.Println(\"gave up:\", ctx.Err())\n\t\treturn // no goroutine leak\n\t}\n}\n\nfunc main() {\n\tctx, cancel := context.WithTimeout(context.Background(), 20*time.Millisecond)\n\tdefer cancel()\n\tproduce(ctx, make(chan int), 1) // nobody receives: gave up: context deadline exceeded\n}\n```\n\n### Optimizations\n\nNo significant optimization. The design is both clear and efficient.\n\n### Trade-off\n\n- **Check `ctx.Done()` on every blocking operation**: code is longer but guarantees no leaks.\n- **Ignore cancellation**: simpler code (fewer `select` statements), but goroutines may block forever.\n\nAlways check `ctx.Done()`. It's a requirement for correctness, not an optimization.\n\n### Grading Checklist (Pipeline)\n\n- [ ] `Generate` closes its output channel (via `defer close(out)`).\n- [ ] `Generate` checks `ctx.Done()` before sending (no leak on early cancel).\n- [ ] `Square` reads from input until it's closed (`x, ok := <-in; if !ok { return }`).\n- [ ] `Square` checks `ctx.Done()` on both receive and send (no leak).\n- [ ] `Merge` uses `sync.WaitGroup` to wait for all input channels to be drained.\n- [ ] `Merge` spawns one goroutine per input channel (no goroutines lost).\n- [ ] `Merge` closes output only after all senders are done (via `wg.Wait()`).\n- [ ] `SumSquares` creates a private context for pipeline orchestration.\n- [ ] `SumSquares` checks `ctx.Err()` to distinguish normal completion from cancellation.\n- [ ] No goroutines leak on cancellation (test with `runtime.NumGoroutine()`).\n- [ ] Tests pass with `-race` and timeouts to catch deadlocks.\n\n---\n\n## Exercise 5: Fetcher\n\n### Readable Solution (fetcher.go)\n\n**What it does**: Fetches many URLs concurrently, bounding in-flight fetches with a semaphore channel.\n\n```go\nimport \"gocourse/solutions/07-concurrency/exercises/fetcher\"\n\ntype (\n\tFetchFunc = fetcher.FetchFunc\n\tResult    = fetcher.Result\n)\n\n// FetchAll fetches every URL in urls with at most limit calls to fetch in\n// flight at any moment (limit < 1 is treated as 1). It returns one Result per\n// URL, in the same order as urls. A failed fetch does not stop the others.\n//\n// If ctx is canceled, FetchAll starts no new fetches; the Result for every\n// URL that was never started has Err == ctx.Err(). FetchAll waits for all\n// started fetches to return before it returns.\nfunc FetchAll(ctx context.Context, urls []string, limit int, fetch FetchFunc) []Result {\n\tresults := make([]Result, len(urls))\n\tsem := make(chan struct{}, max(limit, 1)) // a token per in-flight fetch\n\n\tvar wg sync.WaitGroup\n\tfor i, u := range urls {\n\t\tresults[i].URL = u\n\n\t\t// Acquire in the parent: this bounds the number of goroutines, not\n\t\t// just the number of busy ones, and lets us stop launching early.\n\t\tselect {\n\t\tcase sem <- struct{}{}:\n\t\tcase <-ctx.Done():\n\t\t}\n\t\t// select picks randomly when both cases are ready, so re-check:\n\t\t// never start a fetch once ctx is done.\n\t\tif err := ctx.Err(); err != nil {\n\t\t\tfor j := i; j < len(urls); j++ {\n\t\t\t\tresults[j] = Result{URL: urls[j], Err: err}\n\t\t\t}\n\t\t\tbreak\n\t\t}\n\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tdefer func() { <-sem }() // release\n\t\t\tbody, err := fetch(ctx, u)\n\t\t\tresults[i].Body, results[i].Err = body, err // each goroutine owns one element\n\t\t}()\n\t}\n\twg.Wait()\n\treturn results\n}\n\n// Errors combines the failures in results into one error, each wrapped with\n// its URL, using errors.Join. It returns nil if every fetch succeeded.\nfunc Errors(results []Result) error {\n\tvar errs []error\n\tfor _, r := range results {\n\t\tif r.Err != nil {\n\t\t\terrs = append(errs, fmt.Errorf(\"fetch %s: %w\", r.URL, r.Err))\n\t\t}\n\t}\n\treturn errors.Join(errs...) // nil when errs is empty\n}\n\nfunc main() {\n\tfetch := func(ctx context.Context, url string) (string, error) {\n\t\tif strings.Contains(url, \"bad\") {\n\t\t\treturn \"\", errors.New(\"connection refused\")\n\t\t}\n\t\treturn \"<html>\" + url + \"<\/html>\", nil\n\t}\n\tresults := FetchAll(context.Background(), []string{\"a.example\", \"bad.example\", \"c.example\"}, 2, fetch)\n\tfor _, r := range results {\n\t\tfmt.Printf(\"%s: %q %v\\n\", r.URL, r.Body, r.Err)\n\t}\n\tfmt.Println(Errors(results)) // fetch bad.example: connection refused\n}\n```\n\n**Why it's idiomatic**:\n- Semaphore channel bounds in-flight work. Buffer capacity = max concurrent.\n- Acquire in parent before spawning: bounds goroutines themselves, not just busy ones.\n- Check `ctx.Err()` after attempting to acquire to avoid starting a fetch if already canceled.\n- Capture loop vars by passing them as function arguments.\n- `errors.Join` combines multiple errors with `%w` wrapping.\n\n### Optimizations (fast.go)\n\nNo significant optimization. The semaphore pattern is efficient.\n\n### Trade-off\n\n- **Acquire in parent**: simple, clear, bounds goroutines.\n- **Acquire in goroutine**: slightly less obvious but equivalent (both bound concurrency).\n\nAcquire in parent is clearer.\n\n### Grading Checklist (Fetcher)\n\n- [ ] Semaphore channel has capacity = `max(limit, 1)`.\n- [ ] Acquire token in parent before spawning goroutine (bounds goroutines).\n- [ ] Check `ctx.Err()` after attempting acquire to avoid starting canceled fetches.\n- [ ] Goroutine acquires then immediately releases on deferred `<-sem`.\n- [ ] Results are in the same order as URLs (results[i] corresponds to urls[i]).\n- [ ] A failed fetch does not stop others (all URLs are attempted).\n- [ ] On context cancellation, remaining unstarted URLs get `Err == ctx.Err()`.\n- [ ] `Errors()` wraps each error with its URL and combines with `errors.Join()`.\n- [ ] Tests pass with `-race` and timeouts.\n\n---\n\n## Project: Duplicate File Finder\n\n### Readable Solution (dupfind.go)\n\n**What it does**: Walks a directory, groups files by size, hashes files in size collisions concurrently with a bounded worker pool, and reports duplicates.\n\n**Key functions**:\n\n1. **HashFile(ctx, path)**: compute SHA-256 hash.\n   ```go\n   func HashFile(ctx context.Context, path string) (string, error) {\n       if err := ctx.Err(); err != nil {\n           return \"\", err\n       }\n       f, err := os.Open(path)\n       if err != nil {\n           return \"\", err\n       }\n       defer f.Close()\n\n       h := sha256.New()\n       if _, err := io.Copy(h, f); err != nil {\n           return \"\", fmt.Errorf(\"hash %s: %w\", path, err)\n       }\n       return hex.EncodeToString(h.Sum(nil)), nil\n   }\n\n   func main() {\n   \tf, _ := os.CreateTemp(\"\", \"hash-*\")\n   \tdefer os.Remove(f.Name())\n   \tf.WriteString(\"hello\\n\")\n   \tf.Close()\n   \tfmt.Println(HashFile(context.Background(), f.Name())) // 5891b5b5... <nil>\n   }\n   ```\n\n2. **filesBySize(ctx, root, minSize)**: walk and group by size.\n   ```go\n   func filesBySize(ctx context.Context, root string, minSize int64) (map[int64][]string, error) {\n       bySize := make(map[int64][]string)\n       err := filepath.WalkDir(root, func(path string, d fs.DirEntry, err error) error {\n           if err != nil { return err }\n           if err := ctx.Err(); err != nil { return err }\n           if !d.Type().IsRegular() { return nil }\n           info, err := d.Info()\n           if err != nil { return err }\n           if info.Size() >= minSize {\n               bySize[info.Size()] = append(bySize[info.Size()], path)\n           }\n           return nil\n       })\n       if err != nil {\n           return nil, fmt.Errorf(\"walk %s: %w\", root, err)\n       }\n       return bySize, nil\n   }\n\n   func main() {\n   \tdir, _ := os.MkdirTemp(\"\", \"bysize\")\n   \tdefer os.RemoveAll(dir)\n   \tfor name, body := range map[string]string{\"a\": \"12345\", \"b\": \"abcde\", \"c\": \"x\", \"empty\": \"\"} {\n   \t\tos.WriteFile(filepath.Join(dir, name), []byte(body), 0o644)\n   \t}\n   \tbySize, err := filesBySize(context.Background(), dir, 1)\n   \tfmt.Println(len(bySize[5]), len(bySize[1]), len(bySize[0]), err) // 2 1 0 <nil>\n   }\n   ```\n\n3. **hashAll(ctx, paths, opts)**: bounded worker pool hashing.\n   ```go\n   import \"gocourse/solutions/07-concurrency/project/dupfind\"\n\n   type Options = dupfind.Options\n\n   var HashFile = dupfind.HashFile\n\n   // hashAll hashes paths with a bounded worker pool and returns the hashes in\n   // the same order as paths. It stops at the first error.\n   func hashAll(ctx context.Context, paths []string, opts Options) ([]string, error) {\n   \thash := opts.Hash\n   \tif hash == nil {\n   \t\thash = HashFile\n   \t}\n   \tworkers := opts.Workers\n   \tif workers < 1 {\n   \t\tworkers = runtime.GOMAXPROCS(0)\n   \t}\n\n   \tctx, cancel := context.WithCancelCause(ctx)\n   \tdefer cancel(nil)\n\n   \thashes := make([]string, len(paths))\n   \tjobs := make(chan int)\n   \tvar wg sync.WaitGroup\n   \tfor range min(workers, len(paths)) {\n   \t\twg.Add(1)\n   \t\tgo func() {\n   \t\t\tdefer wg.Done()\n   \t\t\tfor i := range jobs {\n   \t\t\t\th, err := hash(ctx, paths[i])\n   \t\t\t\tif err != nil {\n   \t\t\t\t\tcancel(fmt.Errorf(\"hash %s: %w\", paths[i], err))\n   \t\t\t\t\treturn\n   \t\t\t\t}\n   \t\t\t\thashes[i] = h\n   \t\t\t}\n   \t\t}()\n   \t}\n\n   feed:\n   \tfor i := range paths {\n   \t\tselect {\n   \t\tcase jobs <- i:\n   \t\tcase <-ctx.Done():\n   \t\t\tbreak feed\n   \t\t}\n   \t}\n   \tclose(jobs)\n   \twg.Wait()\n\n   \tif err := context.Cause(ctx); err != nil {\n   \t\treturn nil, err\n   \t}\n   \treturn hashes, nil\n   }\n\n   func main() {\n   \tdir, _ := os.MkdirTemp(\"\", \"hashall\")\n   \tdefer os.RemoveAll(dir)\n   \tvar paths []string\n   \tfor _, name := range []string{\"a\", \"b\", \"c\"} {\n   \t\tp := filepath.Join(dir, name)\n   \t\tos.WriteFile(p, []byte(\"same\"), 0o644)\n   \t\tpaths = append(paths, p)\n   \t}\n   \thashes, err := hashAll(context.Background(), paths, Options{Workers: 2})\n   \tfmt.Println(len(hashes), hashes[0] == hashes[2], err) // 3 true <nil>\n   }\n   ```\n\n4. **Find**: orchestrates the whole process.\n   ```go\n   import \"gocourse/solutions/07-concurrency/project/dupfind\"\n\n   type (\n   \tOptions = dupfind.Options\n   \tGroup   = dupfind.Group\n   )\n\n   var HashFile = dupfind.HashFile\n\n   // Find walks root and returns every group of duplicate regular files.\n   // Symlinks and other non-regular files are ignored. Groups are sorted by\n   // Size descending, then by their first path; paths within a group are\n   // sorted. Find returns a nil slice (and nil error) when there are no\n   // duplicates.\n   //\n   // If walking or hashing fails, or ctx is canceled, Find stops hashing,\n   // waits for its goroutines to exit, and returns the error.\n   func Find(ctx context.Context, root string, opts Options) ([]Group, error) {\n   \tbySize, err := filesBySize(ctx, root, max(opts.MinSize, 1))\n   \tif err != nil {\n   \t\treturn nil, err\n   \t}\n\n   \tvar candidates []string\n   \tsizeOf := make(map[string]int64)\n   \tfor size, paths := range bySize {\n   \t\tif len(paths) < 2 {\n   \t\t\tcontinue // a unique size cannot have a duplicate: never read it\n   \t\t}\n   \t\tfor _, p := range paths {\n   \t\t\tcandidates = append(candidates, p)\n   \t\t\tsizeOf[p] = size\n   \t\t}\n   \t}\n\n   \thashes, err := hashAll(ctx, candidates, opts)\n   \tif err != nil {\n   \t\treturn nil, err\n   \t}\n\n   \ttype key struct {\n   \t\tsize int64\n   \t\thash string\n   \t}\n   \tbyKey := make(map[key][]string)\n   \tfor i, p := range candidates {\n   \t\tk := key{sizeOf[p], hashes[i]}\n   \t\tbyKey[k] = append(byKey[k], p)\n   \t}\n\n   \tvar groups []Group\n   \tfor k, paths := range byKey {\n   \t\tif len(paths) < 2 {\n   \t\t\tcontinue\n   \t\t}\n   \t\tslices.Sort(paths)\n   \t\tgroups = append(groups, Group{Size: k.size, Hash: k.hash, Paths: paths})\n   \t}\n   \tslices.SortFunc(groups, func(a, b Group) int {\n   \t\treturn cmp.Or(\n   \t\t\tcmp.Compare(b.Size, a.Size), // larger files first\n   \t\t\tcmp.Compare(a.Paths[0], b.Paths[0]),\n   \t\t)\n   \t})\n   \treturn groups, nil\n   }\n\n   // filesBySize walks root and groups regular files of at least minSize bytes\n   // by size.\n   func filesBySize(ctx context.Context, root string, minSize int64) (map[int64][]string, error) {\n   \tbySize := make(map[int64][]string)\n   \terr := filepath.WalkDir(root, func(path string, d fs.DirEntry, err error) error {\n   \t\tif err != nil {\n   \t\t\treturn err\n   \t\t}\n   \t\tif err := ctx.Err(); err != nil {\n   \t\t\treturn err\n   \t\t}\n   \t\tif !d.Type().IsRegular() {\n   \t\t\treturn nil // directories, symlinks, devices, sockets...\n   \t\t}\n   \t\tinfo, err := d.Info()\n   \t\tif err != nil {\n   \t\t\treturn err\n   \t\t}\n   \t\tif info.Size() >= minSize {\n   \t\t\tbySize[info.Size()] = append(bySize[info.Size()], path)\n   \t\t}\n   \t\treturn nil\n   \t})\n   \tif err != nil {\n   \t\treturn nil, fmt.Errorf(\"walk %s: %w\", root, err)\n   \t}\n   \treturn bySize, nil\n   }\n\n   // hashAll hashes paths with a bounded worker pool and returns the hashes in\n   // the same order as paths. It stops at the first error.\n   func hashAll(ctx context.Context, paths []string, opts Options) ([]string, error) {\n   \thash := opts.Hash\n   \tif hash == nil {\n   \t\thash = HashFile\n   \t}\n   \tworkers := opts.Workers\n   \tif workers < 1 {\n   \t\tworkers = runtime.GOMAXPROCS(0)\n   \t}\n\n   \tctx, cancel := context.WithCancelCause(ctx)\n   \tdefer cancel(nil)\n\n   \thashes := make([]string, len(paths))\n   \tjobs := make(chan int)\n   \tvar wg sync.WaitGroup\n   \tfor range min(workers, len(paths)) {\n   \t\twg.Add(1)\n   \t\tgo func() {\n   \t\t\tdefer wg.Done()\n   \t\t\tfor i := range jobs {\n   \t\t\t\th, err := hash(ctx, paths[i])\n   \t\t\t\tif err != nil {\n   \t\t\t\t\tcancel(fmt.Errorf(\"hash %s: %w\", paths[i], err))\n   \t\t\t\t\treturn\n   \t\t\t\t}\n   \t\t\t\thashes[i] = h\n   \t\t\t}\n   \t\t}()\n   \t}\n\n   feed:\n   \tfor i := range paths {\n   \t\tselect {\n   \t\tcase jobs <- i:\n   \t\tcase <-ctx.Done():\n   \t\t\tbreak feed\n   \t\t}\n   \t}\n   \tclose(jobs)\n   \twg.Wait()\n\n   \tif err := context.Cause(ctx); err != nil {\n   \t\treturn nil, err\n   \t}\n   \treturn hashes, nil\n   }\n\n   func main() {\n   \tdir, _ := os.MkdirTemp(\"\", \"dupfind\")\n   \tdefer os.RemoveAll(dir)\n   \tfor name, body := range map[string]string{\"a.txt\": \"hello\", \"b.txt\": \"hello\", \"c.txt\": \"world\", \"d.txt\": \"much longer\"} {\n   \t\tos.WriteFile(filepath.Join(dir, name), []byte(body), 0o644)\n   \t}\n   \tgroups, err := Find(context.Background(), dir, Options{})\n   \tfor _, g := range groups {\n   \t\tfmt.Println(g.Size, len(g.Paths), filepath.Base(g.Paths[0]), filepath.Base(g.Paths[1]))\n   \t}\n   \tfmt.Println(err) // one group: 5 2 a.txt b.txt, then <nil>\n   }\n   ```\n\n**Why it's idiomatic**:\n- Two-stage grouping: cheap (size) before expensive (hash).\n- Worker pool for hashing with bounded concurrency.\n- Error propagation via `context.WithCancelCause`.\n- `sync.WaitGroup` ensures all workers finish before checking for errors.\n- Each output element (hash at index i) is written by exactly one worker (no contention).\n\n### Optimizations\n\n1. **Parallel hashing of large files**: read large files in chunks and hash in parallel (complex; not required).\n2. **Memory-mapped files**: avoid buffering entire files in RAM (Go's `io.Copy` already uses bufio internally).\n3. **Avoiding redundant stats**: already done (one stat per file in `WalkDir`).\n\nThe solution is already well-optimized for typical use cases.\n\n### Trade-off\n\n- **Two-stage (size, then hash)**: avoids hashing files with unique sizes; simplest and best for most directories.\n- **Hash all files**: simpler code, slower if many files have unique sizes (wasted hash work).\n\nTwo-stage is correct and faster; use it.\n\n### Grading Checklist (Project)\n\n**dupfind.go**:\n- [ ] `HashFile(ctx, path)` returns the correct SHA-256 hash (verify against `sha256sum`).\n- [ ] `HashFile(ctx, path)` checks `ctx.Err()` early to support cancellation.\n- [ ] `filesBySize` skips non-regular files (directories, symlinks, etc.).\n- [ ] `filesBySize` respects `minSize` (empty files are always skipped, per Options.MinSize = 1 default).\n- [ ] `hashAll` creates a worker pool with `min(workers, len(paths))` goroutines.\n- [ ] `hashAll` uses unbuffered `jobs` channel and feeds indices.\n- [ ] `hashAll` checks `ctx.Done()` when feeding jobs (graceful cancellation).\n- [ ] `hashAll` preserves result order: hashes[i] = hash of paths[i].\n- [ ] `hashAll` stops hashing on first error and propagates it.\n- [ ] `Find` groups files by size first (optimization: avoid hashing unique-size files).\n- [ ] `Find` only hashes files in size collisions (at least 2 files per size).\n- [ ] `Find` groups by (size, hash) and returns only groups with >= 2 files.\n- [ ] `Find` sorts groups by size descending, then by first path.\n- [ ] `Find` sorts paths within each group alphabetically.\n- [ ] `WriteReport` outputs the correct format (group N, file count, hash, paths, summary).\n- [ ] `Wasted()` correctly computes Size * (len(Paths) - 1) per group.\n- [ ] Tests pass with `-race` (no data races).\n- [ ] No goroutine leaks on error or cancellation (checked via `runtime.NumGoroutine()`).\n- [ ] Tests include: empty dir, no duplicates, duplicates, symlinks (skipped), MinSize filter, custom Hash, concurrency bounds.\n\n**main.go**:\n- [ ] Parses flags correctly: `-workers`, `-min-size`, optional directory.\n- [ ] Defaults: workers=0 (GOMAXPROCS), min-size=1, directory=\".\".\n- [ ] Uses `signal.NotifyContext` for graceful Ctrl+C.\n- [ ] Exit codes: 0 on success, 1 on file system errors, 2 on invalid flags.\n- [ ] Calls `dupfind.Find` and `WriteReport` correctly.\n- [ ] Error messages go to stderr; report goes to stdout.\n- [ ] Tests: finds duplicates, lists paths, filters by MinSize, handles bad flags, handles missing dir.\n\n---\n\n## Summary: Concurrency Best Practices\n\n1. **Synchronous API, concurrent implementation**: let the caller decide to spawn goroutines.\n2. **Every goroutine needs an exit condition**: channel close, `ctx.Done()`, `wg.Done()`, or `return`.\n3. **Every blocking operation needs a matching cancellation check**: `select { case <-ch:; case <-ctx.Done(): return }`.\n4. **One owner per resource**: one goroutine sends and closes a channel; one locks a Mutex; one adds to a WaitGroup.\n5. **Acquire semaphore tokens in the parent** (not spawned goroutine) to bound goroutines, not just busy ones.\n6. **Test with `-race` and timeouts**: find races and deadlocks.\n7. **Avoid subtle closure bugs**: capture loop variables by passing them as arguments to spawned functions.\n8. **Use `errors.Join` to combine multiple errors**: cleaner than `[]error` with manual formatting.\n9. **Prefer unbuffered channels**: simpler reasoning; buffer only when you have a specific reason.\n10. **Keep critical sections small**: no I/O or channel sends while holding a Mutex.\n", "solDir": "/home/csmith/Workspace/tools/go-course/solutions/07-concurrency", "dir": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency"}, {"slug": "08-http", "compose": "modules/08-http/compose.yaml", "services": ["test", "vet", "bench", "cover", "shell", "solutions"], "title": "Module 08: Context, HTTP Servers & Clients", "lesson": "# Module 08: Context, HTTP Servers & Clients\n\n## Goals\n\nBy the end of this module, you will be able to:\n\n- Write net/http handlers using Go 1.22 ServeMux patterns with method routing and wildcard path parameters\n- Use context for cancellation, deadlines, and request-scoped values\n- Implement middleware chains and composable request processing with request IDs and logging\n- Encode and decode JSON safely in HTTP handlers with validation\n- Write HTTP clients that respect timeouts, drain response bodies, and handle errors correctly\n- Gracefully handle panics in HTTP handlers and log them\n- Write tests for HTTP handlers and clients using httptest without any real network ports\n\n## Concepts\n\n### Context in HTTP handlers\n\nThe `*http.Request` carries a context obtained with `r.Context()`. This context:\n- Is canceled when the client disconnects\n- Carries request-scoped values\n- Can have timeouts and deadlines applied by the framework\n\nYou should always use the request context when making calls that might block (database queries, API calls, etc.). That way, if the client times out or cancels their request, your handler can give up gracefully.\n\n```go\ntype User struct{ ID, Name string }\n\ntype DB struct{}\n\nfunc (DB) GetUser(ctx context.Context, id string) (User, error) {\n\tselect {\n\tcase <-time.After(50 * time.Millisecond): // a slow query\n\t\treturn User{ID: id, Name: \"Ada\"}, nil\n\tcase <-ctx.Done(): // ...that stops when the request does\n\t\treturn User{}, ctx.Err()\n\t}\n}\n\ntype Server struct{ db DB }\n\n// A handler that respects the request context\nfunc (h *Server) handleGetUser(w http.ResponseWriter, r *http.Request) {\n\t// The server cancels r.Context() when the client goes away\n\tuser, err := h.db.GetUser(r.Context(), r.PathValue(\"id\"))\n\tif err != nil {\n\t\t// If the client cancelled, err is context.Canceled\n\t\t// If a timeout fired, err is context.DeadlineExceeded\n\t\thttp.Error(w, \"get user: \"+err.Error(), http.StatusServiceUnavailable)\n\t\treturn\n\t}\n\tfmt.Fprintln(w, user.Name)\n}\n\nfunc main() {\n\th := &Server{}\n\tmux := http.NewServeMux()\n\tmux.HandleFunc(\"GET /users/{id}\", h.handleGetUser)\n\n\trec := httptest.NewRecorder()\n\tmux.ServeHTTP(rec, httptest.NewRequest(\"GET\", \"/users/1\", nil))\n\tfmt.Print(rec.Code, \" \", rec.Body.String()) // 200 Ada\n\n\t// A client that gives up after 10ms:\n\tctx, cancel := context.WithTimeout(context.Background(), 10*time.Millisecond)\n\tdefer cancel()\n\trec = httptest.NewRecorder()\n\tmux.ServeHTTP(rec, httptest.NewRequestWithContext(ctx, \"GET\", \"/users/1\", nil))\n\tfmt.Print(rec.Code, \" \", rec.Body.String()) // 503 get user: context deadline exceeded\n}\n```\n\nYou can also add your own deadlines or derive child contexts:\n\n```go\nfunc checkDatabase(ctx context.Context) error {\n\tselect {\n\tcase <-time.After(2 * time.Second): // a database that hangs\n\t\treturn nil\n\tcase <-ctx.Done():\n\t\treturn ctx.Err()\n\t}\n}\n\nhealth := func(w http.ResponseWriter, r *http.Request) {\n\t// Add a 1-second timeout to a health check\n\tctx, cancel := context.WithTimeout(r.Context(), time.Second)\n\tdefer cancel()\n\tif err := checkDatabase(ctx); err != nil {\n\t\thttp.Error(w, fmt.Sprintf(\"database is unhealthy: %v\", err), http.StatusServiceUnavailable)\n\t\treturn\n\t}\n\tfmt.Fprintln(w, \"ok\")\n}\n\nrec := httptest.NewRecorder()\nhealth(rec, httptest.NewRequest(\"GET\", \"/healthz\", nil)) // takes 1s, not 2s\nfmt.Print(rec.Code, \" \", rec.Body.String())              // 503 database is unhealthy: context deadline exceeded\n```\n\nContext values are thread-safe and should be used for request-scoped data (trace IDs, user IDs, etc.), not shared state.\n\n### net/http ServeMux (Go 1.22+)\n\nGo 1.22 brought method-aware patterns and wildcard path parameters to the standard `http.ServeMux`. Gone are the days of manually checking `r.Method` or parsing path segments:\n\n```go\nreply := func(name string) http.HandlerFunc {\n\treturn func(w http.ResponseWriter, r *http.Request) {\n\t\tfmt.Fprintf(w, \"%s id=%q path=%q\", name, r.PathValue(\"id\"), r.PathValue(\"path\"))\n\t}\n}\n\nmux := http.NewServeMux()\n\n// Method-specific patterns\nmux.HandleFunc(\"GET /items\", reply(\"listItems\"))        // only GET requests\nmux.HandleFunc(\"POST /items\", reply(\"createItem\"))      // only POST requests\nmux.HandleFunc(\"GET /items/{id}\", reply(\"getItem\"))     // matches \"GET /items/123\"\nmux.HandleFunc(\"DELETE /items/{id}\", reply(\"deleteItem\"))\n\n// Wildcard pattern (matches rest of path)\nmux.HandleFunc(\"GET /files/{path...}\", reply(\"serveFile\")) // \"GET /files/a/b/c.txt\" -> r.PathValue(\"path\") == \"a/b/c.txt\"\n\n// Exact root path only. A plain \"/\" pattern matches EVERY path (it is a\n// prefix pattern); \"{$}\" anchors it so only \"/\" itself matches.\nmux.HandleFunc(\"GET /{$}\", reply(\"serveRoot\"))\n\nfor _, req := range []string{\"GET /items/123\", \"DELETE /items/9\", \"GET /files/a/b/c.txt\", \"GET /\", \"PUT /items\", \"GET /nope\"} {\n\tmethod, path, _ := strings.Cut(req, \" \")\n\trec := httptest.NewRecorder()\n\tmux.ServeHTTP(rec, httptest.NewRequest(method, path, nil))\n\tfmt.Printf(\"%-22s -> %d %s\\n\", req, rec.Code, strings.TrimSpace(rec.Body.String()))\n}\n// PUT /items gets 405 Method Not Allowed; GET /nope gets 404\n```\n\nKey rules:\n- Patterns are case-sensitive\n- `{id}` captures a single path segment (everything up to the next `/`)\n- `{path...}` captures the rest of the path (may contain `/`)\n- More specific patterns win regardless of registration order (e.g., `/items/latest` beats `/items/{id}`); registering two patterns that conflict with neither more specific panics at registration\n- A `GET` pattern also matches `HEAD` requests\n- POST to a GET-only route gets an automatic 405 with an `Allow` header\n- `r.PathValue(\"id\")` retrieves a captured segment\n\n### JSON encoding/decoding in HTTP handlers\n\nWhen writing JSON responses, encode into a buffer first. That way, if encoding fails, the client gets a 500 *before* any response body is sent. If you write the status and body piecemeal, a write error leaves the client with a partial response.\n\n```go\ntype response struct {\n\tID    int `json:\"id\"`\n\tPrice any `json:\"price\"`\n}\n\n// GOOD: buffer first, write atomically\ngood := func(w http.ResponseWriter, resp response) {\n\tvar buf bytes.Buffer\n\tif err := json.NewEncoder(&buf).Encode(resp); err != nil {\n\t\thttp.Error(w, \"internal server error\", http.StatusInternalServerError)\n\t\treturn\n\t}\n\tw.Header().Set(\"Content-Type\", \"application/json\")\n\tw.WriteHeader(http.StatusCreated)\n\tw.Write(buf.Bytes())\n}\n\n// BAD: write header and body separately; if Encode fails midway, client sees partial data\nbad := func(w http.ResponseWriter, resp response) {\n\tw.Header().Set(\"Content-Type\", \"application/json\")\n\tw.WriteHeader(http.StatusCreated)\n\tif err := json.NewEncoder(w).Encode(resp); err != nil {\n\t\thttp.Error(w, \"internal server error\", http.StatusInternalServerError) // too late!\n\t}\n}\n\nbroken := response{ID: 1, Price: math.Inf(1)} // JSON can't encode +Inf\nrec := httptest.NewRecorder()\ngood(rec, broken)\nfmt.Println(\"good:\", rec.Code) // good: 500\nrec = httptest.NewRecorder()\nbad(rec, broken)\nfmt.Println(\"bad:\", rec.Code) // bad: 201, for a request that failed\n```\n\nWhen reading JSON request bodies:\n- Always set `Content-Type` requirements and validate with `mime.ParseMediaType`\n- Use `http.MaxBytesReader` to cap the body size before decoding\n- Call `DisallowUnknownFields()` on the decoder to reject unrecognized fields\n- Check for a second JSON value (multiple documents)\n- Distinguish client errors (400) from server errors (500)\n\n```go\ntype Item struct {\n\tName  string `json:\"name\"`\n\tPrice int    `json:\"price\"`\n}\n\n// Typical handler receiving JSON\nfunc handleCreateItem(w http.ResponseWriter, r *http.Request) {\n\t// Check Content-Type\n\tmediaType, _, _ := mime.ParseMediaType(r.Header.Get(\"Content-Type\"))\n\tif mediaType != \"application/json\" {\n\t\thttp.Error(w, \"Content-Type must be application/json\", http.StatusUnsupportedMediaType)\n\t\treturn\n\t}\n\n\t// Cap body size\n\tr.Body = http.MaxBytesReader(w, r.Body, 1<<20) // 1 MiB\n\tdec := json.NewDecoder(r.Body)\n\tdec.DisallowUnknownFields()\n\n\tvar item Item\n\tif err := dec.Decode(&item); err != nil {\n\t\t// Distinguish client errors\n\t\tif errors.Is(err, io.EOF) {\n\t\t\thttp.Error(w, \"body is empty\", http.StatusBadRequest)\n\t\t} else {\n\t\t\t// inspect err to craft a helpful message\n\t\t\thttp.Error(w, \"malformed JSON: \"+err.Error(), http.StatusBadRequest)\n\t\t}\n\t\treturn\n\t}\n\tfmt.Fprintf(w, \"created %+v\\n\", item)\n}\n\nfunc main() {\n\tfor _, body := range []string{`{\"name\": \"pen\", \"price\": 3}`, ``, `{\"name\": \"pen\", \"colour\": \"red\"}`} {\n\t\treq := httptest.NewRequest(\"POST\", \"/items\", strings.NewReader(body))\n\t\treq.Header.Set(\"Content-Type\", \"application/json; charset=utf-8\")\n\t\trec := httptest.NewRecorder()\n\t\thandleCreateItem(rec, req)\n\t\tfmt.Print(rec.Code, \" \", rec.Body.String())\n\t}\n}\n```\n\n### Middleware chaining\n\nMiddleware is a function that wraps a handler. By chaining middleware, you can add cross-cutting concerns (logging, auth, panics recovery) without modifying handler code.\n\n```go\nimport \"crypto/rand\"\n\n// ctxKey is unexported, so no other package can collide with these keys.\ntype ctxKey int\n\nconst ctxKeyID ctxKey = 0\n\n// Middleware type: takes a handler, returns a handler\ntype Middleware func(http.Handler) http.Handler\n\n// Chain applies middleware from outside to inside\n// If mws = [a, b, c], the order is a -> b -> c -> handler\nfunc Chain(h http.Handler, mws ...Middleware) http.Handler {\n    for i := len(mws) - 1; i >= 0; i-- {\n        h = mws[i](h)\n    }\n    return h\n}\n\n// Example: request ID middleware\nfunc RequestID(gen func() string) Middleware {\n    return func(next http.Handler) http.Handler {\n        return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n            id := r.Header.Get(\"X-Request-ID\")\n            if id == \"\" {\n                id = gen()\n            }\n            w.Header().Set(\"X-Request-ID\", id)\n            ctx := context.WithValue(r.Context(), ctxKeyID, id)\n            next.ServeHTTP(w, r.WithContext(ctx))\n        })\n    }\n}\n\n// statusWriter remembers the status code so middleware can log it and\n// knows whether the response has started.\ntype statusWriter struct {\n    http.ResponseWriter\n    status      int\n    wroteHeader bool\n}\n\nfunc (w *statusWriter) WriteHeader(code int) {\n    if !w.wroteHeader {\n        w.status, w.wroteHeader = code, true\n    }\n    w.ResponseWriter.WriteHeader(code)\n}\n\nfunc (w *statusWriter) Write(p []byte) (int, error) {\n    if !w.wroteHeader {\n        w.status, w.wroteHeader = http.StatusOK, true // implicit 200\n    }\n    return w.ResponseWriter.Write(p)\n}\n\n// Example: logging middleware\nfunc Logging(logger *slog.Logger) Middleware {\n    return func(next http.Handler) http.Handler {\n        return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n            start := time.Now()\n            sw := &statusWriter{ResponseWriter: w}\n            next.ServeHTTP(sw, r)\n            logger.InfoContext(r.Context(), \"request\",\n                \"method\", r.Method,\n                \"path\", r.URL.Path,\n                \"status\", sw.status,\n                \"duration\", time.Since(start),\n            )\n        })\n    }\n}\n\n// Use them\nfunc main() {\n    logger := slog.New(slog.NewTextHandler(os.Stdout, nil))\n    mux := http.NewServeMux()\n    mux.HandleFunc(\"GET /hello\", func(w http.ResponseWriter, r *http.Request) {\n        fmt.Fprintf(w, \"hello, request %s\\n\", r.Context().Value(ctxKeyID))\n    })\n    handler := Chain(mux,\n        Logging(logger),\n        RequestID(rand.Text), // crypto/rand.Text (Go 1.24): a random 26-character string\n    )\n    // A real server: http.ListenAndServe(\":8080\", handler). Here, one request in memory:\n    rec := httptest.NewRecorder()\n    handler.ServeHTTP(rec, httptest.NewRequest(\"GET\", \"/hello\", nil))\n    fmt.Print(rec.Code, \" \", rec.Body.String())\n}\n```\n\nThe key insight: middleware runs in nested order, so the outermost middleware sees the entire request/response lifecycle.\n\n### HTTP client best practices\n\nA well-behaved HTTP client:\n1. Uses a timeout on the http.Client\n2. Passes context on every request\n3. Checks the status code explicitly\n4. Drains the response body even on error (so connections are reused)\n5. Wraps errors with context\n\n```go\ntype Item struct {\n\tID   string `json:\"id\"`\n\tName string `json:\"name\"`\n}\n\ntype Client struct {\n    baseURL string\n    http    *http.Client\n}\n\n// Timeout applies to the entire request+response, not just the connection\nfunc New(baseURL string, timeout time.Duration) *Client {\n    return &Client{\n        baseURL: baseURL,\n        http: &http.Client{Timeout: timeout},\n    }\n}\n\nfunc (c *Client) GetItem(ctx context.Context, id string) (Item, error) {\n    // PathEscape: an id like \"a/b\" or \"x?y\" must not change the URL's shape.\n    req, err := http.NewRequestWithContext(ctx, http.MethodGet, c.baseURL+\"/items/\"+url.PathEscape(id), nil)\n    if err != nil {\n        return Item{}, fmt.Errorf(\"get item: %w\", err)\n    }\n\n    resp, err := c.http.Do(req)\n    if err != nil {\n        return Item{}, fmt.Errorf(\"get item: %w\", err)\n    }\n    defer resp.Body.Close()\n\n    // Always drain to allow connection reuse\n    defer io.Copy(io.Discard, resp.Body)\n\n    // Check status explicitly\n    if resp.StatusCode != http.StatusOK {\n        b, _ := io.ReadAll(io.LimitReader(resp.Body, 512)) // don't trust the size of an error body\n        return Item{}, fmt.Errorf(\"get item: status %d: %s\", resp.StatusCode, string(b))\n    }\n\n    var item Item\n    if err := json.NewDecoder(resp.Body).Decode(&item); err != nil {\n        return Item{}, fmt.Errorf(\"get item: decode: %w\", err)\n    }\n    return item, nil\n}\n\nfunc main() {\n\t// A fake API server to talk to\n\tsrv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tif r.URL.Path != \"/items/42\" {\n\t\t\thttp.Error(w, \"no such item\", http.StatusNotFound)\n\t\t\treturn\n\t\t}\n\t\tfmt.Fprint(w, `{\"id\": \"42\", \"name\": \"pen\"}`)\n\t}))\n\tdefer srv.Close()\n\n\tc := New(srv.URL, 2*time.Second)\n\tfmt.Println(c.GetItem(context.Background(), \"42\"))  // {42 pen} <nil>\n\tfmt.Println(c.GetItem(context.Background(), \"a/b\")) // get item: status 404: no such item\n}\n```\n\n### Panic recovery in HTTP\n\nIf a handler panics, `net/http` recovers the panic itself, logs a stack trace, and closes the connection, so the server survives but the client gets no response. To log it your way and send a 500 instead:\n\n```go\ntype Middleware func(http.Handler) http.Handler\n\n// statusWriter, from the middleware example above\ntype statusWriter struct {\n\thttp.ResponseWriter\n\tstatus      int\n\twroteHeader bool\n}\n\nfunc (w *statusWriter) WriteHeader(code int) {\n\tif !w.wroteHeader {\n\t\tw.status, w.wroteHeader = code, true\n\t}\n\tw.ResponseWriter.WriteHeader(code)\n}\n\nfunc (w *statusWriter) Write(p []byte) (int, error) {\n\tif !w.wroteHeader {\n\t\tw.status, w.wroteHeader = http.StatusOK, true\n\t}\n\treturn w.ResponseWriter.Write(p)\n}\n\nfunc Recover(logger *slog.Logger) Middleware {\n    return func(next http.Handler) http.Handler {\n        return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n            sw := &statusWriter{ResponseWriter: w}\n            defer func() {\n                v := recover()\n                if v == nil {\n                    return\n                }\n                // http.ErrAbortHandler is the signal to abort; re-panic it\n                if v == http.ErrAbortHandler {\n                    panic(v)\n                }\n                // Log and send 500\n                logger.ErrorContext(r.Context(), \"panic recovered\",\n                    \"panic\", fmt.Sprint(v),\n                    \"path\", r.URL.Path,\n                )\n                if !sw.wroteHeader {\n                    http.Error(w, \"internal server error\", http.StatusInternalServerError)\n                }\n            }()\n            next.ServeHTTP(sw, r)\n        })\n    }\n}\n\nfunc main() {\n\tlogger := slog.New(slog.NewTextHandler(os.Stdout, nil))\n\tboom := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tvar m map[string]int\n\t\tm[\"x\"]++ // a bug: nil map\n\t})\n\trec := httptest.NewRecorder()\n\tRecover(logger)(boom).ServeHTTP(rec, httptest.NewRequest(\"GET\", \"/boom\", nil))\n\tfmt.Print(rec.Code, \" \", rec.Body.String()) // 500 internal server error\n}\n```\n\nIf the handler already started writing, the status line has been sent and it\nis too late for a 500. All you can do is log.\n\n## Idioms & Best Practices\n\n- **Always pass context to backends**: Use `r.Context()` for database queries, external APIs, etc. The context carries client-cancellation and deadline information.\n  ```go\n  type DB struct{}\n\n  func (DB) GetUser(ctx context.Context, id int) (string, error) {\n  \tselect {\n  \tcase <-time.After(100 * time.Millisecond):\n  \t\treturn \"Ada\", nil\n  \tcase <-ctx.Done():\n  \t\treturn \"\", ctx.Err()\n  \t}\n  }\n\n  var db DB\n  handler := func(w http.ResponseWriter, r *http.Request) {\n  \tid := 1\n  \t// GOOD: stops when the client goes away\n  \tuser, err := db.GetUser(r.Context(), id)\n  \t// BAD: keeps working for a client that is gone\n  \t//   user, err := db.GetUser(context.Background(), id)\n  \tfmt.Println(user, err)\n  }\n\n  ctx, cancel := context.WithTimeout(context.Background(), 10*time.Millisecond) // an impatient client\n  defer cancel()\n  handler(httptest.NewRecorder(), httptest.NewRequestWithContext(ctx, \"GET\", \"/\", nil)) // context deadline exceeded\n  ```\n\n- **Don't panic in handlers; recover and log**: Panics kill the goroutine but not the server. If you must panic, make it part of your recovery tests.\n  ```go\n  handler := func(w http.ResponseWriter, r *http.Request) {\n  \tid, _ := strconv.Atoi(r.URL.Query().Get(\"id\"))\n  \t// GOOD: validate and return an error\n  \tif id < 0 {\n  \t\thttp.Error(w, \"id must be positive\", http.StatusBadRequest)\n  \t\treturn\n  \t}\n  \t// BAD would be panic(\"invalid id\"): the client gets no useful response\n  \tfmt.Fprintln(w, \"item\", id)\n  }\n\n  rec := httptest.NewRecorder()\n  handler(rec, httptest.NewRequest(\"GET\", \"/item?id=-3\", nil))\n  fmt.Print(rec.Code, \" \", rec.Body.String()) // 400 id must be positive\n  ```\n\n- **Drain response bodies even on error**: Without draining, the HTTP connection can't be reused.\n  ```go\n  srv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n  \tfmt.Fprint(w, `{\"ok\": true}`)\n  }))\n  defer srv.Close()\n\n  resp, err := http.Get(srv.URL)\n  if err != nil {\n  \tlog.Fatal(err)\n  }\n  defer func() {\n  \tio.Copy(io.Discard, resp.Body) // drain, so the connection can be reused\n  \tresp.Body.Close()\n  }()\n  // Now safe to check status and decode\n  var out struct{ OK bool }\n  err = json.NewDecoder(resp.Body).Decode(&out)\n  fmt.Println(resp.StatusCode, out.OK, err) // 200 true <nil>\n  ```\n\n- **Encode response bodies into a buffer first**: If encoding fails partway through, you can't send a 500 (headers are already sent).\n  ```go\n  resp := map[string]any{\"total\": math.NaN()} // JSON can't encode NaN\n\n  // GOOD\n  good := httptest.NewRecorder()\n  var buf bytes.Buffer\n  if err := json.NewEncoder(&buf).Encode(resp); err != nil {\n  \thttp.Error(good, \"internal error\", http.StatusInternalServerError)\n  } else {\n  \tgood.WriteHeader(http.StatusCreated)\n  \tgood.Write(buf.Bytes())\n  }\n\n  // BAD\n  bad := httptest.NewRecorder()\n  bad.WriteHeader(http.StatusCreated)\n  json.NewEncoder(bad).Encode(resp) // if Encode fails, client sees 201 and partial body\n\n  fmt.Println(good.Code, bad.Code) // 500 201\n  ```\n\n- **Validate Content-Type and body size**: Use `mime.ParseMediaType` and `http.MaxBytesReader`.\n  ```go\n  func decodeJSON(w http.ResponseWriter, r *http.Request, v any) error {\n  \tmediaType, _, _ := mime.ParseMediaType(r.Header.Get(\"Content-Type\"))\n  \tif mediaType != \"application/json\" {\n  \t\treturn fmt.Errorf(\"want application/json, got %s\", mediaType)\n  \t}\n  \tr.Body = http.MaxBytesReader(w, r.Body, 1<<20)\n  \treturn json.NewDecoder(r.Body).Decode(v)\n  }\n\n  func main() {\n  \tvar v map[string]any\n  \treq := httptest.NewRequest(\"POST\", \"/\", strings.NewReader(\"a=1\"))\n  \treq.Header.Set(\"Content-Type\", \"application/x-www-form-urlencoded\")\n  \tfmt.Println(decodeJSON(httptest.NewRecorder(), req, &v)) // want application/json, got application/x-www-form-urlencoded\n  }\n  ```\n\n- **Use `DisallowUnknownFields()` for API inputs**: This catches typos and API versioning issues.\n  ```go\n  var req struct{ Name string }\n  r := httptest.NewRequest(\"POST\", \"/\", strings.NewReader(`{\"name\": \"pen\", \"nmae\": \"typo\"}`))\n\n  dec := json.NewDecoder(r.Body)\n  dec.DisallowUnknownFields()\n  if err := dec.Decode(&req); err != nil {\n  \tfmt.Println(err) // json: unknown field \"nmae\": a typo you'd otherwise never notice\n  }\n  ```\n\n- **Use `time.Duration` and `time.Time` carefully**: Duration is in nanoseconds; time.Time has a monotonic component that's excluded from JSON. For comparisons, use `t1.Equal(t2)`, not `t1 == t2`.\n\n- **Log with context, not globally**: Use `logger.InfoContext(r.Context(), ...)` so that request-scoped values (trace ID) are included automatically.\n  ```go\n  logger := slog.New(slog.NewTextHandler(os.Stdout, nil))\n  r := httptest.NewRequest(\"GET\", \"/items\", nil)\n  userID, statusCode := 42, http.StatusOK\n\n  logger.InfoContext(r.Context(), \"request processed\",\n  \t\"user_id\", userID,\n  \t\"status\", statusCode,\n  )\n  ```\n\n- **Chain middleware from outermost to innermost**: The order matters. Logging should wrap authentication so you log all requests, not just successful ones.\n  ```go\n  type Middleware func(http.Handler) http.Handler\n\n  func Chain(h http.Handler, mws ...Middleware) http.Handler {\n  \tfor i := len(mws) - 1; i >= 0; i-- {\n  \t\th = mws[i](h)\n  \t}\n  \treturn h\n  }\n\n  func Logging(next http.Handler) http.Handler {\n  \treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n  \t\tfmt.Println(\"logging:\", r.URL.Path)\n  \t\tnext.ServeHTTP(w, r)\n  \t})\n  }\n\n  func Auth(next http.Handler) http.Handler {\n  \treturn http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n  \t\tif r.Header.Get(\"Authorization\") == \"\" {\n  \t\t\tfmt.Println(\"auth: rejected\")\n  \t\t\thttp.Error(w, \"unauthorized\", http.StatusUnauthorized)\n  \t\t\treturn\n  \t\t}\n  \t\tnext.ServeHTTP(w, r)\n  \t})\n  }\n\n  func main() {\n  \tmux := http.NewServeMux()\n  \tmux.HandleFunc(\"/\", func(w http.ResponseWriter, r *http.Request) { fmt.Println(\"handler\") })\n\n  \t// Request \u2192 Logging \u2192 Auth \u2192 Handler\n  \thandler := Chain(mux, Logging, Auth)\n\n  \thandler.ServeHTTP(httptest.NewRecorder(), httptest.NewRequest(\"GET\", \"/secret\", nil))\n  \treq := httptest.NewRequest(\"GET\", \"/secret\", nil)\n  \treq.Header.Set(\"Authorization\", \"Bearer token\")\n  \thandler.ServeHTTP(httptest.NewRecorder(), req)\n  }\n  ```\n\n## Common Pitfalls\n\n- **Forgetting to use the request context**: If you use `context.Background()` in a handler, client cancellations are ignored, and you might do unnecessary work.\n\n- **Sending a response header, then failing to encode**: Once `WriteHeader` or the first `Write` is called, you can't change the status. If encoding fails after that, you're stuck.\n\n- **Not draining response bodies**: Without draining, connections aren't reused, and you leak resources. Even if you only need the status code, drain the body.\n\n- **Panicking in a goroutine spawned by a handler**: If a goroutine panics, the panic doesn't reach the handler's defer recover(). Use error channels instead.\n  ```go\n  doSomething := func() error { return errors.New(\"failed in the background\") }\n\n  // BAD: a panic in this goroutine is not caught by the server's (or your\n  // Recover middleware's) recover: it crashes the whole process.\n  //\n  //\tgo func() { panic(\"oops\") }()\n\n  // GOOD: use a channel\n  errCh := make(chan error, 1)\n  go func() { errCh <- doSomething() }()\n  if err := <-errCh; err != nil {\n  \tfmt.Println(\"handled:\", err)\n  }\n  ```\n\n- **Sharing request-scoped data via global variables**: Use `context.WithValue` to carry request data.\n  ```go\n  // BAD\n  //\n  //\tvar userID int // global, racy: every request overwrites it\n\n  // GOOD: a request-scoped value travels in the request's context\n  type ctxKey int\n\n  const ctxKeyUserID ctxKey = 0\n\n  r := httptest.NewRequest(\"GET\", \"/\", nil)\n  userID := 42\n  ctx := context.WithValue(r.Context(), ctxKeyUserID, userID)\n  r = r.WithContext(ctx)\n  fmt.Println(r.Context().Value(ctxKeyUserID)) // 42\n  ```\n\n- **Not checking errors from `Close()` or `Flush()` on writers**: for a buffered or file writer, that error is often the *only* report that data never reached its destination.\n  ```go\n  // A writer that fails, like a full disk or a closed connection\n  type failingWriter struct{}\n\n  func (failingWriter) Write(p []byte) (int, error) { return 0, errors.New(\"broken pipe\") }\n\n  func writeReport(w io.Writer) error {\n  \tbw := bufio.NewWriter(w)\n  \tfmt.Fprintln(bw, \"report\") // buffered: no error yet\n\n  \t// BAD: the error that matters is thrown away\n  \t//   defer bw.Flush()\n\n  \t// GOOD\n  \tif err := bw.Flush(); err != nil {\n  \t\treturn fmt.Errorf(\"flush: %w\", err)\n  \t}\n  \treturn nil\n  }\n\n  func main() {\n  \tfmt.Println(writeReport(failingWriter{})) // flush: broken pipe\n  }\n  ```\n\n- **Encoding nil slices and maps as JSON**: a nil slice encodes as `null`, not `[]`, and a nil map as `null`, not `{}`. Clients written in other languages often choke on `null` where they expect a list.\n  ```go\n  type Item struct{ Name string }\n  type ListResponse struct {\n  \tItems []Item `json:\"items\"`\n  }\n\n  var items []Item // no items found: a nil slice\n\n  // BAD: {\"items\":null} when there are no items\n  bad, _ := json.Marshal(ListResponse{Items: items})\n\n  // GOOD: {\"items\":[]}\n  if items == nil {\n  \titems = []Item{}\n  }\n  good, _ := json.Marshal(ListResponse{Items: items})\n  fmt.Println(string(bad), string(good))\n  ```\n\n## Exercises\n\n### Exercise 1: Health Handler\n**Package**: `health`\n\nImplement a health-check endpoint that runs a set of named checks, each under its own timeout derived from the request context. Stretch: make the endpoint's latency that of the slowest check instead of the sum of all checks.\n\nImplement:\n- `Handler(timeout, checks)` \u2192 `http.Handler` that runs every check under its own deadline and returns 200 if all pass, 503 otherwise\n\n**Test command:**\n```sh\ngo test ./modules/08-http/exercises/health/\n```\n\n### Exercise 2: JSON I/O Helpers\n**Package**: `jsonio`\n\nWrite strict JSON encoding/decoding helpers for HTTP handlers that validate Content-Type, cap request bodies, disallow unknown fields, and encode responses into a buffer first.\n\nImplement:\n- `WriteJSON(w, status, v)` \u2192 encodes and writes JSON with the given status\n- `WriteError(w, status, msg)` \u2192 writes `{\"error\": msg}` as JSON\n- `DecodeJSON(w, r, dst)` \u2192 decodes the request body as JSON, returning a `*RequestError` on validation failures\n\n**Test command:**\n```sh\ngo test ./modules/08-http/exercises/jsonio/\n```\n\n### Exercise 3: Middleware Chain\n**Package**: `middleware`\n\nImplement middleware for request IDs (carried in context), structured logging with slog, and panic recovery.\n\nImplement:\n- `Chain(h, mws...)` \u2192 wraps h with middleware, applying them from outside to inside\n- `RequestID(newID)` \u2192 middleware that assigns each request a unique ID from the X-Request-ID header or a generated one\n- `Logging(logger)` \u2192 middleware that logs every request with method, path, status, bytes written, and duration\n- `Recover(logger)` \u2192 middleware that catches panics, logs them, and sends 500 (unless the handler already started the response)\n\n**Test command:**\n```sh\ngo test ./modules/08-http/exercises/middleware/\n```\n\n### Exercise 4: Path Parameter Routing\n**Package**: `routes`\n\nUse Go 1.22 ServeMux patterns to expose a notes store over HTTP with method and wildcard routing.\n\nImplement:\n- `Routes(s *Store)` \u2192 returns an `http.Handler` with routes for listing, creating, getting, and deleting notes\n\nThe store is provided complete; the exercise is the HTTP layer.\n\n**Test command:**\n```sh\ngo test ./modules/08-http/exercises/routes/\n```\n\n### Exercise 5: HTTP Client\n**Package**: `client`\n\nWrite a well-behaved HTTP client that respects timeouts, drains response bodies, checks status codes, and wraps errors.\n\nImplement:\n- `New(baseURL, timeout)` \u2192 returns a Client with the given base URL and timeout\n- `GetItem(ctx, id)` \u2192 fetches GET {base}/items/{id}, returning a 404 as `ErrNotFound`\n- `CreateItem(ctx, it)` \u2192 sends POST {base}/items with a JSON body, expecting 201\n\n**Test command:**\n```sh\ngo test ./modules/08-http/exercises/client/\n```\n\n## Project: URL Shortener API\n\nA complete URL-shortener HTTP API with routes to create links, redirect, and fetch statistics, backed by an in-memory store.\n\n**Routes:**\n- `POST /links` \u2014 create a short link; expects `{\"url\": \"https://...\"}`, optionally `\"code\"` for custom short codes\n- `GET /{code}` \u2014 redirect to the original URL\n- `GET /links/{code}/stats` \u2014 fetch statistics (visits, creation time)\n\n**Requirements:**\n- Use ServeMux patterns for routing\n- Validate URLs and custom codes\n- Implement a Store interface so the HTTP layer doesn't depend on the storage implementation\n- Use httptest for tests; no real ports\n- Gracefully log and handle errors\n\n**Spec:** See `project/README.md`.\n\n## Submitting for Review\n\nWhen all exercise tests pass and the project is complete, ask your instructor (Claude) to review `modules/08-http/`. The review will cover:\n- Correct use of ServeMux routing and path parameters\n- Proper context propagation and cancellation\n- Safe JSON encoding/decoding in handlers\n- Effective middleware composition\n- Connection reuse in the HTTP client\n- Error handling and logging\n- Graceful error recovery and panic handling\n\n## Further Reading\n\n- **Go 1.22 net/http enhancements:** https://go.dev/blog/routing-enhancements\n- **Context package:** https://pkg.go.dev/context\n- **ServeMux:** https://pkg.go.dev/net/http#ServeMux\n- **Effective Go, \"A web server\":** https://go.dev/doc/effective_go#web_server\n- **json.Decoder:** https://pkg.go.dev/encoding/json#Decoder\n- **http.Client:** https://pkg.go.dev/net/http#Client\n- **httptest:** https://pkg.go.dev/net/http/httptest\n- **slog structured logging:** https://pkg.go.dev/log/slog\n- **Go Code Review Comments:** https://go.dev/wiki/CodeReviewComments\n", "units": [{"kind": "exercise", "name": "client", "dir": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/client", "doc": "Package client is a small, well-behaved HTTP client for an \"items\" JSON API.\nIt shows the habits every Go HTTP client should have: a timeout, a context\non every request, status codes checked explicitly, response bodies always\ndrained and closed, and errors wrapped with context.", "readme": "", "files": [{"name": "client.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/client/client.go"}, {"name": "client_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/client/client_test.go"}], "cmd": "go test ./modules/08-http/exercises/client/", "id": "modules/08-http/exercises/client"}, {"kind": "exercise", "name": "health", "dir": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/health", "doc": "Package health implements a JSON health-check endpoint whose individual\nchecks are bounded by a per-check deadline derived from the request context.", "readme": "", "files": [{"name": "health.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/health/health.go"}, {"name": "health_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/health/health_test.go"}], "cmd": "go test ./modules/08-http/exercises/health/", "id": "modules/08-http/exercises/health"}, {"kind": "exercise", "name": "jsonio", "dir": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/jsonio", "doc": "Package jsonio provides small, strict helpers for reading JSON request\nbodies and writing JSON responses in net/http handlers.", "readme": "", "files": [{"name": "jsonio.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/jsonio/jsonio.go"}, {"name": "jsonio_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/jsonio/jsonio_test.go"}], "cmd": "go test ./modules/08-http/exercises/jsonio/", "id": "modules/08-http/exercises/jsonio"}, {"kind": "exercise", "name": "middleware", "dir": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/middleware", "doc": "Package middleware provides composable net/http middleware: request IDs\ncarried in the request context, structured access logging with log/slog,\nand panic recovery.", "readme": "", "files": [{"name": "middleware.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/middleware/middleware.go"}, {"name": "middleware_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/middleware/middleware_test.go"}], "cmd": "go test ./modules/08-http/exercises/middleware/", "id": "modules/08-http/exercises/middleware"}, {"kind": "exercise", "name": "routes", "dir": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/routes", "doc": "Package routes exposes a notes Store over HTTP using the method and\nwildcard patterns of net/http's ServeMux (Go 1.22+).", "readme": "", "files": [{"name": "routes.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/routes/routes.go"}, {"name": "routes_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/routes/routes_test.go"}, {"name": "store.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/exercises/routes/store.go"}], "cmd": "go test ./modules/08-http/exercises/routes/", "id": "modules/08-http/exercises/routes"}, {"kind": "project", "name": "project", "dir": "/home/csmith/Workspace/tools/go-course/modules/08-http/project", "doc": "", "readme": "# Project: URL Shortener API\n\n## Overview\n\nBuild a complete URL-shortening HTTP API backed by an in-memory store. The API accepts long URLs, assigns short codes, and provides redirect and statistics endpoints.\n\n## Requirements\n\n### Routes\n\nThe API must expose:\n\n- **POST /links** \u2014 Create a shortened link\n  - Request body: `{\"url\": \"https://...\", \"code\": \"...\"}`\n    - `url` (required): the target URL, must be a valid http or https URL, max 2048 characters\n    - `code` (optional): a custom short code (4-32 characters of `[A-Za-z0-9_-]`); if omitted, generate a random one\n  - Response: **201 Created** with `Location` header and JSON body:\n    ```json\n    {\n      \"code\": \"xyz123\",\n      \"url\": \"https://example.com/very/long/path\",\n      \"short_url\": \"http://localhost:8080/xyz123\",\n      \"visits\": 0,\n      \"created_at\": \"2026-10-11T12:34:56Z\"\n    }\n    ```\n  - Error cases:\n    - **400 Bad Request**: Invalid or missing URL, code too short/long, unknown field in JSON, or body is invalid\n    - **409 Conflict**: Custom code is already in use\n    - **413 Payload Too Large**: Request body exceeds 4 KiB\n\n- **GET /{code}** \u2014 Redirect to the original URL\n  - Path parameter: the short code\n  - Response: **302 Found** with `Location` header pointing to the original URL\n  - Increments the visit counter\n  - Error case: **404 Not Found** if the code doesn't exist\n\n- **GET /links/{code}/stats** \u2014 Fetch link statistics\n  - Path parameter: the short code\n  - Response: **200 OK** with the same JSON shape as POST /links\n  - Error case: **404 Not Found** if the code doesn't exist\n\n### Validation\n\n- **URL validation**: Must be an absolute http or https URL with a non-empty host. Do not allow localhost URLs (unless testing locally).\n  - Accept: `https://example.com`, `http://api.example.com/path?query=1`\n  - Reject: `ftp://example.com` (wrong scheme), `/relative/path`, `example.com` (no scheme), `:8080` (no host)\n\n- **Custom code validation**: 4-32 characters of `[A-Za-z0-9_-]` only. Case-sensitive.\n  - Accept: `short`, `my_code-123`\n  - Reject: `hi` (too short), `code!!!` (invalid characters), `code with spaces`\n\n- **Request body**: Must be JSON. Unknown fields are rejected. Body size is capped at 4 KiB.\n\n### Store Interface\n\nThe HTTP layer must not depend on a specific storage implementation. Define a `Store` interface with methods:\n\n```go\n// Checks the interface against YOUR MemoryStore (shortener/store.go).\nimport \"gocourse/modules/08-http/project/shortener\"\n\ntype Link = shortener.Link\n\ntype Store interface {\n\tCreate(ctx context.Context, l Link) error\n\tGet(ctx context.Context, code string) (Link, error)\n\tVisit(ctx context.Context, code string) (Link, error)\n}\n\nvar s Store = shortener.NewMemoryStore() // compiles: the method set matches\nctx := context.Background()\nerr := s.Create(ctx, Link{Code: \"go\", URL: \"https://go.dev\"})\nl, err2 := s.Visit(ctx, \"go\")\nfmt.Println(err, l.Visits, err2) // when you're done: <nil> 1 <nil>\n```\n\n- **Create**: Stores a new link. Returns `ErrExists` if the code is already taken.\n- **Get**: Returns the link for a code, or `ErrNotFound`.\n- **Visit**: Atomically increments the visit counter and returns the updated link, or `ErrNotFound`.\n\nProvide a `MemoryStore` implementation for development and testing.\n\n### Logging\n\nUse `log/slog` to log each request with:\n- **message**: \"request\"\n- **attributes**: `method`, `path`, `status`, `duration` (as time.Duration)\n\nErrors inside handlers should log the error details (URL validation failed, code generation exhausted) at Error level.\n\n### Error Responses\n\nAll errors must be JSON:\n\n```json\n{\"error\": \"error message here\"}\n```\n\nThe message must be safe to show the client (no internal stack traces or paths). For internal failures (code generation, store errors), log the details and send a generic message:\n\n```json\n{\"error\": \"internal server error\"}\n```\n\n## Acceptance Criteria\n\n- [ ] Routes accept POST /links, GET /{code}, GET /links/{code}/stats with the correct methods\n- [ ] URL validation rejects invalid schemes, missing hosts, and URLs longer than 2048 characters\n- [ ] Custom codes are validated (4-32 characters of [A-Za-z0-9_-])\n- [ ] Random codes are generated when code is omitted; collision is handled by retrying\n- [ ] Responses include the correct Content-Type (application/json)\n- [ ] Responses return the correct status codes (201, 302, 404, 400, 409, 413, 500)\n- [ ] Location header is set on 201 and 302 responses\n- [ ] Request and response bodies are JSON (validated with mime.ParseMediaType)\n- [ ] Request body size is capped at 4 KiB\n- [ ] Unknown fields in request JSON are rejected (DisallowUnknownFields)\n- [ ] Visit counter is incremented only on redirect (GET /{code}), not on stats requests\n- [ ] Every request is logged with method, path, status, and duration\n- [ ] Errors are logged with details; clients see generic messages\n- [ ] All tests use httptest.NewServer (no real network ports)\n- [ ] Tests must pass with `go test -race ./...`\n\n## Testing\n\nWrite comprehensive tests covering:\n\n- Creating links with valid and invalid URLs\n- Creating links with and without custom codes\n- Handling code collisions and retries\n- Redirecting with visit counter increment\n- Fetching statistics\n- Invalid path parameters\n- Malformed JSON requests\n- Request body size validation\n- Unknown fields rejection\n- Content-Type validation\n- Concurrent requests (test with -race)\n\n**Test command:**\n```sh\ngo test ./modules/08-http/project/... -race\n```\n\n## Stretch Goals (optional)\n\n- Add a **DELETE /{code}** endpoint to remove a link\n- Implement link expiration (TTL) with a background cleanup goroutine\n- Add a **PUT /links/{code}** endpoint to update a link's URL\n- Return different status codes for different error types (e.g., 422 Unprocessable Entity for validation)\n- Implement a real database backend (SQLite, PostgreSQL) as an alternative Store\n\n## Tips\n\n- Use `http.NewServeMux` with Go 1.22 patterns: `POST /links`, `GET /{code}`.\n- Encode responses into a `bytes.Buffer` first, so if encoding fails the client gets a 500, not a partial response.\n- Use `mime.ParseMediaType` to validate Content-Type (it handles charset parameters).\n- Use `http.MaxBytesReader` to cap the request body size.\n- Call `json.Decoder.DisallowUnknownFields()` to catch typos and API versioning issues.\n- Drain response bodies with `io.Copy(io.Discard, resp.Body)` so connections are reused (if you implement a redirect without following it).\n- Every request should pass through `r.Context()`, so store cancellations and timeouts work correctly.\n- Test with `go test -race ./...` to catch data races.\n", "files": [{"name": "README.md", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/project/README.md"}, {"name": "shortener/code.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/project/shortener/code.go"}, {"name": "shortener/link.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/project/shortener/link.go"}, {"name": "shortener/server.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/project/shortener/server.go"}, {"name": "shortener/server_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/project/shortener/server_test.go"}, {"name": "shortener/store.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/project/shortener/store.go"}, {"name": "shortener/store_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/08-http/project/shortener/store_test.go"}], "cmd": "go test ./modules/08-http/project/...", "id": "modules/08-http/project"}], "review": "# Review Guide for Module 08: HTTP\n\n## Exercise 1: health\n\n### Readable Solution\nThe `Handler` function creates an http.Handler that:\n1. Initializes a Response with status \"ok\"\n2. Iterates over each check with a fresh per-check timeout using `context.WithTimeout`\n3. Records \"ok\" or the error message in the Checks map\n4. Returns HTTP 200 if all pass, HTTP 503 if any fail\n\nThe key design insight is using `context.WithTimeout` for **each check separately**. This means if one check times out, it doesn't steal time from the others. A naive implementation might use `context.WithDeadline` once at the top and share that context across all checks\u2014that would mean if the first check uses 8 of 10 seconds, the second only gets 2. By creating a fresh timeout for each check, you give each one its full allotment.\n\n**Example structure:**\n```go\nimport \"gocourse/solutions/08-http/exercises/health\"\n\ntype (\n\tCheck    = health.Check\n\tResponse = health.Response\n)\n\nfunc Handler(timeout time.Duration, checks map[string]Check) http.Handler {\n    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n        resp := Response{\n            Status: \"ok\",\n            Checks: make(map[string]string, len(checks)),\n        }\n\n        for name, check := range checks {\n            ctx, cancel := context.WithTimeout(r.Context(), timeout)\n            err := check(ctx)\n            cancel() // Release the timer immediately\n\n            if err != nil {\n                resp.Status = \"fail\"\n                resp.Checks[name] = err.Error()\n            } else {\n                resp.Checks[name] = \"ok\"\n            }\n        }\n\n        status := http.StatusOK\n        if resp.Status == \"fail\" {\n            status = http.StatusServiceUnavailable\n        }\n\n        w.Header().Set(\"Content-Type\", \"application/json\")\n        w.Header().Set(\"Cache-Control\", \"no-store\")\n        w.WriteHeader(status)\n        json.NewEncoder(w).Encode(resp)\n    })\n}\n\nfunc main() {\n\tchecks := map[string]Check{\n\t\t\"db\":    func(ctx context.Context) error { return nil },\n\t\t\"cache\": func(ctx context.Context) error { <-ctx.Done(); return ctx.Err() }, // hangs until the timeout\n\t}\n\trec := httptest.NewRecorder()\n\tHandler(50*time.Millisecond, checks).ServeHTTP(rec, httptest.NewRequest(\"GET\", \"/healthz\", nil))\n\tfmt.Print(rec.Code, \" \", rec.Body.String()) // 503 {\"status\":\"fail\",\"checks\":{\"cache\":\"context deadline exceeded\",\"db\":\"ok\"}}\n}\n```\n\n### Optimized Solution\n`HandlerParallel` (in `fast.go`) runs every check in its own goroutine, so\nthe endpoint's latency is that of the **slowest** check instead of the **sum**\nof all of them. Each goroutine writes only its own slot of a pre-sized\n`[]error`, so no mutex is needed, and the result map is built after\n`wg.Wait()`. The check names are copied into a slice once, at construction\ntime.\n\n**Measured (Go 1.24.2 linux/amd64, `-count=5`, medians), three checks that\neach sleep 1 ms:**\n- `Handler` (sequential): ~3.29 ms/op, 44 allocs/op\n- `HandlerParallel`: ~1.17 ms/op, 49 allocs/op\n\nThat is about 2.8x lower latency, at the cost of a goroutine per check (5 more\nallocations). The CPU cost is irrelevant here; the win is entirely in\nwall-clock latency, which is what a load balancer probing `/healthz`\nexperiences.\n\n### Trade-off\n- **Sequential** is simpler, deterministic, and easy to test. Prefer it when\n  checks are fast (in-process) or few.\n- **Parallel** is worth it as soon as checks do I/O (DB ping, upstream HTTP).\n  The price is goroutine reasoning: each goroutine must write only its own\n  slot (or use a mutex), and the handler must not return before `wg.Wait()`.\n  Run the tests with `-race`.\n- In both versions, the per-check `context.WithTimeout` (not one shared\n  deadline) is what keeps one slow dependency from eating the others' budget.\n\n### Review Checklist\n- [ ] Handler returns an http.Handler (implements ServeHTTP), not a plain function\n- [ ] Response status is exactly \"ok\" or \"fail\" (not \"healthy\", \"unhealthy\", \"pass\", \"success\")\n- [ ] Checks map is always initialized (not nil), even with zero checks\n- [ ] Uses `context.WithTimeout`, not `WithDeadline` or `WithCancel`\n- [ ] Each check runs in its own independent context (creates a new timeout for each iteration)\n- [ ] `cancel()` is called after every check (deferred or explicit after the check call)\n- [ ] HTTP status 200 is used for all-pass, 503 for any failure (not 500)\n- [ ] Cache-Control header is set to \"no-store\" (health responses should never be cached)\n- [ ] Content-Type is set to \"application/json\"\n- [ ] Response is JSON-encoded with json.NewEncoder or json.Marshal (not plain text or skipped)\n- [ ] Handler respects the request context (derives child contexts from r.Context(), not context.Background())\n- [ ] Concurrent checks don't race (each check has its own context; no shared mutable state in the map)\n- [ ] Tests use httptest.NewRecorder (no real HTTP server)\n- [ ] Tests use httptest.NewRequestWithContext to set timeouts and contexts\n- [ ] Tests verify both \"ok\" and \"fail\" responses\n- [ ] Tests verify that check timeouts are independent (one timeout doesn't affect the next check)\n\n## Exercise 2: jsonio\n\n### Readable Solution\nThree functions to keep JSON handling consistent across all handlers:\n\n1. **WriteJSON(w http.ResponseWriter, status int, v any)**: Encodes into a buffer, then writes status and body atomically. If encoding fails, the handler sends HTTP 500 before any partial body.\n   - Allocates a bytes.Buffer\n   - Uses json.NewEncoder to encode v\n   - On encoding error: sends 500 via http.Error\n   - On success: sets Content-Type, writes status, then body\n\n2. **WriteError(w, status, msg)**: Helper to send error responses as JSON. Always succeeds because map[string]string always encodes, so write errors are silently ignored (client is gone).\n\n3. **DecodeJSON(w, r, dst)**: Validates the request and decodes into dst, returning *RequestError on client errors, or a server error (for unexpected failures). Does:\n   - Check Content-Type is application/json (using mime.ParseMediaType to handle charset)\n   - Cap body size with http.MaxBytesReader\n   - Call DisallowUnknownFields() on the decoder\n   - Detect trailing JSON values (reject multiple documents)\n   - Distinguish client errors (400/413/415) from server errors (500)\n\n**Key insight for WriteJSON**: The atomic write is critical. If you write the status code or headers first, then fail to encode, the client has already received a 201 or 200. Now they see a partial body or connection close, which is worse than a clean 500. By buffering, you guarantee either a complete response or a clean error.\n\n**Key insight for DecodeJSON**: Content-Type validation prevents clients from sending binary data and claiming it's JSON. DisallowUnknownFields() catches API versioning issues (e.g., client sends \"user_ids\" but server expects \"user_id\"). Trailing-value detection prevents a buggy client from sending two JSON documents in one request.\n\n### Optimized Solution\n`WriteJSONFast` (in `fast.go`) makes two changes:\n- It takes the encode buffer from a `sync.Pool` instead of allocating a new\n  `bytes.Buffer` per response. Buffers that grew past 64 KiB are not returned to\n  the pool, so one huge response cannot pin memory forever.\n- It assigns `w.Header()[\"Content-Type\"] = jsonContentType`, a shared,\n  pre-built `[]string`, instead of `Header().Set`, which allocates a new\n  one-element slice every call. This is only valid because the key is already\n  in canonical form.\n\n**Measured (Go 1.24.2 linux/amd64, `-count=5`, medians):**\n- `WriteJSON`: ~480 ns/op, 184 B/op, 4 allocs/op\n- `WriteJSONFast`: ~309 ns/op, 24 B/op, 1 alloc/op\n- About 1.5x faster, with 3 fewer allocations per response.\n\nCaveats worth discussing with the student: the shared header slice is a\nlatent bug if any later code does `w.Header()[\"Content-Type\"][0] = ...` (it\nwould rewrite the value for every response in the process). `Header().Add`\nis safe, because `append` on a full slice copies. A `sync.Pool` also adds\nbehaviour that is hard to test (buffer reuse between requests). Neither is\nworth it unless a profile shows `WriteJSON` on the hot path.\n\n### Trade-off\n- **Use readable WriteJSON** for most code. The buffer overhead is worth the clarity.\n- **Use an optimized version** only if profiling shows this on the critical path (e.g., thousands of requests per second on single-threaded handler).\n- The error translation in `decodeError()` must be explicit; consolidating cases would lose specificity (e.g., distinguish EOF \"empty body\" from syntax \"malformed JSON\").\n\n### Review Checklist\n- [ ] WriteJSON encodes to a bytes.Buffer first, before any write\n- [ ] WriteJSON returns an error only on encoding failure\n- [ ] WriteJSON sets Content-Type before WriteHeader\n- [ ] WriteJSON never calls WriteHeader on error; lets http.Error do it\n- [ ] WriteError creates a map[string]string{...} and ignores write errors\n- [ ] DecodeJSON validates Content-Type with mime.ParseMediaType (handles charset, case-insensitivity)\n- [ ] DecodeJSON returns 415 Unsupported Media Type for wrong Content-Type\n- [ ] DecodeJSON caps body size with http.MaxBytesReader (returns 413 Payload Too Large)\n- [ ] DecodeJSON calls dec.DisallowUnknownFields()\n- [ ] DecodeJSON returns 400 Bad Request for unknown fields\n- [ ] DecodeJSON checks for a second JSON value (reads and expects io.EOF)\n- [ ] DecodeJSON returns 400 for multiple documents (trailing values)\n- [ ] DecodeJSON handles io.EOF (empty body) separately from other decode errors\n- [ ] *RequestError type has both Status (int) and Msg (string) fields\n- [ ] *RequestError implements the error interface (Error() string method)\n- [ ] All client errors (Content-Type, body size, JSON format, unknown fields) are 4xx\n- [ ] All server errors (unexpected Marshal failures) are 5xx\n- [ ] Tests cover all error cases: missing header, wrong type, syntax, unknown fields, too large, trailing values\n- [ ] Tests use httptest.NewRecorder (no real HTTP server)\n\n## Exercise 3: middleware\n\n### Readable Solution\nA classic middleware pattern with four components:\n\n1. **Chain(h, mws...)**: Applies middleware from the end of the slice backwards so the **first** middleware in the slice is the **outermost** (runs first on the request, last on the response). \n   - Example: Chain(h, Logging, Auth) wraps as Auth(Logging(h)), so request flow is: Logging \u2192 Auth \u2192 h \u2192 (response flows backward)\n\n2. **RequestID(gen func() string)**: Middleware factory that assigns each request a unique ID.\n   - Reads X-Request-ID header; if missing, calls gen() to create one\n   - Bounds the header to 64 bytes (prevents logging 10MB request IDs)\n   - Stores ID in request context with an unexported key type (prevents context pollution)\n   - Echoes ID in response header for client tracing\n\n3. **Logging(logger)**: Middleware that logs every request and response.\n   - Wraps the handler with a statusWriter to capture status and bytes written\n   - Logs **after** the handler completes (deferred) with: method, path, status, bytes, duration\n   - Includes request_id in the log entry (if RequestID middleware is in the chain)\n   - Uses logger.InfoContext (not logger.Info) to carry context attributes\n\n4. **Recover(logger)**: Middleware that catches panics in handlers.\n   - Uses defer + recover() to catch panic values\n   - Logs panic details at Error level\n   - Sends HTTP 500 only if no response has started (checks statusWriter.wroteHeader)\n   - Re-panics http.ErrAbortHandler (the standard library's official abort signal for framework use)\n   - Does nothing if no panic occurs\n\n5. **statusWriter**: Internal wrapper around http.ResponseWriter.\n   - Tracks the status code (recorded on first WriteHeader call)\n   - Tracks bytes written (sum of all Write calls)\n   - Implements Unwrap() to satisfy http.ResponseController expectations (allows middleware to unwrap and access the real writer)\n   - Returns implicit status 200 if Write is called without WriteHeader\n\n**Key insight**: Middleware order matters. Logging should wrap Auth so you log all requests (including rejected ones). Error recovery should be outermost to catch panics from any inner middleware.\n\n### Optimized Solution\n`LoggingFast` (in `fast.go`) makes three changes:\n- It checks `logger.Enabled(ctx, slog.LevelInfo)` first and, if logging is\n  off, calls the next handler directly: no clock reads, no `statusWriter`.\n- It logs with `logger.LogAttrs` and typed attributes (`slog.Int`,\n  `slog.Duration`), so values are not boxed into `any` as they are with the\n  `\"key\", value` form.\n- It collects the attributes in a fixed `[6]slog.Attr` array on the stack.\n\n**Measured (Go 1.24.2 linux/amd64, `-count=5`, medians):**\n\n| Benchmark | ns/op | B/op | allocs/op |\n|---|---|---|---|\n| `Logging`, Info enabled | ~930 | 82 | 4 |\n| `LoggingFast`, Info enabled | ~800 | 50 | 2 |\n| `Logging`, Info disabled | ~170 | 82 | 4 |\n| `LoggingFast`, Info disabled | ~18 | 2 | 1 |\n\nThe cost of middleware composition is dominated by slog formatting, not the wrapper itself.\n\n### Trade-off\n- **Use readable implementation** (current) for clarity; the statusWriter wrapper is necessary and has minimal overhead.\n- **Optimize only if** profiling shows middleware on critical path. Most applications spend >99% time in handlers, not middleware.\n- **Never optimize** by removing panic recovery; a single panic in production without recovery brings down the entire server.\n\n### Review Checklist\n- [ ] Chain applies middleware in the correct order (first in slice is outermost)\n- [ ] Chain(h) with empty middleware returns h unchanged (identity function for middleware)\n- [ ] RequestID uses unexported key type (prevents namespace collisions in context)\n- [ ] RequestID generates a new ID via gen() if header is missing\n- [ ] RequestID reads from X-Request-ID header and uses it as-is (if present)\n- [ ] RequestID bounds header length (maxRequestIDLen = 64; longer headers are replaced with generated ID)\n- [ ] RequestID stores ID in context and sets it in response X-Request-ID header\n- [ ] Logging wraps handler in statusWriter to capture status and bytes\n- [ ] Logging logs **after** handler returns (uses defer)\n- [ ] Logging records: method, path, status, bytes written, duration\n- [ ] Logging includes request_id in log fields (if context has it)\n- [ ] Logging uses logger.InfoContext (carries context attributes like request ID)\n- [ ] Logging with disabled slog level is cheap (~18 ns/op, no allocation)\n- [ ] Recover catches panic values with recover()\n- [ ] Recover logs panic details with logger.ErrorContext\n- [ ] Recover re-panics http.ErrAbortHandler (preserves framework abort signal)\n- [ ] Recover sends HTTP 500 only if statusWriter.wroteHeader is false\n- [ ] Recover sends 500 via http.Error or WriteHeader+Write (not panic)\n- [ ] statusWriter implements Write, WriteHeader, Header, and Unwrap methods\n- [ ] statusWriter.statusCode() returns 200 for implicit status (when no WriteHeader called yet)\n- [ ] statusWriter tracks bytes written correctly across multiple Write calls\n- [ ] statusWriter.Unwrap() returns the underlying http.ResponseWriter\n- [ ] Flusher/Pusher/Hijacker interfaces are delegated (if present in original writer)\n- [ ] Tests cover: no panic, panic before writing, panic after writing, ErrAbortHandler re-panic\n- [ ] Tests verify middleware order with a marker or mock (first in slice is outermost)\n- [ ] Tests use httptest.NewRecorder and httptest.NewRequestWithContext\n- [ ] Tests verify that RequestID persists across context boundaries\n\n## Exercise 4: routes\n\n### Readable Solution\nUses Go 1.22 ServeMux to route based on method and path:\n\n1. **Routes(s *Store)**: Factory function that creates an http.ServeMux, registers all routes, and returns it as http.Handler.\n   - No global state; routes are scoped to the returned handler\n   - Allows testing multiple stores/configurations independently\n\n2. **Handlers**: Each handler reads path parameters with r.PathValue(\"name\"), validates input, and calls the store.\n   - GET /{$} \u2014 root path (exact match; /{$} prevents matching \"\" as a prefix)\n   - GET /notes \u2014 list all notes (returns 200 with empty array for no notes, not 404)\n   - POST /notes \u2014 create note; expects JSON {text: \"...\"}, returns 201 with Location header\n   - GET /notes/latest \u2014 most recent note (mo
