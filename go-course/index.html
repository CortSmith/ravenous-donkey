dRE = regexp.MustCompile(`^[A-Z]+$`)\n    statusRE = regexp.MustCompile(`^[1-5][0-9][0-9]$`)\n    numberRE = regexp.MustCompile(`^[0-9]+$`)\n)\n\n// parseLine (same as before, but regexes are compiled once)\nfunc parseLine(line string) (entry, error) {\n    f := strings.FieldsFunc(line, isSep)\n    if len(f) != 6 {\n        return entry{}, fmt.Errorf(\"want 6 fields, got %d\", len(f))\n    }\n    if !methodRE.MatchString(f[1]) {  // compiled once, reused\n        return entry{}, fmt.Errorf(\"bad method %q\", f[1])\n    }\n    if !strings.HasPrefix(f[2], \"/\") {\n        return entry{}, fmt.Errorf(\"bad path %q\", f[2])\n    }\n    if !statusRE.MatchString(f[3]) {\n        return entry{}, fmt.Errorf(\"bad status %q\", f[3])\n    }\n    status, _ := strconv.Atoi(f[3]) // can't fail after statusRE\n    if !numberRE.MatchString(f[4]) || !numberRE.MatchString(f[5]) {\n        return entry{}, fmt.Errorf(\"bad number in %q\", line)\n    }\n    dur, err := strconv.ParseInt(f[4], 10, 64)\n    if err != nil {\n        return entry{}, fmt.Errorf(\"bad duration: %w\", err)\n    }\n    size, err := strconv.ParseInt(f[5], 10, 64)\n    if err != nil {\n        return entry{}, fmt.Errorf(\"bad bytes: %w\", err)\n    }\n    return entry{method: f[1], path: f[2], status: status, duration: dur, bytes: size}, nil\n}\n\nfunc main() {\n\tfmt.Println(parseLine(\"2026-10-11T12:00:00Z GET /api/users 200 12 5120\"))\n\tfmt.Println(parseLine(\"2026-10-11T12:00:00Z get /api/users 200 12 5120\"))\n}\n```\n\nThis alone cuts allocations dramatically (regex compilation is expensive).\n\n### Optimized Solution (fast.go)\n\nReplace regexes and FieldsFunc with manual parsing:\n\n```go\n// entry is one parsed log line.\ntype entry struct {\n\tmethod   string\n\tpath     string\n\tstatus   int\n\tduration int64\n\tbytes    int64\n}\n\n// fast.go\nfunc parseLineOptimized(line string) (entry, error) {\n    // Manual field extraction: scan for separators\n    var fieldStarts [6]int\n    var fieldEnds [6]int\n    fieldIdx := 0\n    inField := false\n\n    for i := 0; i < len(line) && fieldIdx < 6; i++ {\n        c := line[i]\n        if c == ' ' || c == '\\t' {\n            if inField {\n                fieldEnds[fieldIdx] = i\n                fieldIdx++\n                inField = false\n            }\n        } else {\n            if !inField {\n                fieldStarts[fieldIdx] = i\n                inField = true\n            }\n        }\n    }\n    if inField {\n        fieldEnds[fieldIdx] = len(line)\n        fieldIdx++\n    }\n\n    if fieldIdx != 6 {\n        return entry{}, fmt.Errorf(\"want 6 fields, got %d\", fieldIdx)\n    }\n\n    // Extract fields as substrings (no allocation)\n    method := line[fieldStarts[1]:fieldEnds[1]]\n    path := line[fieldStarts[2]:fieldEnds[2]]\n    statusStr := line[fieldStarts[3]:fieldEnds[3]]\n    durStr := line[fieldStarts[4]:fieldEnds[4]]\n    bytesStr := line[fieldStarts[5]:fieldEnds[5]]\n\n    // Validate method: all uppercase letters\n    if !isMethod(method) {\n        return entry{}, fmt.Errorf(\"bad method %q\", method)\n    }\n\n    // Validate path: starts with /\n    if len(path) == 0 || path[0] != '/' {\n        return entry{}, fmt.Errorf(\"bad path %q\", path)\n    }\n\n    // Validate status: exactly 3 digits, 100-599\n    status := parseStatus(statusStr)\n    if status < 100 || status > 599 {\n        return entry{}, fmt.Errorf(\"bad status %q\", statusStr)\n    }\n\n    // Validate and parse duration\n    dur, err := strconv.ParseInt(durStr, 10, 64)\n    if err != nil {\n        return entry{}, fmt.Errorf(\"bad duration: %w\", err)\n    }\n\n    // Validate and parse bytes\n    size, err := strconv.ParseInt(bytesStr, 10, 64)\n    if err != nil {\n        return entry{}, fmt.Errorf(\"bad bytes: %w\", err)\n    }\n\n    return entry{method: method, path: path, status: status, duration: dur, bytes: size}, nil\n}\n\nfunc isMethod(s string) bool {\n    if len(s) == 0 {\n        return false\n    }\n    for i := 0; i < len(s); i++ {\n        c := s[i]\n        if c < 'A' || c > 'Z' {\n            return false\n        }\n    }\n    return true\n}\n\nfunc parseStatus(s string) int {\n    if len(s) != 3 {\n        return -1\n    }\n    if s[0] < '1' || s[0] > '5' || s[1] < '0' || s[1] > '9' || s[2] < '0' || s[2] > '9' {\n        return -1\n    }\n    return int(s[0]-'0')*100 + int(s[1]-'0')*10 + int(s[2]-'0')\n}\n\nfunc main() {\n\tfmt.Println(parseLineOptimized(\"2026-10-11T12:00:00Z GET /api/users 200 12 5120\"))\n\tfmt.Println(parseLineOptimized(\"2026-10-11T12:00:00Z GET /api/users 700 12 5120\"))\n\tfmt.Println(testing.AllocsPerRun(100, func() { parseLineOptimized(\"2026-10-11T12:00:00Z GET /api/users 200 12 5120\") })) // 0\n}\n```\n\n**Why it's faster:**\n- No regex compilation or MatchString calls\n- No `FieldsFunc` allocation\n- Field extraction by substring (zero-copy)\n- Validation is O(field length), not regex matching\n- Preallocated maps reduce insertion-time allocations\n\n### Benchmark Results\n\n**Starter:**\n```\nBenchmarkSummarize-20    176    6624259 ns/op    1560332 B/op    20903 allocs/op\n```\n(measured on go1.24.2 linux/amd64)\n\n**Optimized (manual parsing):**\n```\nBenchmarkSummarize-20   1048    1129365 ns/op       5437 B/op       30 allocs/op\n```\n(measured on go1.24.2 linux/amd64)\n\n**Speedup:** 5.86x from starter to optimized.\n\n### Trade-off\n\n- **Readable:** Hoist regexes to package level. Simpler to understand, 3x speedup.\n- **Optimized:** Manual parsing. Slightly longer code, but 6x speedup and zero per-line allocations.\n\nFor this module, the optimized version is worth it because parsing is the core operation.\n\n### Review Checklist\n\n- [ ] **Correctness:**\n  - All tests pass: `go test ./modules/09-performance/project/ -v`\n  - No race conditions: `go test -race ./modules/09-performance/project/`\n  - Handles empty input (empty lines, blank input)\n  - Counts malformed lines correctly\n  - Never allocates nil maps (they're initialized)\n\n- [ ] **Performance:**\n  - `TestSummarizeAllocs` passes (\u226460 allocations for 2000 lines)\n  - `TestSummarizeAllocsDoNotScale` passes (allocations don't scale with line count)\n  - Benchmark shows \u22655x improvement over starter\n  - `project/RESULTS.md` documents before/after numbers\n\n- [ ] **Optimization technique:**\n  - Regexes are either hoisted or removed\n  - `FieldsFunc` is replaced or optimized (no per-field allocations)\n  - Maps are prealloc'd\n  - Manual parsing or `strings.Cut` used instead of `FieldsFunc`\n\n- [ ] **Code quality:**\n  - No panics on malformed input\n  - Error messages are clear (helpful for debugging)\n  - Handles edge cases (leading zeros, large numbers, unicode paths)\n  - Code is reasonably readable (even if optimized)\n\n---\n\n## Summary: When to Optimize\n\n**Readable (first solution):** Choose this when the code is clear and performance is acceptable.\n\n**Optimized (fast variant):** Choose this when:\n- The code is called frequently (1000+ times per second)\n- Allocations are visible in a profile\n- Readability loss is acceptable (e.g., for core parsers or encoders)\n\nFor this module, all exercises and the project benefit from optimization because they're either in hot loops or process many items. The optimized versions are justified.\n\n**Grading note:** A student who implements the readable solution and passes the allocation test has met the goal.\nA student who goes further and explores fast.go variants has gone above and beyond.\n", "solDir": "/home/csmith/Workspace/tools/go-course/solutions/09-performance", "dir": "/home/csmith/Workspace/tools/go-course/modules/09-performance"}, {"slug": "10-capstone", "compose": "modules/10-capstone/compose.yaml", "services": ["test", "vet", "bench", "cover", "shell", "solutions", "kvd", "kvd-solution"], "title": "Module 10: Capstone \u2014 Building a Mini Key-Value Store", "lesson": "# Module 10: Capstone \u2014 Building a Mini Key-Value Store\n\nWelcome to the capstone! You'll build a durable, concurrent key-value store in three milestones, each building on the last. By the end, you'll have a real system: an in-memory store with TTL expiry, persistence via an append-only log, and an HTTP API.\n\n**Quick facts:**\n- **Go 1.24**, stdlib only (as always).\n- Three milestones, each \u2264 60 minutes.\n- All code passes `-race` (concurrency-safe).\n- TTL tests use an injectable clock (no sleeping).\n- Later milestones can be started independently; they ship their own starter code.\n\n---\n\n## Goals\n\nBy the end of the capstone you will be able to:\n\n- Design a concurrency-safe data structure (`sync.RWMutex`, a janitor goroutine stopped by `context`) and prove it race-free with `-race`.\n- Make time testable by injecting a clock, so TTL tests run instantly and deterministically.\n- Make data durable with an append-only log: one `Write` per record, `fsync`, replay on start-up, torn-tail recovery, and atomic compaction (write temp file \u2192 fsync \u2192 rename \u2192 fsync directory).\n- Explain, with a measured number, what `fsync` costs and what you lose without it.\n- Expose a store over HTTP with Go 1.22 `ServeMux` patterns, JSON, and `slog`.\n- Write a production-shaped `main`: a testable `run(ctx, args, stdout, stderr) error`, SIGINT/SIGTERM handling, server timeouts, graceful `Shutdown`, and cleanup on every exit path.\n- Combine every earlier module (errors, interfaces, testing, I/O, concurrency, HTTP) into one working program.\n\n---\n\n## Module Structure\n\nEach milestone is self-contained:\n\n- **Milestone 1**: concurrency-safe in-memory store with TTL and a janitor goroutine.\n- **Milestone 2**: persistence via append-only log, replay on startup, and compaction.\n- **Milestone 3**: HTTP API (GET/PUT/DELETE /kv/{key}), slog logging, graceful shutdown, and a runnable server in `cmd/kvd`.\n\nEach milestone directory has:\n- A **README.md** with spec, design decisions, and the exact `go test` command.\n- **Starter code** in `modules/10-capstone/milestone{1,2,3}/`.\n- **Solution** in `solutions/10-capstone/milestone{1,2,3}/`.\n\n---\n\n## Key Concepts by Milestone\n\n### Milestone 1: TTL & Janitor\n\n**What you'll learn:**\n- Time-based expiry (lazy + active cleanup).\n- Context cancellation for graceful shutdown.\n- sync.Mutex / RWMutex patterns.\n- Defensive coding: testing with an injectable clock, no sleeps.\n\n**Core ideas:**\n- Entries expire at an absolute instant; reads check against \"now\".\n- A janitor goroutine periodically sweeps expired entries so they don't hog memory.\n- The janitor stops when the context is canceled, and tests can inject a fake clock.\n\n**Implementation hints:**\n- Store entries with an `expiresAt` field (zero = never expires).\n- `Set` calculates expiry relative to \"now\" and stores the absolute time.\n- `Get` and other reads treat expired entries as absent (lazy expiry).\n- `DeleteExpired` scans the map once per tick; use a `time.Ticker` in `RunJanitor`.\n\n### Milestone 2: Append-Only Log & Replay\n\n**What you'll learn:**\n- Durability via write-ahead logging (WAL).\n- Handling crashes: torn writes, recovery, file truncation.\n- Binary format: JSON Lines for simple, debuggable storage.\n- Atomicity via fsync and careful file handling.\n- Compaction to shrink the log over time.\n\n**Core ideas:**\n- Every write (Set, Delete) is appended to a log before it touches memory.\n- On startup, the log is replayed to rebuild state.\n- A torn final record (process died mid-write) is detected and discarded.\n- Records are stored as JSON lines so corruption is line-granular.\n- Compaction rewrites the log to contain one record per live key, removing deleted/overwritten entries.\n\n**Implementation hints:**\n- Log records: `{\"op\":\"set\",\"key\":\"k\",\"value\":\"v\",\"exp\":12345}` and `{\"op\":\"del\",\"key\":\"k\"}`.\n- One write() per record ensures crashes tear at most the final record.\n- Replay() scans lines, tracking the offset of the last complete line, and truncates if needed.\n- Compact() creates a temp file, renames it over the old log, and fsyncs the directory.\n- DB serializes writes via a mutex so the log order is always correct.\n\n### Milestone 3: HTTP API & Graceful Shutdown\n\n**What you'll learn:**\n- net/http routing (Go 1.22 patterns: GET /path/{id}).\n- Request/response encoding (JSON, status codes).\n- slog structured logging.\n- Graceful shutdown with context cancellation.\n- Running a real server in main().\n\n**Core ideas:**\n- Three routes: GET /kv/{key} reads, PUT /kv/{key} writes (with optional TTL), DELETE /kv/{key} deletes.\n- The server is an http.Handler wrapping the DB.\n- Graceful shutdown: catch SIGINT/SIGTERM, cancel the context, wait for active requests.\n- Log every operation with context and status for debugging.\n\n**Implementation hints:**\n- Use r.PathValue(\"key\") to extract path parameters (Go 1.22+).\n- Request body for PUT: `{\"value\":\"...\",\"ttl\":5000}` (TTL in milliseconds).\n- Response on success: `{\"key\":\"...\",\"value\":\"...\"}` or similar.\n- Graceful shutdown: `signal.NotifyContext` + `httpServer.Shutdown` with a timeout.\n- Include a main in cmd/kvd that ties everything together.\n\n---\n\n## Concepts: TTL, Janitor, Persistence, HTTP\n\n### TTL and Janitor Patterns\n\n**Lazy vs. Active Expiry:**\n\nIn a real system, you often want both:\n- **Lazy**: When a reader asks for a key, check if it's expired; if so, return ErrNotFound.\n- **Active**: A background task periodically deletes expired entries to reclaim memory.\n\nTogether, they guarantee:\n- Readers never observe stale data.\n- Memory is eventually reclaimed (no unbounded growth).\n- Tests can skip the janitor by never calling RunJanitor, or drive it manually with a fake clock.\n\n```go\nvar ErrNotFound = errors.New(\"not found\")\n\n// Store is a minimal TTL store: just enough around the methods below.\ntype Store struct {\n    mu    sync.RWMutex\n    items map[string]entry\n    now   func() time.Time\n}\n\nfunc (s *Store) Set(key, value string, ttl time.Duration) {\n    s.mu.Lock()\n    defer s.mu.Unlock()\n    var exp time.Time\n    if ttl > 0 {\n        exp = s.now().Add(ttl)\n    }\n    s.items[key] = entry{value: value, expiresAt: exp}\n}\n\n// An entry with a TTL.\ntype entry struct {\n    value     string\n    expiresAt time.Time // zero = never\n}\n\n// Lazy: check on read.\nfunc (e entry) expired(now time.Time) bool {\n    return !e.expiresAt.IsZero() && !now.Before(e.expiresAt)\n}\n\n// Store.Get treats it as absent if expired.\nfunc (s *Store) Get(key string) (string, error) {\n    now := s.now()\n    s.mu.RLock()\n    e, ok := s.items[key]\n    s.mu.RUnlock()\n    if !ok || e.expired(now) {\n        return \"\", ErrNotFound\n    }\n    return e.value, nil\n}\n\n// Active: janitor sweep.\nfunc (s *Store) DeleteExpired() int {\n    now := s.now()\n    s.mu.Lock()\n    defer s.mu.Unlock()\n    n := 0\n    for k, e := range s.items {\n        if e.expired(now) {\n            delete(s.items, k)\n            n++\n        }\n    }\n    return n\n}\n\n// Janitor loop: run every interval until ctx is canceled.\nfunc (s *Store) janitor(ctx context.Context, ticks <-chan time.Time) {\n    for {\n        select {\n        case <-ctx.Done():\n            return\n        case <-ticks:\n            s.DeleteExpired()\n        }\n    }\n}\n\nfunc main() {\n    now := time.Date(2026, 1, 1, 0, 0, 0, 0, time.UTC)\n    s := &Store{items: map[string]entry{}, now: func() time.Time { return now }}\n    s.Set(\"session\", \"abc\", time.Minute)\n    s.Set(\"config\", \"on\", 0) // never expires\n\n    now = now.Add(2 * time.Minute) // time passes\n    _, err := s.Get(\"session\")\n    fmt.Println(err)                      // not found: lazily expired on read\n    fmt.Println(len(s.items))             // 2: but still in memory...\n    fmt.Println(s.DeleteExpired())        // 1: ...until the janitor sweeps\n    fmt.Println(s.Get(\"config\"))          // on <nil>\n\n    // Drive the janitor with a channel the test controls:\n    ctx, cancel := context.WithCancel(context.Background())\n    ticks := make(chan time.Time)\n    done := make(chan struct{})\n    go func() { s.janitor(ctx, ticks); close(done) }()\n    ticks <- now // one sweep\n    cancel()\n    <-done\n}\n```\n\n**Testable Clocks:**\n\nNever sleep in tests. Instead, inject a fake clock:\n\n```go\n// The reference milestone 1 store, so the output means something.\n// Point the import at modules/10-capstone/milestone1/store to try yours.\nimport \"gocourse/solutions/10-capstone/milestone1/store\"\n\ntype fakeClock struct {\n    mu  sync.Mutex\n    now time.Time\n}\n\nfunc (c *fakeClock) Now() time.Time {\n    c.mu.Lock()\n    defer c.mu.Unlock()\n    return c.now\n}\n\nfunc (c *fakeClock) Advance(d time.Duration) {\n    c.mu.Lock()\n    defer c.mu.Unlock()\n    c.now = c.now.Add(d)\n}\n\nfunc main() {\n    // In tests:\n    baseTime := time.Date(2026, 1, 1, 0, 0, 0, 0, time.UTC)\n    clk := &fakeClock{now: baseTime}\n    s := store.New(store.WithClock(clk.Now))\n    s.Set(\"key\", \"val\", time.Second)\n    fmt.Println(s.Get(\"key\")) // val <nil>\n    clk.Advance(time.Second)  // key is now expired\n    fmt.Println(s.Get(\"key\")) // store: key not found\n    // No sleep needed!\n}\n```\n\n### Append-Only Logs and Durability\n\n**Write-Ahead Logging (WAL):**\n\nA durable store never updates in-place; it logs first, then applies in memory:\n\n1. **Log append**: Write the mutation to stable storage.\n2. **Acknowledge**: Return to caller (write is durable).\n3. **Apply in memory**: Update the in-memory state.\n4. **Crash recovery**: On restart, replay the log to rebuild state.\n\nBenefits:\n- If the process crashes between log and memory, the log has the truth.\n- If it crashes during the memory update, the next replay will redo it (idempotent).\n\n**JSON Lines Format:**\n\nStore one record per line, as JSON:\n\n```\n{\"op\":\"set\",\"key\":\"user:1\",\"value\":\"alice\",\"exp\":1735787045000000000}\n{\"op\":\"set\",\"key\":\"user:2\",\"value\":\"bob\",\"exp\":0}\n{\"op\":\"del\",\"key\":\"user:1\"}\n{\"op\":\"set\",\"key\":\"user:1\",\"value\":\"alice2\",\"exp\":1735787045000000000}\n```\n\nWhy JSON Lines?\n- Line-by-line parsing is simple and streaming-friendly.\n- Each '\\n' is a frame boundary; a torn write stops at the last newline.\n- Corruption is isolated to one line, not the entire file.\n- Human-readable (great for debugging).\n\n**Handling Torn Writes:**\n\nIf the process dies mid-Append, the last line may be incomplete:\n\n```\n{\"op\":\"set\",\"key\":\"k\",\"value\":\"v\",\"exp\":123\n<-- process dies here; '\\n' never written -->\n```\n\nOn Replay, we detect this:\n- Use bufio.ReadBytes('\\n') to read lines.\n- If EOF is hit and there's unread data, that's a torn record.\n- Truncate the file to discard the torn record.\n- Continue; the torn record was never acknowledged, so losing it is safe.\n\n```go\n// A log whose last record was torn by a crash: no final '\\n'.\nf, _ := os.CreateTemp(\"\", \"torn-*.log\")\ndefer os.Remove(f.Name())\nf.WriteString(\"{\\\"op\\\":\\\"set\\\",\\\"key\\\":\\\"a\\\"}\\n{\\\"op\\\":\\\"set\\\",\\\"key\\\":\\\"b\\\"}\\n{\\\"op\\\":\\\"set\\\",\\\"key\\\":\\\"k\\\",\\\"val\")\nf.Seek(0, io.SeekStart)\n\nbr := bufio.NewReader(f)\nvar lastGoodOffset int64\nfor {\n    line, err := br.ReadBytes('\\n')\n    if err == io.EOF {\n        if len(line) > 0 { // torn tail\n            fmt.Printf(\"torn record: %q\\n\", line)\n            f.Truncate(lastGoodOffset)\n        }\n        break\n    }\n    fmt.Printf(\"replay: %s\", line) // process line...\n    lastGoodOffset += int64(len(line))\n}\ninfo, _ := f.Stat()\nfmt.Println(\"file size now\", info.Size(), \"=\", lastGoodOffset)\n```\n\n**Compaction:**\n\nOver time, the log grows with deletes and rewrites. Compaction shrinks it:\n\n1. Snapshot the in-memory state (call Items()).\n2. Write one \"set\" record per live key to a temp file.\n3. fsync the temp file (data durable).\n4. Atomic rename over the old log.\n5. fsync the directory (rename durable).\n6. Reopen the log with O_APPEND.\n\n```go\ntype Record struct {\n    Op  string `json:\"op\"`\n    Key string `json:\"key\"`\n}\n\ntype Log struct {\n    path string\n    f    *os.File\n}\n\nfunc (l *Log) Compact(records []Record) error {\n    dir := filepath.Dir(l.path)\n\n    // Write to temp file (same directory, so the rename stays on one filesystem)\n    tmp, err := os.CreateTemp(dir, \"compact-*\")\n    if err != nil {\n        return err\n    }\n    defer os.Remove(tmp.Name()) // no-op after a successful rename\n    enc := json.NewEncoder(tmp)\n    for _, r := range records {\n        if err := enc.Encode(r); err != nil {\n            tmp.Close()\n            return err\n        }\n    }\n    if err := tmp.Sync(); err != nil { // durable on disk\n        tmp.Close()\n        return err\n    }\n    if err := tmp.Close(); err != nil {\n        return err\n    }\n\n    if err := os.Rename(tmp.Name(), l.path); err != nil { // atomic\n        return err\n    }\n    if err := syncDir(dir); err != nil { // make rename durable\n        return err\n    }\n\n    // Reopen with O_APPEND\n    f, err := os.OpenFile(l.path, os.O_RDWR|os.O_APPEND, 0o644)\n    if err != nil {\n        return err\n    }\n    l.f.Close()\n    l.f = f\n    return nil\n}\n\nfunc syncDir(dir string) error {\n    d, err := os.Open(dir)\n    if err != nil {\n        return err\n    }\n    defer d.Close()\n    return d.Sync()\n}\n\nfunc main() {\n    dir, _ := os.MkdirTemp(\"\", \"compact\")\n    defer os.RemoveAll(dir)\n    path := filepath.Join(dir, \"kv.log\")\n    os.WriteFile(path, []byte(\"{\\\"op\\\":\\\"set\\\",\\\"key\\\":\\\"a\\\"}\\n{\\\"op\\\":\\\"del\\\",\\\"key\\\":\\\"a\\\"}\\n{\\\"op\\\":\\\"set\\\",\\\"key\\\":\\\"b\\\"}\\n\"), 0o644)\n    f, _ := os.OpenFile(path, os.O_RDWR|os.O_APPEND, 0o644)\n    l := &Log{path: path, f: f}\n\n    fmt.Println(l.Compact([]Record{{Op: \"set\", Key: \"b\"}})) // <nil>\n    data, _ := os.ReadFile(path)\n    fmt.Print(string(data)) // only the live key is left\n}\n```\n\n### HTTP API and Graceful Shutdown\n\n**Routing (Go 1.22):**\n\nServeMux now supports method and path parameters:\n\n```go\nmux := http.NewServeMux()\n\n// GET /kv/{key}: read\nmux.HandleFunc(\"GET /kv/{key}\", func(w http.ResponseWriter, r *http.Request) {\n\tkey := r.PathValue(\"key\")\n\tfmt.Fprintln(w, \"read\", key) // look the key up in the db\n})\n\n// PUT /kv/{key}: write\nmux.HandleFunc(\"PUT /kv/{key}\", func(w http.ResponseWriter, r *http.Request) {\n\t// decode JSON body, then call db.Set\n\tfmt.Fprintln(w, \"write\", r.PathValue(\"key\"))\n})\n\n// DELETE /kv/{key}: delete\nmux.HandleFunc(\"DELETE /kv/{key}\", func(w http.ResponseWriter, r *http.Request) {\n\t// call db.Delete\n\tfmt.Fprintln(w, \"delete\", r.PathValue(\"key\"))\n})\n\nfor _, m := range []string{\"GET\", \"PUT\", \"DELETE\", \"PATCH\"} {\n\trec := httptest.NewRecorder()\n\tmux.ServeHTTP(rec, httptest.NewRequest(m, \"/kv/user:1\", nil))\n\tfmt.Print(m, \" \", rec.Code, \" \", rec.Body.String()) // PATCH gets 405\n}\n```\n\n**Request/Response:**\n\n```go\n// PUT request body\ntype putRequest struct {\n    Value string `json:\"value\"`\n    TTL   int64  `json:\"ttl,omitempty\"` // milliseconds, optional\n}\n\n// Success response\ntype putResp struct {\n    Key   string `json:\"key\"`\n    Value string `json:\"value\"`\n}\n\n// Error response\ntype errorResp struct {\n    Error string `json:\"error\"`\n}\n\nfunc put(w http.ResponseWriter, r *http.Request) {\n    var req putRequest\n    if err := json.NewDecoder(r.Body).Decode(&req); err != nil {\n        w.Header().Set(\"Content-Type\", \"application/json\")\n        w.WriteHeader(http.StatusBadRequest)\n        json.NewEncoder(w).Encode(errorResp{Error: \"invalid JSON\"})\n        return\n    }\n    // Set Content-Type and status, then Encode\n    w.Header().Set(\"Content-Type\", \"application/json\")\n    w.WriteHeader(http.StatusOK)\n    json.NewEncoder(w).Encode(putResp{Key: r.PathValue(\"key\"), Value: req.Value})\n}\n\nfunc main() {\n    mux := http.NewServeMux()\n    mux.HandleFunc(\"PUT /kv/{key}\", put)\n    for _, body := range []string{`{\"value\": \"alice\", \"ttl\": 5000}`, `{oops`} {\n        rec := httptest.NewRecorder()\n        mux.ServeHTTP(rec, httptest.NewRequest(\"PUT\", \"/kv/user:1\", strings.NewReader(body)))\n        fmt.Print(rec.Code, \" \", rec.Body.String())\n    }\n}\n```\n\nThis writes the status before encoding, which is fine for these small,\nalways-encodable structs. For arbitrary values, use module 08's\nencode-into-a-buffer-first pattern, so an encoding error can still become a\nclean 500.\n\n**Graceful Shutdown:**\n\nTurn signals into context cancellation in `main`, and keep everything else\nin a testable `run`:\n\n```go\nfunc main() {\n    // SIGTERM is what docker stop, Kubernetes and systemd send, not just Ctrl-C.\n    ctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)\n    defer stop()\n    // Demo only: pretend a SIGTERM arrives after 200ms, so this example ends.\n    ctx, cancel := context.WithTimeout(ctx, 200*time.Millisecond)\n    defer cancel()\n    if err := run(ctx, os.Args[1:], os.Stdout, os.Stderr); err != nil {\n        fmt.Fprintln(os.Stderr, \"kvd:\", err)\n        stop()\n        os.Exit(1) // only here: os.Exit skips deferred calls\n    }\n}\n\nfunc run(ctx context.Context, args []string, stdout, stderr io.Writer) error {\n    ln, err := net.Listen(\"tcp\", \"127.0.0.1:0\") // any free port\n    if err != nil {\n        return err\n    }\n    srv := &http.Server{Handler: http.NotFoundHandler(), ReadHeaderTimeout: 5 * time.Second}\n    fmt.Fprintln(stdout, \"listening on\", ln.Addr())\n\n    // After starting the server:\n    serveErr := make(chan error, 1)\n    go func() { serveErr <- srv.Serve(ln) }()\n\n    select {\n    case err := <-serveErr: // Serve failed by itself: don't wait for a signal forever\n        return fmt.Errorf(\"serve: %w\", err)\n    case <-ctx.Done(): // signal (or a test) asked us to stop\n    }\n\n    shutdownCtx, cancel := context.WithTimeout(context.Background(), 5*time.Second)\n    defer cancel()\n    if err := srv.Shutdown(shutdownCtx); err != nil { // stop accepting, drain in-flight requests\n        return fmt.Errorf(\"shutdown: %w\", err)\n    }\n    fmt.Fprintln(stdout, \"shut down cleanly\")\n    return nil\n}\n```\n\nNote that `Shutdown` gets a **fresh** context: `ctx` is already canceled at\nthis point, and passing it would abort the drain immediately. Milestone 3's\nREADME walks through the full `run`.\n\n**Structured Logging:**\n\nUse slog (Go 1.21+) for structured output:\n\n```go\nlogger := slog.New(slog.NewTextHandler(os.Stdout, &slog.HandlerOptions{\n    Level: slog.LevelInfo,\n}))\n\nlogger.Info(\"server started\", \"addr\", \"127.0.0.1:8080\")\n\nr := httptest.NewRequest(\"GET\", \"/kv/user:1\", nil)\nkey, err := \"user:1\", errors.New(\"disk read failed\")\nlogger.ErrorContext(r.Context(), \"get failed\", \"key\", key, \"error\", err)\n```\n\n---\n\n## Idioms & Best Practices\n\n### Channels and Goroutine Lifecycle\n\n- **Always stop a Ticker**: `defer t.Stop()` when creating a new Ticker.\n- **Context cancellation**: Pass `ctx` to goroutines and check `ctx.Done()` in loops.\n- **Goroutine leaks**: If a goroutine never returns, it's a leak. Test with `runtime.NumGoroutine()` or timeout-based checks.\n\n### Error Handling\n\n- **Sentinel errors**: Define package-level errors like `var ErrNotFound = errors.New(\"...\")` for specific conditions.\n- **Wrapping**: Use `fmt.Errorf(\"%w\", err)` to chain errors.\n- **Checking**: Use `errors.Is(err, ErrNotFound)` to check sentinel errors.\n\n### Concurrency\n\n- **RWMutex over Mutex**: Use RWMutex when you have many readers and few writers. Release the lock as soon as possible (don't hold it during expensive operations like sorting).\n- **Serializing writes**: Use a mutex to ensure writes (and reads that depend on consistency) are ordered.\n- **Race detector**: Always test with `-race` on concurrency-heavy code.\n\n### Slices and Maps\n\n- **nil vs. empty**: Return `nil` or an empty slice; both are valid. Don't mix them inconsistently.\n- **Preallocation**: If you know the size upfront, preallocate to avoid repeated allocations.\n- **Sorting**: Use `slices.Sort` (Go 1.21+) for simple types, `slices.SortFunc` for custom orders.\n\n---\n\n## Common Pitfalls\n\n1. **Not stopping Tickers**: before Go 1.23 an unstopped `time.Ticker` was never garbage-collected (a leak). Since 1.23 it is collected once unreferenced, but `defer t.Stop()` still documents exactly when the ticker's life ends. Write it anyway.\n2. **Holding locks too long**: Locks block readers. Release as soon as possible; sort/encode outside the lock if possible.\n3. **Ignoring torn writes**: If you don't truncate the log after a torn tail, subsequent Replays may read garbage.\n4. **Forgetting fsync**: If you don't fsync after writes, a power loss can lose data. fsync is slow but essential for durability.\n5. **Not fsyncing the directory**: After renaming a file, fsync the directory so the rename itself is durable (not just the file contents).\n6. **Calling `time.Now()` directly**: one stray `time.Now()` in `Get` or `DeleteExpired` bypasses the injected clock, and the TTL tests become flaky or wrong. Always call `s.now()`. (Deleting from a map *during* `range` over it is fine in Go; the spec allows it.)\n7. **Race conditions on maps**: Maps are not thread-safe. Always guard with a mutex, even if you think a single write is atomic.\n\n---\n\n## Exercises\n\nThe capstone has no separate exercises: the three milestones are the\nexercises. Each has its own README with the full spec and test command, and\nships complete working code for the earlier milestones under \"Provided for\nyou\", so you can start any of them independently.\n\n| Milestone | Spec | You implement | Test command |\n|---|---|---|---|\n| 1. In-memory store with TTL | `milestone1/README.md` | `store/store.go` | `go test -race ./modules/10-capstone/milestone1/...` |\n| 2. Append-only log & replay | `milestone2/README.md` | `store/log.go`, `store/db.go` | `go test -race ./modules/10-capstone/milestone2/...` |\n| 3. HTTP API & graceful shutdown | `milestone3/README.md` | `store/api.go`, `run` in `cmd/kvd/main.go` | `go test -race ./modules/10-capstone/milestone3/...` |\n\n## Project\n\nThe finished milestone 3 *is* the project: a runnable `kvd` server. When its\ntests pass, run it for real. Start it, `curl` a few keys, stop it with\n`kill` (SIGTERM), start it again, and check the keys are still there. The\ncommands are at the end of `milestone3/README.md`. Stretch goals (group\ncommit, the sharded store, metrics) are listed in each milestone's README.\n\n---\n\n## Submitting for Review\n\nWhen you complete all three milestones and tests pass with `-race`:\n\n```bash\ngo test ./modules/10-capstone/milestone1/... -race\ngo test ./modules/10-capstone/milestone2/... -race\ngo test ./modules/10-capstone/milestone3/... -race\n```\n\nAsk your instructor (Claude) to review `modules/10-capstone/`. They'll check:\n- Code compiles and passes tests (including `-race`).\n- TTL tests use a clock, not sleeps.\n- Serialization is correct (writes are ordered, compaction is atomic).\n- HTTP API works end-to-end.\n- Graceful shutdown on signal.\n\n---\n\n## Further Reading\n\n- **Effective Go**: https://go.dev/doc/effective_go\n- **Go Code Review Comments**: https://go.dev/wiki/CodeReviewComments\n- **net/http `Server.Shutdown`**: https://pkg.go.dev/net/http#Server.Shutdown\n- **`os/signal.NotifyContext`**: https://pkg.go.dev/os/signal#NotifyContext\n- **Concurrency patterns**: https://go.dev/blog/pipelines\n- **net/http**: https://pkg.go.dev/net/http\n- **log/slog**: https://pkg.go.dev/log/slog\n- **Context package**: https://pkg.go.dev/context\n- **Durability**: \"Designing Data-Intensive Applications\" by Martin Kleppmann (external reading).\n", "units": [{"kind": "milestone", "name": "milestone1", "dir": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone1", "doc": "", "readme": "# Milestone 1: In-Memory Store with TTL\n\n**Time budget:** \u2264 60 minutes\n\n## Overview\n\nImplement a concurrency-safe, in-memory key-value store with per-key time-to-live (TTL) expiry. Entries expire at an absolute instant; the store enforces expiry lazily (on read) and actively (via a background janitor goroutine).\n\n## Specification\n\n### API\n\n```go\n// The API of milestone1/store. Each assertion below checks YOUR signature:\n// this block stops compiling if one of them differs.\nimport \"gocourse/modules/10-capstone/milestone1/store\"\n\n// Store is a concurrency-safe in-memory key-value store.\n//\n//\ttype Store struct { /* your fields */ }\n\nvar (\n\t// Create a new store.\n\t_ func(opts ...store.Option) *store.Store = store.New\n\n\t// Set stores value under key, replacing any previous value and TTL.\n\t// If ttl > 0, the entry expires ttl after now; otherwise it never expires.\n\t_ func(s *store.Store, key, value string, ttl time.Duration) = (*store.Store).Set\n\n\t// Get returns the value stored under key.\n\t// It returns ErrNotFound if the key is absent or expired.\n\t_ func(s *store.Store, key string) (string, error) = (*store.Store).Get\n\n\t// Delete removes key and reports whether a live entry was removed.\n\t// An expired entry is removed, but Delete returns false.\n\t_ func(s *store.Store, key string) bool = (*store.Store).Delete\n\n\t// Keys returns the live (unexpired) keys in ascending order.\n\t// The returned slice is owned by the caller.\n\t_ func(s *store.Store) []string = (*store.Store).Keys\n\n\t// Len returns the number of live entries.\n\t_ func(s *store.Store) int = (*store.Store).Len\n\n\t// DeleteExpired removes every expired entry and returns how many.\n\t_ func(s *store.Store) int = (*store.Store).DeleteExpired\n\n\t// RunJanitor calls DeleteExpired every interval until ctx is canceled.\n\t// If interval <= 0, returns immediately (janitor disabled).\n\t_ func(s *store.Store, ctx context.Context, interval time.Duration) = (*store.Store).RunJanitor\n)\n\n// janitor runs one sweep per tick and returns when ctx is canceled.\n// Separating it from RunJanitor lets tests drive sweeps with a fake clock.\n// (Unexported, so it can't be checked from here:)\n//\n//\tfunc (s *Store) janitor(ctx context.Context, ticks <-chan time.Time)\n\nfunc main() {\n\ts := store.New()\n\ts.Set(\"lang\", \"go\", time.Minute)\n\tfmt.Println(s.Get(\"lang\")) // when you're done: go <nil>\n\tfmt.Println(s.Keys(), s.Len())\n}\n```\n\n### Behavior\n\n**TTL:**\n- Entries are expired at an absolute instant, calculated as `now + ttl`.\n- An entry whose expiry equals the current instant is expired (e.g., a 10-second TTL means \"gone at +10s\").\n- A TTL of 0 or negative means the entry never expires.\n\n**Expiry enforcement:**\n1. **Lazy**: When you call Get, Keys, Len, or Delete, they treat expired entries as absent.\n2. **Active**: RunJanitor starts a background goroutine that calls DeleteExpired every interval to reclaim memory.\n\n**Concurrency:**\n- All operations (Get, Set, Delete, Keys, Len, DeleteExpired) are safe for concurrent use.\n- Use sync.Mutex or sync.RWMutex to guard the items map.\n- The janitor runs in its own goroutine and must safely check the clock, even while the main thread advances a fake clock (see Testing).\n\n**Clock injection:**\n- The store reads \"now\" via a `func() time.Time` field.\n- By default, this is `time.Now`.\n- Tests can override it with `WithClock(fakeClockFunc)` to control time without sleeping.\n\n### Testing\n\nYou don't write tests for this milestone; they're provided. However, understand the test strategy:\n\n- **Fake clock**: Tests inject a controllable clock (see the test's `fakeClock` type). This lets you advance time instantly without sleeping.\n- **No sleeps**: The provided tests never call `time.Sleep`. They advance the clock and check state immediately.\n- **Janitor control**: Tests either:\n  - Call `RunJanitor` with a real ticker to verify it works.\n  - Call `janitor` directly with a manual channel to drive it tick-by-tick.\n- **Concurrency testing**: `TestConcurrentAccess` hammers the store from 8 goroutines while the janitor runs. It only detects bugs under `go test -race`.\n\n### Run the tests\n\n```bash\ncd /home/csmith/Workspace/tools/go-course\ngo test ./modules/10-capstone/milestone1/... -race\n```\n\nThe tests should **fail** until you implement the TODOs. When done, all tests pass with `-race`.\n\n---\n\n## Implementation Guide\n\n### Design Decisions\n\n**Why RWMutex?** The store has many readers (Get, Keys, Len) and fewer writers (Set, Delete, RunJanitor). RWMutex allows readers to run in parallel, only blocking on writes.\n\n**Why two-level expiry?** Lazy expiry means reads never stall waiting for cleanup. Active expiry reclaims memory so the store doesn't grow unbounded. Together, they're robust.\n\n**Why a janitor?** If entries were never cleaned up, the map would grow forever, even if every key had expired. The janitor removes stale entries periodically.\n\n**Why a separate janitor function?** Tests need to drive sweeps without waiting for a ticker. By separating `janitor(ctx, ticks)` from `RunJanitor(ctx, interval)`, tests can pass a channel they control.\n\n### Step-by-step\n\n1. **Implement `expired`**: Check if an entry is expired at a given instant.\n   ```go\n   type entry struct {\n   \tvalue     string\n   \texpiresAt time.Time // zero = never expires\n   }\n\n   func (e entry) expired(now time.Time) bool {\n   \t// An entry with a zero expiresAt never expires.\n   \t// Otherwise, it's expired if now >= expiresAt, i.e. if now is NOT before it.\n   \treturn !e.expiresAt.IsZero() && !now.Before(e.expiresAt)\n   }\n\n   now := time.Date(2026, 1, 1, 12, 0, 0, 0, time.UTC)\n   fmt.Println(entry{}.expired(now))                                // false: never expires\n   fmt.Println(entry{expiresAt: now}.expired(now))                  // true: expiry is inclusive\n   fmt.Println(entry{expiresAt: now.Add(time.Second)}.expired(now)) // false\n   ```\n\n2. **Implement `Set`**:\n   - Lock the mutex (write lock or full lock).\n   - Calculate `expiresAt` as `now().Add(ttl)` if ttl > 0, otherwise zero.\n   - Store the entry.\n\n3. **Implement `Get`**:\n   - Read-lock the mutex.\n   - Fetch the entry; if absent or expired, return ErrNotFound.\n   - Otherwise, return the value.\n\n4. **Implement `Delete`**:\n   - Lock the mutex.\n   - Fetch the entry; if absent, return false.\n   - Delete it; return true if it was not expired, false if it was already expired.\n\n5. **Implement `Keys`**:\n   - Read-lock, collect live keys into a slice.\n   - Release the lock.\n   - Sort the slice *outside* the lock.\n   - Return it.\n\n6. **Implement `Len`**:\n   - Read-lock the mutex.\n   - Count live entries.\n   - Release and return.\n\n7. **Implement `DeleteExpired`**:\n   - Lock the mutex (write lock or full lock).\n   - Iterate the map, delete expired entries, count them.\n   - Release and return the count.\n\n8. **Implement `RunJanitor`**:\n   - If `interval <= 0`, return immediately (janitor disabled).\n   - Create a time.Ticker.\n   - Defer `t.Stop()` to clean up (crucial!).\n   - Call `janitor(ctx, t.C)`.\n\n9. **Implement `janitor`**:\n   - Loop forever.\n   - Select on `ctx.Done()` and `ticks`.\n   - When ctx is canceled, return.\n   - When a tick arrives, call `DeleteExpired()`.\n\n---\n\n## Common Mistakes\n\n1. **Forgetting to Stop the Ticker**: A stopped Ticker can still deliver ticks. Forgetting `defer t.Stop()` causes goroutine leaks.\n\n2. **Holding the lock too long**: Don't hold the lock while sorting or doing expensive work. Read the data, release the lock, then process.\n\n3. **Not handling the zero time**: A zero `time.Time` means \"never expires\". Check with `IsZero()`, not `== time.Time{}`.\n\n4. **Confusing before and after**: Expiry at time T means the entry is gone at T, not after. So `now.Before(expiresAt)` is alive, `!now.Before(expiresAt)` is expired.\n\n5. **Race conditions on the clock**: Tests advance the clock while the janitor reads it. Make sure your clock function is thread-safe (tests provide a safe one).\n\n6. **Leaking goroutines**: If janitor doesn't return when ctx is canceled, the test will hang. Always check `ctx.Done()` in the select loop.\n\n---\n\n## Rubric (for instructor review)\n\nWhen reviewing a student's solution, check:\n\n- \u2713 All functions compile and tests pass with `-race`.\n- \u2713 `expired()` correctly handles zero and non-zero times.\n- \u2713 `Set` and `Get` handle TTL correctly (entries expire at the right instant).\n- \u2713 `Keys` returns a sorted slice and doesn't corrupt the map when values are mutated externally.\n- \u2713 `DeleteExpired` is called by janitor and removes stale entries.\n- \u2713 `RunJanitor` stops the ticker and returns when ctx is canceled.\n- \u2713 Janitor doesn't leak goroutines (no hanging on cancellation).\n- \u2713 `-race` detector finds no issues under `TestConcurrentAccess`.\n- \u2713 No sleeps in the code (real clock only in `time.Now`).\n\n---\n\n## Stretch Goals (Optional)\n\n1. **Measure lock contention.** Write a benchmark with `b.RunParallel` doing\n   90% `Get` / 10% `Set` over 1024 keys, and run it with `-cpu=1,4,8`. Does\n   ns/op go *up* as you add cores? That is lock contention.\n2. **Shard the store.** Build a `ShardedStore` with N independently locked\n   maps, picking the shard by hashing the key. Write a differential test\n   that runs the same operations on `Store` and `ShardedStore` and compares\n   results. Then re-run the benchmark: when does sharding win, and when does\n   it lose? (Hint: try `-cpu=1`.)\n3. **Make `Keys` cheaper.** Can it avoid holding the lock while sorting?\n   Measure with `-benchmem`.\n\nAfter your attempt, compare with `solutions/10-capstone/milestone1/store/fast.go`\nand the measured numbers in the instructor's review.\n", "files": [{"name": "README.md", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone1/README.md"}, {"name": "store/store.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone1/store/store.go"}, {"name": "store/store_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone1/store/store_test.go"}], "cmd": "go test -race ./modules/10-capstone/milestone1/...", "id": "modules/10-capstone/milestone1"}, {"kind": "milestone", "name": "milestone2", "dir": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone2", "doc": "", "readme": "# Milestone 2: Persistence via Append-Only Log\n\n**Time budget:** \u2264 60 minutes\n\n> **Provided for you:** `store/memory.go` is a complete reference implementation of Milestone 1 (with `SetExpiresAt`/`Items` helpers added for replay), so this milestone is independent of your M1 code. You implement `store/log.go` and `store/db.go`. Feel free to swap in your own M1 store instead.\n\n## Overview\n\nMake the store durable: every mutation (Set or Delete) is appended to an append-only log before it is applied in memory. On startup, the log is replayed to rebuild the exact state. Handle crashes gracefully (torn writes, recovery). Optionally, compact the log to shrink it.\n\n## Specification\n\n### API\n\nThis milestone extends Milestone 1's Store with two new methods and introduces Log and DB.\n\n```go\n// The API of milestone2/store. Each assertion below checks YOUR signature:\n// this block stops compiling if one of them differs.\nimport \"gocourse/modules/10-capstone/milestone2/store\"\n\nvar (\n\t// Store additions (from Milestone 1)\n\n\t// SetExpiresAt stores value under key with an absolute expiry time.\n\t// A zero expiresAt means the entry never expires.\n\t// An expiresAt in the past stores an already-expired entry (reads treat as absent).\n\t//\n\t// Persistence needs this: a TTL is relative to \"now\", but the log records\n\t// the absolute expiry so a restart doesn't extend the key's life.\n\t_ func(s *store.Store, key, value string, expiresAt time.Time) = (*store.Store).SetExpiresAt\n\n\t// Items returns a snapshot of every live entry, sorted by key.\n\t// Each Item has Key, Value, and ExpiresAt (zero = never expires).\n\t_ func(s *store.Store) []store.Item = (*store.Store).Items\n\n\t// Log is an append-only file of Records.\n\n\t// OpenLog opens the log file at path, creating if necessary.\n\t// If syncWrites is true, every Append fsyncs (survives power loss).\n\t// Call Replay before the first Append.\n\t_ func(path string, syncWrites bool) (*store.Log, error) = store.OpenLog\n\n\t// Append writes r to the end of the log.\n\t_ func(l *store.Log, r store.Record) error = (*store.Log).Append\n\n\t// Replay reads the log from the beginning, calling fn for each record.\n\t// Handles torn final records (incomplete write from a crash).\n\t_ func(l *store.Log, fn func(store.Record) error) error = (*store.Log).Replay\n\n\t// Compact atomically replaces the log with a snapshot of the given records.\n\t// Removes deleted, overwritten, and expired entries from disk.\n\t_ func(l *store.Log, records []store.Record) error = (*store.Log).Compact\n\n\t// Close closes the log file.\n\t_ func(l *store.Log) error = (*store.Log).Close\n\n\t// DB is a durable key-value store (wraps Store + Log).\n\n\t// Open opens the database at path, replaying the log to rebuild state.\n\t_ func(path string, opts store.Options) (*store.DB, error) = store.Open\n\n\t// Get, Keys, Delete, RunJanitor same as Store.\n\n\t// Set durably stores value under key. TTL is relative to now;\n\t// it's persisted as an absolute time.\n\t_ func(db *store.DB, key, value string, ttl time.Duration) error = (*store.DB).Set\n\n\t// Delete durably removes key. Returns false if the key was absent.\n\t_ func(db *store.DB, key string) (bool, error) = (*store.DB).Delete\n\n\t// Compact rewrites the log with one \"set\" record per live key.\n\t_ func(db *store.DB) error = (*store.DB).Compact\n\n\t// Close closes the log.\n\t_ func(db *store.DB) error = (*store.DB).Close\n)\n\n// The data types, already declared in the starter:\nvar (\n\t_ = store.Item{Key: \"k\", Value: \"v\", ExpiresAt: time.Time{}}\n\t_ = store.Record{\n\t\tOp:        store.OpSet, // or store.OpDelete\n\t\tKey:       \"k\",\n\t\tValue:     \"v\", // only for \"set\"\n\t\tExpiresAt: 0,   // Unix nanoseconds; 0 = never expires\n\t}\n\t_ = store.Options{\n\t\tNow:  nil,   // nil means time.Now\n\t\tSync: false, // fsync after every write?\n\t}\n)\n\nfunc main() {\n\tdir, _ := os.MkdirTemp(\"\", \"kvdb\")\n\tdefer os.RemoveAll(dir)\n\tdb, err := store.Open(filepath.Join(dir, \"kv.log\"), store.Options{})\n\tif err != nil {\n\t\tfmt.Println(\"Open:\", err)\n\t\treturn\n\t}\n\tdefer db.Close()\n\tfmt.Println(db.Set(\"lang\", \"go\", 0)) // when you're done: <nil>\n\tfmt.Println(db.Get(\"lang\"))          // go <nil>\n}\n```\n\n### Behavior\n\n**Write-Ahead Logging (WAL):**\n- Every write (Set or Delete) is appended to the log before it's applied in memory.\n- If the append succeeds, the write is durable.\n- If the append fails, the in-memory state is unchanged and the error is reported.\n\n**Replay:**\n- On Open, the log is replayed by calling a callback for each record.\n- The callback applies each record to the in-memory Store.\n\n**Torn Writes:**\n- If the process dies mid-write, the last line may lack a terminating `\\n`.\n- Replay detects this (EOF before `\\n`) and truncates the file, discarding the incomplete record.\n- The incomplete record was never acknowledged to the caller, so losing it is safe.\n\n**Compaction:**\n- Compact takes a snapshot of live items, writes them to a temp file, fsyncs, renames atomically over the log, and fsyncs the directory.\n- A crash at any point leaves either the complete old log or the complete new one, never a mixture.\n\n**Concurrency:**\n- All operations are safe for concurrent use.\n- Writes (Set, Delete, Compact) are serialized via a mutex so the log order is deterministic.\n- Reads (Get, Keys) are served from the in-memory Store and don't touch the disk.\n\n### Testing\n\n```bash\ncd /home/csmith/Workspace/tools/go-course\ngo test ./modules/10-capstone/milestone2/... -race\n```\n\nThe test files are provided (db_test.go, log_test.go). They verify:\n- Opening and replaying a log.\n- Handling torn writes (truncation on recovery).\n- Compaction shrinking the log.\n- Durability: data survives a process restart.\n- Concurrency and `-race` safety.\n\n---\n\n## Implementation Guide\n\n### Design: Store Modifications\n\nThe starter Store is your Milestone 1 solution. Add:\n\n1. **SetExpiresAt**: Like Set, but takes an absolute `expiresAt` time instead of a duration.\n\n2. **Items**: Return a slice of Item (struct with Key, Value, ExpiresAt), filtered to live entries, sorted by key.\n\n### Design: Log\n\nRecords are stored as **JSON Lines** (one JSON object per line):\n\n```json\n{\"op\":\"set\",\"key\":\"user:1\",\"value\":\"alice\",\"exp\":1735787045000000000}\n{\"op\":\"set\",\"key\":\"user:2\",\"value\":\"bob\",\"exp\":0}\n{\"op\":\"del\",\"key\":\"user:1\"}\n```\n\n**Encoding/Decoding:**\n- Use `encoding/json` to marshal/unmarshal Record.\n- Append a `\\n` after each record (the line terminator).\n- Strip the `\\n` when parsing.\n\n**OpenLog:**\n- Use `os.OpenFile(path, os.O_RDWR|os.O_CREATE|os.O_APPEND, 0o600)` to open for reading and appending.\n- The O_APPEND flag ensures the kernel positions every write at the end, regardless of the read offset.\n\n**Append:**\n- Encode the record to JSON, append a newline, and write in one operation.\n- If `l.sync` is true, call `f.Sync()` to ensure the write reaches disk.\n- Errors in writing or syncing should be wrapped and returned.\n\n**Replay:**\n- Seek to the beginning of the file.\n- Use `bufio.Reader` and `ReadBytes('\\n')` to read lines.\n- If EOF is reached with unread data, that's a torn record: truncate the file to the last complete line.\n- For each complete line, decode and call the provided callback.\n- If decoding fails, return an error wrapping ErrCorrupt.\n\n**Compact:**\n- Write records to a temp file in the same directory (use `os.CreateTemp`).\n- Fsync the temp file.\n- Close the temp file.\n- Rename the temp file over the old log (atomic, but not durable yet).\n- Fsync the directory to make the rename durable.\n- Reopen the log with O_APPEND (your old file descriptor points to the unlinked inode; writes would be lost).\n\n### Design: DB\n\nThe DB wraps a Store and a Log:\n\n1. **Open**: Creates a Log, replays it into a new Store, and returns the DB.\n\n2. **apply**: Called by Replay for each record. Updates the Store based on the operation.\n\n3. **Set**: Lock, write to log, unlock, apply in memory. If the log write fails, don't apply.\n\n4. **Delete**: Lock, check if the key is live, write to log if it is, unlock, apply in memory. If the key is absent, don't write to the log.\n\n5. **Compact**: Lock, take a snapshot (Items), write it to the log via Compact, unlock.\n\n**Time conversions:**\n- `toUnixNano(t time.Time) int64`: Converts an absolute time to Unix nanoseconds (used for storage).\n- `fromUnixNano(n int64) time.Time`: Converts back.\n- A zero time (never expires) is stored as 0 and converted back to zero.\n\n---\n\n## Common Mistakes\n\n1. **Forgetting to fsync**: If you don't fsync after a write, a power loss can lose data. Even worse, a `Sync() bool` flag that's ignored.\n\n2. **Not truncating torn records**: If you don't truncate the file after detecting a torn tail, subsequent Replays will read garbage.\n\n3. **Not reopening the log after Compact**: After renaming the temp file, your old file descriptor points to the now-unlinked inode. Writes go nowhere. You must reopen with O_APPEND.\n\n4. **Not fsyncing the directory**: After renaming a file, fsync the directory so the rename itself is durable, not just the file contents.\n\n5. **Deleting during replay**: If Delete is called during Replay, it must not write to the log (you're replaying, not accepting new writes). Let the DB's apply method call SetExpiresAt directly, not Set.\n\n6. **Not serializing writes**: If two goroutines call Set concurrently, they might interleave their log writes, corrupting the order. Use a mutex around log operations.\n\n7. **Panic on encode errors**: If JSON encoding fails (very rare but possible), handle it gracefully; don't panic.\n\n---\n\n## Optimization Notes\n\n- **Batch compactions**: If the log grows large, consider compacting after N deletions or M log lines. (Not required for this milestone, but good to know.)\n- **Incremental log**: Instead of rewriting the entire log on every Compact, you could append a \"checkpoint\" record. (Advanced; not required.)\n\n## Stretch Goals (Optional)\n\n1. **Measure the cost of durability.** Write `BenchmarkAppend` with two\n   sub-benchmarks, `OpenLog(path, false)` and `OpenLog(path, true)`, using\n   `b.TempDir()`. How many times slower is an fsynced append on your\n   machine? What does that mean for how many writes per second `kvd` can\n   acknowledge?\n2. **Group commit.** Let concurrent `Append` calls share one `fsync`: writers\n   enqueue their record and wait; a single goroutine writes everything\n   queued, fsyncs once, then wakes all the writers. Prove it keeps the\n   durability guarantee with a test, and measure the throughput with\n   `b.RunParallel`.\n3. **Auto-compaction.** Compact automatically when the log has more than\n   twice as many records as there are live keys.\n\n---\n\n## Rubric (for instructor review)\n\nWhen reviewing a student's solution, check:\n\n- \u2713 All functions compile and tests pass with `-race`.\n- \u2713 `Open` replays the log correctly into a fresh Store.\n- \u2713 `Set` and `Delete` write to the log before applying in memory.\n- \u2713 Torn writes are detected and the log is truncated.\n- \u2713 `Compact` writes to a temp file, fsyncs, renames, and fsyncs the directory.\n- \u2713 After `Compact`, the log is reopened with O_APPEND (new writes go to the new file).\n- \u2713 Data survives a process restart (Open replays correctly).\n- \u2713 Writes are serialized; the log order is deterministic.\n- \u2713 `-race` detector finds no issues.\n- \u2713 No sleeps in the code.\n\n---\n\n## Advanced: Fsync Semantics\n\n(Optional deeper dive)\n\n**What does fsync actually do?**\n- `fsync()` flushes the file's dirty pages to stable storage (usually the SSD's NAND or HDD's platter).\n- Without fsync, the OS buffer cache might hold data for seconds before writing.\n- A power loss before fsync = data loss.\n\n**Durability guarantees:**\n- After `f.Write()` + `f.Sync()` returns nil, the data is on disk.\n- After `os.Rename()` (atomic at the filesystem level), the rename is in the journal, but not persisted.\n- After `dir.Sync()`, the rename is on disk.\n\n**Why Compact fsyncs the temp file before renaming:**\n- If the process dies during the rename, we're safe.\n- The old log is still there (rename is atomic but not yet durable).\n- On recovery, we see the old log and replay it (losing the compaction).\n- The temp file is lost (fsync'd but never renamed), so no data loss.\n\n**Why Compact fsyncs the directory:**\n- If the process dies after the rename, we're safe.\n- The new log is on disk.\n- On recovery, we see the new (compacted) log and replay it.\n\n---\n\n## Next Steps\n\nWhen all tests pass, you're ready for **Milestone 3: HTTP API**.\n", "files": [{"name": "README.md", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone2/README.md"}, {"name": "store/db.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone2/store/db.go"}, {"name": "store/db_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone2/store/db_test.go"}, {"name": "store/log.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone2/store/log.go"}, {"name": "store/log_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone2/store/log_test.go"}, {"name": "store/memory.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone2/store/memory.go"}], "cmd": "go test -race ./modules/10-capstone/milestone2/...", "id": "modules/10-capstone/milestone2"}, {"kind": "milestone", "name": "milestone3", "dir": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone3", "doc": "", "readme": "# Milestone 3: HTTP API & Graceful Shutdown\n\n**Time budget:** \u2264 60 minutes\n\n> **Provided for you:** `store/memory.go`, `store/log.go` and `store/db.go` are complete reference implementations of Milestones 1\u20132, so this milestone is independent of your earlier code. You implement `store/api.go` and `cmd/kvd/main.go`. Feel free to swap in your own M1/M2 code instead.\n\n## Overview\n\nBuild a complete, runnable service: an HTTP API wrapping the durable store from Milestone 2, with structured logging and graceful shutdown. Implement three endpoints (GET /kv/{key}, PUT /kv/{key}, DELETE /kv/{key}), start a server in main, and handle SIGINT/SIGTERM cleanly.\n\n## Specification\n\n### HTTP API\n\nThree endpoints:\n\n**GET /kv/{key}**\n- Returns the value associated with key.\n- Status 200: `{\"value\":\"...\"}` (success).\n- Status 404: `{\"error\":\"key not found\"}` (key missing or expired).\n- Status 400: `{\"error\":\"...\"}` (invalid request, e.g., empty key).\n- Status 500: `{\"error\":\"database error\"}` (internal error).\n\n**PUT /kv/{key}**\n- Sets the value associated with key.\n- Request body: `{\"value\":\"...\",\"ttl\":5000}` (ttl in milliseconds, optional).\n- Status 200: `{\"key\":\"...\",\"value\":\"...\"}` (success).\n- Status 400: `{\"error\":\"...\"}` (invalid request body or empty key).\n- Status 500: `{\"error\":\"database error\"}` (database error).\n\n**DELETE /kv/{key}**\n- Deletes the key.\n- Status 200: `{\"key\":\"...\"}` (success; key was live).\n- Status 404: `{\"error\":\"key not found\"}` (key missing or already expired).\n- Status 400: `{\"error\":\"...\"}` (invalid request, e.g., empty key).\n- Status 500: `{\"error\":\"database error\"}` (internal error).\n\n### Server\n\n```go\n// The API of milestone3/store/api.go, checked against YOUR code.\nimport \"gocourse/modules/10-capstone/milestone3/store\"\n\n// Server wraps a DB and provides HTTP handlers.\n//\n//\ttype Server struct {\n//\t\tdb *DB\n//\t\tlg *slog.Logger\n//\t}\n\nvar (\n\t// NewServer creates a Server.\n\t_ func(db *store.DB, lg *slog.Logger) *store.Server = store.NewServer\n\n\t// Register registers the server's routes on the given mux.\n\t_ func(s *store.Server, mux *http.ServeMux) = (*store.Server).Register\n)\n\nfunc main() {\n\tfmt.Println(\"the Server API compiles\")\n}\n```\n\n### Main Program\n\nA runnable server in `cmd/kvd/main.go`:\n\n```bash\nkvd -addr 127.0.0.1:8080 -db /path/to/kvd.log\n```\n\n**Behavior:**\n1. Parse `-addr` (listen address, default 127.0.0.1:8080) and `-db` (log path, default kvd.log).\n2. Open the database at `-db`.\n3. Start the janitor to clean up expired keys every minute.\n4. Create an HTTP server with the store's routes.\n5. Listen and serve on `-addr`.\n6. On SIGINT or SIGTERM, gracefully shutdown: stop accepting new requests, wait for in-flight requests, close the database.\n7. Log all operations and errors with slog.\n\n`main` itself stays tiny: it sets up signal handling and calls\n`run(ctx, args, stdout, stderr) error`, the testable-main pattern from\nmodule 00 (section 6). `cmd/kvd/main_test.go` starts `run` on a random port, talks to it\nover real HTTP, cancels its context (exactly what a signal does), and starts it\nagain on the same log file to prove the data survived.\n\n### Testing\n\n```bash\n# from the course root\ngo test -race ./modules/10-capstone/milestone3/...\ngo test -race ./modules/10-capstone/milestone3/cmd/kvd/   # just the program\n```\n\nTests verify:\n- GET/PUT/DELETE endpoints work end-to-end.\n- TTL expiry works (with a fake clock).\n- Error responses (404, 400, 500) are correct.\n- The program starts, serves, shuts down cleanly on cancellation, and data persists across a restart (`cmd/kvd`).\n- Status codes and JSON formatting.\n\n---\n\n## Implementation Guide\n\n### Part 1: Server (store/api.go)\n\nImplement the Server struct and its methods:\n\n1. **NewServer**: Store the DB and logger.\n\n2. **Register**: Use `mux.HandleFunc` to wire up three handlers:\n   ```go\n   type Server struct{}\n\n   func (s *Server) get(w http.ResponseWriter, r *http.Request)    { fmt.Fprintln(w, \"get\", r.PathValue(\"key\")) }\n   func (s *Server) put(w http.ResponseWriter, r *http.Request)    { fmt.Fprintln(w, \"put\", r.PathValue(\"key\")) }\n   func (s *Server) delete(w http.ResponseWriter, r *http.Request) { fmt.Fprintln(w, \"delete\", r.PathValue(\"key\")) }\n\n   func (s *Server) Register(mux *http.ServeMux) {\n   \tmux.HandleFunc(\"GET /kv/{key}\", s.get)\n   \tmux.HandleFunc(\"PUT /kv/{key}\", s.put)\n   \tmux.HandleFunc(\"DELETE /kv/{key}\", s.delete)\n   }\n\n   func main() {\n   \tmux := http.NewServeMux()\n   \t(&Server{}).Register(mux)\n   \tfor _, m := range []string{\"GET\", \"PUT\", \"DELETE\", \"POST\"} {\n   \t\trec := httptest.NewRecorder()\n   \t\tmux.ServeHTTP(rec, httptest.NewRequest(m, \"/kv/user:1\", nil))\n   \t\tfmt.Print(m, \" -> \", rec.Code, \" \", rec.Body.String()) // POST gets 405\n   \t}\n   }\n   ```\n\n3. **writeJSON**: A helper that sets Content-Type, status, and encodes JSON. All responses use this.\n\n4. **get**:\n   - Extract key via `r.PathValue(\"key\")`.\n   - If key is empty, return 400.\n   - Call `db.Get(key)`.\n   - If ErrNotFound, return 404 with an error message.\n   - If error, return 500.\n   - If success, return 200 with the value.\n   - Log the request with key, status, and any error.\n\n5. **put**:\n   - Extract key via `r.PathValue(\"key\")`.\n   - If key is empty, return 400.\n   - Decode the JSON body into putRequest (error on invalid JSON = 400).\n   - Convert TTL from milliseconds to time.Duration (0 if omitted or \u2264 0).\n   - Call `db.Set(key, value, ttl)`.\n   - If error, return 500.\n   - If success, return 200 with key and value.\n   - Log the request.\n\n6. **delete**:\n   - Extract key via `r.PathValue(\"key\")`.\n   - If key is empty, return 400.\n   - Call `db.Delete(key)`.\n   - If error, return 500.\n   - If ok is false (key was absent), return 404.\n   - If ok is true, return 200 with the key.\n   - Log the request.\n\n**Request/Response types:**\n```go\ntype putRequest struct {\n    Value string `json:\"value\"`\n    TTL   int64  `json:\"ttl,omitempty\"`  // milliseconds\n}\n\ntype errorResp struct {\n    Error string `json:\"error\"`\n}\n\nvar req putRequest\nerr := json.Unmarshal([]byte(`{\"value\":\"alice\",\"ttl\":5000}`), &req)\nfmt.Printf(\"%+v %v\\n\", req, err) // {Value:alice TTL:5000} <nil>\nout, _ := json.Marshal(errorResp{Error: \"key not found\"})\nfmt.Println(string(out)) // {\"error\":\"key not found\"}\n```\n\n**Logging:**\nUse `logger.InfoContext(r.Context(), \"event\", \"key\", key, \"status\", status)` for info-level logs and `logger.ErrorContext` for errors. This gives you request context and structured fields.\n\n### Part 2: Main Program (cmd/kvd/main.go)\n\n`main` is provided. You write `run`:\n\n```go\n// The signature main expects:\nfunc run(ctx context.Context, args []string, stdout, stderr io.Writer) error {\n\tfs := flag.NewFlagSet(\"kvd\", flag.ContinueOnError)\n\tfs.SetOutput(stderr)\n\taddr := fs.String(\"addr\", \"127.0.0.1:8080\", \"listen address\")\n\tdbPath := fs.String(\"db\", \"kvd.log\", \"database file\")\n\tif err := fs.Parse(args); err != nil {\n\t\treturn err\n\t}\n\tfmt.Fprintln(stdout, \"would serve\", *addr, \"from\", *dbPath) // ...the rest is yours\n\treturn nil\n}\n\nfunc main() {\n\tfmt.Println(run(context.Background(), []string{\"-addr\", \"127.0.0.1:0\"}, os.Stdout, os.Stderr))\n\tfmt.Println(run(context.Background(), []string{\"-port\", \"1\"}, os.Stdout, os.Stdout)) // a parse error, returned\n}\n```\n\n1. **Parse flags** with `flag.NewFlagSet(\"kvd\", flag.ContinueOnError)` and\n   `fs.SetOutput(stderr)`: `-addr` (default `127.0.0.1:8080`) and `-db`\n   (default `kvd.log`). Return the parse error; don't call `os.Exit` in `run`.\n\n2. **Create the logger** writing to `stdout`:\n   `slog.New(slog.NewTextHandler(stdout, nil))`.\n\n3. **Open the database** with `store.Open(dbPath, store.Options{})`, and\n   close it on **every** return path. Report the error from `Close`: for a\n   log file it can be the only sign that data never reached the disk.\n   ```go\n   type fakeDB struct{}\n\n   func (fakeDB) Close() error { return errors.New(\"sync: input/output error\") }\n\n   func run() (err error) { // a named result, so the deferred func can change it\n   \tdb := fakeDB{}\n   \tdefer func() {\n   \t\tif cerr := db.Close(); cerr != nil {\n   \t\t\terr = errors.Join(err, fmt.Errorf(\"close database: %w\", cerr))\n   \t\t}\n   \t}()\n   \treturn nil // everything else went fine...\n   }\n\n   func main() {\n   \tfmt.Println(run()) // ...but Close failed, and the caller hears about it\n   }\n   ```\n   (This needs a named result: `(err error)`.)\n\n4. **Listen** with `net.Listen(\"tcp\", addr)`. Log `\"server started\"` with\n   `\"addr\", ln.Addr().String()`. With `-addr 127.0.0.1:0` the OS picks the\n   port, and the tests read it from this line.\n\n5. **Start the janitor** in a goroutine with a context derived from `ctx`.\n   Before closing the database, cancel it and **wait** for the goroutine to\n   return (a `done` channel), so nothing touches the DB after `Close`.\n\n6. **Create the server** and register the routes:\n   ```go\n   // Uses YOUR milestone3 store.\n   import \"gocourse/modules/10-capstone/milestone3/store\"\n\n   func main() {\n   \tdir, _ := os.MkdirTemp(\"\", \"kvd\")\n   \tdefer os.RemoveAll(dir)\n   \tdb, err := store.Open(filepath.Join(dir, \"kvd.log\"), store.Options{})\n   \tif err != nil {\n   \t\tfmt.Println(err)\n   \t\treturn\n   \t}\n   \tdefer db.Close()\n   \tlogger := slog.New(slog.NewTextHandler(os.Stdout, nil))\n\n   \tmux := http.NewServeMux()\n   \tstore.NewServer(db, logger).Register(mux)\n   \tsrv := &http.Server{Handler: mux, ReadHeaderTimeout: 5 * time.Second}\n\n   \t// Try the handler without a network:\n   \trec := httptest.NewRecorder()\n   \tsrv.Handler.ServeHTTP(rec, httptest.NewRequest(\"PUT\", \"/kv/lang\", strings.NewReader(`{\"value\":\"go\"}`)))\n   \tfmt.Println(rec.Code, rec.Body.String()) // when you're done: 200 {\"key\":\"lang\",\"value\":\"go\"}\n   }\n   ```\n   `ReadHeaderTimeout` stops a client from holding a connection open forever\n   by sending headers one byte at a time (the \"Slowloris\" attack).\n\n7. **Serve in a goroutine and wait for either outcome**:\n   ```go\n   func serve(ctx context.Context, srv *http.Server, ln net.Listener) error {\n   \tserveErr := make(chan error, 1)\n   \tgo func() { serveErr <- srv.Serve(ln) }()\n   \tselect {\n   \tcase err := <-serveErr:\n   \t\treturn fmt.Errorf(\"serve: %w\", err) // failed on its own\n   \tcase <-ctx.Done():\n   \t}\n   \tshutdownCtx, cancel := context.WithTimeout(context.Background(), 5*time.Second)\n   \tdefer cancel()\n   \tsrv.Shutdown(shutdownCtx)\n   \treturn <-serveErr // http.ErrServerClosed after a clean shutdown\n   }\n\n   func main() {\n   \tln, _ := net.Listen(\"tcp\", \"127.0.0.1:0\")\n   \tctx, cancel := context.WithTimeout(context.Background(), 100*time.Millisecond) // \"a signal\"\n   \tdefer cancel()\n   \tfmt.Println(serve(ctx, &http.Server{}, ln)) // http: Server closed\n\n   \tln.Close() // a listener that's already closed: Serve fails at once\n   \tfmt.Println(serve(context.Background(), &http.Server{}, ln)) // serve: ... use of closed network connection\n   }\n   ```\n   Waiting only on `<-ctx.Done()` would hang forever if `Serve` failed.\n\n8. **Shut down gracefully**: log `\"shutting down\"`, call `srv.Shutdown` with\n   a 5-second timeout, then check that `<-serveErr` is\n   `http.ErrServerClosed` (use `errors.Is`), and log `\"shutdown complete\"`.\n\n9. **Signals** are `main`'s job: `signal.NotifyContext(ctx, os.Interrupt,\n   syscall.SIGTERM)`. `SIGTERM` is what `docker stop`, Kubernetes and systemd\n   send. Handling only Ctrl-C (`os.Interrupt`) is a classic production bug.\n\nTry it by hand (or in the container: `docker compose -f modules/10-capstone/compose.yaml --profile app up kvd`,\nthen `docker compose ... stop kvd` sends the SIGTERM):\n\n```bash\ngo run ./modules/10-capstone/milestone3/cmd/kvd -db /tmp/kvd.log &\ncurl -X PUT -d '{\"value\":\"hello\"}' localhost:8080/kv/greeting\nkill %1                      # SIGTERM: watch the shutdown log lines\ngo run ./modules/10-capstone/milestone3/cmd/kvd -db /tmp/kvd.log &\ncurl localhost:8080/kv/greeting   # still there\nkill %1\n```\n\n---\n\n## Common Mistakes\n\n1. **Not extracting path parameters**: Use `r.PathValue(\"key\")`, not r.URL.Path parsing.\n\n2. **Not handling TTL conversion**: TTL in the request is milliseconds; convert to time.Duration.\n\n3. **Not closing the listener gracefully**: Use `httpServer.Shutdown`, not just close.\n\n4. **Losing `db.Close()` on error paths**: `os.Exit` skips deferred calls, so a `defer db.Close()` in a `main` that later calls `os.Exit(1)` never runs. Keep `os.Exit` out of `run`, and return errors instead.\n\n5. **Not logging with context**: Use `InfoContext`/`ErrorContext` to include request tracing.\n\n6. **Ignoring JSON decoding errors**: Empty request body, malformed JSON, and type mismatches should return 400.\n\n7. **Not handling ErrClosed**: If the database is closed, operations return ErrClosed. Return 500 with a clear message.\n\n8. **Forgetting to start the janitor**: Without it, expired keys never go away. Start it early and pass the shutdown context.\n\n9. **Hardcoding localhost**: Use the `-addr` flag; don't assume 127.0.0.1:8080.\n\n---\n\n## Performance Notes\n\n- **No middleware overhead**: This is a simple server; if you add middleware (timing, tracing, etc.), measure the impact.\n- **Graceful shutdown timeout**: 5 seconds is reasonable for small deployments; tune based on your max expected request latency.\n- **Janitor interval**: Every minute is fine for small datasets. For millions of keys, consider more frequent cleanup.\n\n---\n\n## Rubric (for instructor review)\n\nWhen reviewing a student's solution, check:\n\n- \u2713 All functions compile and tests pass with `-race`.\n- \u2713 HTTP endpoints return correct status codes (200, 400, 404, 500).\n- \u2713 Request/response bodies are valid JSON with expected fields.\n- \u2713 TTL is converted from milliseconds to time.Duration.\n- \u2713 GET returns 404 for expired keys.\n- \u2713 PUT without a TTL stores the key with no expiry.\n- \u2713 DELETE returns 404 for absent or already-expired keys.\n- \u2713 Server logs operations with slog (not fmt.Printf).\n- \u2713 Server gracefully shuts down on SIGINT/SIGTERM.\n- \u2713 After shutdown, the database is closed and the log is flushed.\n- \u2713 Data persists across a server restart (durability).\n- \u2713 `-race` detector finds no issues.\n\n---\n\n## Stretch Goals (Optional)\n\nIf you finish early:\n\n1. **Compact on startup**: If the log is large, compact before serving requests.\n2. **Metrics endpoint**: Add a GET /metrics endpoint that returns JSON with stats (number of keys, log size, etc.).\n3. **Expiration header**: In GET responses, include an optional \"Expires\" header with the UTC time the key will expire.\n4. **Request timeouts**: Use `context.WithTimeout` on database operations so slow queries don't hang the server.\n5. **TLS support**: Add flags for cert/key and use `http.Server{TLSConfig:...}`.\n\n---\n\n## Next Steps\n\nWhen all tests pass, you've completed the capstone! Ask your instructor for feedback on the design and implementation.\n", "files": [{"name": "README.md", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone3/README.md"}, {"name": "cmd/kvd/main.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone3/cmd/kvd/main.go"}, {"name": "cmd/kvd/main_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone3/cmd/kvd/main_test.go"}, {"name": "store/api.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone3/store/api.go"}, {"name": "store/api_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone3/store/api_test.go"}, {"name": "store/db.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone3/store/db.go"}, {"name": "store/log.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone3/store/log.go"}, {"name": "store/memory.go", "path": "/home/csmith/Workspace/tools/go-course/modules/10-capstone/milestone3/store/memory.go"}], "cmd": "go test -race ./modules/10-capstone/milestone3/...", "id": "modules/10-capstone/milestone3"}], "review": "# Capstone Module Review & Rubric\n\nThis document contains instructor notes for reviewing student solutions to the capstone milestones.\n\n---\n\n## Milestone 1: In-Memory Store with TTL\n\n### Solution Overview\n\nThe readable solution (store.go) is the recommended implementation:\n- Uses `sync.RWMutex` for readers/writers.\n- Lazy expiry on every read; active cleanup via janitor.\n- Separates `janitor(ctx, ticks)` from `RunJanitor(ctx, interval)` for testability.\n\n### Readable Solution\n\nSee **solutions/10-capstone/milestone1/store/store.go**. Key design:\n\n```go\n// ErrNotFound is returned by Get when a key is absent or has expired.\nvar ErrNotFound = errors.New(\"store: key not found\")\n\n// entry is one stored value. A zero expiresAt means \"never expires\".\ntype entry struct {\n\tvalue     string\n\texpiresAt time.Time\n}\n\n// expired reports whether e is expired at instant now. An entry whose\n// expiry equals now is expired: a TTL of 10s means \"gone at +10s\".\nfunc (e entry) expired(now time.Time) bool {\n\treturn !e.expiresAt.IsZero() && !now.Before(e.expiresAt)\n}\n\n// Store is a concurrency-safe in-memory key-value store. Create one with\n// New; the zero value is not usable.\ntype Store struct {\n\tnow func() time.Time\n\n\tmu    sync.RWMutex\n\titems map[string]entry\n}\n\n// Get returns the value stored under key. It returns ErrNotFound if the key\n// is absent or expired.\nfunc (s *Store) Get(key string) (string, error) {\n\tnow := s.now()\n\n\ts.mu.RLock()\n\tdefer s.mu.RUnlock()\n\te, ok := s.items[key]\n\tif !ok || e.expired(now) {\n\t\treturn \"\", ErrNotFound\n\t}\n\treturn e.value, nil\n}\n\n// Keys returns the live keys in ascending order. It never returns expired\n// keys. The returned slice is owned by the caller.\nfunc (s *Store) Keys() []string {\n\tnow := s.now()\n\n\ts.mu.RLock()\n\tkeys := make([]string, 0, len(s.items))\n\tfor k, e := range s.items {\n\t\tif !e.expired(now) {\n\t\t\tkeys = append(keys, k)\n\t\t}\n\t}\n\ts.mu.RUnlock()\n\n\tslices.Sort(keys) // sort outside the lock: it only touches our copy\n\treturn keys\n}\n\n// DeleteExpired removes every expired entry and returns how many it removed.\nfunc (s *Store) DeleteExpired() int {\n\tnow := s.now()\n\n\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\tn := 0\n\tfor k, e := range s.items {\n\t\tif e.expired(now) {\n\t\t\tdelete(s.items, k) // deleting during range is allowed by the spec\n\t\t\tn++\n\t\t}\n\t}\n\treturn n\n}\n\n// janitor runs one sweep per value received from ticks and returns when ctx\n// is canceled. Separating it from RunJanitor lets tests drive sweeps with a\n// channel they control instead of a real ticker.\nfunc (s *Store) janitor(ctx context.Context, ticks <-chan time.Time) {\n\tfor {\n\t\tselect {\n\t\tcase <-ctx.Done():\n\t\t\treturn\n\t\tcase <-ticks:\n\t\t\ts.DeleteExpired()\n\t\t}\n\t}\n}\n\nfunc main() {\n\tnow := time.Date(2026, 1, 1, 0, 0, 0, 0, time.UTC)\n\ts := &Store{now: func() time.Time { return now }, items: map[string]entry{\n\t\t\"b\": {value: \"2\"},\n\t\t\"a\": {value: \"1\", expiresAt: now.Add(time.Minute)},\n\t\t\"z\": {value: \"old\", expiresAt: now.Add(-time.Minute)},\n\t}}\n\tfmt.Println(s.Keys())     // [a b]: z already expired\n\tfmt.Println(s.Get(\"z\"))   // store: key not found\n\tctx, cancel := context.WithCancel(context.Background())\n\tticks, done := make(chan time.Time), make(chan struct{})\n\tgo func() { s.janitor(ctx, ticks); close(done) }()\n\tticks <- now // one sweep removes z\n\tcancel()\n\t<-done\n\tfmt.Println(len(s.items)) // 2\n}\n```\n\n### Optimized Solution\n\nSee **solutions/10-capstone/milestone1/store/fast.go**: `ShardedStore`.\n\nThe readable `Store` has one `sync.RWMutex` for the whole map, so every\n`Set` blocks every other goroutine, and even concurrent `Get`s contend on\nthe RWMutex's reader counter. `ShardedStore` splits the key space into 32\nshards, each with its own lock and map:\n\n- **Shard choice** is an inline FNV-1a hash of the key, masked with\n  `shardCount-1` (a power of two). It is written out by hand because\n  `hash/fnv` would need a `[]byte` conversion and an interface call.\n- **Padding**: each shard is padded to 128 bytes so two shards' mutexes never\n  share a cache line. Without it, cores locking *different* shards would\n  still invalidate each other's cache line (false sharing).\n- `Get`/`Set`/`Delete` touch one shard. `Keys`, `Len` and `DeleteExpired` visit\n  all 32, which makes them slower and **no longer a single atomic snapshot**.\n- `TestShardedStoreMatchesStore` checks it against the readable `Store`\n  (a differential test).\n\n**Measured on go1.24.2 linux/amd64** (`BenchmarkMixed*`: 1024 keys, 90%\n`Get` / 10% `Set` from `GOMAXPROCS` goroutines via `b.RunParallel`; medians of 5;\n0 allocs/op for both):\n\n| GOMAXPROCS (`-cpu`) | `Store` ns/op | `ShardedStore` ns/op | Speedup |\n|---|---|---|---|\n| 1 | ~65 | ~70 | 0.93\u00d7 (sharded is *slower*: hashing, no contention to remove) |\n| 4 | ~207 | ~80 | ~2.6\u00d7 |\n| 20 | ~264 | ~60 | ~4.4\u00d7 |\n\nNote how the readable store gets *slower* per op as cores are added (lock\ncontention), while the sharded one stays flat. That is the signature of a\ncontended lock in a benchmark, and a good thing to show the student.\n\n```bash\ngo test -run='^$' -bench=Mixed -benchmem -cpu=1,4,20 ./solutions/10-capstone/milestone1/store/\n```\n\n**When to use the sharded version:**\n- Many goroutines hit the store concurrently (a server under load), and a\n  profile (`go test -mutexprofile`, or `runtime/pprof` mutex profile)\n  shows time waiting on the store's lock.\n\n**When to stick with the readable version:**\n- Single-threaded or lightly concurrent use. It is faster there.\n- When `Keys`/`Len` must be a consistent snapshot.\n- Always as the first version: shard only after measuring contention.\n\n### Trade-offs\n\n| Aspect | Readable `Store` | `ShardedStore` |\n|--------|----------|------|\n| **Complexity** | One lock, one map | 32 locks, hashing, padding |\n| **Single goroutine** | Faster (~65 vs ~70 ns/op) | Pays for hashing |\n| **Many goroutines** | Contends on one lock | Scales with cores |\n| **`Keys`/`Len`** | Consistent snapshot | Visits 32 shards; not atomic across them |\n| **Memory** | One map | 32 maps + 4 KiB of padded shard headers |\n\n### Grading Checklist (Milestone 1)\n\nFor each student submission:\n\n- \u2713 **Correctness**: All tests pass with `-race`. No timeouts or hangs.\n- \u2713 **TTL semantics**: Keys expire at the right instant (not before, not after). Zero TTL never expires.\n- \u2713 **Lazy expiry**: Get and Keys treat expired entries as absent without calling DeleteExpired first.\n- \u2713 **Active expiry**: DeleteExpired is called by janitor; expired entries are removed.\n- \u2713 **Conc
