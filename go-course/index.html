can't initialize the runtime).\n\nThe key distinction: if the error is something the *caller* might have caused (bad input, missing file, network issue), return an error. If it's a bug in the *program* (programmer error), panic.\n\n```go\n// OK: the caller provided a bad argument; they can handle it\nfunc Open(path string) (*os.File, error) {\n\tif path == \"\" {\n\t\treturn nil, errors.New(\"path is required\")\n\t}\n\treturn os.Open(path)\n}\n\ntype Stack struct{ items []int }\n\nfunc (s *Stack) Len() int { return len(s.items) }\n\n// OK: this violates a package invariant (programmer bug)\nfunc (s *Stack) Pop() int {\n\tif s.Len() == 0 {\n\t\tpanic(\"Pop on empty stack\") // programmer error; caller didn't check Len()\n\t}\n\tv := s.items[len(s.items)-1]\n\ts.items = s.items[:len(s.items)-1]\n\treturn v\n}\n\n// NOT OK: panicking on user input\nfunc ParseInt(s string) (int, error) {\n\tn, err := strconv.Atoi(s)\n\tif err != nil {\n\t\tpanic(err) // NO! User provided bad input, return an error\n\t}\n\treturn n, nil\n}\n\n_, err := Open(\"\")\nfmt.Println(err) // path is required\ns := &Stack{items: []int{1}}\nfmt.Println(s.Pop()) // 1\nn, _ := ParseInt(\"42\")\nfmt.Println(n) // 42. Now try ParseInt(\"forty-two\") or another s.Pop()\n```\n\n**MustXxx functions:** The pattern `MustXxx` (like `regexp.MustCompile`) is fine for initialization with constant, known-good input:\n\n```go\n// Initialized once at package level, with known-good input\nvar emailRegex = regexp.MustCompile(`^[^@]+@[^@]+$`)\n\n// If the regex were wrong, it's a programmer error, so panicking at startup is appropriate.\n\nfmt.Println(emailRegex.MatchString(\"ada@example.com\"), emailRegex.MatchString(\"not an email\")) // true false\n```\n\nBut don't use `MustXxx` for user-provided data.\n\n### Recover: One Legitimate Use\n\nLibrary code that doesn't control its callbacks (HTTP handlers, plugin hosts, job runners) may use `recover` at a boundary to prevent panics from crashing the application:\n\n```go\nfunc ServeRequest(w http.ResponseWriter, r *http.Request) {\n\tdefer func() {\n\t\tif recovered := recover(); recovered != nil {\n\t\t\tw.WriteHeader(http.StatusInternalServerError)\n\t\t\tfmt.Fprintf(w, \"Internal error: %v\", recovered)\n\t\t\t// Log it for debugging\n\t\t\tlog.Printf(\"panic in handler: %v\", recovered)\n\t\t}\n\t}()\n\thandleLogic(r) // might panic, but we'll recover\n}\n\nfunc handleLogic(r *http.Request) {\n\tvar counts map[string]int\n\tcounts[r.URL.Path]++ // bug: nil map\n}\n\n// Call the handler directly, the way a test would (module 08 covers httptest).\nrec := httptest.NewRecorder()\nServeRequest(rec, httptest.NewRequest(\"GET\", \"/boom\", nil))\nfmt.Println(rec.Code, rec.Body.String()) // 500 Internal error: assignment to entry in nil map\n```\n\nThis is appropriate at *boundaries*\u2014places where untrusted code runs:\n- HTTP request handlers.\n- Job queue processors executing user-submitted tasks.\n- Plugin or callback hosts.\n- RPC servers or message dispatchers.\n\nThe pattern: catch the panic, log it, and return a safe error response to the caller. The panic doesn't crash the server; the handler fails gracefully.\n\n**Why only at boundaries?** \n- If *your* code panicked (not a callback you called), recovering masks a bug. You should fix it, not hide it.\n- Recovering deep in libraries breaks the call stack contract. The caller expects either a return value or a crash, not a secret recovery.\n- It makes the code harder to debug: a panic message disappears, and you're left with an error you need to correlate back to the panic location.\n\n**Outside these boundaries, recover usually indicates a design problem.** Don't use it as control flow:\n\n```go\nvar badState = true\n\n// Bad: using recover to implement try/catch\nfunc doSomethingPanicky() {\n\tdefer func() {\n\t\tif r := recover(); r != nil {\n\t\t\tfmt.Println(\"caught:\", r) // handle the \"error\"\n\t\t}\n\t}()\n\n\t// Panicking instead of returning errors\n\tif badState {\n\t\tpanic(\"something went wrong\") // NO!\n\t}\n}\n\n// Good: return an error normally\nfunc doSomething() error {\n\tif badState {\n\t\treturn errors.New(\"something went wrong\")\n\t}\n\treturn nil\n}\n\ndoSomethingPanicky()\nif err := doSomething(); err != nil {\n\tfmt.Println(\"error:\", err)\n}\n```\n\n### Handle Errors Once\n\nIf an error is important enough to log, don't also return it\u2014the caller will log it again, and you'll see duplicate messages in logs. Log *or* return, not both (Uber style guide):\n\n```go\nfunc loadConfig(path string) error {\n\tf, err := os.Open(path)\n\tif err != nil {\n\t\tlog.Printf(\"failed to open: %v\", err) // Bad: logs once...\n\t\treturn err\n\t}\n\treturn f.Close()\n}\n\n// ...and the caller logs it again\nif err := loadConfig(\"myfile.json\"); err != nil {\n\tlog.Printf(\"error: %v\", err) // the same error, a second time\n}\n```\n\n**Good: wrap and return, let the caller decide:**\n\n```go\nfunc LoadConfig(path string) error {\n\tf, err := os.Open(path)\n\tif err != nil {\n\t\treturn fmt.Errorf(\"open config %q: %w\", path, err) // wrap with context, don't log\n\t}\n\tdefer f.Close()\n\t// ... parse f ...\n\treturn nil\n}\n\n// Caller decides to log once, at the boundary\nif err := LoadConfig(\"myfile.json\"); err != nil {\n\tlog.Printf(\"failed to load config: %v\", err) // one log message with full context\n}\n```\n\n**Rule of thumb:**\n- **Libraries:** Return errors. Let the caller decide how to handle them.\n- **Main function / CLI:** Log errors (the top level of the call stack).\n- **Middleware / boundaries:** Log interesting errors, then pass them on or return a safe response.\n\nThis way, each error is logged once, in context, with all the information needed to understand it.\n\n**Related:** Never silently discard errors with `_ = someFunction()`. If you're ignoring an error intentionally, explain why in a comment:\n\n```go\nfile, err := os.CreateTemp(\"\", \"scratch-*.txt\")\nif err != nil {\n\tlog.Fatal(err)\n}\ndefer os.Remove(file.Name())\n\n// OK: intentional\n_ = file.Close() // ignore close errors; the file is temporary\n\n// Better: explicit comment\nif err := file.Close(); err != nil {\n\t// Ignore: we're cleaning up a temporary file, not critical.\n\tfmt.Println(\"ignoring:\", err) // this second Close fails: file already closed\n}\n```\n\n### Closing and Flushing\n\nWhen writing through a buffered writer, errors can happen at Flush or Close, not just Write. The `bufio.Writer` buffers data and only writes it to the underlying file when you call Flush. Errors can occur at each step:\n\n1. `Write()`: buffer is full or the underlying write failed.\n2. `Flush()`: force all buffered data to disk.\n3. `Close()`: flush remaining data and close the file.\n\n```go\nfunc SaveFile(path string, data []byte) (err error) {\n    f, err := os.Create(path)\n    if err != nil {\n        return err  // file creation failed; nothing to clean up\n    }\n    // Ensure Close is called even if we panic or error out\n    defer func() {\n        if cerr := f.Close(); cerr != nil {\n            // If we already had an error, join both; otherwise just return the close error\n            err = errors.Join(err, fmt.Errorf(\"close: %w\", cerr))\n        }\n    }()\n\n    w := bufio.NewWriter(f)\n    if _, err := w.Write(data); err != nil {\n        return fmt.Errorf(\"write: %w\", err)  // return early; defer will still close the file\n    }\n\n    if err := w.Flush(); err != nil {\n        return fmt.Errorf(\"flush: %w\", err)  // flush may fail; defer will still close the file\n    }\n\n    return nil  // Close will be called by defer; if it fails, err will be set\n}\n\nfmt.Println(SaveFile(filepath.Join(os.TempDir(), \"save-demo.txt\"), []byte(\"hi\"))) // <nil>\nfmt.Println(SaveFile(\"/no/such/dir/file.txt\", []byte(\"hi\")))                      // the Create error\n```\n\n**Why this pattern matters:** Buffered writers hide when data actually hits the disk. If you ignore Flush or Close errors, data might not be written:\n\n```go\ndir, _ := os.MkdirTemp(\"\", \"flush-demo\")\ndefer os.RemoveAll(dir)\ndata := []byte(\"hello\\n\")\n\n// Bad: data might not be written\nf1, _ := os.Create(filepath.Join(dir, \"bad.txt\"))\nw1 := bufio.NewWriter(f1)\nw1.Write(data)\nf1.Close() // closed without Flush: the data is still in w1's buffer\n\n// Good: ensure flush and close are called\nf2, _ := os.Create(filepath.Join(dir, \"good.txt\"))\nw2 := bufio.NewWriter(f2)\nfunc() {\n\tdefer func() {\n\t\tw2.Flush()\n\t\tf2.Close()\n\t}()\n\tw2.Write(data) // even if this panicked, flush and close would run\n}()\n\nbad, _ := os.ReadFile(filepath.Join(dir, \"bad.txt\"))\ngood, _ := os.ReadFile(filepath.Join(dir, \"good.txt\"))\nfmt.Printf(\"bad: %q, good: %q\\n\", bad, good) // bad: \"\", good: \"hello\\n\"\n```\n\n**Combining multiple errors:** If both Write and Close fail, join them so the caller can see both:\n\n```go\nfunc save(path string, data []byte) error {\n\tf, err := os.Create(path)\n\tif err != nil {\n\t\treturn err\n\t}\n\t_, writeErr := f.Write(data) // might fail\n\tcloseErr := f.Close()        // might fail\n\treturn errors.Join(writeErr, closeErr) // caller sees both; nil if both are nil\n}\n\nfmt.Println(save(filepath.Join(os.TempDir(), \"join-demo.txt\"), []byte(\"x\"))) // <nil>\nfmt.Println(save(\"/no/such/dir/file.txt\", []byte(\"x\")))                      // the Create error\n```\n\n### The Nil-Pointer-in-Interface Gotcha\n\nA common bug when returning a typed nil pointer:\n\n```go\ntype ParseError struct{ Line int }\n\nfunc (e *ParseError) Error() string { return fmt.Sprintf(\"parse error on line %d\", e.Line) }\n\nfunc Parse(input string) (int, error) {\n\tvar pe *ParseError // nil pointer\n\tn, err := strconv.Atoi(input)\n\tif err != nil {\n\t\tpe = &ParseError{Line: 1}\n\t}\n\treturn n, pe // when pe is nil, the interface still holds (*ParseError, nil)\n}\n\nn, err := Parse(\"42\")\nif err != nil { // TRUE! the interface is non-nil\n\tfmt.Printf(\"n=%d, err != nil, err is %T(%v)\\n\", n, err, err)\n}\n```\n\nReturn `nil` explicitly:\n\n```go\ntype ParseError struct{ Line int }\n\nfunc (e *ParseError) Error() string { return fmt.Sprintf(\"parse error on line %d\", e.Line) }\n\nfunc Parse(input string) (int, error) {\n\tn, err := strconv.Atoi(input)\n\tif err != nil {\n\t\treturn 0, &ParseError{Line: 1}\n\t}\n\treturn n, nil // explicit nil\n}\n\nn, err := Parse(\"42\")\nfmt.Println(n, err == nil) // 42 true\n```\n\n## Idioms & Best Practices\n\n- **Error as the last return:** `func F() (T, error)`. Check it right away.\n- **Wrap with context:** Use `fmt.Errorf(\"operation X: %w\", err)`. Put `%w` last. Don't repeat what the callee already said.\n- **Unwrap carefully:** Never use `==` after wrapping; use `errors.Is`. For custom types, use `errors.As`.\n- **Sentinel errors for matchable conditions:** `var ErrXxx = errors.New(\"...\")` for expected, known failures. Name them `ErrXxx` (exported) or `errXxx` (unexported).\n- **Custom types for extra data:** Use a struct with `Error()` and `Unwrap()` methods when you need to carry line numbers, field names, or other context.\n- **errors.Join for multiple failures:** Validation, cleanup, and anything with independent errors.\n- **Lowercase error messages:** \"file not found\", not \"File Not Found\" or \"Error: file not found\".\n- **Handle once:** Log *or* return; if you log, return `nil`. If you return, the caller decides to log.\n- **Never silently discard errors:** If you ignore an error with `_`, add a comment explaining why.\n- **Defer cleanup on success too:** A file opened successfully must be closed, even if the next operation panics.\n- **Catch panics only at boundaries:** HTTP handlers, job runners, RPC servers. Don't use `recover` in libraries.\n\n## Common Pitfalls\n\n1. **Comparing wrapped errors with `==`.** Use `errors.Is` instead.\n2. **Hiding the error with `%v` when you should wrap with `%w`.** This breaks `errors.Is`.\n3. **Panicking on user input.** Use errors and let the caller decide.\n4. **Forgetting to check `Close` and `Flush` errors.** They can hide data loss.\n5. **Logging and returning the same error.** The caller logs it again.\n6. **Returning a nil-typed pointer through an error interface:** `var e *MyErr = nil; return e` (interface is non-nil). Return `nil` explicitly.\n7. **Calling `errors.As` with a non-pointer target.** `errors.As(err, &myType)` requires the second argument to be a non-nil pointer.\n8. **Wrapping at every layer with \"failed to X: failed to Y: ...\"** Be selective; avoid noise.\n\n## Exercises\n\n### 1. configparse: Sentinel and Custom Error Types\n\n**Package:** `configparse`  \n**File:** `modules/02-errors/exercises/configparse/`  \n**Commands:**\n```bash\ngo test ./modules/02-errors/exercises/configparse/\ngo test ./solutions/02-errors/exercises/configparse/\n```\n\nParse a `key=value` configuration file. Return a `*ParseError` that records the line number and wraps one of several sentinel errors (`ErrMissingEquals`, `ErrEmptyKey`, `ErrInvalidKey`, `ErrDuplicateKey`). Implement `Error()` and `Unwrap()` so that:\n- `errors.As(err, &pe)` extracts the line number.\n- `errors.Is(err, ErrInvalidKey)` matches through wrapping.\n\nTest that reader errors (disk failures) are wrapped with context but NOT reported as `*ParseError`.\n\n### 2. lookup: Wrapping Through Layers\n\n**Package:** `lookup`  \n**File:** `modules/02-errors/exercises/lookup/`  \n**Commands:**\n```bash\ngo test ./modules/02-errors/exercises/lookup/\ngo test ./solutions/02-errors/exercises/lookup/\n```\n\nImplement a service layer on top of a storage layer. The storage returns a sentinel `ErrNotFound` wrapped with context (\"user 7: not found\"). The service layer either passes that up or handles it (e.g., in `Greet`, return \"Hello, guest!\" with nil error for not-found users). Show how sentinel errors and wrapping survive multiple layers, and how callers use `errors.Is` to match them.\n\n### 3. validate: Multiple Errors with errors.Join\n\n**Package:** `validate`  \n**File:** `modules/02-errors/exercises/validate/`  \n**Commands:**\n```bash\ngo test ./modules/02-errors/exercises/validate/\ngo test ./solutions/02-errors/exercises/validate/\n```\n\nValidate a sign-up form (name, email, age) and report *all* problems at once using `errors.Join`. Each field has a `*FieldError` that wraps a sentinel (`ErrRequired`, `ErrTooLong`, `ErrInvalidFormat`, `ErrOutOfRange`). Return `nil` only if valid. Tests should check that `errors.Is(err, ErrRequired)` works and that `Fields(err)` returns the affected field names by unwrapping the join tree.\n\n### 4. safediv: Panics vs Errors, and Recover\n\n**Package:** `safediv`  \n**File:** `modules/02-errors/exercises/safediv/`  \n**Commands:**\n```bash\ngo test ./modules/02-errors/exercises/safediv/\ngo test ./solutions/02-errors/exercises/safediv/\n```\n\nThe `Divide(a, b)` function should return an error (not panic) for two cases where the `/` operator misbehaves: division by zero and integer overflow (`math.MinInt / -1`). It does not call any untrusted code, so no recover.\n\nThe `Safely(f)` function wraps a callback that might panic. It recovers, converts the panic to a `*PanicError` (which implements `Unwrap()` to expose the panic cause if it's an error), and returns it. This is appropriate at boundaries (HTTP handlers, job runners).\n\n### 5. closeerr: Defer, Flush, and Close\n\n**Package:** `closeerr`  \n**File:** `modules/02-errors/exercises/closeerr/`  \n**Commands:**\n```bash\ngo test ./modules/02-errors/exercises/closeerr/\ngo test ./solutions/02-errors/exercises/closeerr/\n```\n\nImplement `WriteLines(w, lines)` that writes to a buffered writer, flushes, and closes\u2014handling all errors including Close. Use a named return and defer to ensure Close runs. Join Close errors with earlier errors if both fail.\n\n## Project: Bank Ledger\n\n**Deadline:** ~ 45\u201360 minutes.\n\n**Directory:** `modules/02-errors/project/`\n\nParse a transaction file (deposits, withdrawals, transfers) and report an account balance report. Transactions that fail (insufficient funds, invalid format) are reported in a summary, but processing continues. Exit code 0 if all succeed, 1 if any failed.\n\nSee `project/README.md` for the full spec.\n\nWhen tests pass, ask your instructor (Claude) to review `modules/02-errors/`.\n\n## Submitting for Review\n\nWhen all tests pass, ask your instructor (Claude) to review `modules/02-errors/`.\n\n## Further Reading\n\n- [Go Blog: Errors are values](https://go.dev/blog/errors-are-values) \u2014 the philosophy.\n- [Go Blog: Working with errors in Go 1.13](https://go.dev/blog/go1.13-errors) \u2014 wrapping, Is, As.\n- [Code Review Comments: Error Strings](https://go.dev/wiki/CodeReviewComments#error-strings) \u2014 conventions.\n- [Code Review Comments: Handle Errors](https://go.dev/wiki/CodeReviewComments#handle-errors) \u2014 error handling patterns.\n- [Effective Go: Panic](https://go.dev/doc/effective_go#panic) \u2014 when to panic.\n- [pkg.go.dev/errors](https://pkg.go.dev/errors) \u2014 API reference.\n", "units": [{"kind": "exercise", "name": "closeerr", "dir": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/closeerr", "doc": "Package closeerr shows how to write data without losing errors from\nFlush and Close, using defer and a named result.", "readme": "", "files": [{"name": "closeerr.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/closeerr/closeerr.go"}, {"name": "closeerr_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/closeerr/closeerr_test.go"}], "cmd": "go test ./modules/02-errors/exercises/closeerr/", "id": "modules/02-errors/exercises/closeerr"}, {"kind": "exercise", "name": "configparse", "dir": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/configparse", "doc": "Package configparse parses a tiny key=value configuration format and\nreports problems as structured *ParseError values.\n\nFormat rules:\n  - One \"key = value\" pair per line. Whitespace around key and value is trimmed.\n  - Blank lines and lines whose first non-space character is '#' are ignored.\n  - Everything after the FIRST '=' is the value, so \"url=a=b\" has value \"a=b\".\n  - Values may be empty (\"debug=\" is valid).\n  - Keys must be non-empty and use only ASCII letters, digits, '_', '.', '-'.\n  - A key may appear only once.", "readme": "", "files": [{"name": "configparse.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/configparse/configparse.go"}, {"name": "configparse_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/configparse/configparse_test.go"}], "cmd": "go test ./modules/02-errors/exercises/configparse/", "id": "modules/02-errors/exercises/configparse"}, {"kind": "exercise", "name": "lookup", "dir": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/lookup", "doc": "Package lookup demonstrates sentinel errors travelling through layers:\na storage layer reports \"not found\", a service layer adds context, and a\ntop-level caller decides what \"not found\" means for the user.", "readme": "", "files": [{"name": "lookup.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/lookup/lookup.go"}, {"name": "lookup_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/lookup/lookup_test.go"}], "cmd": "go test ./modules/02-errors/exercises/lookup/", "id": "modules/02-errors/exercises/lookup"}, {"kind": "exercise", "name": "safediv", "dir": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/safediv", "doc": "Package safediv contrasts the two ways a Go function can fail:\nreturning an error (for expected failures) and panicking (for bugs), and\nshows the one place where recover is appropriate: a boundary that must\nkeep running when a callback it does not control panics.", "readme": "", "files": [{"name": "safediv.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/safediv/safediv.go"}, {"name": "safediv_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/safediv/safediv_test.go"}], "cmd": "go test ./modules/02-errors/exercises/safediv/", "id": "modules/02-errors/exercises/safediv"}, {"kind": "exercise", "name": "validate", "dir": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/validate", "doc": "Package validate checks a sign-up form and reports EVERY problem at once,\ncombining per-field errors with errors.Join.", "readme": "", "files": [{"name": "validate.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/validate/validate.go"}, {"name": "validate_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/exercises/validate/validate_test.go"}], "cmd": "go test ./modules/02-errors/exercises/validate/", "id": "modules/02-errors/exercises/validate"}, {"kind": "project", "name": "project", "dir": "/home/csmith/Workspace/tools/go-course/modules/02-errors/project", "doc": "", "readme": "# Project: Bank Ledger\n\n**Deadline:** ~ 45\u201360 minutes.\n\n## Overview\n\nImplement a bank ledger that processes a file of transactions (open account, deposit, withdraw, transfer) and reports successful and failed transactions. Unlike the exercises, the ledger must:\n\n- Define structured, matchable error types for specific failures (insufficient funds, syntax errors, etc.)\n- Keep going when a transaction fails, reporting *all* failures at the end (not stopping on the first error).\n- Use typed errors (`*AccountError` and `*LineError`) so callers can match specific problems with `errors.Is` and `errors.As`.\n- Report an exit code: 0 if all transactions succeeded, 1 if any failed.\n\n## Spec\n\n### Ledger API (`ledger.go`)\n\nDefine a `Ledger` type that manages accounts and their balances. Balances are stored in **cents** (as `int64`), so there are no floating-point issues.\n\n**Exported functions and types:**\n\n- `New() *Ledger`: Return an empty ledger.\n- `Open(account string, initial int64) error`: Create a new account with the given initial balance (>= 0). If the account exists, return error. If the initial amount is negative, return error.\n- `Balance(account string) (int64, error)`: Return the balance in cents. Return an error if the account doesn't exist.\n- `Accounts() []string`: Return all account names in sorted order.\n- `Deposit(account string, amount int64) error`: Add cents to an account. Return error if the account doesn't exist, the amount is invalid (\u2264 0), or overflow would occur.\n- `Withdraw(account string, amount int64) error`: Subtract cents. Return error if the account doesn't exist, the amount is invalid (\u2264 0), or there are insufficient funds.\n- `Transfer(from, to string, amount int64) error`: Move cents from one account to another. This is atomic: all checks must pass before any balance changes. Return error for unknown accounts, invalid amounts, insufficient funds, attempting to transfer to the same account, or overflow on the destination. Report the account at fault in the error message.\n\n**Error types:**\n\n- `AccountError`: A struct with fields `Op` (string: \"open\", \"deposit\", \"withdraw\", \"balance\", \"transfer\"), `Account` (string), and `Err` (error). It implements `Error()` and `Unwrap()`. The error message format is `\"op account: cause\"`, e.g., `\"deposit alice: insufficient funds\"`.\n- Sentinel errors: `ErrAccountExists`, `ErrUnknownAccount`, `ErrInsufficientFunds`, `ErrInvalidAmount`, `ErrSameAccount`, `ErrOverflow`, `ErrSyntax`. Each is created with `errors.New` and wrapped in an `*AccountError` by ledger operations.\n\nAmounts are validated: they must be > 0 for deposits, withdrawals, and transfers.\n\n### File Parsing (`process.go`)\n\nImplement `Process(r io.Reader) (Result, error)` on `*Ledger`.\n\n**Input format:** One transaction per line:\n```\nopen alice 100      # Open alice with 100 cents. Amount is optional; defaults to 0.\nopen bob            # Open bob with 0.\ndeposit alice 50    # Add 50 to alice.\nwithdraw bob 25     # Subtract 25 from bob.\ntransfer alice bob 30  # Move 30 from alice to bob.\n# Lines starting with '#' are comments.\n               # Blank lines are ignored.\n```\n\nFields are separated by whitespace.\n\n**Error handling:** If a transaction line is malformed (bad syntax, bad amount, or an operation fails), record the error in `Result.Failures` as a `*LineError` and keep processing. Do not stop.\n\n**Result type:**\n```go\n// Runs YOUR ledger package. The types are already in process.go:\n//\n//\ttype Result struct {\n//\t\tApplied  int          // successful transactions\n//\t\tFailures []*LineError // one per failed transaction\n//\t}\n//\n// LineError has Line (1-based) and Err (the cause: a syntax error or an\n// *AccountError), with Error() and Unwrap(). Result.Err() returns\n// errors.Join of all failures, or nil if there are none.\nimport \"gocourse/modules/02-errors/project/ledger\"\n\ninput := \"open alice 100\\nwithdraw alice 500\\nfly bob\\ndeposit alice 5\\n\"\nres, err := ledger.New().Process(strings.NewReader(input))\nfmt.Println(\"applied:\", res.Applied, \"failures:\", len(res.Failures), \"read error:\", err)\nfmt.Println(res.Err())\n// When you're done: applied: 2 failures: 2, then one line per failure.\n```\n\nIf reading the input fails (e.g., I/O error), return the read error wrapped in context (e.g., `\"read transactions: ...\"`) and the Result with what was processed so far.\n\n### CLI (`cmd/ledger/main.go` and `ledger.go` Run function)\n\nImplement `Run(args []string, stdin io.Reader, stdout, stderr io.Writer) int` on package ledger.\n\nThe CLI:\n- Takes a file path as an argument. If no argument, read from stdin.\n- Calls `Process` to apply transactions.\n- Prints a summary: number of successful transactions and a report of all failures (line number, error).\n- Returns exit code 0 if all succeeded, 1 if any failed.\n- Returns exit code 2 if the input file cannot be read or parsed in a fatal way (e.g., cannot open the file).\n\n## Acceptance Criteria\n\n- [ ] All ledger operations (`Open`, `Deposit`, `Withdraw`, `Transfer`, `Balance`) work correctly and return errors for invalid inputs.\n- [ ] Error types (`AccountError`, `LineError`) are properly defined with `Error()` and `Unwrap()` methods.\n- [ ] Sentinel errors are matchable with `errors.Is`.\n- [ ] `Process` keeps going on failed transactions, collecting all failures in order.\n- [ ] `Run` prints all failures in a readable format.\n- [ ] Exit code is 0 on success, 1 on transaction failures, 2 on fatal input errors.\n- [ ] Tests pass: `go test ./modules/02-errors/project/...`\n- [ ] No data races: `go test -race ./modules/02-errors/project/...`\n\n## Testing\n\nRun tests from the course root:\n```bash\ngo test ./modules/02-errors/project/...\ngo test -race ./modules/02-errors/project/...\n```\n\n## Stretch Goals\n\n- Persist the ledger to a file and reload it (JSON or newline-delimited format).\n- Support comments in transaction files (already do this).\n- Add a `QueryBalance` command that outputs the final balance of an account.\n- Add undo/rollback for the last transaction.\n", "files": [{"name": "README.md", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/project/README.md"}, {"name": "cmd/ledger/main.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/project/cmd/ledger/main.go"}, {"name": "ledger/amount.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/project/ledger/amount.go"}, {"name": "ledger/amount_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/project/ledger/amount_test.go"}, {"name": "ledger/ledger.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/project/ledger/ledger.go"}, {"name": "ledger/ledger_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/project/ledger/ledger_test.go"}, {"name": "ledger/process.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/project/ledger/process.go"}, {"name": "ledger/process_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/project/ledger/process_test.go"}, {"name": "ledger/run.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/project/ledger/run.go"}, {"name": "ledger/run_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/02-errors/project/ledger/run_test.go"}], "cmd": "go test ./modules/02-errors/project/...", "id": "modules/02-errors/project"}], "review": "# Module 02-Errors: Review Rubric\n\n## Exercise 1: configparse\n\n### Readable Solution\n\nThe `configparse` package demonstrates sentinel errors, custom error types, and proper error wrapping.\n\n**Key points:**\n\n- `ParseError` struct holds `Line`, `Key` (optional), and `Err` (an underlying sentinel).\n- `Error()` formats as `\"line N: ...\"` or `\"line N: key \\\"k\\\": ...\"`.\n- `Unwrap()` returns the underlying sentinel, so `errors.Is(err, ErrMissingEquals)` works through wrapping.\n- The `validKey` helper ensures keys match ASCII [a-zA-Z0-9_.-].\n- Reader errors are wrapped with context (e.g., `\"read config: %w\"`) but NOT reported as `*ParseError`, preserving the distinction between syntax errors and I/O errors.\n- `errors.As` can extract the `ParseError` even after a caller wraps it further, demonstrating the robustness of the design.\n\n**Trade-offs:**\n\n- The readable version allocates a new `ParseError` each time a validation fails, which is fine for a config parser (runs once at startup).\n- The `fast.go` version is available for comparison: it preallocates sentinel `ParseError` instances, reducing allocations. Benchmark (measured on go1.24.2 linux/amd64): readable ~= 57.96 \u00b5s with 426 allocs for 200 lines (~0.29 \u00b5s/line, 2.13 allocs/line), fast ~= 37.89 \u00b5s with 226 allocs (~0.19 \u00b5s/line, 1.13 allocs/line).\n\n### Optimized Solution\n\nSee `exercises/configparse/fast.go`. It:\n\n- Pre-allocates sentinel `ParseError` instances for static error messages (e.g., `errMissingEquals`).\n- Reuses the same `*ParseError` pointer when a validation fails (works because the cause is not modified by callers).\n- **Caveat:** If a caller does `errors.As(err, &pe); pe.Key = \"x\"`, this corrupts the shared error. The README mentions this trade-off.\n- Returns `nil` early if the input is valid, avoiding a call to `errors.Join`.\n\n### Grading Checklist\n\n- [ ] Sentinel errors are declared (ErrMissingEquals, ErrEmptyKey, ErrInvalidKey, ErrDuplicateKey).\n- [ ] ParseError is a struct with Line, Key, Err fields.\n- [ ] ParseError.Error() returns the correct format.\n- [ ] ParseError.Unwrap() is implemented.\n- [ ] validKey rejects non-ASCII and spaces.\n- [ ] Parse reads lines correctly and skips comments and blanks.\n- [ ] Duplicate keys are detected (with the line they were first defined on in the error message).\n- [ ] Reader errors are wrapped with context and not reported as *ParseError.\n- [ ] First error wins (parsing stops at the first problem).\n\n---\n\n## Exercise 2: lookup\n\n### Readable Solution\n\nThe `lookup` package demonstrates:\n\n- Sentinel errors flowing through multiple layers.\n- Wrapping with context at each layer, e.g., `\"user 7: not found\"`.\n- Using `errors.Is` to match sentinels even after wrapping.\n- A Service layer that handles \"not found\" as an expected condition (e.g., Greet returns \"Hello, guest!\" with nil error).\n\n**Key points:**\n\n- `MapStore.Get` returns an error wrapping `ErrNotFound` with context about which user was not found.\n- `Service.DisplayName` calls `Get` and wraps its error again, adding \"user store: \" context.\n- `Service.Greet` treats `ErrNotFound` as success (returns \"Hello, guest!\") but passes through other errors.\n- The key idiom: `errors.Is(err, ErrNotFound)` works even when the error is wrapped multiple times.\n\n### Optimized Solution\n\nNo significant optimization for this exercise; the readable solution is the idiomatic approach.\n\n### Grading Checklist\n\n- [ ] Sentinel errors are defined (ErrNotFound, ErrInvalidID).\n- [ ] User struct is defined with ID and Name.\n- [ ] Getter interface is small and defined by the consumer (Service package).\n- [ ] MapStore.Get returns errors wrapping ErrNotFound with the user ID.\n- [ ] Service.DisplayName validates the ID, calls Get, and wraps the error.\n- [ ] Service.Greet uses errors.Is to match ErrNotFound and treats it as success.\n- [ ] Errors wrap through multiple layers but remain matchable.\n\n---\n\n## Exercise 3: validate\n\n### Readable Solution\n\nThe `validate` package demonstrates:\n\n- Multiple independent validation errors collected and joined with `errors.Join`.\n- Custom error type (`FieldError`) with a field name and a sentinel cause.\n- Each field validated once; only the first failure per field is reported.\n- The `Fields` helper unwraps an `errors.Join` tree and a `fmt.Errorf` chain to extract field names.\n\n**Key points:**\n\n- `Validate` calls `checkName`, `checkEmail`, and `checkAge` independently, collecting their errors.\n- `errors.Join` is called with all errors (including nils), which returns nil if all are nil.\n- `errors.Is(err, ErrRequired)` works through the join and returns true if any joined branch contains `ErrRequired`.\n- The `Fields` function walks through both `Unwrap() error` (for `fmt.Errorf` chains) and `Unwrap() []error` (for `errors.Join`).\n\n### Optimized Solution\n\nSee `exercises/validate/fast.go`:\n\n- Pre-allocates static `FieldError` instances for static field/sentinel combinations.\n- Checks all fields first, then only calls `errors.Join` if there are failures (avoid the join overhead on the happy path).\n- Uses a byte-length shortcut for the name length check (a string of at most MaxNameLen bytes cannot exceed MaxNameLen runes).\n\n**Benchmark (measured on go1.24.2 linux/amd64):** Happy path (valid input): readable ~= 61.45 ns with 0 allocs, fast ~= 44.90 ns with 0 allocs. Invalid input: readable ~= 174.9 ns with 4 allocs, fast ~= 110.1 ns with 2 allocs.\n\n### Grading Checklist\n\n- [ ] Sentinel errors are declared (ErrRequired, ErrTooLong, ErrInvalidFormat, ErrOutOfRange).\n- [ ] Constants MaxNameLen, MinAge, MaxAge are defined.\n- [ ] FieldError struct is defined with Field and Err.\n- [ ] FieldError.Error() and Unwrap() are implemented.\n- [ ] Validate returns nil for valid input, errors.Join of failures otherwise.\n- [ ] Name is required, trimmed, and checked for max rune length.\n- [ ] Email is required, trimmed, and validated (no whitespace, one '@', non-empty local, domain with dot not starting/ending with dot).\n- [ ] Age is in [MinAge, MaxAge].\n- [ ] Age error includes the actual value in the message.\n- [ ] Fields helper correctly extracts field names from join trees and fmt.Errorf chains.\n- [ ] nil *FieldError in the error interface is not returned (values are returned, not pointers).\n\n---\n\n## Exercise 4: safediv\n\n### Readable Solution\n\nThe `safediv` package demonstrates two important patterns:\n\n1. **Errors for expected failures** (division by zero, overflow): `Divide` returns errors for cases where `/` misbehaves.\n2. **Recover for boundary protection** (panics in user callbacks): `Safely` recovers from panics in a user-provided function.\n\n**Key points:**\n\n- `Divide` checks for division by zero (b == 0) and overflow (a == math.MinInt && b == -1) *before* computing, returning errors instead of panicking.\n- `PanicError` holds the panic value (any) and a stack trace.\n- `PanicError.Unwrap()` returns the panic value if it's an error (e.g., a runtime.Error), enabling `errors.Is` matching.\n- `Safely` uses a deferred function with `recover()`, capturing the panic value and stack trace, converting it to a `*PanicError`.\n\n### Optimized Solution\n\nNo significant optimization; the readable version is idiomatic.\n\n### Grading Checklist\n\n- [ ] Sentinel errors are declared (ErrDivideByZero, ErrOverflow).\n- [ ] Divide checks for b == 0 and math.MinInt / -1 cases.\n- [ ] Divide returns an error with context, never panics.\n- [ ] PanicError struct has Value (any) and Stack ([]byte) fields.\n- [ ] PanicError.Error() returns \"panic: <value>\".\n- [ ] PanicError.Unwrap() returns the value as an error if it is one, nil otherwise.\n- [ ] Safely catches panics and returns *PanicError.\n- [ ] Safely captures the stack trace with runtime/debug.Stack().\n- [ ] A panic in Safely does not escape.\n- [ ] Ordinary errors returned by the function are passed through unchanged (not wrapped in *PanicError).\n\n---\n\n## Exercise 5: closeerr\n\n### Readable Solution\n\nThe `closeerr` package demonstrates **proper defer usage for cleanup on all paths**.\n\n**Key points:**\n\n- `WriteLines` uses a named return variable `err` and a deferred function that captures `err` by pointer.\n- The deferred function checks `w.Close()` and, if it fails, joins the close error with any prior write/flush error.\n- `bw.Flush()` is called explicitly; a failed write or flush returns early with the error wrapped (e.g., `\"write: ...\"`).\n- If both a write/flush error and a close error occur, `errors.Join` combines them so both are visible to `errors.Is`.\n- The file is closed on every path: successful writes, write failures, and even if WriteLines panics (because `defer` runs).\n\n### Optimized Solution\n\nNo significant optimization; the readable version is the idiomatic pattern.\n\n### Grading Checklist\n\n- [ ] WriteLines uses a named return variable.\n- [ ] WriteLines defers w.Close() in a function that can modify the named return.\n- [ ] The deferred function joins the close error with the write/flush error (if any).\n- [ ] Write and Flush errors are wrapped with context (\"write: ...\", \"flush: ...\").\n- [ ] Close error is wrapped with context (\"close: ...\").\n- [ ] Close is called exactly once, even on error.\n- [ ] Multiple errors (write + close) are joined so both are matchable.\n- [ ] SaveFile calls os.Create and returns its error for file-not-found etc.\n- [ ] SaveFile delegates the write/close logic to WriteLines.\n\n---\n\n## Project: Bank Ledger\n\n### Readable Solution\n\nThe ledger demonstrates:\n\n- Custom error types (`AccountError`, `LineError`) with structured data (operation, account, line number).\n- Sentinel errors for matchable causes (ErrInsufficientFunds, ErrUnknownAccount, etc.).\n- Wrapping errors with context at the appropriate layer.\n- Continuing on errors (Process keeps going after a failed transaction, collecting all failures).\n- Atomic transfers (all checks run before any balance changes).\n\n**Key design:**\n\n- `Ledger.Transfer` is atomic: it checks both accounts, amounts, and overflow *before* any balance changes. If any check fails, both accounts are left unchanged.\n- `Process` reads lines, parses commands, and applies them. Each failure is recorded as a `*LineError` (line number + cause), and processing continues.\n- `Result.Err()` returns `errors.Join` of all failures, or nil if there are none.\n- `Run` is a testable CLI that can accept stdin or a file, prints failures (unless -q), and returns the correct exit code.\n\n### Optimized Solution\n\nThe readable solution is efficient; no major optimization needed. Possible improvements:\n\n- Batch processing (apply multiple transactions in one critical section under a mutex, if concurrency were added).\n- Caching balances to avoid map lookups.\n\n### Grading Checklist: Ledger Type\n\n- [ ] New() returns an initialized ledger.\n- [ ] Open(account, initial) creates an account with the given balance, returns error if the account exists or balance is negative.\n- [ ] Balance(account) returns the balance, returns error if the account doesn't exist.\n- [ ] Accounts() returns all account names in sorted order.\n- [ ] Deposit(account, amount) adds to an account, validates amount > 0, account exists, no overflow.\n- [ ] Withdraw(account, amount) subtracts from an account, validates amount > 0, account exists, sufficient funds.\n- [ ] Transfer(from, to, amount) is atomic (all checks before any changes), validates both accounts, amount > 0, from != to, sufficient funds, no overflow. Reports the account at fault.\n\n### Grading Checklist: Error Types\n\n- [ ] AccountError struct has Op, Account, Err.\n- [ ] AccountError.Error() and Unwrap() are implemented correctly.\n- [ ] Sentinel errors are declared and used consistently.\n\n### Grading Checklist: Process and Parsing\n\n- [ ] LineError struct has Line (1-based), Err.\n- [ ] LineError.Error() and Unwrap() are implemented.\n- [ ] Result struct has Applied, Failures.\n- [ ] Result.Err() returns errors.Join of failures or nil.\n- [ ] Process skips comments and blank lines.\n- [ ] Process parses each command correctly and applies it to the ledger.\n- [ ] Process continues on failure, recording the error.\n- [ ] Process detects syntax errors (unknown command, wrong number of arguments).\n- [ ] ParseAmount parses decimal amounts (\"12.34\", \"0.05\") as cents.\n- [ ] ParseAmount rejects invalid formats (signs, exponents, trailing dot, overflow).\n- [ ] FormatAmount formats cents as a decimal with exactly 2 digits.\n\n### Grading Checklist: CLI (Run)\n\n- [ ] Run parses the -q flag.\n- [ ] Run accepts zero or one positional argument (the file).\n- [ ] Run reads from stdin if FILE is absent or \"-\".\n- [ ] Run opens FILE and returns ExitIO on open errors.\n- [ ] Run prints all failures to stderr unless -q.\n- [ ] Run prints final balances to stdout.\n- [ ] Run prints a summary to stderr.\n- [ ] Run returns ExitOK if no failures, ExitTxFailed if any failed.\n- [ ] Run returns ExitIO on read errors.\n- [ ] Run returns ExitUsage on bad command-line usage or flag parse errors (unless -h, which returns ExitOK).\n\n---\n\n## Common Pitfalls and Grading Notes\n\n### Across All Exercises\n\n1. **Comparing wrapped errors with ==**: Always use `errors.Is` after wrapping. Direct `==` comparison fails.\n2. **Ignoring the Unwrap() method**: Without `Unwrap()`, `errors.Is` and `errors.As` won't work through custom error types.\n3. **Nil pointer in interface**: A function that returns `var e *MyErr = nil; return e` will return a non-nil error interface. Return `nil` explicitly.\n4. **Hiding errors with %v instead of %w**: Using `fmt.Errorf(\"%v\", err)` loses the ability to match the wrapped error with `errors.Is`. Always use `%w`.\n5. **Capitalizing error messages**: Error messages should start lowercase and have no trailing period.\n6. **Redundant \"Error: \" prefix**: Don't prefix error strings with \"Error: \" or \"Failed to ...\".\n\n### configparse\n\n- Ensure `validKey` rejects non-ASCII characters, including UTF-8.\n- The test for line-too-long (bufio.ErrTooLong) checks that sc.Err() is consulted; a common bug is to not check it.\n- Reader errors must be wrapped with context but NOT reported as *ParseError (test checks this distinction).\n\n### lookup\n\n- The sentinel errors must survive wrapping through multiple layers.\n- errors.Is works because Unwrap() is implemented.\n\n### validate\n\n- A valid Signup with surrounding whitespace must succeed (trim before checking).\n- Email validation is strict: no whitespace, exactly one '@', non-empty local and domain, domain must have a dot not at the edges.\n- A nil *FieldError in the error interface is a bug (always return concrete errors from helpers, not typed nil pointers).\n- The Fields helper must walk through both Unwrap() error and Unwrap() []error chains.\n\n### safediv\n\n- Divide must never panic; it checks for the two edge cases.\n- Safely must actually recover (not just catch); test verifies no panic escapes.\n- PanicError.Unwrap() returns the value as an error if it is one (enabling errors.As on runtime.Error).\n\n### closeerr\n\n- Close must be called exactly once, even on error.\n- A close error that occurs alongside a write error must be joinable; both must be matchable with errors.Is.\n- SaveFile must return the PathError from os.Create unchanged (it already has the path and operation).\n\n### Bank Ledger Project\n\n- Balances are stored as int64 cents, not floats.\n- Transfer is atomic: all checks before any state changes.\n- Process must continue on failure (every transaction is attempted).\n- LineError must record the 1-based line number.\n- Exit codes are ExitOK (0), ExitTxFailed (1), ExitUsage (2), ExitIO (3).\n- The -q flag suppresses individual failure messages but not the summary.\n\n---\n\n## Suggested Improvements for Student Code\n\nIf a student's solution works but could be better:\n\n1. **Over-wrapping**: If every function wraps the error, the chain becomes too deep. Be selective: wrap where you add meaningful context, not at every layer.\n2. **Missing Unwrap()**: If a custom error type implements Error() but not Unwrap(), errors.Is and errors.As won't work through it.\n3. **Panic in libraries**: If a student uses panic for expected failures (e.g., invalid input), suggest returning an error instead. Panic is for programmer bugs.\n4. **Ignoring Close errors**: If a student opens a file or creates a resource but doesn't check Close, note that Close can hide data loss (especially on writes).\n5. **String-matching errors**: If a student does `strings.Contains(err.Error(), \"not found\")` instead of using `errors.Is`, point out the fragility.\n\n---\n\n## Testing Notes\n\n- All tests must pass: `go test ./solutions/02-errors/...`\n- All tests must pass with `-race`: `go test -race ./solutions/02-errors/...` (though there is no concurrency in these exercises).\n- `gofmt` must pass: `gofmt -l ./solutions/02-errors/` should print nothing.\n- `go vet` must pass: `go vet ./solutions/02-errors/...` should print nothing.\n", "solDir": "/home/csmith/Workspace/tools/go-course/solutions/02-errors", "dir": "/home/csmith/Workspace/tools/go-course/modules/02-errors"}, {"slug": "03-types-interfaces", "compose": "modules/03-types-interfaces/compose.yaml", "services": ["test", "vet", "bench", "cover", "shell", "solutions"], "title": "Structs, Methods & Interfaces", "lesson": "# Structs, Methods & Interfaces\n\n## Goals\n\nBy the end of this module you'll understand:\n- How to design struct types and methods that make sense together.\n- The difference between value and pointer receivers, and why it matters.\n- Go's implicit interfaces: what they are, how they're used, and why they're powerful.\n- How to embed types and avoid the pitfalls of promotion.\n- The pattern of compile-time assertions to catch interface violations early.\n- How to use interfaces as contracts in your API and how to keep them small.\n- Type assertions and type switches for inspecting interface values at runtime.\n- Common gotchas like nil receivers and nil interface values.\n- How to design with constructors and functional options for clean APIs.\n\n## Concepts\n\n### Structs and Fields\n\nA struct is a sequence of named fields with their types. You create one like this:\n\n```go\ntype Person struct {\n\tName string\n\tAge  int\n\tCity string\n}\n\np := Person{Name: \"Alice\", Age: 30, City: \"NYC\"}\n\nq := p // a copy: structs are values\nq.Age = 31\nfmt.Println(p.Age, q.Age) // 30 31\n```\n\nStructs are values. When you assign a struct to a variable or pass it to a function, Go copies all its fields. If the struct is large (e.g., a thousand-element array), that copy can be expensive\u2014a sign that you might want a pointer instead.\n\nStruct fields can be exported (capitalized, visible outside the package) or unexported (lowercase, private to the package). A common pattern is to hide the implementation details (use unexported fields) and expose only what's needed through methods (see below).\n\n```go\n// Good: hides implementation, exposes behavior\ntype Stack struct {\n\titems []int // unexported\n}\n\nfunc (s *Stack) Push(v int) { s.items = append(s.items, v) }\nfunc (s *Stack) Len() int   { return len(s.items) }\n\nvar s Stack\ns.Push(1)\ns.Push(2)\nfmt.Println(s.Len()) // 2: callers use the methods, never s.items directly\n```\n\n### Methods and Receivers\n\nA method is a function attached to a type. It has a *receiver*\u2014a special parameter between `func` and the method name:\n\n```go\ntype Stack struct{ items []int }\n\nfunc (s *Stack) Push(v int) {\n\ts.items = append(s.items, v)\n}\n\nvar s Stack\ns.Push(7) // Go takes &s for you because s is addressable\nfmt.Println(s.items) // [7]\n```\n\nThe receiver can be any named type (struct, int, string), not just pointers. The question is: should it be a value or a pointer?\n\n#### Value Receivers vs Pointer Receivers\n\n**Value receiver**: the method receives a copy of the value. Changes inside the method don't affect the original.\n\n```go\ntype Point struct {\n\tX, Y float64\n}\n\n// Value receiver: changes are lost\nfunc (p Point) Add(dx, dy float64) {\n\tp.X += dx // only affects the copy\n\tp.Y += dy\n}\n\npoint := Point{1, 2}\npoint.Add(3, 4)\nfmt.Println(point) // still {1 2}\n```\n\n**Pointer receiver**: the method receives a pointer to the original value. Changes affect the original.\n\n```go\ntype Point struct {\n\tX, Y float64\n}\n\n// Pointer receiver: changes persist\nfunc (p *Point) Add(dx, dy float64) {\n\tp.X += dx // affects the original\n\tp.Y += dy\n}\n\npoint := Point{1, 2}\npoint.Add(3, 4)\nfmt.Println(point) // {4 6}\n```\n\n**When to use each** (from [Effective Go](https://go.dev/doc/effective_go#pointers_vs_values)):\n\n- **Pointer receiver** when the method mutates the receiver (including building state through repeated calls).\n- **Pointer receiver** when the struct contains a `sync.Mutex` or another type with no-copy semantics (e.g., `sync.WaitGroup`).\n- **Pointer receiver** when the struct is large (e.g., thousands of fields or a large array); copying is expensive.\n- **Value receiver** for small, immutable types: `time.Time`, slices, maps, functions, channels, and built-in numeric types.\n- **Don't mix**: if any method of a type needs a pointer receiver, give *all* of them pointer receivers. Consistency matters, and it avoids confusion about which methods modify the value.\n\nViolating the \"don't mix\" rule creates subtle bugs. A common pitfall:\n\n```go\ntype Stack struct {\n\titems []int\n}\n\n// BUG: value receiver on a mutating method\nfunc (s Stack) Push(v int) {\n\ts.items = append(s.items, v) // mutation lost\n}\n\nstack := Stack{}\nstack.Push(1)\nfmt.Println(stack.items) // empty\u2014push didn't work!\n```\n\nThe fix is simple: use a pointer receiver.\n\n```go\ntype Stack struct {\n\titems []int\n}\n\nfunc (s *Stack) Push(v int) {\n\ts.items = append(s.items, v)\n}\n\nstack := Stack{}\nstack.Push(1)\nfmt.Println(stack.items) // [1]\n```\n\n#### Method Sets\n\nThe method set of a type `T` is the set of methods with a *value* receiver. The method set of `*T` is the set of *all* methods: both those with value receivers and those with pointer receivers.\n\n```go\ntype Circle struct {\n\tRadius float64\n}\n\n// value receiver\nfunc (c Circle) Area() float64 { return math.Pi * c.Radius * c.Radius }\n\n// pointer receiver\nfunc (c *Circle) SetRadius(r float64) { c.Radius = r }\n\nc := Circle{Radius: 1}\nc.SetRadius(2) // c is addressable, so Go calls (&c).SetRadius(2)\nfmt.Printf(\"%.2f\\n\", c.Area()) // 12.57\n```\n\nThe method set of `Circle` contains only `Area()`. The method set of `*Circle` contains both `Area()` and `SetRadius()`.\n\nThis matters for interfaces (see below). If an interface requires both `Area()` and `SetRadius()`, then:\n\n- A `*Circle` can satisfy it (it has all methods).\n- A `Circle` value cannot (it doesn't have `SetRadius()`), though `&Circle` could.\n\nThis is why compile-time assertions (coming up) are valuable: they catch mismatches early.\n\n### Interfaces\n\nAn interface defines a set of methods. Any type that implements those methods implicitly satisfies the interface\u2014no explicit \"implements\" keyword needed.\n\n```go\n// Reader is an interface; anyone with a Read method implements it.\ntype Reader interface {\n\tRead(p []byte) (n int, err error)\n}\n\n// *os.File has a Read method, so *os.File is a Reader.\n// *bytes.Buffer has a Read method, so *bytes.Buffer is a Reader.\n\nvar _ Reader = (*os.File)(nil)\nvar _ Reader = (*bytes.Buffer)(nil)\n\nvar r Reader = strings.NewReader(\"so is *strings.Reader\")\nb, _ := io.ReadAll(r)\nfmt.Println(string(b))\n```\n\nBecause interfaces are implicit, you can define them *where they are used*, not next to the implementation. This decouples your code and makes it more flexible.\n\n```go\n// Bad: interface defined with the implementation (package userdb)\ntype User struct{ Name string }\n\ntype UserStorer interface {\n\tGetUser(id int) (*User, error)\n}\n\ntype PostgresDB struct{ users map[int]*User }\n\nfunc (p *PostgresDB) GetUser(id int) (*User, error) {\n\tu, ok := p.users[id]\n\tif !ok {\n\t\treturn nil, fmt.Errorf(\"user %d not found\", id)\n\t}\n\treturn u, nil\n}\n\n// The producer now dictates the abstraction to every consumer.\nvar store UserStorer = &PostgresDB{users: map[int]*User{1: {\"Ada\"}}}\nu, _ := store.GetUser(1)\nfmt.Println(u.Name)\n```\n\n```go\n// Good: interface defined by the consumer (package service)\ntype User struct{ Name string }\n\ntype UserStorer interface {\n\tGetUser(id int) (*User, error)\n}\n\ntype Service struct{}\n\nfunc (s *Service) FindUser(id int, store UserStorer) (*User, error) {\n\treturn store.GetUser(id)\n}\n\n// A test fake satisfies it without importing anything from service.\ntype fakeStore struct{}\n\nfunc (fakeStore) GetUser(id int) (*User, error) { return &User{Name: \"Test User\"}, nil }\n\nu, _ := (&Service{}).FindUser(1, fakeStore{})\nfmt.Println(u.Name) // Test User\n```\n\nThe second approach means a new implementation (e.g., a mock for testing) doesn't need to import the service package or even know it exists. It just implements the methods it cares about.\n\n**Keep interfaces small.** The Go philosophy: \"The bigger the interface, the weaker the abstraction.\" Small interfaces are easier to implement, compose, and test.\n\n```go\n// Good: focused interfaces (the same shape as io.Reader and io.Writer)\ntype Reader interface {\n\tRead(p []byte) (n int, err error)\n}\n\ntype Writer interface {\n\tWrite(p []byte) (n int, err error)\n}\n\n// Each parameter asks for only the method it uses.\nfunc Copy(dst Writer, src Reader) error {\n\t_, err := io.Copy(dst, src)\n\treturn err\n}\n\nerr := Copy(os.Stdout, strings.NewReader(\"hello from a Reader\\n\"))\nfmt.Println(err) // <nil>\n```\n\nAvoid huge interfaces, especially ones with dozens of methods. If your interface has 10+ methods, consider breaking it into smaller pieces.\n\n#### Implicit Satisfaction\n\nUnlike languages with explicit `implements` keywords, Go types satisfy interfaces automatically if they have all the required methods. This is powerful but can be surprising:\n\n```go\ntype Greeter interface {\n\tGreet() string\n}\n\ntype Robot struct{}\n\nfunc (r Robot) Greet() string { return \"beep boop\" }\n\nvar g Greeter = Robot{} // OK: Robot implements Greeter\n\nfmt.Println(g.Greet()) // beep boop\n```\n\nThere's no \"Greeter\" declaration in the Robot type; Go checks at compile time whether the method set covers the interface. This makes it easy to retrofit code with interfaces.\n\n#### The `Stringer` Interface\n\nMany standard library functions (like `fmt.Println`, `fmt.Sprintf`) use the `fmt.Stringer` interface:\n\n```go\ntype Stringer interface {\n\tString() string\n}\n\ntype Celsius float64\n\nfunc (c Celsius) String() string { return fmt.Sprintf(\"%.1f\u00b0C\", float64(c)) }\n\nvar s Stringer = Celsius(21.5)\nfmt.Println(s.String(), Celsius(30)) // 21.5\u00b0C 30.0\u00b0C: fmt finds the same method\n```\n\nIf your type has a `String()` method, `fmt.Println` calls it automatically. This is how you customize printing:\n\n```go\ntype Color int\n\nconst (\n\tRed Color = iota\n\tGreen\n\tBlue\n)\n\nfunc (c Color) String() string {\n\tswitch c {\n\tcase Red:\n\t\treturn \"red\"\n\tcase Green:\n\t\treturn \"green\"\n\tcase Blue:\n\t\treturn \"blue\"\n\tdefault:\n\t\treturn \"unknown\"\n\t}\n}\n\nfmt.Println(Red) // Output: red\n```\n\n**A gotcha**: if `String()` has a pointer receiver, then printing a *value* won't call it (a value's method set has no pointer-receiver methods):\n\n```go\ntype Color int\n\nconst Red Color = 0\n\nfunc (c *Color) String() string { return \"red\" }\n\nc := Red\nfmt.Println(c)  // 0: a Color value has no String method; only *Color does\nfmt.Println(&c) // red: the pointer has it\n```\n\n**Another gotcha**: infinite recursion. This pattern causes a stack overflow:\n\n```go expect=runtime-error\ntype Color int\n\nfunc (c Color) String() string {\n\treturn fmt.Sprintf(\"%v\", c) // calls String again! (go vet warns about this)\n}\n\n// Fix: convert to the underlying type\n//\n//\tfunc (c Color) String() string {\n//\t\treturn fmt.Sprintf(\"%v\", int(c))\n//\t}\n\nfmt.Println(Color(1)) // fatal error: stack overflow\n```\n\n### Embedding and Composition\n\nGo doesn't have inheritance, but it does have *embedding*: a struct can include another struct (or interface) as a field without a name. The embedded type's methods are *promoted* to the embedding type.\n\n```go\ntype Animal struct {\n\tName string\n}\n\nfunc (a Animal) Speak() string { return a.Name + \" makes a sound\" }\n\ntype Dog struct {\n\tAnimal          // embedded: no field name\n\tBreed  string\n}\n\ndog := Dog{\n\tAnimal: Animal{Name: \"Buddy\"},\n\tBreed:  \"Golden Retriever\",\n}\n\nfmt.Println(dog.Speak()) // \"Buddy makes a sound\"\n```\n\nThe `Speak()` method is promoted to `Dog`, so you can call it directly. But the receiver of the promoted method is the embedded value, not the outer struct. There is **no virtual dispatch back to the outer type**:\n\n```go\ntype Animal struct {\n\tName string\n}\n\nfunc (a Animal) Speak() string     { return a.Name + \" makes a sound\" }\nfunc (a Animal) Introduce() string { return \"I'm \" + a.Name + \". \" + a.Speak() }\n\ntype Dog struct {\n\tAnimal\n\tBreed string\n}\n\nfunc (d Dog) Speak() string { return d.Name + \" barks\" }\n\ndog := Dog{Animal: Animal{Name: \"Buddy\"}}\nfmt.Println(dog.Speak()) // Buddy barks (Dog.Speak hides Animal.Speak)\n\n// Introduce is promoted from Animal, and inside it the receiver is the\n// Animal, so a.Speak() is Animal.Speak, never Dog.Speak:\nfmt.Println(dog.Introduce()) // I'm Buddy. Buddy makes a sound\n```\n\nThis isn't inheritance; it's just method promotion. The embedded type's receiver is always the embedded value.\n\n**Common pitfall: exported struct embedding**. Embedding an unexported type in an exported struct leaks that type's API. This couples your code to the embedded type and makes it harder to refactor:\n\n```go\ntype DB struct{} // stands in for *sql.DB\n\nfunc (*DB) Query(q string) string { return \"rows for \" + q }\nfunc (*DB) Close() error          { return nil }\n\n// Bad: client code can now access DB's fields and methods directly\ntype LeakyService struct {\n\t*DB\n}\n\n// Good: explicit composition\ntype DatabaseService struct {\n\tdb *DB\n}\n\nfunc (s *DatabaseService) Query(query string) string { return s.db.Query(query) }\n\nleaky := LeakyService{&DB{}}\nleaky.Close() // anyone can close your connection pool\ngood := DatabaseService{&DB{}}\nfmt.Println(good.Query(\"users\")) // only the methods you chose\n```\n\nAnother pitfall: **embedding a Mutex in an exported struct**. The Mutex's `Lock()` and `Unlock()` methods are promoted to the struct, which defeats the purpose of hiding synchronization:\n\n```go\n// Bad: Lock and Unlock are exposed\ntype LeakyCache struct {\n\tsync.Mutex\n\titems map[string]string\n}\n\nleaky := LeakyCache{}\nleaky.Lock() // public API\u2014not what you want\nleaky.Unlock()\n\n// Good: unexported named field\ntype Cache struct {\n\tmu    sync.Mutex\n\titems map[string]string\n}\n\nfunc (c *Cache) Get(key string) string {\n\tc.mu.Lock()\n\tdefer c.mu.Unlock()\n\treturn c.items[key]\n}\n\ncache := &Cache{items: map[string]string{\"k\": \"v\"}}\nfmt.Println(cache.Get(\"k\")) // v\n```\n\n**Embedding interfaces** in other interfaces is idiomatic and useful:\n\n```go\ntype ReadCloser interface {\n\tio.Reader\n\tio.Closer\n}\n\n// equivalent to:\ntype ReadCloserSpelledOut interface {\n\tRead(p []byte) (n int, err error)\n\tClose() error\n}\n\nvar rc ReadCloser = io.NopCloser(strings.NewReader(\"x\"))\nvar rc2 ReadCloserSpelledOut = rc // same method set, so this assignment compiles\nfmt.Println(rc2.Close())          // <nil>\n```\n\n### Type Assertions and Type Switches\n\nAt runtime, an interface value holds both a dynamic type and a dynamic value. You can inspect and extract them with **type assertions**:\n\n```go\nvar r io.Reader = os.Stdin\n\n// Assert that r is a *os.File\nf, ok := r.(*os.File)\nif ok {\n\tfmt.Println(\"It's a file:\", f.Name())\n} else {\n\tfmt.Println(\"Not a file\")\n}\n```\n\nAlways use the comma-ok form (`v, ok := expr.(T)`); a bare assertion panics if the type doesn't match:\n\n```go expect=runtime-error\nvar r io.Reader = strings.NewReader(\"not a file\")\nf := r.(*os.File) // panics: interface conversion: io.Reader is *strings.Reader, not *os.File\nfmt.Println(f)\n```\n\nFor multiple possible types, use a **type switch**:\n\n```go\nfunc describe(v interface{}) {\n\tswitch v := v.(type) {\n\tcase string:\n\t\tfmt.Printf(\"string: %q\\n\", v)\n\tcase int:\n\t\tfmt.Printf(\"int: %d\\n\", v)\n\tcase fmt.Stringer:\n\t\tfmt.Printf(\"Stringer: %s\\n\", v.String())\n\tdefault:\n\t\tfmt.Printf(\"unknown: %T\\n\", v)\n\t}\n}\n\ndescribe(\"go\")        // string: \"go\"\ndescribe(42)          // int: 42\ndescribe(time.Second) // Stringer: 1s\ndescribe(3.14)        // unknown: float64\n```\n\nThe type switch unwraps the dynamic type for each case. This is cleaner than repeated assertions.\n\n**Important: wrapped errors.** If an error is wrapped with `%w`, the dynamic type of the error interface is the outer wrapper, not the underlying error. Type switches on the outer error won't catch the inner type:\n\n```go\ntype MyError struct{ msg string }\nfunc (e *MyError) Error() string { return e.msg }\n\nerr := fmt.Errorf(\"operation failed: %w\", &MyError{\"inner\"})\n\n// Type switch checks the outer *fmt.wrapError, not *MyError:\nswitch err.(type) {\ncase *MyError:\n\tfmt.Println(\"caught inner error\")  // this won't run\ndefault:\n\tfmt.Println(\"outer error\")  // this runs\n}\n\n// Use errors.Is or errors.As to inspect wrapped errors:\nif errors.Is(err, &MyError{}) {\n\t// doesn't work\u2014Is uses == comparison\n}\n\nvar me *MyError\nif errors.As(err, &me) {\n\tfmt.Println(\"unwrapped:\", me.msg)  // this works\n}\n```\n\n### The Nil Interface Value Gotcha\n\nAn interface value is nil only if both its dynamic type and dynamic value are nil. A common mistake:\n\n```go\ntype MyError struct{ msg string }\n\nfunc (e *MyError) Error() string { return e.msg }\n\nfunc doSomething() error {\n\tvar e *MyError // nil pointer\n\treturn e       // returns interface holding (type=*MyError, value=nil)\n}\n\nerr := doSomething()\nif err != nil { // true! The interface is not nil.\n\tfmt.Printf(\"err != nil, and it holds %T\\n\", err) // err != nil, and it holds *main.MyError\n}\n```\n\nThe interface value is *not* nil because it holds a type (`*MyError`). This trips up beginners constantly. The fix is to return `nil` explicitly:\n\n```go\nfunc doSomething(ok bool) error {\n\tif ok {\n\t\treturn nil // explicit nil\n\t}\n\treturn fmt.Errorf(\"something went wrong\")\n}\n\nfmt.Println(doSomething(true) == nil) // true\n```\n\nOr, design your error types so the zero value is never valid:\n\n```go\ntype MyError struct {\n\tCode    int\n\tMessage string\n}\n\nfunc (e *MyError) Error() string {\n\treturn fmt.Sprintf(\"code %d: %s\", e.Code, e.Message)\n}\n\n// Zero value MyError{} is not meaningful, so it's unlikely to escape.\n\nvar err error = &MyError{Code: 404, Message: \"not found\"}\nfmt.Println(err) // code 404: not found\n```\n\n### Compile-Time Assertions\n\nYou can assert at compile time that a type implements an interface using a blank identifier:\n\n```go\ntype MyType struct{}\n\nfunc (*MyType) Read(p []byte) (int, error) { return 0, io.EOF }\n\ntype MyValue struct{}\n\nfunc (MyValue) String() string { return \"my value\" }\n\nvar _ io.Reader = (*MyType)(nil)\nvar _ fmt.Stringer = MyValue{}\n\nfmt.Println(MyValue{}) // compiles, so both assertions hold: my value\n```\n\nThe compiler checks whether `*MyType` has all the methods of `io.Reader`. If not, the assignment fails and the code won't compile. This is a cheap way to catch interface violations early. Here `ConsoleLogger` forgot `Logf`; run it to read the compiler's error:\n\n```go expect=compile-error\ntype Logger interface {\n\tLog(msg string)\n\tLogf(format string, args ...any)\n}\n\ntype ConsoleLogger struct{}\n\nfunc (l *ConsoleLogger) Log(msg string) { fmt.Println(msg) }\n\n// Missing Logf: this line fails to compile, naming the missing method\nvar _ Logger = (*ConsoleLogger)(nil)\n```\n\nAdd the missing method and the assertion compiles. Note that the assertion uses `(*ConsoleLogger)(nil)`: the methods have pointer receivers, so only `*ConsoleLogger` is a `Logger`. `var _ Logger = ConsoleLogger{}` would still fail.\n\n```go\ntype Logger interface {\n\tLog(msg string)\n\tLogf(format string, args ...any)\n}\n\ntype ConsoleLogger struct{}\n\nfunc (l *ConsoleLogger) Log(msg string)                 { fmt.Println(msg) }\nfunc (l *ConsoleLogger) Logf(format string, args ...any) { fmt.Printf(format+\"\\n\", args...) }\n\n// Now this succeeds\nvar _ Logger = (*ConsoleLogger)(nil)\n\nvar log Logger = &ConsoleLogger{}\nlog.Logf(\"%d methods, all present\", 2)\n```\n\n### Constructors and the \"New\" Convention\n\nFor types with unexported fields or complex setup, define a constructor function:\n\n```go\ntype Server struct {\n\thost string\n\tport int\n}\n\nfunc NewServer(host string, port int) *Server {\n\treturn &Server{host: host, port: port}\n}\n\ns := NewServer(\"localhost\", 8080)\nfmt.Printf(\"%+v\\n\", *s) // {host:localhost port:8080}\n```\n\nThe constructor is typically named `New<TypeName>`. It should validate inputs and return a properly initialized value. For errors, return a tuple:\n\n```go\ntype Server struct {\n\thost string\n\tport int\n}\n\nfunc NewServer(host string, port int) (*Server, error) {\n\tif port < 1 || port > 65535 {\n\t\treturn nil, fmt.Errorf(\"invalid port %d\", port)\n\t}\n\treturn &Server{host: host, port: port}, nil\n}\n\n_, err := NewServer(\"localhost\", 70000)\nfmt.Println(err) // invalid port 70000\n```\n\n### Functional Options Pattern\n\nWhen a type has many optional parameters, the functional options pattern is idiomatic:\n\n```go\ntype Server struct {\n\thost         string\n\tport         int\n\treadTimeout  time.Duration\n\twriteTimeout time.Duration\n\tmaxConns     int\n}\n\n// Option is a function that modifies a Server\ntype Option func(*Server) error\n\nfunc WithPort(port int) Option {\n\treturn func(s *Server) error {\n\t\tif port < 1 || port > 65535 {\n\t\t\treturn fmt.Errorf(\"invalid port %d\", port)\n\t\t}\n\t\ts.port = port\n\t\treturn nil\n\t}\n}\n\nfunc WithReadTimeout(d time.Duration) Option {\n\treturn func(s *Server) error {\n\t\tif d <= 0 {\n\t\t\treturn errors.New(\"timeout must be positive\")\n\t\t}\n\t\ts.readTimeout = d\n\t\treturn nil\n\t}\n}\n\n// New applies defaults and then the options in order\nfunc New(host string, opts ...Option) (*Server, error) {\n\ts := &Server{\n\t\thost:         host,\n\t\tport:         8080,\n\t\treadTimeout:  5 * time.Second,\n\t\twriteTimeout: 10 * time.Second,\n\t\tmaxConns:     100,\n\t}\n\tfor _, opt := range opts {\n\t\tif opt == nil { // skip nil options\n\t\t\tcontinue\n\t\t}\n\t\tif err := opt(s); err != nil {\n\t\t\treturn nil, fmt.Errorf(\"invalid option: %w\", err)\n\t\t}\n\t}\n\treturn s, nil\n}\n\n// Usage\nsrv, err := New(\"localhost\", WithPort(9000), WithReadTimeout(3*time.Second))\n\nfmt.Println(srv.port, srv.readTimeout, srv.writeTimeout, srv.maxConns, err) // 9000 3s 10s 100 <nil>: options applied, defaults kept\n\n_, err = New(\"localhost\", WithPort(70000))\nfmt.Println(err) // invalid option: invalid port 70000\n```\n\nThis pattern gives you:\n- Fluent, readable APIs: `New(host, WithPort(...), WithTimeout(...))`.\n- Extensibility: add new options without breaking existing code (no function signature changes).\n- Validation: each option can report errors.\n- Optional parameters: skip any options you don't need (no positional `nil` arguments).\n\n### Sorting: `slices.SortFunc` vs `sort.Slice`\n\nIn Go 1.21+, use `slices.SortFunc` (from the `slices` package) to sort with a custom comparison function:\n\n```go\ntype Product struct {\n\tName  string\n\tPrice int\n}\n\nproducts := []Product{{\"pen\", 3}, {\"book\", 12}, {\"mug\", 8}}\n\n// Sort by price, ascending\nslices.SortFunc(products, func(a, b Product) int {\n\treturn cmp.Compare(a.Price, b.Price)\n})\nfmt.Println(products) // [{pen 3} {mug 8} {book 12}]\n```\n\nThe comparison function takes two elements and returns:\n- A negative number if the first should come before the second.\n- 0 if they're equal.\n- A positive number if the first should come after the second.\n\nThe `cmp.Compare` function (from package `cmp`, Go 1.21+) implements this for ordered types.\n\nFor descending order, negate the result:\n\n```go\ntype Product struct {\n\tName  string\n\tPrice int\n}\n\nproducts := []Product{{\"pen\", 3}, {\"book\", 12}, {\"mug\", 8}}\nslices.SortFunc(products, func(a, b Product) int {\n\treturn -cmp.Compare(a.Price, b.Price) // or cmp.Compare(b.Price, a.Price)\n})\nfmt.Println(products) // [{book 12} {mug 8} {pen 3}]\n```\n\nFor stable sorting (preserving the relative order of equal elements), use `slices.SortStableFunc`.\n\nThe older `sort.Slice` takes a `less(i, j int) bool` func over indices and works through reflection, and `sort.Sort` needs a type with `Len`, `Less`, and `Swap` methods. Both are more verbose and slower. Prefer `slices.SortFunc`.\n\n## Idioms & Best Practices\n\n- **Accept interfaces, return concrete types:** functions should accept interface parameters (for flexibility) but return concrete types (so callers can call more methods without a type assertion). The exception is `error`.\n  ```go\n  // Good: accepts any io.Reader, returns a concrete []byte\n  func ReadAll(r io.Reader) ([]byte, error) { return io.ReadAll(r) }\n\n  // Bad: takes a filename (can't pass a buffer in a test) and returns an\n  // interface (callers can only call Read).\n  func OpenFile(filename string) io.Reader {\n  \tf, _ := os.Open(filename)\n  \treturn f\n  }\n\n  b, _ := ReadAll(strings.NewReader(\"abc\"))\n  fmt.Println(b[0], len(b)) // 97 3: callers can index it\n  _ = OpenFile\n  ```\n\n- **Avoid interface{} (any):** use `any` (a synonym for `interface{}`) sparingly. It says nothing and often hides bugs. Prefer concrete types or concrete interfaces.\n  ```go\n  // Bad: anything goes; mistakes surface at run time\n  func ProcessAny(v any) {\n  \tif r, ok := v.(io.Reader); ok {\n  \t\tio.Copy(io.Discard, r)\n  \t}\n  }\n\n  // Better: the compiler checks callers\n  func Process(r io.Reader) {\n  \tn, _ := io.Copy(io.Discard, r)\n  \tfmt.Println(\"processed\", n, \"bytes\")\n  }\n\n  ProcessAny(42) // compiles, silently does nothing\n  Process(strings.NewReader(\"hello\"))\n  ```\n\n- **Don't use pointers to interfaces:** it's almost never the right thing. Interfaces are already reference types; a pointer to an interface is usually a mistake.\n  ```go\n  // Bad: a pointer to an interface\n  func SetupPtr(w *io.Writer) { fmt.Fprintln(*w, \"setup (ptr)\") }\n\n  // Good: the interface value already refers to the writer\n  func Setup(w io.Writer) { fmt.Fprintln(w, \"setup\") }\n\n  var w io.Writer = os.Stdout\n  SetupPtr(&w) // awkward at every call site\n  Setup(os.Stdout)\n  ```\n\n- **Consistent receiver types:** if any method of a type uses a pointer receiver, all should. This prevents confusion and matches Go conventions.\n  ```go\n  type Cache struct {\n  \tmu    sync.Mutex\n  \titems map[string]string\n  }\n\n  // All pointer receivers\n  func (c *Cache) Get(key string) string {\n  \tc.mu.Lock()\n  \tdefer c.mu.Unlock()\n  \treturn c.items[key]\n  }\n\n  func (c *Cache) Set(key, value string) {\n  \tc.mu.Lock()\n  \tdefer c.mu.Unlock()\n  \tif c.items == nil {\n  \t\tc.items = make(map[string]string)\n  \t}\n  \tc.items[key] = value\n  }\n\n  var c Cache\n  c.Set(\"lang\", \"go\")\n  fmt.Println(c.Get(\"lang\")) // go\n  ```\n\n- **Embed unexported types with care:** if you expose a struct, think twice before embedding another struct. It couples you to that struct's API. Often a named field is cleaner.\n  ```go\n  type DB struct{} // stands in for *sql.DB\n\n  func (*DB) Exec(q string) {}\n\n  // Bad: exposes DB's methods\n  type LeakyUserDB struct{ *DB }\n\n  // Good: hides the implementation\n  type UserDB struct{ db *DB }\n\n  func (u *UserDB) GetUser(id int) string { return fmt.Sprint(\"user \", id) }\n\n  LeakyUserDB{&DB{}}.Exec(\"DROP TABLE users\") // allowed!\n  fmt.Println((&UserDB{&DB{}}).GetUser(1))\n  ```\n\n- **Use the zero value:** design types so their zero value is useful. `var mu sync.Mutex` works; `var sb strings.Builder` works. If the zero value is broken, the type is hard to use.\n\n- **Validate at the boundary:** constructors and public methods should validate inputs. Unexported types and methods can assume they're called correctly.\n\n- **Copy mutable arguments and results:** if a method takes or returns a slice or map, decide whether callers own it or you do. If you own it, make a copy or document the ownership rules clearly.\n  ```go\n  type Cache struct{ keys []string }\n\n  // Good: caller is guaranteed not to affect internal state\n  func (c *Cache) Keys() []string {\n  \treturn slices.Clone(c.keys) // copy\n  }\n\n  c := &Cache{keys: []string{\"a\", \"b\"}}\n  k := c.Keys()\n  k[0] = \"changed\"\n  fmt.Println(c.keys) // [a b]\n  ```\n\n## Common Pitfalls\n\n- **Mixing receiver types:** inconsistent receiver types (some value, some pointer) confuse callers and lead to subtle bugs. Choose one style and stick to it.\n\n- **Value receivers on mutating methods:** a value receiver mutates a copy, not the original. If the method should mutate, use a pointer.\n\n- **Returning nil pointers through interface types:** `var e *MyError; return e` returns a non-nil interface because the type is `*MyError`. Always return `nil` explicitly when successful.\n\n- **Forgetting the method set:** `T` and `*T` have different method sets. An interface requiring a pointer-receiver method cannot be satisfied by a value.\n\n- **Embedding types you don't control:** embedding `sql.DB` or `http.Server` exposes their entire API to your users. Use composition with a named field instead.\n\n- **Infinite recursion in `String()`:** the pattern `fmt.Sprintf(\"%v\", m)` inside `String()` recurses forever. Convert to the underlying type: `fmt.Sprintf(\"%v\", int(m))`.\n\n- **Interfaces with a single implementation:** if an interface has only one implementation and is created just for testing, you probably don't need it. Interfaces are for flexibility, not just mocking.\n\n- **Large interfaces:** a 20-method interface is a sign that your design needs rethinking. Break it into smaller pieces.\n\n## Exercises\n\nEach exercise is in `exercises/<pkg>/` with starter code and tests. The tests fail until you implement the functions.\n\n**Run each exercise with:** `go test ./modules/03-types-interfaces/exercises/<pkg>/`\n\n### Exercise 1: shapes\n\nImplement a `Shape` interface with `Area()` and `Perimeter()` methods. Create three types: `Circle`, `Rect` and `Triangle`. Add a `String()` method to each (the `fmt.Stringer` interface) so they print nicely. Implement helper functions `TotalArea`, `Largest`, and `SortByArea`. Add compile-time assertions proving each type implements both `Shape` and `fmt.Stringer`.\n\n**Test command:** `go test ./modules/03-types-interfaces/exercises/shapes/`\n\n### Exercise 2: stack\n\nThe starter code defines a `Stack` type with value receivers on mutating methods. This is a bug. Fix the receivers, then implement the missing methods (`Peek`, `Values`, `Clone`, `String`). The `Values()` method should return a copy, not leak the internal slice. The `Clone()` method should return an independent copy. The `String()` method should format the stack as \"Stack[1 2 3]\".\n\n**Test command:** `go test ./modules/03-types-interfaces/exercises/stack/`\n\n### Exercise 3: describe\n\nImplement a `Describe` function that takes an interface{} value and returns a formatted string describing it using a type switch. Handle many types in priority order:\n\n1. `nil` (untyped) \u2192 `\"nil\"`\n2. `error` \u2192 `\"error: \" + v.Error()`  (checked before Stringer!)\n3. `fmt.Stringer` \u2192 `\"Stringer: \" + v.String()`\n4. `bool` \u2192 `\"bool true\"` or `\"bool false\"`\n5. Integer types (`int`, `int8`, `int16`, `int32`, `int64`, `uint`, `uint8`, `uint16`, `uint32`, `uint64`) \u2192 `\"<type> <value>\"`\n6. `float32` and `float64` \u2192 `\"<type> <value>\"` using the shortest representation\n7. `string` \u2192 `` `string \"hello\"` `` (using `strconv.Quote` for escaping)\n8. `[]byte` \u2192 `\"[]byte len=N\"`\n9. `[]any` \u2192 `\"[elem1, elem2, ...]\"` (recursive, comma-separated)\n10. `map[string]any` \u2192 `\"map[key1: val1, key2: val2]\"` (sorted by key, recursive)\n11. Everything else \u2192 `\"unknown <type>\"` where `<type>` is from `%T`\n\nAlso implement a `Validate` function that returns an error with the \"nil interface\" gotcha in mind: return the untyped `nil` literal, not a nil pointer.\n\n**Test command:** `go test ./modules/03-types-interfaces/exercises/describe/`\n\n### Exercise 4: logging\n\nDesign a type that combines (embeds) an unexported `Logger` type. The `Logger` has a `Log` method. Write an `Animal` type that embeds the logger and implements a `Speak()` method that logs its output. Demonstrate method promotion and the receiver rules.\n\n**Test command:** `go test ./modules/03-types-interfaces/exercises/logging/`\n\n### Exercise 5: server\n\nUse the functional options pattern to implement a `Server` configuration type with optional parameters: port, read/write timeouts, and max connections. Implement option functions `WithPort`, `WithTimeouts`, `WithMaxConns`, and `WithTLS`. The `New` function should apply defaults, validate options in order, and return an error if any option is invalid.\n\n**Test command:** `go test ./modules/03-types-interfaces/exercises/server/`\n\n## Project\n\nThe **Inventory Manager** project ties everything together. See `project/README.md` for the full spec.\n\nIn brief: implement a `Product` type, a `Store` interface with an in-memory implementation, and an `Inventory` service layer that sells, restocks, filters, sorts and reports. Use methods with appropriate receivers, implement the `Stringer` interface, and practice embedding and composition.\n\n**Test command:** `go test ./modules/03-types-interfaces/project/`\n\n## Submitting for Review\n\nWhen your tests pass, ask your instructor (Claude) to review `modules/03-types-interfaces/`. They'll check:\n- Code style (gofmt, naming, doc comments).\n- Receiver consistency and correctness.\n- Interface design (small, well-scoped).\n- Idiomatic Go patterns and error handling.\n- Test coverage and clarity.\n\n## Further Reading\n\n- [Effective Go: Interfaces and types](https://go.dev/doc/effective_go#interfaces_and_types)\n- [Go Code Review Comments: Interfaces](https://go.dev/wiki/CodeReviewComments#interfaces)\n- [Go Code Review Comments: Receiver type](https://go.dev/wiki/CodeReviewComments#rece
