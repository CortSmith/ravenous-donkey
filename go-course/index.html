ect a clock.\n- **An `Example` without `// Output:`** silently never runs.\n- **A fuzz target with no property** (\"call it and see if it panics\") only\n  finds crashes, never wrong answers.\n- **Benchmarking a wrong function.** A fast wrong answer is worthless. Make\n  the correctness test pass before you look at benchmark numbers.\n- **Trusting one benchmark run.** Noise of \u00b110% is normal on a laptop. Use\n  `-count` and `benchstat`.\n- **Running the fuzzer on several targets at once.** `-fuzz=Fuzz` matches\n  both `FuzzRoundTrip` and `FuzzSplit` and is rejected; anchor the regexp.\n\n## Exercises\n\nGeneral workflow for every exercise:\n\n1. Read the package's doc comments: they are the spec.\n2. Run the starter tests. They pass, which is the problem.\n3. Write tests that pin down the documented behaviour. Run them. They should\n   fail; each failure points at a bug.\n4. Only then fix the code, with the smallest change that makes the test pass.\n5. Ask yourself: \"would my tests fail if someone re-introduced this bug?\"\n\nBug counts are given; the bugs themselves are for you to find.\n\n### 1. csvline \u2014 fuzzing (2 bugs)\n\n`csvline` encodes a list of fields as one CSV line (`Join`) and decodes it\nagain (`Split`). The two bugs are hard to find with hand-written examples.\nWrite:\n\n- `TestJoin`, `TestSplit`: table-driven, including error cases checked with `errors.Is`.\n- `FuzzRoundTrip`: the property is that `Split` undoes `Join`.\n- `FuzzSplit`: arbitrary input must never panic, errors must be the documented sentinels, and whatever is accepted must round-trip.\n\nWhen the fuzzer finds something, read the failing input, add it to your table\ntest with a `// Found by FuzzXxx` comment, then fix the code. Keep the files\nthe fuzzer writes under `testdata/fuzz/`.\n\n```bash\ngo test ./modules/04-testing/exercises/csvline/\ngo test ./modules/04-testing/exercises/csvline/ -run='^$' -fuzz='^FuzzRoundTrip$' -fuzztime=20s\ngo test ./modules/04-testing/exercises/csvline/ -run='^$' -fuzz='^FuzzSplit$' -fuzztime=20s\n```\n\n### 2. paginate \u2014 table tests and boundaries (3 bugs)\n\n`Pages(total, perPage)` counts pages; `Bounds(total, perPage, page)` returns\nthe half-open index range `[start, end)` shown on a page. Write:\n\n- `TestPages` and `TestBounds`: table-driven, covering both sides of every\n  boundary and every documented error.\n- Bonus `TestBoundsCoverEveryItem`: a **property test** without the fuzzer. For\n  every `total` in 0..40 and `perPage` in 1..12, walk all pages and check\n  they cover `[0, total)` exactly once, with no gaps or overlaps.\n- Bonus `ExampleBounds`.\n\n```bash\ngo test ./modules/04-testing/exercises/paginate/\n```\n\n### 3. concat \u2014 oracles, allocations, benchmarks (2 bugs)\n\nThree ways to join strings, each promising to equal `strings.Join`.\n`JoinBuilder` also promises to allocate once. Write:\n\n- `TestJoinersMatchStringsJoin`: one table of inputs, run against every\n  joiner, with `strings.Join` as the **oracle**.\n- `TestJoinBuilderAllocatesOnce`: pin the promise with `testing.AllocsPerRun`.\n- `BenchmarkJoin`: every joiner at 10, 100 and 1000 elements, with\n  `b.Run`, `b.Loop`, `b.ReportAllocs`.\n\nFix correctness first, then read the benchmark. Can you explain *why* the\nfastest one is faster, using the `allocs/op` column?\n\n```bash\ngo test ./modules/04-testing/exercises/concat/\ngo test ./modules/04-testing/exercises/concat/ -run='^$' -bench=. -benchmem\n```\n\n### 4. reminder \u2014 fakes and an injected clock (3 bugs)\n\nA `Scheduler` sends reminders through a `Sender` once a `Clock` says they are\ndue. Write a `fakeClock` (with `Advance`) and a `fakeSender` (records sends,\ncan fail for chosen recipients), then:\n\n- `TestFlushSendsOnlyDueReminders`: what exactly counts as \"due\"?\n- `TestFlushLaterAfterClockAdvances`\n- `TestFlushSendsEarliestFirst`\n- `TestFlushKeepsFailedRemindersForRetry`\n- `TestFlushJoinsAllErrors`\n\nNo `time.Sleep` anywhere.\n\n```bash\ngo test ./modules/04-testing/exercises/reminder/\n```\n\n### 5. report \u2014 golden files (3 bugs)\n\n`Render` prints a bill as a text table. Write:\n\n- `TestRenderGolden`: table-driven, one golden file per case under\n  `testdata/`, with an `-update` flag. Choose cases that vary what real bills\n  vary.\n- `TestMoney`: a white-box unit test for the unexported `money` helper.\n- Bonus: a test of the layout rules that doesn't use golden files, and\n  `ExampleRender`.\n\n**Read every golden file** against `Render`'s doc comment before you trust\nit. If `-update` wrote down a bug, your test now protects the bug.\n\n```bash\ngo test ./modules/04-testing/exercises/report/ -update   # write golden files\n# now READ modules/04-testing/exercises/report/testdata/*.golden\ngo test ./modules/04-testing/exercises/report/\n```\n\n## Project\n\n**Semantic Versioning (\u2264 60 min).** `project/semver` is a complete\nSemVer 2.0.0 parser and comparator with **4 planted bugs** and no tests. Write\na black-box test suite from the [specification](https://semver.org/spec/v2.0.0.html):\ntable tests, the spec's own precedence list, fuzz tests, examples and\nbenchmarks. Reach \u2265 90% coverage, then fix the bugs. Full requirements are in\n[project/README.md](project/README.md).\n\n```bash\ngo test ./modules/04-testing/project/semver/\ngo test -cover ./modules/04-testing/project/semver/\n```\n\n## Submitting for Review\n\nWhen all your tests pass, ask your instructor (Claude) to review\n`modules/04-testing/`. Expect the review to **put each bug back, one at a\ntime, and run your tests**. A bug your tests don't catch is a required\nchange, even if you fixed it in the code.\n\n## Further Reading\n\n- [`testing` package documentation](https://pkg.go.dev/testing): `T`, `B`, `F`, examples, `AllocsPerRun`.\n- [Go wiki: Table-driven tests](https://go.dev/wiki/TableDrivenTests)\n- [Go Code Review Comments: Useful test failures](https://go.dev/wiki/CodeReviewComments#useful-test-failures)\n- [Go blog: Using Subtests and Sub-benchmarks](https://go.dev/blog/subtests)\n- [Go fuzzing documentation](https://go.dev/doc/security/fuzz) and [tutorial](https://go.dev/doc/tutorial/fuzz)\n- [Go blog: More predictable benchmarking with `testing.B.Loop`](https://go.dev/blog/testing-b-loop)\n- [Go blog: The cover story](https://go.dev/blog/cover): how coverage works.\n- [Go blog: Testable Examples in Go](https://go.dev/blog/examples)\n- [`benchstat`](https://pkg.go.dev/golang.org/x/perf/cmd/benchstat): comparing benchmark runs.\n- Mitchell Hashimoto, *Advanced Testing with Go* (GopherCon 2017 talk): fakes, golden files, test helpers in practice.\n", "units": [{"kind": "exercise", "name": "concat", "dir": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/concat", "doc": "Package concat contains several ways to join strings so that you can\nbenchmark them against each other. Every function must return exactly\nwhat strings.Join(elems, sep) returns.\n\nThis package has 2 bugs: one makes a function return the wrong answer,\nthe other makes it allocate far more than its doc comment promises.\nBenchmarking wrong code is pointless, so write the correctness test\nfirst. See concat_test.go.", "readme": "", "files": [{"name": "concat.go", "path": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/concat/concat.go"}, {"name": "concat_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/concat/concat_test.go"}], "cmd": "go test ./modules/04-testing/exercises/concat/", "id": "modules/04-testing/exercises/concat"}, {"kind": "exercise", "name": "csvline", "dir": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/csvline", "doc": "Package csvline encodes a list of fields as one comma-separated line and\ndecodes it again. It is a deliberately small subset of RFC 4180; real\ncode should use encoding/csv.\n\nThis package has 2 bugs. Ordinary example-based tests are unlikely to\nfind them; a fuzz test will. See csvline_test.go.", "readme": "", "files": [{"name": "csvline.go", "path": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/csvline/csvline.go"}, {"name": "csvline_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/csvline/csvline_test.go"}], "cmd": "go test ./modules/04-testing/exercises/csvline/", "id": "modules/04-testing/exercises/csvline"}, {"kind": "exercise", "name": "paginate", "dir": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/paginate", "doc": "Package paginate computes page boundaries for showing a list of results\none page at a time.\n\nThis package has 3 bugs. Write tests in paginate_test.go that expose\nthem, watch the tests fail, then fix the code.", "readme": "", "files": [{"name": "paginate.go", "path": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/paginate/paginate.go"}, {"name": "paginate_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/paginate/paginate_test.go"}], "cmd": "go test ./modules/04-testing/exercises/paginate/", "id": "modules/04-testing/exercises/paginate"}, {"kind": "exercise", "name": "reminder", "dir": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/reminder", "doc": "Package reminder sends reminders once they fall due.\n\nThis package has 3 bugs. Write tests in reminder_test.go that expose\nthem (you will need fake Clock and Sender implementations), watch the\ntests fail, then fix the code.\n\nThe Scheduler talks to the outside world only through two small\ninterfaces, Clock and Sender, so tests can replace both with fakes.", "readme": "", "files": [{"name": "reminder.go", "path": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/reminder/reminder.go"}, {"name": "reminder_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/reminder/reminder_test.go"}], "cmd": "go test ./modules/04-testing/exercises/reminder/", "id": "modules/04-testing/exercises/reminder"}, {"kind": "exercise", "name": "report", "dir": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/report", "doc": "Package report renders an itemised bill as a plain-text table.\n\nThis package has 3 bugs. Write golden-file tests in report_test.go that\nexpose them, check the golden files by eye, then fix the code.", "readme": "", "files": [{"name": "report.go", "path": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/report/report.go"}, {"name": "report_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/04-testing/exercises/report/report_test.go"}], "cmd": "go test ./modules/04-testing/exercises/report/", "id": "modules/04-testing/exercises/report"}, {"kind": "project", "name": "project", "dir": "/home/csmith/Workspace/tools/go-course/modules/04-testing/project", "doc": "", "readme": "# Project: Semantic Versioning Parser\n\nImplement a semantic versioning parser and comparison tool per [semver.org spec v2.0.0](https://semver.org/spec/v2.0.0.html).\n\n## Overview\n\nSemantic versioning follows the format `MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]`:\n- `1.0.0` \u2014 release version.\n- `1.0.0-alpha` \u2014 pre-release version.\n- `1.0.0-rc.1+build.5` \u2014 pre-release with build metadata.\n- `v1.0.0` \u2014 optionally prefixed with \"v\".\n\n**Rules:**\n- MAJOR, MINOR, PATCH are non-negative integers without leading zeros.\n- Pre-release and build are dot-separated identifiers (alphanumeric + hyphen). Pre-release identifiers that are numeric must not have leading zeros.\n- Build metadata is ignored in version precedence (v1.0.0+a == v1.0.0+b).\n- A pre-release version is lower precedence than the release (1.0.0-rc.1 < 1.0.0).\n- Pre-release identifiers compare left-to-right: numeric identifiers numerically, others alphabetically, numeric < non-numeric.\n\n## Starter Code\n\n`semver.go` contains:\n- **Parse(s string) (Version, error)**: parse a version string.\n- **MustParse(s string) Version**: Parse that panics on error (for constants).\n- **Version.String() string**: canonical form without \"v\".\n- **Version.IsPrerelease() bool**: whether it has pre-release identifiers.\n- **Compare(a, b Version) int**: returns -1, 0, or 1 for <, ==, >.\n- **Sort(vs []Version)**: sort versions in ascending precedence.\n\nThe starter code **has 4 planted bugs** and no tests. Your job is to find\nthem the way you would in real life: by testing the code against the\nspecification, not by reading it line by line. The spec at\n[semver.org](https://semver.org/spec/v2.0.0.html) is your oracle; \u00a72, \u00a79,\n\u00a710 and \u00a711 contain every rule you need. One of the bugs makes `Parse`\npanic on a certain input; a fuzz test will find it if your table doesn't.\n\n## Requirements\n\n### Parsing\n\n- Accept optional \"v\" prefix (case-sensitive, only lowercase \"v\").\n- Parse MAJOR.MINOR.PATCH (all required, integers without leading zeros).\n- Optional \"-PRERELEASE\" and \"+BUILD\" suffixes.\n- Validate identifiers (non-empty, alphanumeric + hyphen, numeric ones without leading zeros in prerelease).\n- On failure, return the zero `Version` and an error that wraps `ErrInvalid` (check it with `errors.Is`).\n\n### Comparison\n\nImplement precedence rules from semver spec \u00a711:\n- Compare MAJOR, MINOR, PATCH numerically, in that order.\n- A pre-release is lower than the release (1.0.0-rc < 1.0.0).\n- Pre-release identifiers compare left-to-right.\n- Numeric identifiers compare numerically (e.g., \"2\" < \"10\"), and must not overflow on very long ones.\n- Non-numeric: ASCII order (e.g., \"alpha\" < \"beta\").\n- Numeric < non-numeric (e.g., \"1\" < \"alpha\").\n- Build metadata is completely ignored.\n\n### API\n\n- **Version** struct with exported fields: Major, Minor, Patch (int), Prerelease, Build (string).\n- **ErrInvalid** sentinel error, wrapped by all Parse errors.\n- **Compare** signature: `Compare(a, b Version) int`, compatible with `slices.SortFunc`.\n- **String**, **IsPrerelease**, **Sort** methods as documented.\n\n## Test Requirements\n\nWrite comprehensive tests in `semver_test.go`. The starter skeleton has room for your implementation.\n\n### Table-Driven Tests\n\n- **TestParse**: valid versions (plain, with v, prerelease, build, all combinations).\n- **TestParseInvalid**: every kind of input the spec forbids. Go through the spec rule by rule.\n- **TestMustParse**: panic on invalid, success on valid.\n- **TestString**: round-trip and canonical form.\n- **TestIsPrerelease**: correctly identify pre-releases.\n- **TestCompare**: numeric order, prerelease < release, prerelease comparison rules, build ignored.\n- **TestCompareSpecOrder**: the spec's example precedence list at \u00a711.\n- **TestSort**: stable sort of mixed versions.\n\n### Fuzzing\n\n- **FuzzParse**: seeds with valid/invalid versions; fuzz never panics, errors wrap ErrInvalid, valid versions round-trip (Parse \u2192 String \u2192 Parse).\n- **FuzzCompare**: seeds with pairs; verify antisymmetry (Compare(a,b) == -Compare(b,a)).\n\n### Examples\n\n- **ExampleCompare**: show Compare and the -1/0/+1 result.\n- **ExampleSort**: show Sort on a mixed slice.\n\n### Benchmarks\n\n- **BenchmarkParse**: typical version string.\n- **BenchmarkCompare**: two pre-release versions.\n\n## Coverage\n\nAim for \u226590% code coverage. Check with:\n\n```bash\ngo test ./modules/04-testing/project/semver/ -cover\ngo test ./modules/04-testing/project/semver/ -coverprofile=c.out\ngo tool cover -html=c.out  # browser view\n```\n\n## Verification Checklist\n\n- [ ] `go test ./modules/04-testing/project/semver/` passes all tests.\n- [ ] `go vet ./modules/04-testing/project/semver/` passes.\n- [ ] `go test -cover` shows \u226590% coverage.\n- [ ] Fuzzing: `go test -run='^$' -fuzz=FuzzParse -fuzztime=30s` and `FuzzCompare` pass.\n- [ ] Benchmarks run without panicking: `go test -bench=. -benchmem -run='^$'`.\n- [ ] Code is `gofmt` clean.\n\n## Stretch Goals\n\n1. **Performance**: Optimize Parse or Compare and measure with benchmarks. Document trade-offs (e.g., pre-computing splits vs. parsing on demand).\n2. **Zero-allocation Compare**: `Compare` allocates (it splits the pre-release strings). Write a `CompareFast` that walks both strings with `strings.IndexByte`, prove it equal to `Compare` with a differential fuzz test (`Compare` is the oracle), and show the benchmark difference.\n3. **CLI Tool**: write a `cmd/semver` command-line tool that parses versions and sorts a list.\n\n## Run Tests\n\n```bash\n# Compile and basic tests:\ngo test ./modules/04-testing/project/semver/\n\n# Verbose output:\ngo test ./modules/04-testing/project/semver/ -v\n\n# With race detector:\ngo test -race ./modules/04-testing/project/semver/\n\n# Fuzzing (30 seconds):\ngo test -run='^$' -fuzz=FuzzParse -fuzztime=30s ./modules/04-testing/project/semver/\n\n# Benchmarks:\ngo test -bench=. -benchmem -run='^$' ./modules/04-testing/project/semver/\n\n# Coverage:\ngo test -cover ./modules/04-testing/project/semver/\ngo test -coverprofile=c.out ./modules/04-testing/project/semver/\ngo tool cover -html=c.out\n```\n", "files": [{"name": "README.md", "path": "/home/csmith/Workspace/tools/go-course/modules/04-testing/project/README.md"}, {"name": "semver/semver.go", "path": "/home/csmith/Workspace/tools/go-course/modules/04-testing/project/semver/semver.go"}, {"name": "semver/semver_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/04-testing/project/semver/semver_test.go"}], "cmd": "go test ./modules/04-testing/project/...", "id": "modules/04-testing/project"}], "review": "# Module 04 \u2014 Testing: Instructor Review Guide\n\nThis module is inverted compared with the others: the **code is given, the\ntests are the student's work**. Every starter package contains planted bugs.\nThe student writes tests that expose them, watches the tests fail, then fixes\nthe code. So a review grades two things, in this order:\n\n1. **Do the student's tests catch every planted bug?** (Most important. A\n   fixed `.go` file proves nothing: the student may have spotted the bug by\n   reading.)\n2. Is the test code idiomatic, and is the fix correct and minimal?\n\nAll numbers in this file were measured on **go1.24.2 linux/amd64**\n(20 logical CPUs), `-count=5`, and are rounded. Absolute times will differ on\nother machines; the ratios and allocation counts are what matter.\n\n---\n\n## How to grade: re-plant the bugs (mutation check)\n\nThe student has fixed the bugs, so their tests pass. To prove the tests\n*would have* caught each bug, put the bugs back **one at a time** and run the\nstudent's tests. This is mutation testing done by hand.\n\n```bash\n# from the course root; repeat for each package\nW=$(mktemp -d)\ncp -r modules/04-testing/exercises/paginate/. \"$W\"\nprintf 'module gocourse/modules/04-testing/exercises/paginate\\n\\ngo 1.24\\n' > \"$W/go.mod\"\ncd \"$W\"\n# re-plant ONE bug from the table below, e.g.:\nsed -i 's/if page < 1 ||/if page < 0 ||/' paginate.go\ngo test ./...      # must FAIL; note which test caught it\n```\n\nFor semver the student's test is a black-box test (`package semver_test`)\nimporting `gocourse/modules/04-testing/project/semver`, which is why the\n`go.mod` above names the module path rather than an arbitrary one.\n\nA bug the student's suite does not catch is a **required change**, even if\ntheir `.go` fix is correct.\n\nEach bug below was verified this way against the reference tests: every one,\napplied alone to the reference solution, makes `go test` fail, and the\n\"caught by\" column lists the tests that failed.\n\n---\n\n## Bug inventory (17 bugs)\n\n| Package | # | Bug (one-line mutation of the solution) | Caught by (reference tests) |\n|---|---|---|---|\n| csvline | 1 | `Join`: quote test omits `\"` \u2014 `ContainsAny(f, \",\\r\\n\")` | `TestJoin/{quote_inside,leading_quote,just_a_quote}`, `FuzzRoundTrip` |\n| csvline | 2 | `Split`: error snippet `line[i:i+8]` panics on short input | `TestSplit/short_junk_after_closing_quote`, `FuzzSplit` |\n| concat | 1 | `JoinBuilder` skips empty elements (`if e == \"\" { continue }`) | `TestJoinersMatchStringsJoin/Builder/{empty_middle,empty_last,all_empty}`, `ExampleJoinBuilder` |\n| concat | 2 | `JoinBuilder` under-sizes `Grow` (`len(elems)*len(sep)`) | `TestJoinBuilderAllocatesOnce` (5 allocs vs \u22641) |\n| paginate | 1 | `Pages` returns `total/perPage + 1` | `TestPages/{no_items,exactly_one_page,exact_multiple,one_item_per_page}`, `TestBounds/page_after_exact_multiple`, `TestBoundsCoverEveryItem` |\n| paginate | 2 | `Bounds` accepts page 0 (`page < 0`) | `TestBounds/page_zero`, `TestBoundsCoverEveryItem` |\n| paginate | 3 | `Bounds` doesn't clamp `end` to `total` | `TestBounds/{last_partial_page,fewer_items_than_a_page}`, `TestBoundsCoverEveryItem`, `ExampleBounds` |\n| report | 1 | total adds unit price, not `Qty*Price` | `TestRenderGolden/{basic,cents,unicode,wide_numbers}`, `TestRenderLayoutRules`, `ExampleRender` |\n| report | 2 | column width uses `len` (bytes), not runes | `TestRenderGolden/unicode`, `TestRenderLayoutRules` |\n| report | 3 | `money` uses `%d.%d` (5\u00a2 \u2192 `0.5`) | `TestMoney`, `TestRenderGolden/*`, `TestRenderLayoutRules`, `ExampleRender` |\n| reminder | 1 | `Flush` doesn't sort by due time | `TestFlushSendsEarliestFirst` |\n| reminder | 2 | due test `!Due.Before(now)` \u2014 a reminder due exactly now is not sent | `TestFlushSendsOnlyDueReminders/exactly_now`, `TestFlushLaterAfterClockAdvances` |\n| reminder | 3 | failed sends are dropped instead of kept for retry | `TestFlushKeepsFailedRemindersForRetry` |\n| semver | 1 | MAJOR/MINOR/PATCH leading zeros accepted (`01.2.3`) | `TestParseInvalid/{01.2.3,1.02.3,1.2.00}` |\n| semver | 2 | empty identifiers accepted; `1.2.3-` **panics** (`isNumeric(\"\")` is true, then `id[0]`) | `TestParseInvalid/{1.2.3-,1.2.3-a.,1.2.3-a..b,1.2.3+,1.2.3+a..b}` |\n| semver | 3 | a release does not outrank its pre-releases (`1.0.0-rc.1 < 1.0.0` fails) | `TestCompare/1.0.0-rc.1_vs_1.0.0`, `TestCompareSpecOrder`, `TestSort`, `ExampleCompare`, `ExampleSort` |\n| semver | 4 | numeric pre-release ids compared as strings (`alpha.10 < alpha.2`) | `TestCompare/1.0.0-alpha.2_vs_1.0.0-alpha.10`, `TestCompare/\u202699999999999999999999\u2026`, `TestCompareSpecOrder`, `TestSort` |\n\nNotes on the inventory:\n\n- **report bug 2** needs two edits to re-plant (drop the `unicode/utf8` import\n  and use `len(cell)`), otherwise the file does not compile.\n- **semver bug 2** spans two functions in the starter: `checkIdents` lost its\n  `id == \"\"` check and `isNumeric` lost its `s == \"\"` check. Restoring only\n  `isNumeric`'s check is not observable through the public API; restoring\n  `checkIdents`'s check fixes the behaviour. Count it as one bug. A fix that\n  restores only one of the two is acceptable if the tests pass, but mention the\n  other in review.\n- Fuzzing: with an **empty corpus**, `FuzzRoundTrip` finds csvline bug 1 and\n  `FuzzSplit` finds csvline bug 2 in well under a second. If a student says\n  \"the fuzzer found nothing\", their fuzz target is wrong (usually it checks\n  nothing, or it ignores the error from `Split`).\n- Bugs mask each other. For example, with paginate bug 1 present,\n  `Bounds(20, 10, 3)` is accepted because `Pages` says there are 3 pages.\n  The student may see a test fail for a \"different\" reason than expected.\n  That is fine; what matters is that each bug *alone* is caught.\n\n---\n\n## Exercise 1 \u2014 csvline (fuzzing)\n\n### What a good student suite looks like\n- `TestJoin` / `TestSplit` tables including: `nil`, a single empty field,\n  empty fields at the edges (`\",x,\"`), comma / CR / LF / quote inside a\n  field, an escaped quote, an unterminated quote, junk after the closing\n  quote (both long and **short**).\n- Error cases checked with `errors.Is(err, ErrSyntax)`, not string compare.\n- `FuzzRoundTrip` with a **real property** (`Split(Join(x)) == x`) and\n  `FuzzSplit` with \"never panic; errors are one of the two sentinels; whatever\n  is accepted round-trips\".\n- After fuzzing, the failing inputs are promoted into the table tests with a\n  `// Found by FuzzX` comment. The `testdata/fuzz/...` files the fuzzer\n  writes are committed too: plain `go test` replays them as regression tests.\n\n### Readable solution\n`Join` writes into a `strings.Builder` and quotes a field only when it\ncontains `,`, `\"`, CR or LF, doubling inner quotes with `strings.ReplaceAll`.\n`Split` is a single forward scan; quoted fields go through a `strings.Builder`\nso escaped quotes can be collapsed. Both fixes are one-liners:\nadd `\"` to the `ContainsAny` set; clamp the snippet with\n`line[i:min(i+8, len(line))]`.\n\n### Optimized solution \u2014 `fast.go` (`JoinFast`, `SplitFast`)\n- `JoinFast` computes the exact output length first (`len` + 2 quotes + one\n  extra byte per inner `\"`), calls `Grow` once, and writes doubled quotes byte\n  by byte, so there are no `ReplaceAll` temporaries.\n- `SplitFast` sizes the result slice with `strings.Count(line, \",\")+1` (an\n  upper bound on the field count) and returns quoted fields that contain no\n  escaped quote as **substrings of `line`** instead of copying them.\n\n| Benchmark (6 fields, one quoted) | ns/op | B/op | allocs/op |\n|---|---|---|---|\n| `Join` (readable) | ~350 | 200 | 5 |\n| `JoinFast` | ~255 | 64 | 1 |\n| `Split` (readable) | ~340 | 272 | 6 |\n| `SplitFast` | ~210 | 136 | 2 |\n\nCorrectness is pinned by `FuzzFastMatchesReadable` (a **differential fuzz\ntest**: the readable function is the oracle). It ran 12M inputs with no\nmismatch, and `TestJoinFastAllocatesOnce` pins the allocation promise.\n\n### Trade-off\nThe readable version is obviously correct at a glance; the fast one has a\nsize computation that must stay in sync with the writing loop, and its fields\nalias the input (fine for strings, which are immutable, but it keeps the whole\nline alive while any field is referenced). Choose fast only in a hot path, and\nonly with a differential test. In real code, use `encoding/csv`.\n\n### Review checklist\n- [ ] Fuzz target checks a property. `f.Fuzz(func(t *testing.T, s string) { Split(s) })` only catches panics and **misses bug 1**.\n- [ ] Fuzz target ignores `Split`'s error or treats every error as failure (`FuzzSplit` must allow `ErrUnterminated`/`ErrSyntax`).\n- [ ] Bug-finding inputs promoted into table tests (with a `// Found by` comment).\n- [ ] Fuzz corpus files under `testdata/fuzz/` committed, not deleted.\n- [ ] `errors.Is` for sentinel errors; no `err.Error() == \"...\"`.\n- [ ] `t.Fatalf` when a later check depends on an earlier one (e.g. error then fields), `t.Errorf` otherwise.\n- [ ] Failure messages name the function and input: `Split(%q) = %q, want %q`.\n\n---\n\n## Exercise 2 \u2014 paginate (table tests, boundaries)\n\n### What a good student suite looks like\n- `TestPages` table: 0 items, fewer than a page, exact multiple, one over a\n  multiple, `perPage == 1`, negative total, `perPage` 0 and negative.\n- `TestBounds` table: first / middle / last-partial / last-exact page,\n  `total == 0` page 1 \u2192 `[0,0)`, page 0, page past the end, invalid sizes,\n  errors checked with `errors.Is`.\n- Bonus property test `TestBoundsCoverEveryItem`: for `total` 0..40 and\n  `perPage` 1..12, walk every page and check the ranges tile `[0,total)` with\n  no gap or overlap. **This one test alone catches all three bugs**; point that out to the student as the payoff of\n  property tests.\n\n### Readable solution\n`Pages` divides and adds one only when there is a remainder; `Bounds`\nvalidates sizes, special-cases the empty list's single page, rejects\n`page < 1 || page > Pages(...)`, and clamps `end` with `min`.\n\n### Optimized solution\nThere is no meaningful speed difference to find here; both versions are a\nhandful of integer instructions. The common \"clever\" form is\n\n```go\nfunc Pages(total, perPage int) int {\n\tif total < 0 || perPage < 1 {\n\t\treturn 0\n\t}\n\treturn (total + perPage - 1) / perPage // ceiling division\n}\n\nfmt.Println(Pages(0, 10), Pages(21, 10), Pages(20, 10), Pages(10, 0)) // 0 3 2 0\n```\n\nIt is shorter and branch-free but **overflows** when `total` is near\n`math.MaxInt` (the sum wraps negative). The readable version cannot overflow.\nA good review point is that \"optimizing\" this is a correctness risk with no\nmeasurable benefit. Not benchmarked, because there is nothing to measure.\n\n### Trade-off\nKeep the readable version. Use the ceiling-division idiom only when inputs are\nknown to be small (and say so in a comment).\n\n### Review checklist\n- [ ] Boundaries tested on **both sides** (exact multiple *and* one over).\n- [ ] Error cases use `errors.Is(err, ErrInvalidPage)`; checks the zero values returned with the error.\n- [ ] Subtest names are readable (`\"last partial page\"`, not `\"case3\"`).\n- [ ] No duplicated loops: one table and one `t.Run` per function.\n- [ ] `Example` has an `// Output:` comment (otherwise it is compiled but never run).\n- [ ] Fix uses `min(start+perPage, total)` (Go 1.21 builtin), not an `if` chain.\n\n---\n\n## Exercise 3 \u2014 concat (oracles, AllocsPerRun, benchmarks)\n\n### What a good student suite looks like\n- `TestJoinersMatchStringsJoin`: one table of inputs \u00d7 a slice of joiner\n  funcs, comparing each with `strings.Join` (the **oracle**). Must include\n  empty strings in the middle, at the end, and all-empty.\n- `TestJoinBuilderAllocatesOnce`: `testing.AllocsPerRun` turns the doc\n  comment's performance promise into a failing test.\n- `BenchmarkJoin` with `b.Run` per joiner and size, inputs built **outside**\n  the loop, `for b.Loop()`, `b.ReportAllocs()`.\n\n### Readable vs optimized\nHere the three functions *are* the readable-vs-fast spectrum, and the\nbenchmark is the lesson:\n\n| n elems (8 bytes each) | Plus | Buffer | Builder (fixed) |\n|---|---|---|---|\n| 10 | ~1.0 \u00b5s, 18 allocs | ~290 ns, 3 allocs | ~125 ns, 1 alloc |\n| 100 | ~41 \u00b5s, 198 allocs | ~2.5 \u00b5s, 6 allocs | ~1.0 \u00b5s, 1 alloc |\n| 1000 | ~3.3 ms, 1998 allocs, 9.6 MB | ~22 \u00b5s, 10 allocs | ~7.4 \u00b5s, 1 alloc |\n\n`+=` is quadratic (each step copies the whole string so far). `bytes.Buffer`\ngrows geometrically, and `String()` copies once more at the end.\n`strings.Builder` with an exact `Grow` allocates once and `String()` does not\ncopy. `strings.Join` does exactly what the fixed `JoinBuilder` does; in real\ncode, call it.\n\n### Trade-off\n`+=` is fine for a handful of strings known at compile time (the compiler\nhandles `a + b + c` in one allocation). In loops, use `strings.Builder`, or\n`strings.Join` when you have a slice.\n\n### Review checklist\n- [ ] Uses an oracle rather than hand-written expected strings for every case.\n- [ ] Builds inputs outside the timed loop; no `b.ResetTimer()` needed with `b.Loop()`.\n- [ ] Uses `b.Loop()` (Go 1.24), not `for i := 0; i < b.N; i++`.\n- [ ] Doesn't assign to a package-level sink \"to defeat the compiler\": `b.Loop` keeps the call alive.\n- [ ] Allocation promise pinned in a **test**, not only visible in a benchmark nobody reads.\n- [ ] Joiner table: `[]struct{name string; join func([]string, string) string}`.\n\n---\n\n## Exercise 4 \u2014 reminder (fakes, injected clock)\n\n### What a good student suite looks like\n- `fakeClock` with `Now()` and `Advance(d)`; `fakeSender` recording calls\n  and failing for configured recipients. Compile-time interface checks\n  (`var _ Clock = (*fakeClock)(nil)`).\n- A small constructor helper (`newTestScheduler(t)`) with `t.Helper()`.\n- Tests: due in the past / **exactly now** / 1ns in the future; clock advance\n  then flush; out-of-order adds sent in order, **ties keep insertion order**;\n  a failing send is retried on the next flush; multiple failures joined\n  (`errors.Is` against each).\n- No `time.Sleep`, no `time.Now()` in assertions.\n\n### Readable solution\n`Flush` stable-sorts pending by due time, partitions into \"send now\" and\n\"keep\", keeps failed sends, and joins errors with `errors.Join`. `Pending`\nreturns a sorted **copy**.\n\n### Optimized solution (reasoning, verified against the reference tests)\nKeep `pending` sorted at insert time; then the due reminders are a prefix,\nfound by binary search:\n\n```go\nimport \"gocourse/solutions/04-testing/exercises/reminder\"\n\ntype Reminder = reminder.Reminder\n\ntype Scheduler struct {\n\tclock   reminder.Clock\n\tsender  reminder.Sender\n\tpending []Reminder // sorted by Due\n}\n\nfunc (s *Scheduler) Add(r Reminder) {\n\t// Insert after any reminder due at the same time, so ties keep\n\t// insertion order.\n\ti, _ := slices.BinarySearchFunc(s.pending, r, func(e, t Reminder) int {\n\t\tif e.Due.After(t.Due) {\n\t\t\treturn 1\n\t\t}\n\t\treturn -1\n\t})\n\ts.pending = slices.Insert(s.pending, i, r)\n}\n\nfunc (s *Scheduler) Flush() (int, error) {\n\tnow := s.clock.Now()\n\tn, _ := slices.BinarySearchFunc(s.pending, now, func(r Reminder, t time.Time) int {\n\t\tif r.Due.After(t) {\n\t\t\treturn 1\n\t\t}\n\t\treturn -1\n\t})\n\tvar (\n\t\tfailed []Reminder\n\t\terrs   []error\n\t\tsent   int\n\t)\n\tfor _, r := range s.pending[:n] {\n\t\tif err := s.sender.Send(r.To, r.Body); err != nil {\n\t\t\terrs = append(errs, fmt.Errorf(\"send reminder to %s: %w\", r.To, err))\n\t\t\tfailed = append(failed, r)\n\t\t\tcontinue\n\t\t}\n\t\tsent++\n\t}\n\t// Failed reminders were due before everything still pending, so\n\t// prepending them keeps the slice sorted.\n\ts.pending = append(failed, s.pending[n:]...)\n\treturn sent, errors.Join(errs...)\n}\n\ntype fixedClock time.Time\n\nfunc (c fixedClock) Now() time.Time { return time.Time(c) }\n\ntype printSender struct{}\n\nfunc (printSender) Send(to, body string) error {\n\tif to == \"nobody\" {\n\t\treturn errors.New(\"no such recipient\")\n\t}\n\tfmt.Println(\"sent to\", to)\n\treturn nil\n}\n\nfunc main() {\n\tt0 := time.Date(2026, 1, 1, 9, 0, 0, 0, time.UTC)\n\ts := &Scheduler{clock: fixedClock(t0), sender: printSender{}}\n\ts.Add(Reminder{To: \"bob\", Due: t0.Add(-time.Minute)})\n\ts.Add(Reminder{To: \"later\", Due: t0.Add(time.Hour)})\n\ts.Add(Reminder{To: \"nobody\", Due: t0.Add(-2 * time.Minute)})\n\ts.Add(Reminder{To: \"ada\", Due: t0.Add(-time.Minute)}) // ties keep insertion order\n\tsent, err := s.Flush()\n\tfmt.Println(sent, err, len(s.pending)) // 2 send reminder to nobody: no such recipient 2\n}\n```\n\n`Pending` then becomes a plain `slices.Clone`. This passes the full reference\nsuite. Flush goes from O(n log n) (re-sorting everything each call) to\nO(log n + k) for k due reminders. `Add` becomes O(n) because of the shift,\nwhich suits the expected pattern of frequent flushes and rare adds. Not\nbenchmarked: the dominant cost in a real system is the `Send` I/O, which\ndwarfs either version. For millions of reminders, a `container/heap` is the\nstandard answer.\n\n### Trade-off\nThe readable version has one obvious invariant (\"sort, then partition\"). The\noptimized one spreads the invariant (\"pending is always sorted\") across two\nmethods, and the tie-breaking comparator is subtle. Choose it only if\nprofiling shows `Flush` matters.\n\n### Review checklist\n- [ ] Fakes, not mocks: tests assert on recorded state, not on scripted call expectations.\n- [ ] The boundary \"due exactly now\" is tested (that is what catches bug 2).\n- [ ] Tie ordering tested (catches a non-stable `slices.SortFunc` \"fix\").\n- [ ] Each test builds fresh fakes; no package-level mutable fakes shared between tests.\n- [ ] `errors.Is(err, errA) && errors.Is(err, errB)` for joined errors, not `err.Error()` comparison.\n- [ ] Fix uses `slices.SortStableFunc` + `time.Time.Compare` (Go 1.20), not a hand-written sort.\n- [ ] `SystemClock` is not used in tests except to test `SystemClock` itself.\n\n---\n\n## Exercise 5 \u2014 report (golden files)\n\n### What a good student suite looks like\n- `var update = flag.Bool(\"update\", false, ...)` and an `assertGolden(t, path, got)`\n  helper with `t.Helper()`, that writes on `-update` and otherwise compares\n  and prints a readable diff.\n- Golden cases: empty bill, basic, **amounts with cents < 10**, **multi-byte\n  names**, wide numbers.\n- Golden files **read by eye** against `Render`'s doc comment before being\n  committed. The most common failure in this exercise is running `-update`\n  on the buggy starter and committing the buggy output as \"golden\". The test\n  then passes and catches nothing. The mutation check exposes this at once.\n- A golden-independent test (`TestRenderLayoutRules`, `TestMoney`) so a\n  wrongly updated golden file cannot hide everything.\n- `TestRenderReturnsWriteError` with a failing `io.Writer`.\n\n### Readable solution\nFormat all cells into strings (header, rows, footer), compute column widths\nwith `utf8.RuneCountInString`, pad with `fmt`'s `%-*s` / `%*s` (which count\nrunes), trim trailing spaces, write once. `money` is\n`fmt.Sprintf(\"%d.%02d\", cents/100, cents%100)`.\n\n### Optimized solution \u2014 `fast.go` (`RenderFast`)\nComputes widths arithmetically (digit counts instead of formatting\nthrow-away strings), then appends everything into one pre-sized `[]byte` with\n`strconv.AppendInt` and manual padding, and writes once.\n\n| Benchmark (6 items) | ns/op | B/op | allocs/op |\n|---|---|---|---|\n| `Render` (readable) | ~8 300 | 4 539 | 113 |\n| `RenderFast` | ~650 | 512 | 1 |\n\nThat is about 12\u00d7 faster with 1 allocation instead of 113.\n`FuzzRenderFastMatchesRender` (differential, `Render` as oracle) ran 5M\ninputs with no mismatch. The existing golden files are a second safety net.\n\n### Trade-off\n`RenderFast` is about twice as much code as `Render` (113 lines vs 92 for the whole readable file),\nand a layout change (a new column) now touches width maths in three places.\nA bill printer is never a hot path: keep the readable one. Show the fast one\nto the student as an example of what `fmt` costs, and of how a differential\nfuzz test makes such a rewrite safe.\n\n### Review checklist\n- [ ] Golden files checked by eye (ask: \"what does `testdata/cents.golden` show for a 5-cent item?\").\n- [ ] `-update` flag declared at package level with `flag.Bool`; no custom `TestMain` needed.\n- [ ] Golden write uses `0o644` and handles the `os.WriteFile` error (`t.Fatal`).\n- [ ] Missing golden file gives a helpful message (\"run with -update\").\n- [ ] Diff output quotes lines (`%q`) so whitespace differences are visible.\n- [ ] `t.Helper()` in `assertGolden`.\n- [ ] Unit test for `money` exists; golden files alone make failures hard to localise.\n- [ ] Fix counts runes (`utf8.RuneCountInString`), not bytes. Note that this is still wrong for East Asian wide characters or emoji, which take 2 columns; mention it as a known limitation, not a required change.\n\n---\n\n## Project \u2014 semver\n\n### What a good student suite looks like\n- Black-box test (`package semver_test`) importing the package, so tests use\n  only the exported API.\n- `TestParse` with the spec's own examples (`1.0.0-x-y-z.--`,\n  `1.0.0+21AF26D3---117B344092BD`, build `+001` accepted).\n- `TestParseInvalid` with leading zeros in each numeric field, empty\n  pre-release / build / identifiers (`1.2.3-`, `1.2.3-a..b`, `1.2.3+`),\n  pre-release leading zero (`1.2.3-01`), bad characters, wrong part counts,\n  overflow. Every error checked with `errors.Is(err, semver.ErrInvalid)`.\n- `TestCompare` table, plus `TestCompareSpecOrder` using the exact precedence\n  chain from semver.org \u00a711 (`1.0.0-alpha < 1.0.0-alpha.1 < \u2026 < 1.0.0`),\n  plus `TestSort` covering stability for build-only differences.\n- `FuzzParse` (never panics, errors wrap `ErrInvalid`, accepted input\n  round-trips through `String`), `FuzzCompare` (antisymmetry).\n- `ExampleCompare`, `ExampleSort`; `BenchmarkParse`, `BenchmarkCompare`.\n- Coverage \u2265 90% (`go test -cover`). The reference suite reaches 97.6% of\n  `semver.go`; `go tool cover -func` shows the gap is one branch of\n  `compareIdent` (87.5%). A nice review exercise is to ask the student to find\n  it from the HTML report.\n\n### Readable solution\n`Parse` peels off `+build` then `-pre` with `strings.Cut`, validates\nidentifier lists with `checkIdents`, and splits the core on `.`. `Compare`\ncompares numbers with `cmp.Compare`, then pre-releases with the \u00a711 rules.\nNumeric identifiers are compared **by length first, then lexically**, which\nis valid because leading zeros are forbidden, and it never overflows on\nhuge identifiers. `Sort` uses `slices.SortStableFunc(vs, Compare)`.\n\n### Optimized solution \u2014 `fast.go` (`ParseFast`)\nScans the core with `strings.IndexByte` instead of `strings.Split`, and\nvalidates identifiers in place (`checkIdentsFast`) instead of splitting them.\nA successful parse allocates nothing.\n\n| Benchmark (`v1.22.333-rc.1.alpha+build.2025`) | ns/op | B/op | allocs/op |\n|---|---|---|---|\n| `Parse` (readable) | ~210 | 128 | 3 |\n| `ParseFast` | ~77 | 0 | 0 |\n\nThat is about 2.7\u00d7 faster with zero allocations. `FuzzParseFastMatchesParse`\n(differential) ran 6M inputs with no mismatch, and `TestParseFastDoesNotAllocate`\npins the zero-allocation result. `Compare` (~125 ns, 2 allocs, from\n`strings.Split` of the pre-release) could be made allocation-free the same way\nby walking both strings with `IndexByte`; this is left as a stretch goal for\nthe student and not implemented here.\n\n### Trade-off\n`Parse` mirrors the grammar and is easy to check against the spec. `ParseFast`\nis worth it only if you parse versions in bulk (e.g. a package index with\nmillions of entries). Error messages from `ParseFast` are slightly less\nspecific (it reports the whole identifier list, not the bad identifier).\n\n### Review checklist\n- [ ] Tests come from the **spec**, not from the implementation (the \u00a711 precedence list is the best single test).\n- [ ] `TestParseInvalid` includes input that **panicked** in the starter (`1.2.3-`), as a regression test with a comment.\n- [ ] `errors.Is(err, semver.ErrInvalid)`; no string matching of error text.\n- [ ] Fuzz properties are real (round-trip, antisymmetry), and `FuzzCompare` skips invalid inputs with `t.Skip()` rather than failing.\n- [ ] Numeric comparison fix doesn't use `strconv.Atoi` without handling overflow (`TestCompare/\u202699999999999999999999\u2026`).\n- [ ] Release-vs-pre-release fix handles **both** directions (`a == \"\"` and `b == \"\"`).\n- [ ] Coverage report checked (`go tool cover -func`), not just the percentage.\n- [ ] Examples have `// Output:`.\n- [ ] Benchmarks use `b.Loop()` and `b.ReportAllocs()`.\n\n---\n\n## General review checklist (all packages)\n\n- [ ] `gofmt -l` clean; `go vet` clean.\n- [ ] Table-driven with `t.Run`; subtest names describe the case.\n- [ ] Messages: `Func(input) = got, want want`. Input first, got before want.\n- [ ] `t.Helper()` in every helper that calls `t.Error*`/`t.Fatal*`.\n- [ ] `t.Fatal*` only when continuing makes no sense; never from a goroutine other than the test's.\n- [ ] No `time.Sleep` for synchronisation; time is injected.\n- [ ] No test depends on another's side effects (`go test -shuffle=on` passes).\n- [ ] `go test -race` passes (relevant if the student added `t.Parallel()`).\n- [ ] Tests are readable as documentation of the package's behaviour.\n\n## Common review comments (copy-paste ready)\n\n- \"This test passes against the original buggy code too. Re-plant the bug\n  and you'll see it doesn't fail. What input would make it fail?\"\n- \"You regenerated the golden files with `-update` before fixing the bug, so\n  they record the bug. Open `testdata/cents.golden`: is `0.5` right?\"\n- \"`err.Error() == ...` breaks as soon as someone wraps the error. Use\n  `errors.Is`.\"\n- \"This fuzz target only checks that nothing panics. What property must\n  *always* hold? (Hint: Split undoes Join.)\"\n- \"Use `t.Errorf` here so the remaining cases still run; `t.Fatalf` stops the\n  whole subtest.\"\n- \"Your `Example` has no `// Output:` comment, so it is compiled but never\n  run.\"\n", "solDir": "/home/csmith/Workspace/tools/go-course/solutions/04-testing", "dir": "/home/csmith/Workspace/tools/go-course/modules/04-testing"}, {"slug": "05-io", "compose": "modules/05-io/compose.yaml", "services": ["test", "vet", "bench", "cover", "shell", "solutions"], "title": "Module 05: Readers, Writers, Files & Encoding", "lesson": "# Module 05: Readers, Writers, Files & Encoding\n\n## Goals\n\nBy the end of this module, you'll be able to:\n\n- Write functions that operate on abstract streams using `io.Reader` and `io.Writer`\n- Compose readers and writers to build complex pipelines (e.g., with `io.TeeReader`, `io.MultiWriter`, `io.Copy`)\n- Handle unbounded input using `bufio.Scanner` while respecting its 64 KiB limit and recovering from oversized lines\n- Read files safely, choosing between whole-file loading and streaming approaches\n- Encode and decode CSV and JSON data with proper error handling\n- Work with custom readers and writers to implement domain-specific transformations\n- Design APIs that respect the `io.Reader`/`io.Writer` abstraction and compose with the standard library\n\n## Concepts\n\n### The io.Reader and io.Writer Abstractions\n\nAt the heart of Go's I/O design are two simple interfaces:\n\n```go\ntype Reader interface {\n    Read(p []byte) (n int, err error)\n}\n\ntype Writer interface {\n    Write(p []byte) (n int, err error)\n}\n\n// Anything with the method is one; nothing to declare:\nvar r Reader = strings.NewReader(\"hello\\n\")\nvar w Writer = os.Stdout\np := make([]byte, 16)\nn, _ := r.Read(p)\nw.Write(p[:n]) // hello\n```\n\nThese abstractions let you write code that works with any source or sink: files, network connections, buffers, pipes, or custom implementations. The key insight is to write functions *against the interface*, not against a concrete type like `*os.File`.\n\n**Why this matters:** A function that accepts `io.Reader` can be tested with a `strings.Reader`, can be used with a file, and can be composed with other readers. A function that accepts `*os.File` can only be used with files, and is much harder to test.\n\n```go\nimport \"crypto/rand\"\n\n// Good: works with any reader\nfunc Count(r io.Reader) (int, error) {\n\tb, err := io.ReadAll(r)\n\treturn len(b), err\n}\n\n// Bad: only works with files, hard to test\nfunc CountFile(f *os.File) (int, error) { return Count(f) }\n\nfunc main() {\n\tf, _ := os.CreateTemp(\"\", \"count-*.txt\")\n\tdefer os.Remove(f.Name())\n\tf.WriteString(\"file contents\")\n\tf.Seek(0, io.SeekStart)\n\n\tfmt.Println(Count(f))                                // works with a file: 13 <nil>\n\tfmt.Println(Count(strings.NewReader(\"test\")))        // also works: 4 <nil>\n\tfmt.Println(Count(io.LimitReader(rand.Reader, 10))) // and any other reader: 10 <nil>\n}\n```\n\n### Read Semantics: `n` and `err` Together\n\nOne of the trickiest parts of `io.Reader` is that `Read` may return both `n > 0` **and** `err != nil` in the same call. This happens at EOF: the last chunk may be returned together with `io.EOF`. Always process the n bytes first, then look at the error.\n\n```go\n// A reader that returns data AND io.EOF in the same call, as Read may.\ntype lastChunk struct{ done bool }\n\nfunc (l *lastChunk) Read(p []byte) (int, error) {\n\tif l.done {\n\t\treturn 0, io.EOF\n\t}\n\tl.done = true\n\treturn copy(p, \"last bytes\"), io.EOF\n}\n\n// Common mistake: ignoring n when err != nil\nfunc readWrong(r io.Reader) (got []byte, err error) {\n\tp := make([]byte, 64)\n\tfor {\n\t\tn, err := r.Read(p)\n\t\tif err != nil {\n\t\t\treturn got, err // WRONG: you lose the n bytes that were read\n\t\t}\n\t\tgot = append(got, p[:n]...)\n\t}\n}\n\n// Correct\nfunc readRight(r io.Reader) (got []byte, err error) {\n\tp := make([]byte, 64)\n\tfor {\n\t\tn, err := r.Read(p)\n\t\tif n > 0 {\n\t\t\tgot = append(got, p[:n]...)\n\t\t}\n\t\tif err != nil {\n\t\t\tif err == io.EOF {\n\t\t\t\treturn got, nil\n\t\t\t}\n\t\t\treturn got, err\n\t\t}\n\t}\n}\n\nwrong, _ := readWrong(&lastChunk{})\nright, _ := readRight(&lastChunk{})\nfmt.Printf(\"wrong: %q, right: %q\\n\", wrong, right) // wrong: \"\", right: \"last bytes\"\n\n// Or use helpers\nall, err := io.ReadAll(&lastChunk{}) // handles n/err correctly\nfmt.Printf(\"%q %v\\n\", all, err)      // \"last bytes\" <nil>\np := make([]byte, 4)\nn, err := io.ReadFull(strings.NewReader(\"abcdef\"), p) // read exactly len(p) bytes or error\nfmt.Println(n, err, string(p))                         // 4 <nil> abcd\nm, err := io.CopyN(os.Stdout, strings.NewReader(\"0123456789\"), 3) // read/write exactly 3 bytes\nfmt.Println(\"\", m, err)                                           // 012 3 <nil>\n```\n\n### Composing Readers and Writers\n\nThe standard library provides composable building blocks:\n\n```go\n// io.Copy copies from src to dst until src returns io.EOF:\n//\n//\tfunc Copy(dst Writer, src Reader) (written int64, err error)\nn, err := io.Copy(os.Stdout, strings.NewReader(\"copied\\n\"))\nfmt.Println(n, err) // 7 <nil>\n\n// io.MultiReader concatenates several readers\nmultiR := io.MultiReader(strings.NewReader(\"one \"), strings.NewReader(\"two \"), strings.NewReader(\"three\\n\"))\nio.Copy(os.Stdout, multiR) // one two three\n\n// io.MultiWriter broadcasts writes to multiple writers\nvar buf1, buf2 bytes.Buffer\nmultiW := io.MultiWriter(&buf1, &buf2, os.Stdout)\nfmt.Fprintf(multiW, \"goes to all three\\n\")\nfmt.Println(buf1.Len(), buf2.Len()) // 18 18\n\n// io.TeeReader reads from src, writes to dst, and returns a reader\n// that gives you the same bytes that were written to dst\nvar dst bytes.Buffer\ntee := io.TeeReader(strings.NewReader(\"teed\"), &dst)\ndata, _ := io.ReadAll(tee) // data == what was written to dst\nfmt.Println(string(data), dst.String()) // teed teed\n\n// io.LimitReader returns a reader that stops after n bytes\nlimited := io.LimitReader(strings.NewReader(\"0123456789\"), 4) // read at most 4 bytes\ndata, _ = io.ReadAll(limited)\nfmt.Println(string(data)) // 0123\n\n// io.NewSectionReader reads a window of an io.ReaderAt (a file, a\n// strings.Reader): here 5 bytes starting at offset 6\nsection := io.NewSectionReader(strings.NewReader(\"hello, world\"), 6, 5)\ndata, _ = io.ReadAll(section)\nfmt.Printf(\"%q\\n\", data) // \" worl\"\n```\n\nThese compose to build powerful pipelines with minimal copying:\n\n```go\ndir, _ := os.MkdirTemp(\"\", \"tee\")\ndefer os.RemoveAll(dir)\nname := filepath.Join(dir, \"data.txt\")\nos.WriteFile(name, []byte(strings.Repeat(\"compress me \", 1000)), 0o644)\n\n// Compress a file, write both the original and compressed to separate files\nsrc, err := os.Open(name)\nif err != nil {\n\tlog.Fatal(err)\n}\ndefer src.Close()\n\norig, _ := os.Create(name + \".orig\")\ndefer orig.Close()\n\ngzipped, _ := os.Create(name + \".gz\")\ndefer gzipped.Close()\n\n// Use TeeReader to observe the data flow, then compress\ntee := io.TeeReader(src, orig)\ngz := gzip.NewWriter(gzipped)\n\nn, err := io.Copy(gz, tee) // reads from src, writes to both orig and gzipped\nif err := gz.Close(); err != nil { // Close flushes the last compressed block\n\tlog.Fatal(err)\n}\no, _ := orig.Stat()\ng, _ := gzipped.Stat()\nfmt.Println(n, err, o.Size(), g.Size()) // 12000 <nil> 12000, and far fewer bytes compressed\n```\n\n### Buffered I/O with bufio\n\nFor character-at-a-time or line-at-a-time reading, the `bufio` package provides buffering:\n\n#### bufio.Scanner\n\n`Scanner` reads lines or other tokens without holding the entire input in memory. It handles line ending conversion and raises an error if a line exceeds `bufio.MaxScanTokenSize` (64 KiB).\n\n```go\nr := strings.NewReader(\"first line\\nsecond line\\nno newline at the end\")\nsc := bufio.NewScanner(r)\nfor sc.Scan() {\n\tline := sc.Text() // a string, without the newline\n\tfmt.Printf(\"%q\\n\", line)\n}\nif err := sc.Err(); err != nil {\n\tlog.Fatal(err) // NEVER skip this check\n}\n```\n\nThe 64 KiB limit is intentional: it prevents memory exhaustion on malformed input. If you need longer lines, either:\n\n1. Raise the limit with `sc.Buffer`:\n   ```go\n   long := strings.Repeat(\"x\", 100_000) // one 100 KB line: over the default 64 KiB limit\n   sc := bufio.NewScanner(strings.NewReader(long))\n   for sc.Scan() {\n   }\n   fmt.Println(sc.Err()) // bufio.Scanner: token too long\n\n   sc = bufio.NewScanner(strings.NewReader(long))\n   sc.Buffer(make([]byte, 0, 64*1024), 10*1024*1024) // max 10 MiB per line\n   for sc.Scan() {\n   \tfmt.Println(len(sc.Text())) // 100000\n   }\n   fmt.Println(sc.Err()) // <nil>\n   ```\n\n2. Use `bufio.Reader.ReadLine` instead, which is more flexible:\n   ```go\n   long := strings.Repeat(\"x\", 40) + \"\\nshort\\n\"\n   br := bufio.NewReaderSize(strings.NewReader(long), 16) // tiny buffer to force splits\n   for {\n   \tchunk, isPrefix, err := br.ReadLine() // isPrefix true means the line continues\n   \tif err != nil {\n   \t\tbreak // io.EOF\n   \t}\n   \tfmt.Printf(\"%q isPrefix=%v\\n\", chunk, isPrefix)\n   }\n   ```\n\n3. Read in fixed-size chunks yourself and search with `bytes.IndexByte`.\n\n#### bufio.Writer\n\nA `Writer` buffers writes for efficiency. You must call `Flush` before closing to ensure all data is written.\n\n```go\nf, err := os.CreateTemp(\"\", \"buffered-*.txt\")\nif err != nil {\n\tlog.Fatal(err)\n}\ndefer os.Remove(f.Name())\ndefer f.Close()\n\nw := bufio.NewWriter(f)\nfmt.Fprintf(w, \"buffered output\\n\")\nif err := w.Flush(); err != nil {\n\tlog.Fatal(err)\n}\ndata, _ := os.ReadFile(f.Name())\nfmt.Printf(\"%q\\n\", data) // \"buffered output\\n\"\n```\n\nIn a CLI, remember that `os.Exit` does not run defers, so buffered output is lost if you exit without flushing.\n\n### File Operations and Error Handling\n\n#### Whole-file I/O\n\nFor small or bounded files, `os.ReadFile` and `os.WriteFile` are simple and safe:\n\n```go\ndir, _ := os.MkdirTemp(\"\", \"readfile\")\ndefer os.RemoveAll(dir)\nos.WriteFile(filepath.Join(dir, \"config.json\"), []byte(`{\"debug\": true}`), 0o644)\n\ndata, err := os.ReadFile(filepath.Join(dir, \"config.json\"))\nif err != nil {\n\tlog.Fatal(err)\n}\n\nerr = os.WriteFile(filepath.Join(dir, \"output.txt\"), data, 0o644)\nif err != nil {\n\tlog.Fatal(err)\n}\nfmt.Printf(\"copied %d bytes: %s\\n\", len(data), data)\n```\n\n#### Streaming and Cleanup\n\nFor large or untrusted input, stream with `io.Reader`/`io.Writer`. Always close files and check the error:\n\n```go\n// For reading: Close error is usually safe to ignore\nfunc firstByte(path string) (byte, error) {\n\tf, err := os.Open(path)\n\tif err != nil {\n\t\treturn 0, err\n\t}\n\tdefer f.Close()\n\tb := make([]byte, 1)\n\t_, err = f.Read(b)\n\treturn b[0], err\n}\n\n// For writing: Close error can hide data loss. Check it.\nfunc write(path string, data []byte) (err error) {\n\tf, err := os.Create(path)\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer func() {\n\t\tif cerr := f.Close(); cerr != nil && err == nil {\n\t\t\terr = cerr\n\t\t}\n\t}()\n\n\tw := bufio.NewWriter(f)\n\tif _, err := w.Write(data); err != nil {\n\t\treturn err\n\t}\n\treturn w.Flush()\n}\n\npath := filepath.Join(os.TempDir(), \"close-demo.txt\")\ndefer os.Remove(path)\nfmt.Println(write(path, []byte(\"hello\"))) // <nil>\nb, err := firstByte(path)\nfmt.Printf(\"%c %v\\n\", b, err) // h <nil>\n```\n\nFor atomic replacements (preventing partial writes on crash), write to a temp file first, then rename:\n\n```go\ndir, _ := os.MkdirTemp(\"\", \"atomic\")\ndefer os.RemoveAll(dir)\nfinalPath := filepath.Join(dir, \"config.json\")\n\nf, _ := os.CreateTemp(dir, \"tmp-\") // same directory, so Rename stays on one filesystem\nf.WriteString(`{\"version\": 2}`)\nf.Close()\nos.Rename(f.Name(), finalPath) // readers see the old file or the new one, never half of it\n\ndata, _ := os.ReadFile(finalPath)\nfmt.Println(string(data))\n```\n\n#### Protecting Against Resource Exhaustion\n\nWhen accepting untrusted input, limit its size:\n\n```go\nr := strings.NewReader(strings.Repeat(\"a\", 5_000_000)) // pretend: untrusted, possibly huge\n\n// Bad: io.ReadAll on untrusted input can exhaust memory\n// data, _ := io.ReadAll(r)\n\n// Good: limit to 1 MiB\nlimited := io.LimitReader(r, 1024*1024)\ndata, _ := io.ReadAll(limited)\nfmt.Println(len(data)) // 1048576\n\n// For HTTP request bodies, http.MaxBytesReader is built-in\nh := http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\tr.Body = http.MaxBytesReader(w, r.Body, 1024*1024)\n\t_, err := io.ReadAll(r.Body)\n\tfmt.Println(err) // http: request body too large\n})\nh.ServeHTTP(httptest.NewRecorder(), httptest.NewRequest(\"POST\", \"/\", strings.NewReader(strings.Repeat(\"a\", 2_000_000))))\n```\n\n### Walking Directory Trees\n\nThe `filepath` package provides `WalkDir` for traversing directories without excessive allocations:\n\n```go\ndir, _ := os.MkdirTemp(\"\", \"walk\")\ndefer os.RemoveAll(dir)\nos.MkdirAll(filepath.Join(dir, \"a\", \"b\"), 0o755)\nos.WriteFile(filepath.Join(dir, \"a\", \"one.txt\"), nil, 0o644)\nos.WriteFile(filepath.Join(dir, \"a\", \"b\", \"two.txt\"), nil, 0o644)\n\nerr := filepath.WalkDir(dir, func(path string, d fs.DirEntry, err error) error {\n\tif err != nil {\n\t\treturn err // permission denied, etc.\n\t}\n\tif d.IsDir() {\n\t\treturn nil // keep walking; print only files\n\t}\n\trel, _ := filepath.Rel(dir, path)\n\tfmt.Println(rel)\n\treturn nil\n})\nfmt.Println(err) // a/b/two.txt, a/one.txt (lexical order), then <nil>\n```\n\nUse `WalkDir`, not the older `Walk`: it's more efficient because `DirEntry` caches stat info.\n\n### encoding/csv\n\nThe `csv` package reads and writes CSV with proper quoting and escape handling:\n\n```go\nimport \"encoding/csv\"\n\nfunc readCSV(f io.Reader) error {\n\tr := csv.NewReader(f)\n\tr.FieldsPerRecord = 2 // enforce 2 fields per row, or -1 for variable\n\tfor {\n\t\trecord, err := r.Read() // []string, one per field\n\t\tif err == io.EOF {\n\t\t\tbreak\n\t\t}\n\t\tif err != nil {\n\t\t\treturn err // *csv.ParseError has Line and Column fields\n\t\t}\n\t\tfmt.Printf(\"%q\\n\", record)\n\t}\n\treturn nil\n}\n\nfunc main() {\n\t// Reading\n\terr := readCSV(strings.NewReader(\"name,age\\n\\\"Lovelace, Ada\\\",36\\nBob\\n\"))\n\tfmt.Println(err) // record on line 3: wrong number of fields\n\n\t// Writing\n\tw := csv.NewWriter(os.Stdout)\n\tw.Write([]string{\"name\", \"age\"})\n\tw.Write([]string{\"Alice, Jr.\", \"31\"}) // quoted automatically\n\tw.Flush()                            // MUST flush before closing\n\tif err := w.Error(); err != nil {\n\t\tlog.Fatal(err)\n\t}\n}\n```\n\nKey points:\n- `ReadAll` loads everything into memory; use `Read` in a loop for streaming.\n- Set `LazyQuotes = true` to tolerate malformed input.\n- `FieldsPerRecord = 0` to set the field count based on the first record.\n- `ReuseRecord = true` reduces allocations but then you must copy any record you keep.\n- Don't forget `Flush` and `w.Error()`.\n\n### encoding/json\n\nJSON encoding and decoding in Go:\n\n#### Tags\n\nStruct fields with `json` tags control marshaling and unmarshaling:\n\n```go\ntype User struct {\n    ID       int       `json:\"id\"`\n    Name     string    `json:\"name\"`\n    Email    string    `json:\"email,omitempty\"`        // omit if empty\n    Created  time.Time `json:\"created,omitzero\"`       // 1.24: omit if zero value\n    Internal string    `json:\"-\"`                      // always omit\n    Balance  float64   `json:\"balance,string\"`         // read/write as JSON string\n}\n\nout, _ := json.Marshal(User{ID: 1, Name: \"Ada\", Internal: \"secret\", Balance: 9.5})\nfmt.Println(string(out)) // {\"id\":1,\"name\":\"Ada\",\"balance\":\"9.5\"}: no email, created or internal\n```\n\nFields without a tag use their struct name. When decoding, keys match field names case-insensitively, so `\"NAME\"` fills `Name`. Unexported fields are always ignored.\n\n#### Unmarshaling\n\n`json.Unmarshal` is for data you already have as `[]byte`. `json.NewDecoder(r).Decode(&v)` is for streams:\n\n```go\ntype User struct {\n\tID   int    `json:\"id\"`\n\tName string `json:\"name\"`\n}\n\n// Whole buffer\nvar u User\nerr := json.Unmarshal([]byte(`{\"id\": 1, \"name\": \"Ada\"}`), &u)\nfmt.Println(u, err) // {1 Ada} <nil>\n\n// Stream (e.g., HTTP body, file)\ndec := json.NewDecoder(strings.NewReader(`{\"id\": 2, \"name\": \"Bob\", \"admin\": true}`))\ndec.DisallowUnknownFields() // reject unknown keys\nerr = dec.Decode(&u)\nfmt.Println(err) // json: unknown field \"admin\"\n\n// To reject trailing junk after the first object:\ndec = json.NewDecoder(strings.NewReader(`{\"id\": 3} {\"id\": 4}`))\ndec.Decode(&u)\nif dec.More() {\n\tfmt.Println(errors.New(\"unexpected trailing data\"))\n}\n```\n\n#### Gotchas\n\n- **Field-name matching is case-insensitive** on unmarshal (a JSON key matches any struct field name, regardless of case). This is a common surprise.\n- A nil slice marshals as `null`, an empty slice as `[]`. This matters for APIs.\n- Numbers decoded into `any` become `float64`, so large integers lose precision. Use `dec.UseNumber()` to get `json.Number` instead.\n- `omitempty` does **not** omit empty structs; use `omitzero` (1.24) for that.\n- An embedded type with a `MarshalJSON` method (e.g., embedded `time.Time`) changes how the outer struct marshals.\n\n#### Streaming JSON\n\nFor newline-delimited JSON (NDJSON), decode in a loop:\n\n```go\ntype Event struct {\n\tType string `json:\"type\"`\n\tN    int    `json:\"n\"`\n}\n\n// A stream of JSON objects, one after another (JSON Lines, for example)\nf := strings.NewReader(`{\"type\": \"click\", \"n\": 1}\n{\"type\": \"view\", \"n\": 7}\n{\"type\": \"click\", \"n\": 2}`)\n\ndec := json.NewDecoder(f)\nfor dec.More() {\n\tvar obj Event\n\tif err := dec.Decode(&obj); err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tfmt.Printf(\"%+v\\n\", obj)\n}\n```\n\nFor writing JSON:\n\n```go\nitems := []map[string]any{{\"id\": 1, \"tags\": []string{\"a\"}}, {\"id\": 2}}\nenc := json.NewEncoder(os.Stdout)\nenc.SetIndent(\"\", \"  \") // pretty-print\nfor _, item := range items {\n\tenc.Encode(item) // appends newline\n}\n```\n\n#### Custom types\n\nImplement `json.Marshaler` and `json.Unmarshaler` for custom encoding:\n\n```go\ntype User struct {\n\tID   int    `json:\"id\"`\n\tName string `json:\"name\"`\n}\n\nfunc (u User) MarshalJSON() ([]byte, error) {\n\t// return custom JSON bytes\n\treturn json.Marshal(map[string]any{\n\t\t\"id\":   u.ID,\n\t\t\"name\": strings.ToUpper(u.Name),\n\t})\n}\n\nfunc (u *User) UnmarshalJSON(b []byte) error {\n\ttype Alias User // same fields, but none of User's methods: no infinite recursion\n\taux := struct {\n\t\t*Alias\n\t\tName string `json:\"name\"` // shadows Alias.Name so we can transform it\n\t}{Alias: (*Alias)(u)}\n\tif err := json.Unmarshal(b, &aux); err != nil {\n\t\treturn err\n\t}\n\tu.Name = strings.ToLower(aux.Name)\n\treturn nil\n}\n\nfunc main() {\n\tout, _ := json.Marshal(User{ID: 7, Name: \"ada\"})\n\tfmt.Println(string(out)) // {\"id\":7,\"name\":\"ADA\"}\n\n\tvar u User\n\terr := json.Unmarshal(out, &u)\n\tfmt.Println(u, err) // {7 ada} <nil>\n}\n```\n\n### Go 1.24: os.Root\n\nGo 1.24 adds `os.Root` to confine file operations to a single directory, preventing path traversal attacks when handling user-supplied paths:\n\n```go\ndir, _ := os.MkdirTemp(\"\", \"root-demo\") // stands in for /var/app/data\ndefer os.RemoveAll(dir)\n\nroot, err := os.OpenRoot(dir)\nif err != nil {\n\tlog.Fatal(err)\n}\ndefer root.Close()\n\nf, err := root.Create(\"output.txt\") // creates <dir>/output.txt\nfmt.Println(err)                    // <nil>\nf.Close()\n\n_, err = root.Open(\"../../etc/passwd\") // error: path escapes from parent\nfmt.Println(err)\n```\n\n## Idioms & Best Practices\n\n- **Accept `io.Reader`, return concrete types.** Functions should work against the interface, not a concrete type. This is the core of Go's composability.\n\n- **Always check `sc.Err()` after a `bufio.Scanner` loop.** Forgetting this is a classic bug: the scanner silently stops at 64 KiB.\n\n- **Raise the `bufio.Scanner` token limit only when necessary.** If you're handling unbounded lines, you probably want a different approach.\n\n- **Streaming is better than whole-file for large or untrusted input.** Use `io.LimitReader` to protect against memory exhaustion.\n\n- **Check Close errors on writers, not on readers.** Data may only hit the disk or network on Close or Flush, so `f.Close()` can fail.\n\n- **Use a named error for Close in a deferred function.** Capture and check the Close error separately so Flush errors propagate correctly.\n\n- **Disallow unknown JSON fields for configs and APIs.** Use `dec.DisallowUnknownFields()` to catch typos in JSON keys.\n\n- **Compose readers and writers for pipelines.** Don't write data to intermediate buffers; use `io.TeeReader`, `io.MultiWriter`, and `io.Copy` to build efficient chains.\n\n- **Remember that `io.Read` returns `n` and `err` together.** Process n bytes before checking the error.\n\n- **Use `filepath.WalkDir` instead of `Walk`.** It's more efficient because `DirEntry` caches stat info.\n\n## Common Pitfalls\n\n- **Forgetting to check `sc.Err()` after a Scanner loop.** The scanner stops silently at 64 KiB.\n\n- **Processing `io.EOF` as a failure.** `io.EOF` is not an error; it signals end-of-stream. Many operations return it together with data.\n\n- **Buffered output lost on `os.Exit`.** `os.Exit` does not run deferred functions, so `defer w.Flush()` doesn't help in a CLI's main.\n\n- **Reslicing a huge slice to keep only a part.** The whole array stays in memory. Use `slices.Clone` or copy to drop the parent.\n\n- **Ignoring the error from `csv.Writer.Flush` or `w.Error()`.** Writes are buffered; errors surface on Flush or at the end.\n\n- **Using `io.ReadAll` on untrusted input.** This can exhaust memory. Use `io.LimitReader` instead.\n\n- **Not handling `n > 0` and `err != nil` together in a manual Read loop.** This is the `io.Reader` contract.\n\n- **Assuming JSON keys are case-sensitive.** Unmarshal matches case-insensitively, which surprises many developers.\n\n- **Using `omitempty` when you meant `omitzero`.** `omitempty` omits empty strings and empty slices, but not zero structs.\n\n- **Keeping slices obtained from `sc.Bytes()`.** They reference the scanner's internal buffer, which is reused.\n\n## Exercises\n\nComplete the following exercises in the order listed. Each exercise has a test file that you must make pass by implementing the function or method described in the starter code.\n\n### Exercise 1: rot13 Reader\n\n**What to implement:** A custom `io.Reader` that applies ROT13 transformation to bytes flowing through it.\n\n**What you'll learn:** How to wrap a reader, understand `io.Read` semantics (n and err together), and handle partial reads correctly.\n\n**Test command:**\n```bash\ngo test ./modules/05-io/exercises/rot13/\n```\n\n### Exercise 2: linecount\n\n**What to implement:** A function that counts lines and reports the longest line, handling lines of any length without loading the entire line into memory.\n\n**What you'll learn:** `bufio.Reader.ReadLine` for unbounded lines, the difference between the 64 KiB Scanner limit and streaming approaches, and how to track state across chunks.\n\n**Test command:**\n```bash\ngo test ./modules/05-io/exercises/linecount/\n```\n\n### Exercise 3: csvjson\n\n**What to implement:** A function that converts CSV to newline-delimited JSON (NDJSON), streaming one row at a time.\n\n**What you'll learn:** `encoding/csv` and `encoding/json` with streaming (Decoder/Encoder), header validation, and proper error handling and wrapping.\n\n**Test command:**\n```bash\ngo test ./modules/05-io/exercises/csvjson/\n```\n\n### Exercise 4: tail\n\n**What to implement:** A function that returns the last N lines of a stream using a ring buffer, without loading the whole file.\n\n**What you'll learn:** Ring buffers for fixed-size history, the token limit issue with Scanner, and how to manage memory under constraints.\n\n**Test command:**\n```bash\ngo test ./modules/05-io/exercises/tail/\n```\n\n### Exercise 5: config\n\n**What to implement:** A JSON config loader with custom unmarshaling (Duration), validation, and proper error handling.\n\n**What you'll learn:** Custom JSON types with `Unmarshaler`, validation with `errors.Join`, `DisallowUnknownFields`, file operations, and comprehensive error messages.\n\n**Test command:**\n```bash\ngo test ./modules/05-io/exercises/config/\n```\n\n## Project\n\nSee `project/README.md` for the **Log Analyzer** project: parse HTTP access logs, aggregate status codes and paths, compute p50/p95 latency, and output as text or JSON, all without loading the entire file into memory.\n\n## Submitting for Review\n\nWhen all exercise tests pass, ask your instructor (Claude) to review `modules/05-io/`. The instructor will check:\n\n- Correct implementation of the core concepts (streaming, error handling, `io.Reader`/`io.Writer` patterns)\n- No unnecessary allocations or buffering (logs should stream, not load)\n- Proper error handling and wrapping\n- Code cleanliness and idiomatic Go\n\n## Further Reading\n\n- **io package:** https://pkg.go.dev/io\n- **bufio package:** https://pkg.go.dev/bufio\n- **encoding/csv:** https://pkg.go.dev/encoding/csv\n- **encoding/json:** https://pkg.go.dev/encoding/json\n- **filepath.WalkDir:** https://pkg.go.dev/path/filepath#WalkDir\n- **Go Blog \u2013 JSON and Go:** https://go.dev/blog/json\n- **Go 1.24 release notes \u2013 os.Root:** https://go.dev/blog/osroot\n- **100 Go Mistakes #46:** Using a filename as input instead of io.Reader\n- **100 Go Mistakes #54:** Ignoring Close and Flush errors on writes\n- **100 Go Mistakes #79:** Ignoring errors from Close and Write operations\n", "units": [{"kind": "exercise", "name": "config", "dir": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/config", "doc": "Package config loads and validates a JSON service configuration.", "readme": "", "files": [{"name": "config.go", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/config/config.go"}, {"name": "config_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/config/config_test.go"}], "cmd": "go test ./modules/05-io/exercises/config/", "id": "modules/05-io/exercises/config"}, {"kind": "exercise", "name": "csvjson", "dir": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/csvjson", "doc": "Package csvjson converts CSV with a header row into newline-delimited JSON\n(one JSON object per line, also known as NDJSON or JSON Lines).", "readme": "", "files": [{"name": "csvjson.go", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/csvjson/csvjson.go"}, {"name": "csvjson_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/csvjson/csvjson_test.go"}], "cmd": "go test ./modules/05-io/exercises/csvjson/", "id": "modules/05-io/exercises/csvjson"}, {"kind": "exercise", "name": "linecount", "dir": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/linecount", "doc": "Package linecount counts lines in a stream of text without ever holding a\nwhole line in memory.", "readme": "", "files": [{"name": "linecount.go", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/linecount/linecount.go"}, {"name": "linecount_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/linecount/linecount_test.go"}], "cmd": "go test ./modules/05-io/exercises/linecount/", "id": "modules/05-io/exercises/linecount"}, {"kind": "exercise", "name": "rot13", "dir": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/rot13", "doc": "Package rot13 provides an io.Reader that applies the ROT13 substitution\ncipher to the bytes flowing through it.", "readme": "", "files": [{"name": "rot13.go", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/rot13/rot13.go"}, {"name": "rot13_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/rot13/rot13_test.go"}], "cmd": "go test ./modules/05-io/exercises/rot13/", "id": "modules/05-io/exercises/rot13"}, {"kind": "exercise", "name": "tail", "dir": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/tail", "doc": "Package tail returns the last lines of a stream, like the Unix tail(1)\ncommand, using memory proportional to the number of lines kept rather\nthan to the size of the input.", "readme": "", "files": [{"name": "tail.go", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/tail/tail.go"}, {"name": "tail_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/exercises/tail/tail_test.go"}], "cmd": "go test ./modules/05-io/exercises/tail/", "id": "modules/05-io/exercises/tail"}, {"kind": "project", "name": "project", "dir": "/home/csmith/Workspace/tools/go-course/modules/05-io/project", "doc": "", "readme": "# Project: Log Analyzer\n\n## Overview\n\nBuild a command-line tool that parses HTTP access logs in Apache Combined Log Format, aggregates statistics, and outputs a report in text or JSON format. The tool must stream logs without loading the entire file into memory.\n\n## Specification\n\n### Input Format\n\nLogs are in Apache Combined Log Format:\n\n```\n10.0.0.2 - - [11/Oct/2026:13:00:00 +0000] \"GET /api/items/7 HTTP/1.1\" 200 1024 0.034\n```\n\nFields (in order):\n1. **IP address** (client IP, possibly IPv6)\n2. **ident** (always `-` in modern logs)\n3. **userid** (user ID if authenticated, else `-`)\n4. **timestamp** in the format `[11/Oct/2026:13:00:00 +0000]`\n5. **request line** in double quotes: `METHOD PATH HTTP/VERSION` (e.g., `\"GET / HTTP/1.1\"`)\n6. **status code** (HTTP status, e.g., 200, 404, 500)\n7. **bytes sent** (response body size, or `-` if none)\n8. **latency** (response time in seconds, as a decimal)\n\nMalformed lines should be skipped with a warning printed to stderr.\n\n### Parsing\n\nImplement a `func Parse(line string) (*LogEntry, error)` that returns:\n\n```go\ntype LogEntry struct {\n    IP       string        // client IP\n    UserID   string        // authenticated user, or empty if \"-\"\n    Timestamp time.Time    // parsed timestamp (use time.Parse with a custom layout)\n    Method   string        // HTTP method\n    Path     string        // request path (without query string)\n    Status   int           // HTTP status code\n    Bytes    int64         // response body size, 0 if \"-\"\n    Latency  time.Duration // response time\n}\n\nts, _ := time.Parse(\"02/Jan/2006:15:04:05 -0700\", \"11/Oct/2026:13:00:00 +0000\")\ne := LogEntry{IP: \"10.0.0.2\", Timestamp: ts, Method: \"GET\", Path: \"/api/items/7\", Status: 200, Bytes: 1024, Latency: 34 * time.Millisecond}\nfmt.Printf(\"%+v\\n\", e)\n```\n\nThe timestamp format is: `02/Jan/2006:15:04:05 -0700` (day/month/year:hour:min:sec timezone).\n\nTo extract the path from a request line like `\"GET /api/items?page=2 HTTP/1.1\"`, strip the query string. Malformed request lines should error.\n\n### Aggregation\n\nImplement an `Analyzer` type with methods that return statistics without holding all logs in memory:\n\n```go\n// Runs YOUR loganalyzer package. The API to implement:\n//\n//\tfunc NewAnalyzer() *Analyzer                      // empty, ready to process logs\n//\tfunc (a *Analyzer) ProcessLine(line string) error // parse one line, update the statistics\n//\tfunc (a *Analyzer) StatusCounts() []StatusCount   // status code counts, by count (descending)\n//\tfunc (a *Analyzer) TopPaths(n int) []PathCount    // top n paths, most-requested first\n//\tfunc (a *Analyzer) Latency() LatencyStats         // p50, p95 and max latency\n//\n// Exact percentiles on a stream require storing every latency, which bends\n// the \"streaming\" constraint; a production tool would estimate them with a\n// sketch. For this project, store the latencies (8 bytes each) and compute\n// exact percentiles.\nimport \"gocourse/modules/05-io/project/loganalyzer\"\n\nvar lines = []string{\n\t`10.0.0.2 - - [11/Oct/2026:13:00:00 +0000] \"GET /api/items/7 HTTP/1.1\" 200 1024 0.034`,\n\t`10.0.0.3 - ada [11/Oct/2026:13:00:01 +0000] \"GET /api/items?page=2 HTTP/1.1\" 200 512 0.120`,\n\t`10.0.0.2 - - [11/Oct/2026:13:00:02 +0000] \"POST /api/items HTTP/1.1\" 500 - 1.500`,\n\t`not a log line`,\n}\n\nfunc main() {\n\ta := loganalyzer.NewAnalyzer()\n\tfor _, line := range lines {\n\t\tif err := a.ProcessLine(line); err != nil {\n\t\t\tfmt.Println(\"skipped:\", err)\n\t\t}\n\t}\n\tfmt.Println(a.StatusCounts())\n\tfmt.Println(a.TopPaths(2))\n\tfmt.Printf(\"%+v\\n\", a.Latency())\n}\n```\n\nSupporting types:\n\n```go\ntype StatusCount struct {\n    Status int\n    Count  int\n}\n\ntype PathCount struct {\n    Path  string\n    Count int\n}\n\ntype LatencyStats struct {\n    P50 time.Duration\n    P95 time.Duration\n    Max time.Duration\n}\n\nfmt.Println([]StatusCount{{200, 41}, {404, 3}}, []PathCount{{\"/\", 12}})\nfmt.Printf(\"%+v\\n\", LatencyStats{P50: 30 * time.Millisecond, P95: 180 * time.Millisecond, Max: time.Second})\n```\n\n### Output Formats\n\n#### Text Format\n\nPlain text report, one metric per line or table:\n\n```\nStatus Codes:\n  200: 45\n  404: 12\n  500: 3\n\nTop Paths:\n  /api/items: 30\n  /static/style.css: 15\n  /: 10\n\nLatency:\n  p50: 45ms\n  p95: 120ms\n  max: 500ms\n```\n\n#### JSON Format\n\nStructured JSON output:\n\n```json\n{\n  \"status_codes\": [\n    {\"status\": 200, \"count\": 45},\n    {\"status\": 404, \"count\": 12},\n    {\"status\": 500, \"count\": 3}\n  ],\n  \"top_paths\": [\n    {\"path\": \"/api/items\", \"count\": 30},\n    {\"path\": \"/static/style.css\", \"count\": 15},\n    {\"path\": \"/\", \"count\": 10}\n  ],\n  \"latency\": {\n    \"p50_ms\": 45,\n    \"p95_ms\": 120,\n    \"max_ms\": 500\n  }\n}\n```\n\n### CLI\n\nImplement `cmd/loganalyzer/main.go` with the following interface:\n\n```bash\nloganalyzer [flags] [file]\n```\n\nFlags:\n- `-format text|json` (default: `text`) \u2014 output format\n- `-top N` (default: 10) \u2014 number of top paths to show\n\nArguments:\n- `[file]` \u2014 log file to analyze; if omitted or \"-\", read from stdin\n\nUsage examples:\n\n```bash\n# Analyze a file\nloganalyzer -format json access.log\n\n# Analyze stdin\nloganalyzer < access.log\nloganalyzer - < access.log\n\n# Show top 5 paths\nloganalyzer -top 5 access.log\n```\n\nThe tool should:\n1. Accept a filename or stdin.\n2. Read and parse logs with `bufio.Scanner` or a similar streaming approach.\n3. Skip malformed lines and print warnings to stderr.\n4. Output the report to stdout.\n5. Exit with code 0 on success, 1 on error (other than parsing errors in logs).\n\n### Streaming Requirement\n\nThe tool must not load the entire log file into memory. This means:\n- Do not use `io.ReadAll` or `os.ReadFile`.\n- Process logs one line at a time with `bufio.Scanner`.\n- Update aggregate statistics incrementally.\n- For latencies, storing all values is acceptable (they're few), but do not store raw log entries.\n\n### Testing\n\nWrite tests that:\n1. Test `Parse` with valid and malformed lines.\n2. Test `Analyzer` with a small set of log lines.\n3. Test the `main` function by calling it with a temporary test file and checking exit codes and output.\n4. Include a test that processes the provided testdata and verifies the output format.\n\nUse the provided `testdata/access.log` for integration tests.\n\n### Acceptance Criteria\n\n\u2713 Parses at least 90% of real-world Apache Combined Log Format lines correctly\n\u2713 Skips malformed lines with a warning, does not crash\n\u2713 Streams logs without loading entire file into memory\n\u2713 Outputs text and JSON formats correctly\n\u2713 All tests pass: `go test ./...` (add `-race` to check for concurrency issues)\n\u2713 Code is `gofmt`-clean and passes `go vet`\n\u2713 CLI respects `file` and `-
