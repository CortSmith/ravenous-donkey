e made with `make([]R, 0, len(s))`, make the slice with its full length and assign by index. The readable version never regrows either (its capacity is already exact), so the only saving is `append`'s per-call capacity check and length update. **Measured on Go 1.24.2 linux/amd64 (`-count=5`, medians):** Map: ~48,500 ns/op (81,920 B, 1 alloc); MapFast: ~45,400 ns/op (81,920 B, 1 alloc). About 5\u201310% faster, which is within run-to-run noise on this machine. Same memory. Lesson: once capacity is right, `append` is nearly free.\n\n- **FilterFast:** Pre-allocate the worst-case capacity (len(s)) up front, so it does exactly one allocation no matter how many elements survive. The cost is memory: if `keep` rejects most elements, you pin a mostly-empty backing array long-term. Callers can recover space with `slices.Clip` if needed. **Measured (medians):** Filter (readable): ~76,700 ns/op (128,248 B, 16 allocs); FilterFast (prealloc): ~60,700 ns/op (81,920 B, 1 alloc). About 20\u201335% faster depending on the run, single allocation instead of 16.\n\n- **FilterInPlace:** Reslice the caller's backing array to 0 and append kept elements into it. This DESTROYS the input slice\u2014only correct when the caller owns it entirely and won't use it again. Zero allocations. This is what `slices.DeleteFunc` does (with the predicate inverted). **Measured:** FilterInPlace: ~23,400 ns/op (0 B, 0 allocs). This is about 3x faster than readable Filter, but correctness depends on ownership and contract clarity. The speedup comes from both eliminating allocations and reducing work (append into pre-owned capacity).\n\n### Trade-off\n\n- **Readable vs MapFast:** The measured difference (~5\u201310%) is close to noise, and the indexed loop is about as clear as `append`. Either is fine; don't flag one or the other in review.\n- **Readable Filter vs FilterFast:** Readable Filter's 16 allocations come from repeated slice growth. FilterFast cuts the time by roughly a quarter and the allocations to one, paying with worst-case memory. Choose FilterFast when allocations are profiled as a bottleneck.\n- **FilterInPlace vs others:** Only use FilterInPlace when you own the input and never intend to read it again. The zero-allocation property is powerful in tight loops (e.g., a cleanup phase), but the precondition is strict. Document it prominently; it's easy to misuse.\n\n### Review checklist\n\n- Does `Map` pre-allocate with exactly `len(s)` capacity? (Not larger, not smaller.)\n- Does `Filter` build a fresh slice with `var out S` (appending to a nil slice) instead of `s[:0]`? The latter overwrites `s` itself.\n- Does `Reduce` return the accumulator itself when the slice is empty? (Not a zero `R`, but the `init` value passed in.)\n- Does `GroupBy` avoid a misleading size hint? The number of groups is unknown, so `make(map[K]S, len(s))` usually over-allocates; plain `make(map[K]S)` is the right default.\n- Does `GroupBy` return a non-nil map even when `s` is empty? (Important for JSON marshaling; `nil` and `{}` marshal differently.)\n- All four functions: do they preserve the input `s` unchanged and never mutate its backing array?\n- Why is `K comparable` in `GroupBy` but not required on `E` in `Map`? (Because map keys must be comparable, but elements can be anything.)\n- Are all doc comments present and start with the function name?\n\n---\n\n## Exercise 2: `set` \u2014 A generic hash set\n\n### Readable solution\n\n`Set[T comparable]` wraps `map[T]struct{}`, the idiomatic Go set. The zero value `Set` is usable: reading from a nil map is safe (returns the zero value), only writes panic, so `Add` initializes `s.m` on first write while `Remove` and `Contains` just read. `Contains` and `Len` additionally accept a nil `*Set` (they check `s == nil`), so a nil set behaves like an empty one for reads. `Add` on a nil `*Set` still panics, which is acceptable: there is nowhere to store the element.\n\n`All()` returns `iter.Seq[T]`, allowing callers to range over the set lazily. Set operations (`Union`, `Intersect`, `Difference`) use the iterator and build new sets by iterating and conditionally adding. This is obviously correct and easy to verify.\n\n`Sorted` is a standalone function, not a method, because it needs the constraint `T cmp.Ordered` while `Set` only requires `T comparable`. A method cannot tighten the receiver's type constraint, so the function form is necessary.\n\nThe readable implementation prioritizes clarity: direct map operations, no optimizations, obviously correct logic.\n\n### Optimized solution\n\n`IntersectFast` uses an asymmetry optimization: it walks the **smaller** of the two sets and probes the **larger**, doing O(min(len(s), len(o))) map lookups instead of O(len(s)). It also pre-allocates the result map to the smaller set's size, avoiding incremental map growth during insertion.\n\n**Measured on Go 1.24.2 linux/amd64:** Two sets of 100,000 and 100 integers respectively (Readable version iterates all 100k; Fast version iterates the 100).\n- Intersect (readable): ~2,470,000 ns/op (4,656 B, 12 allocs)\n- IntersectFast (fast): ~4,100 ns/op (2,400 B, 5 allocs)\n- **Speedup: ~600x faster** (the exact ratio varies between runs; the point is orders of magnitude). This dramatic improvement happens because the fast version avoids iterating 100k elements; instead it only probes 100 lookups. This illustrates how algorithmic choice (not just implementation detail) drives performance.\n\nThe code is less obvious: the asymmetry swap and direct `range` over `s.m` (avoiding the iterator closure) require careful reading, but the test coverage is thorough.\n\n### Trade-off\n\n- **Readable vs IntersectFast:** Readable is fine unless you're intersecting huge sets repeatedly in hot code. The iterator overhead is real but much smaller than Intersect's algorithmic penalty. The clarity of \"I range over s and check if each is in o\" beats the asymmetry optimization in most contexts. Use IntersectFast only if profiling shows intersection is a bottleneck.\n\n### Review checklist\n\n- Does `Add` initialize `s.m` if it's nil, or rely on an `ensure()` helper?\n- Do the read-only methods (`Contains`, `Len`) handle a nil `*Set` safely, returning false/0 instead of panicking?\n- Does the iterator in `All()` check `yield`'s return value and return immediately when it's false? Critical for early break: `if !yield(v) { return }`.\n- Does `Sorted` use a top-level generic function instead of a method? (Go 1.24 doesn't support generic methods; a receiver's constraints are fixed.)\n- Do set operations return non-nil maps for consistency? `Union(nil, nil)` should be `{}`, not `nil`. `len(Union(nil, nil))` should be `0`, not a panic.\n- For `IntersectFast`: does the asymmetry correctly swap if s is larger than o?\n- Are the comment explanations clear about why Intersect was not optimized in the readable version?\n\n---\n\n## Exercise 3: `stackqueue` \u2014 Generic LIFO and FIFO containers\n\n### Readable solution\n\n`Stack[T]` is a slice where `Push` appends and `Pop` removes the last element, returning it and a bool for success. `Queue[T]` is a slice where `Push` appends and `Pop` removes the first element by reslicing (`items[1:]`).\n\nBoth return the zero value of `T` when empty, avoiding panics and simplifying the API. Critically, after popping, the code explicitly zeroes the vacated slot to allow the GC to reclaim anything the old value points to. For Stack: `s.items[last] = zero` after `Pop`. For Queue: `q.items[0] = zero` before `q.items = q.items[1:]`. The slot is now outside the slice, but it is still part of the backing array until the next regrow, so without zeroing it would keep the old value alive. A student who forgets this in either type has a memory leak whenever `T` holds pointers and the container is long-lived.\n\nBoth are simple and obviously correct. The zero-value readiness makes them usable as struct fields without initialization.\n\n### Optimized solution\n\n`RingQueue[T]` uses a **circular buffer** backed by a power-of-two-sized slice. Head and tail pointers (represented as a head index and a count `n`) never grow. `Push` reallocates only when the buffer is genuinely full. `Pop` never shrinks. In steady state (equal push/pop), RingQueue allocates nothing after initial growth; `Queue` by contrast keeps sliding its window forward, eventually exhausting capacity and forcing `append` to copy the entire slice.\n\nThe ring logic uses bitwise `&` for modulo because the buffer size is a power of two. When the buffer is full, grow() unrolls the circular buffer into a new, contiguous block.\n\n**Measured on Go 1.24.2 linux/amd64:** 1000-element steady-state churn (one push and one pop per iteration):\n- Queue (slice): ~12.3 ns/op (22 B/op, 0 allocs \u2014 the allocation count rounds down to 0 because it is less than one per op)\n- RingQueue (ring): ~2.9 ns/op (0 B/op, 0 allocs)\n- **Speedup: ~4x faster.** Reslicing with `items[1:]` never allocates. But it moves the slice's start forward through the backing array, and the slots in front are lost. When `append` reaches the end of the capacity, it allocates a new array and copies the live elements. That periodic copy, averaged over every op, is the 22 B/op. RingQueue reuses its slots, so it never reallocates in steady state.\n\nThe trade-off: the ring logic is harder to verify; it's easy to get off-by-one bugs wrong. The sentinel pattern and index wrapping require careful review.\n\n### Trade-off\n\n- **Readable vs RingQueue:** The slice-based Queue is dead simple and fine for most uses. RingQueue saves allocations in a tight loop but its ring logic is harder to verify and the speedup is architectural, not a small constant factor. Use RingQueue if profiling shows the queue is allocating in a hot path. For interactive applications or batch processing, Queue is sufficient.\n\n### Review checklist\n\n- Do both `Pop()` and `Peek()` return the zero value and false when the container is empty? (Not panicking.)\n- Does `Pop` zero the vacated slot to avoid pinning values the GC should reclaim? Critical for Stack; important for Queue if elements point to large allocations.\n- Is the zero value of both types usable (empty and ready for `Push` without initialization)?\n- For RingQueue (fast.go):\n  - Does `grow()` correctly unroll the circular buffer when the head is not 0? (Copy from head to end, then from start to head, into the new buffer.)\n  - Is the index wrapping correct? `(q.head + q.n) & (len(q.buf) - 1)` for the insert position when pushing.\n  - Does `Pop` update both the vacated slot's value and the head index?\n- Are there any off-by-one bugs in the circular-list manipulation? This is the most error-prone part.\n\n---\n\n## Exercise 4: `numeric` \u2014 Arithmetic over type constraints\n\n### Readable solution\n\nDefine three constraints:\n\n- **Integer** (all signed and unsigned integer types and their named variants): `~int | ~int8 | ~int16 | ~int32 | ~int64 | ~uint | ...`\n- **Float** (float32, float64 and their named variants): `~float32 | ~float64`\n- **Number** (the union): `Integer | Float`\n\nEach uses the `~` prefix because a named type like `type Celsius float64` must satisfy `~float64`.\n\n`Sum` accumulates a `T` in a local variable and returns it unchanged when the slice is empty. `SumBy` takes a slice of structs and a function to extract a `Number` from each, useful for summing a field across a struct slice without a separate step.\n\n`Mean` converts to `float64` to avoid integer overflow in the accumulator. It returns `(float64, bool)` because the mean of an empty slice is undefined (`0/0.0` would be NaN). The bool signals success/failure.\n\n`Clamp` uses `cmp.Ordered` (integers, floats, strings) and returns `min(max(v, lo), hi)` with the Go 1.21 builtins. It panics if `cmp.Less(hi, lo)`. `cmp.Less` orders NaN before every other value, whereas `hi < lo` is always false when either is NaN. Note that the builtin `min`/`max` propagate NaN, so `Clamp(NaN, 0, 1)` returns NaN. That is a reasonable result, but the student should be able to say why.\n\n### Optimized solution\n\nNo further optimizations beyond the readable versions; the implementations are already tight. The key \"optimization\" is in `Mean`: explicitly converting to `float64` before accumulating prevents integer overflow. An `int` or `uint8` might overflow in the sum; converting each element to `float64` and then adding avoids this, at the cost of floating-point rounding.\n\n### Trade-off\n\nNone significant. The readable versions are the optimized versions. The constraint definitions are the critical part; wrong constraints (missing `~`, wrong types) are the most common error here.\n\n### Review checklist\n\n- Are the constraints correctly defined with `~` on every base type?\n- Does `Sum` work correctly with named types like `type Days int`? (Test: `Sum([]Days{1, 2, 3})`.)\n- Does `SumBy` pass both the slice and an element-to-number function?\n- Does `Mean` handle empty slices by returning the zero float and false? (Not returning a NaN or panicking.)\n- Does `Clamp` panic if `lo > hi`, since that's a programmer error, not a runtime condition?\n- Does `Clamp` validate `lo <= hi` with `cmp.Less` (NaN-aware) and use the builtin `min`/`max` rather than hand-written comparisons?\n- Why does Clamp use `cmp.Ordered` rather than `Number`? (It only needs ordering, not arithmetic, so it can accept strings too. Choose the weakest constraint that works.)\n- What is the student's experiment result from the package doc comment? (The doc should reference an experiment confirming that named types satisfy their underlying constraints.)\n\n---\n\n## Exercise 5: `iterx` \u2014 Lazy iterator adapters\n\n### Readable solution\n\nAn `iter.Seq[T]` is a function type: `func(yield func(T) bool)`. The returned sequence is that function. `Filter` and `Map` compose: they return a sequence that ranges over the input sequence, applies a check or transformation, and yields kept elements.\n\nThe **one critical rule:** when `yield` returns `false` (the consumer has broken early), the iterator must return immediately and never call `yield` again. Every function checks this: `if !yield(v) { return }`.\n\n`Naturals()` is infinite; callers must use `Take` or a loop with an explicit `break`. `Enumerate` returns `iter.Seq2` (key, value pairs; indices and values). Per-iteration state like `Take`'s `taken` counter lives inside the closure so each range starts fresh.\n\n### Optimized solution\n\n`FilterMap` fuses `Filter` and `Map` into one adapter: one closure layer and one `yield` call per kept element instead of two. This halves the overhead. Use it only when profiling shows the pipeline itself is hot; composing `Filter(Map(...))` reads better and the overhead is usually small.\n\n**Measured on Go 1.24.2 linux/amd64:** Sum of squares of even numbers in a 10,000-element slice, three ways:\n- Pipeline (Filter then Map): ~42,600 ns/op (280 B, 12 allocs)\n- FilterMap (fused): ~36,300 ns/op (216 B, 8 allocs)\n- Plain loop: ~7,500 ns/op (0 B, 0 allocs)\n- **Speedup: FilterMap vs pipeline is ~15% faster.** The pipeline overhead is real (yield calls) but small compared to the plain loop (both are much slower because iterators involve closures and function calls). FilterMap is a win when you're already in hot code, but most code can stay with the composed version.\n\n### Trade-off\n\n- **Composed vs FilterMap:** Composed reads better and is easier to reason about. Use FilterMap only if you've profiled and found the iterator pipeline is your bottleneck. In most applications, the clarity of `Filter(Map(...))` is worth the extra closure call.\n\n### Review checklist\n\n- Does every iterator call `yield` and check its return value immediately? E.g., `if !yield(v) { return }`, not `yield(v)` with the return ignored. This is critical: ignoring the return triggers a runtime panic when the consumer breaks.\n- Does `Take` declare its counter inside the closure, so each `range` starts fresh at 0? (Otherwise the second `range` over the same `Take` sequence will continue from where the first left off.)\n- Does the iterator stop yielding as soon as the consumer signals it? (Test: `break` in a loop should exit early, pulling only as many elements as needed.)\n- For `Naturals`: does the test confirm early break works? It should pull only as many elements as the consumer asks for.\n- For `Enumerate` and `Filter` \u2192 `Map` composition: do the tests confirm reusability? The same `Seq` can be ranged twice and should yield the same elements both times.\n- Are the return-value checks for `yield` consistent across all iterators?\n\n---\n\n## Project: Generic LRU Cache\n\n### Overview\n\nBuild `Cache[K comparable, V any]` and an optional faster variant `FastCache`. Requirements: O(1) `Get`/`Put`/`Delete`, capacity-based eviction, optional TTL with an injectable clock, and an `All()` iterator in recency order. The spec, hints and stretch goals are in `project/README.md`.\n\n### Readable solution\n\n`Cache[K comparable, V any]` uses `container/list` for recency order (doubly-linked list) and a map from key to `*list.Element` for O(1) lookup. `Get` moves an entry to the front (most recently used) and returns it. `Put` adds or updates; if the cache is full, it evicts the back (least recently used) element before adding a new one.\n\nOptional TTL: entries can expire. `Get` checks expiry and removes if expired. An `options` struct holds the TTL duration and a `now` function for injectable time in tests (critical for deterministic testing of expiry).\n\n`All()` returns an `iter.Seq2[K, V]` in recency order, skipping expired entries. The container/list approach is readable, obviously correct, and easy to verify. The cost: allocates an `Element` per entry and boxes the entry value in `Element.Value.(any)`.\n\n### Optimized solution\n\n`FastCache[K comparable, V any]` lives entirely in a **preallocated nodes slice** (`make([]node[K, V], 1, capacity+1)`: the sentinel plus one slot per entry, never regrown). Nodes are referenced by int32 indices, not pointers, so the slice has no internal pointers for the GC to chase (unless K or V contain pointers). The TTL is stored as `int64 UnixNano` (8 bytes) instead of `time.Time` (24 bytes due to the `*Location` field). The clock is only consulted when TTL is configured, avoiding the clock call entirely otherwise.\n\nAll nodes sit contiguously in memory. When full, the evicted slot is reused for the new entry. Steady-state `Get`/`Put` allocate nothing. Trade-off: you maintain a hand-rolled doubly-linked list with a sentinel node, indexed by int32. Off-by-one bugs in the ring manipulation are easy to introduce.\n\n**Measured on Go 1.24.2 linux/amd64:** 1000-capacity cache, 4096-iteration workload with skewed key access (roughly 2 Gets per Put), mixed hits, misses and evictions:\n- Cache (list-based): ~84 ns/op (26 B/op, 0 allocs rounded; under one allocation per op)\n- FastCache (arena): ~27.3 ns/op (0 B/op, 0 allocs)\n- **Speedup: ~3x faster** on the mixed workload. Without TTL, the difference is clear. With TTL:\n- Cache (list+TTL): ~96 ns/op\n- FastCache (arena+TTL): ~63 ns/op\n- **Speedup: ~1.5x faster** when TTL is enabled. The TTL check adds overhead to both; FastCache avoids boxing and element allocation, but the clock call cost is similar.\n\nThe no-allocation property of FastCache is the real win in latency-sensitive code: fewer allocations mean less GC work, which shows up in tail latency more than in average ns/op.\n\n### Trade-off\n\n- **Readable vs FastCache:** Use Cache unless you're building a production cache under sustained load. The list-based clarity is worth the 2\u20133x throughput difference in most applications. FastCache is valuable for:\n  - Embedded systems or latency-critical services (e.g., DNS cache, TCP connection pool).\n  - Learning how arena-based allocation and pointer-free structures work (educational value).\n  - Code that profiles and confirms the cache is a bottleneck.\n\n### Review checklist\n\n**Readable (container/list-based):**\n- Does `New` panic if capacity < 1? (A programming error.)\n- Does `Get` move the entry to the front before returning it?\n- Does `Get` check expiry and remove expired entries? If expired, return the zero V and false.\n- Does `Put` evict the back element (LRU) if the cache is full before adding a new one?\n- Does `Delete` correctly remove an entry and its map entry?\n- Does `All()` return an iterator that respects expiry and yields in recency order?\n- Is the clock injected via `WithClock` for testability? (Tests use a fake clock to control time.)\n- For TTL: does `Put` check and set expiry correctly? Is the duration added to now correctly?\n\n**FastCache (arena-based):**\n- Are node links (prev/next) stored as int32 indices, with `0` as the sentinel?\n- Does `NewFast` initialize the nodes slice with capacity 1 (the sentinel)? `make([]node[K, V], 1, capacity+1)`\n- Does `nowNano()` avoid calling the clock when TTL is not configured? (Return 0 if ttl == 0.)\n- Does `Get` update recency (by unlinking and pushing to front) only when the entry is not already at the front? (Optimization to avoid redundant work.)\n- When evicting and the cache is full, is the back element's slot reused? Or does `Put` allocate a new slot?\n- Does the `remove` function keep the arena dense by moving the last node into the hole?\n- Does `All()` iterate in recency order and skip expired entries?\n- Are there off-by-one bugs in the circular-list manipulation? (Hand-verify: `pushFront`, `unlink`, `remove`.)\n\n### Common student errors\n\n- **Off-by-one in FastCache indices:** Using `i+1` instead of the actual next index, or confusing the sentinel with a regular node.\n- **Forgetting to check `yield`'s return value in iterators:** This causes a panic when a consumer breaks early.\n- **Not injecting the clock:** Making `Get` and `Put` call `time.Now()` directly, making tests non-deterministic.\n- **Forgetting TTL checks:** Returning expired entries, or never evicting them.\n- **Allocating unnecessarily:** Creating new Elements or boxing values in FastCache.\n\n---\n\n## Summary of Measured Speedups (Go 1.24.2 linux/amd64, `-count=5`, medians, rounded)\n\n| Component | Readable | Optimized | Speedup | Notes |\n|---|---|---|---|---|\n| Map | ~48,500 ns/op | ~45,400 ns/op | ~5\u201310% (noise-level) | Index assignment vs `append` |\n| Filter | ~76,700 ns/op (16 allocs) | ~60,700 ns/op (1 alloc) | ~20\u201335% | Preallocation vs growth |\n| FilterInPlace | ~76,700 ns/op | ~23,400 ns/op | ~3x | Zero-alloc, reuses caller's array |\n| Intersect | ~2,470,000 ns/op | ~4,100 ns/op | ~600x | Algorithm change (iterate smaller set) |\n| Queue churn | ~12.3 ns/op | ~2.9 ns/op (RingQueue) | ~4x | No periodic regrow/copy |\n| FilterMap | ~42,600 ns/op (pipeline) | ~36,300 ns/op | ~15% | Fusion of two closures |\n| Cache | ~84 ns/op (list) | ~27.3 ns/op (arena) | ~3x | Arena allocation, no boxing |\n| Cache+TTL | ~96 ns/op | ~63 ns/op | ~1.5x | TTL check overhead |\n\n## Key Implementation Patterns\n\n### Type Constraints and ~\n\nThe `~` operator in constraints is essential when working with named types:\n\n```go\ntype Days int\n\nfunc SumStrict[T int](xs []T) T { // without ~: only int itself\n\tvar total T\n\tfor _, x := range xs {\n\t\ttotal += x\n\t}\n\treturn total\n}\n\nfunc Sum[T ~int](xs []T) T { // with ~: any type whose underlying type is int\n\tvar total T\n\tfor _, x := range xs {\n\t\ttotal += x\n\t}\n\treturn total\n}\n\nfmt.Println(Sum([]Days{1, 2})) // OK: 3\n// SumStrict([]Days{1, 2})     // compile error: Days does not satisfy int (uncomment to see)\n```\n\nAlways include `~` when defining numeric constraints. The pattern `S ~[]E` is ubiquitous in slices to preserve the caller's type. For example, `type IntList []int; Filter(myIntList, ...)` returns `IntList`, not `[]int`.\n\n### Zero Values and Nil Safety\n\nGo's zero value semantics apply to generic types:\n\n- A nil map read doesn't panic; only writes do. Use this in Set/Cache implementations: read operations handle nil receivers, write operations initialize on first call.\n- The zero value of a type parameter `T` is always valid. For Stack/Queue, use `var zero T` to clear slots after popping.\n- Slices and maps can be nil; handle this explicitly in iterators and operations. `Union(nil, Set)` should return a non-nil Set with just the right elements, not nil.\n\n### Iterator Correctness\n\nIterators have one non-negotiable rule: **check `yield`'s return value immediately and return if false**. Pattern:\n\n```go\nfunc Map[T, U any](input iter.Seq[T], transform func(T) U) iter.Seq[U] {\n\treturn func(yield func(U) bool) {\n\t\t// Correct: check and return\n\t\tfor elem := range input {\n\t\t\tif !yield(transform(elem)) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\nfunc MapWrong[T, U any](input iter.Seq[T], transform func(T) U) iter.Seq[U] {\n\treturn func(yield func(U) bool) {\n\t\t// WRONG: ignores yield's return value, causes panic on early break\n\t\tfor elem := range input {\n\t\t\tyield(transform(elem))\n\t\t}\n\t}\n}\n\ndouble := func(n int) int { return 2 * n }\nfor v := range Map(slices.Values([]int{1, 2, 3}), double) {\n\tfmt.Println(v)\n\tbreak // fine\n}\n// Replace Map with MapWrong above and the break panics.\n```\n\nThe `yield` function returns false when the caller breaks early. Ignoring this causes a panic the moment a consumer calls `break`. Write tests that explicitly break:\n\n```go\n// Naturals returns the infinite sequence 0, 1, 2, ... It is only useful\n// with a consumer that stops, such as Take or a loop with break.\nfunc Naturals() iter.Seq[int] {\n\treturn func(yield func(int) bool) {\n\t\tfor i := 0; ; i++ {\n\t\t\tif !yield(i) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\n// Take returns a sequence of at most the first n elements of seq. It never\n// pulls more than n elements from seq, and pulls none when n <= 0.\nfunc Take[T any](seq iter.Seq[T], n int) iter.Seq[T] {\n\treturn func(yield func(T) bool) {\n\t\tif n <= 0 {\n\t\t\treturn\n\t\t}\n\t\ttaken := 0 // declared inside the closure so each range starts fresh\n\t\tfor v := range seq {\n\t\t\tif !yield(v) {\n\t\t\t\treturn\n\t\t\t}\n\t\t\ttaken++\n\t\t\tif taken == n {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\nfunc main() {\n\tfor v := range Take(Naturals(), 5) {\n\t\tif v == 2 {\n\t\t\tbreak // tests that early stop works: no panic\n\t\t}\n\t\tfmt.Println(v)\n\t}\n}\n```\n\n### Reusability of Sequences\n\nA `iter.Seq[T]` can be ranged multiple times if state is managed correctly:\n\n- **Stateful sequences** (like `Take` or a counter-based sequence) must declare state inside the closure so each range starts fresh.\n- **Stateless sequences** (like `Filter` over a slice) can be ranged any number of times.\n\nTest both:\n\n```go\n// Filter returns a sequence of the elements of seq for which keep returns\n// true.\nfunc Filter[T any](seq iter.Seq[T], keep func(T) bool) iter.Seq[T] {\n\treturn func(yield func(T) bool) {\n\t\tfor v := range seq {\n\t\t\tif keep(v) && !yield(v) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\nfunc main() {\n\tdata := slices.Values([]int{1, 2, 3, 4})\n\tpredicate := func(n int) bool { return n%2 == 0 }\n\tseq := Filter(data, predicate)\n\tfirst := slices.Collect(seq)\n\tsecond := slices.Collect(seq)\n\tfmt.Println(first, second, slices.Equal(first, second)) // first and second should be equal\n}\n```\n\n### Efficient Slice Handling\n\nWhen slices are passed to generic functions, understand the backing array:\n\n- `Filter` that does `out := s[:0]; append(out, ...)` **destroys s** by overwriting its data.\n- `FilterFast` with pre-allocation doesn't touch s.\n- Only use in-place techniques when you own the slice entirely and never read it again.\n\n---\n\n## Testing Patterns and Edge Cases\n\n### Nil and Empty Handling\n\nTest every function with:\n- Nil inputs (slices, maps): `Map(nil, f)`, `Set.All() over an empty set`\n- Empty slices: `Filter([]int{}, keep)`\n- Empty maps: `Union(nil, nil)`\n\nNil and empty are distinct in Go: `nil` is the zero value, `[]int{}` is an allocated but zero-length slice. Both should be handled.\n\n### Iterator Early Termination\n\nAlways write tests that break from the iterator loop:\n\n```go\n// Naturals returns the infinite sequence 0, 1, 2, ... It is only useful\n// with a consumer that stops, such as Take or a loop with break.\nfunc Naturals() iter.Seq[int] {\n\treturn func(yield func(int) bool) {\n\t\tfor i := 0; ; i++ {\n\t\t\tif !yield(i) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\n// Filter returns a sequence of the elements of seq for which keep returns\n// true.\nfunc Filter[T any](seq iter.Seq[T], keep func(T) bool) iter.Seq[T] {\n\treturn func(yield func(T) bool) {\n\t\tfor v := range seq {\n\t\t\tif keep(v) && !yield(v) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\nfunc main() {\n\tinput := Naturals()\n\tpredicate := func(n int) bool { return n%3 == 0 }\n\tfor v := range Filter(input, predicate) {\n\t\tif v > 9 { // someCondition\n\t\t\tbreak\n\t\t}\n\t\tfmt.Print(v, \" \") // 0 3 6 9\n\t}\n\tfmt.Println()\n}\n```\n\nThis catches the bug where `yield` return value is ignored.\n\n### Concurrency (Not in 06-generics, but mentioned for awareness)\n\nGeneric types are **not inherently thread-safe**. A `Set[int]` shared between goroutines needs external synchronization. If a later module covers concurrency, note that sharing `Cache` or `Set` requires a mutex.\n\n---\n\n## Common Student Mistakes and How to Grade Them\n\n### 1. Ignoring `yield` return value in iterators\n\n```go expect=runtime-error\nfunc MapWrong[T, U any](seq iter.Seq[T], f func(T) U) iter.Seq[U] {\n\treturn func(yield func(U) bool) {\n\t\t// WRONG: will panic on early break\n\t\tfor v := range seq {\n\t\t\tyield(f(v)) // ignores return value\n\t\t}\n\t}\n}\n\nfor v := range MapWrong(slices.Values([]int{1, 2, 3}), strconv.Itoa) {\n\tfmt.Println(v)\n\tbreak\n}\n```\n\n**Feedback:** Iterators must check `yield` and return immediately when false. Run `go test -run TestTake -v` to see the panic. Add `if !yield(...) { return }`.\n\n### 2. Destroying input in Filter\n\n```go\n// WRONG: Filter reuses s's backing array\nfunc Filter[S ~[]E, E any](s S, keep func(E) bool) S {\n    out := s[:0]  // this overwrites s!\n    for _, v := range s {\n        if keep(v) {\n            out = append(out, v)\n        }\n    }\n    return out\n}\n\nnums := []int{1, 2, 3, 4}\nevens := Filter(nums, func(n int) bool { return n%2 == 0 })\nfmt.Println(evens, nums) // [2 4] [2 4 3 4]: the caller's slice was overwritten\n```\n\n**Feedback:** The caller's slice is modified. Create a fresh slice: `var out S` (nil slice). This is a correctness bug, not a performance issue.\n\n### 3. Missing `~` in constraint definitions\n\n```go expect=compile-error\ntype Days int\n\n// WRONG: type Days int does not satisfy int\nfunc Sum[T int](xs []T) T {\n\tvar total T\n\tfor _, x := range xs {\n\t\ttotal += x\n\t}\n\treturn total\n}\n\n// CORRECT: Days satisfies ~int. Change the constraint to ~int and it compiles.\n\nfunc main() {\n\tfmt.Println(Sum([]Days{1, 2}))\n}\n```\n\n**Feedback:** When a constraint is a single type (not a union), add `~` if you want named types to satisfy it.\n\n### 4. Off-by-one in FastCache/RingQueue\n\nHand-verify the circular-list logic:\n- Does `pushFront` correctly set prev/next?\n- Does `unlink` update neighbors correctly?\n- In a ring, does wrapping use `& (len(buf) - 1)` correctly?\n\n**Feedback:** Run the tests with different capacities and workloads. Add print debugging inside the ring logic if tests fail.\n\n### 5. Not checking expiry in Cache.All()\n\nThe All() iterator must skip expired entries. If TTL is set, the iterator should call `isExpired` before yielding.\n\n**Feedback:** Test with a fake clock: add entries with TTL, advance time, then iterate and confirm expired entries are skipped.\n\n### 6. Panicking on nil in Set/Stack/Queue operations\n\n`Contains` on a nil Set should return false, not panic. `Pop` on an empty Stack should return false.\n\n**Feedback:** Add checks: `if s == nil || s.m == nil { ... }` at the start of read methods.\n\n### 7. Returning nil instead of empty map/slice\n\n```go\ntype Set[T comparable] struct{ m map[T]struct{} }\n\nfunc (s *Set[T]) Add(v T) {\n\tif s.m == nil {\n\t\ts.m = make(map[T]struct{})\n\t}\n\ts.m[v] = struct{}{}\n}\n\nfunc (s *Set[T]) All() iter.Seq[T] {\n\treturn func(yield func(T) bool) {\n\t\tif s == nil {\n\t\t\treturn\n\t\t}\n\t\tfor v := range s.m {\n\t\t\tif !yield(v) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\n// WRONG: returns nil\nfunc (s *Set[T]) UnionBad(o *Set[T]) *Set[T] {\n\tif s == nil && o == nil {\n\t\treturn nil // the caller's next Add panics\n\t}\n\tout := &Set[T]{}\n\tfor v := range s.All() {\n\t\tout.Add(v)\n\t}\n\tfor v := range o.All() {\n\t\tout.Add(v)\n\t}\n\treturn out\n}\n\n// CORRECT: returns non-nil empty\nfunc (s *Set[T]) Union(o *Set[T]) *Set[T] {\n\tout := &Set[T]{m: make(map[T]struct{})}\n\tfor v := range s.All() {\n\t\tout.Add(v)\n\t}\n\tfor v := range o.All() {\n\t\tout.Add(v)\n\t}\n\treturn out // guaranteed non-nil\n}\n\nfunc main() {\n\tvar a, b *Set[int]\n\tfmt.Println(a.UnionBad(b) == nil, a.Union(b) == nil) // true false\n\ta.Union(b).Add(1)                                    // fine\n\t// a.UnionBad(b).Add(1)                              // panics: nil pointer dereference\n}\n```\n\n**Feedback:** Callers use the result directly (`a.Union(b).Add(x)`), so always return a usable, non-nil empty collection. This is a subtle but important contract.\n\n---\n\n## Grading Summary\n\n### Exercise 1: funcs\n- **Readable solutions (70%):** Correct Map, Filter, Reduce, GroupBy.\n- **Optimized variants (20%):** Presence of fast.go and benchmarks; understanding trade-offs.\n- **Quality (10%):** No doc comments required but appreciated; explanation of why MapFast helps.\n\n### Exercise 2: set\n- **Readable Set (60%):** Correct Add/Remove/Contains/Len/All, non-nil returns, iterator correctness.\n- **Set operations (20%):** Union/Intersect/Difference correct; Sorted as a function, not a method.\n- **Quality (20%):** Nil-safe reads; IntersectFast optimization (optional but impressive).\n\n### Exercise 3: stackqueue\n- **Stack and Queue (70%):** Correct Push/Pop/Peek/Len; zero-value readiness; slot zeroing.\n- **RingQueue optimization (20%):** Correct circular-buffer logic (if attempted); no off-by-one bugs.\n- **Quality (10%):** Comments explaining the steady-state alloc difference.\n\n### Exercise 4: numeric\n- **Constraints and functions (80%):** Sum/SumBy/Mean/Clamp with correct constraints; `~` used correctly.\n- **Edge cases (10%):** Empty-slice handling; NaN handling in Clamp.\n- **Quality (10%):** Experiment result mentioned in doc comment; explanation of why Mean returns bool.\n\n### Exercise 5: iterx\n- **Basic iterators (60%):** Filter/Map/Take/Enumerate/Naturals; correct yield checking.\n- **Composition (20%):** Laziness confirmed; reusability over same sequence; early break works.\n- **FilterMap optimization (20%):** Present; understanding when to use.\n\n### Project: LRU Cache\n- **Readable Cache (60%):** Correct Get/Put/Delete; LRU eviction; TTL and clock injection.\n- **Iterator (15%):** All() in recency order; expiry handling.\n- **FastCache optimization (20%):** Arena allocation; steady-state zero allocs; correct sentinel manipulation; optional but highly valued.\n- **Quality (5%):** Tests pass; no panics on edge cases; doc comments present.\n\n---\n\n## What changed after Go 1.24\n\nGo 1.27 (released after this course was written) added **generic methods**: a method can now declare its own type parameters. So `func (l List[T]) Map[U any](f func(T) U) List[U]` compiles in 1.27+. In Go 1.24, the workaround is a top-level function like `func MapList[T, U any](l List[T], f func(T) U) List[U]`. You'll see the function form throughout older code, and this course uses it. Mention generic methods in prose when teaching 1.24 code, but do not use them in the 06-generics solutions.\n", "solDir": "/home/csmith/Workspace/tools/go-course/solutions/06-generics", "dir": "/home/csmith/Workspace/tools/go-course/modules/06-generics"}, {"slug": "07-concurrency", "compose": "modules/07-concurrency/compose.yaml", "services": ["test", "vet", "bench", "cover", "shell", "solutions"], "title": "Module 07: Goroutines, Channels & Sync", "lesson": "# Module 07: Goroutines, Channels & Sync\n\n## Goals\n\nAfter this module, you will be able to:\n\n- Spawn and coordinate goroutines using `sync.WaitGroup`.\n- Design concurrent programs using channels (unbuffered, buffered, closing rules).\n- Handle context cancellation in goroutines and gracefully stop goroutines on shutdown.\n- Use `sync.Mutex` and `sync.RWMutex` to protect shared state.\n- Build worker pools, pipelines, and fan-out/fan-in patterns.\n- Avoid goroutine leaks and data races (test with `-race`).\n- Use `sync/atomic` for single-value concurrency and `sync.Once` for one-time initialization.\n\n## Concepts\n\n### Goroutines: Lightweight Concurrency\n\nA goroutine is a lightweight thread managed by the Go runtime. Unlike OS threads, goroutines are cheap to spawn (thousands or millions can exist in one program). They run concurrently within a single process and share memory.\n\n```go\nfunc printHello() { fmt.Println(\"Hello from printHello\") }\n\n// Spawn a goroutine. Nothing waits for it, so it may never get to run\n// before main returns: run this a few times.\ngo printHello()\n\n// The main goroutine must wait for others (here using sync.WaitGroup)\nvar wg sync.WaitGroup\nwg.Add(1)\ngo func() {\n\tdefer wg.Done()\n\tfmt.Println(\"Hello from a goroutine\")\n}()\nwg.Wait()\n```\n\nKey points:\n- `go` keyword spawns a new goroutine that runs concurrently.\n- The spawning goroutine does *not* wait; it continues immediately.\n- A goroutine that sends on a channel or calls `wg.Done()` must always reach that point, even on errors.\n- A program exits when `main` returns, killing all remaining goroutines. Use `sync.WaitGroup` to wait for them.\n\n### Channels: Goroutine Communication\n\nA channel is a typed, synchronized queue that goroutines use to send and receive values. It's the primary way to coordinate goroutines and avoid data races on shared memory.\n\n**Unbuffered channels** block the sender until a receiver is ready:\n\n```go\nch := make(chan int)  // unbuffered\ngo func() {\n\tch <- 42  // blocks until the receiver is ready\n}()\nv := <-ch  // blocks until the sender sends\nfmt.Println(v)\n```\n\n**Buffered channels** allow a limited number of sends without a receiver ready:\n\n```go expect=runtime-error\nch := make(chan int, 2) // buffer capacity 2\nch <- 1                 // does not block\nch <- 2                 // does not block\nch <- 3                 // blocks! buffer is full, and no one will ever receive\n// fatal error: all goroutines are asleep - deadlock!\n```\n\n**Closing channels**: a closed channel broadcasts to all receivers:\n\n```go\nch := make(chan int, 1)\nch <- 1\nclose(ch)\n// Receiving from a closed channel never blocks: buffered values come out\n// first, then the zero value with ok=false\nv, ok := <-ch\nfmt.Println(v, ok) // 1 true\nv, ok = <-ch\nfmt.Println(v, ok) // 0 false\n```\n\nImportant rules:\n- Only the *sender* (the goroutine that owns the channel) should close it.\n- Closing a channel signals \"no more values; stop waiting.\"\n- Receiving from a closed channel is safe; sending to a closed channel panics.\n- `range ch` stops when the channel is closed.\n\n### select: Waiting on Multiple Channels\n\n`select` lets a goroutine wait on multiple channel operations, picking one at random when ready:\n\n```go\nch1, ch2 := make(chan int), make(chan int)\ngo func() {\n\ttime.Sleep(10 * time.Millisecond)\n\tch2 <- 2\n}()\n\nselect {\ncase v := <-ch1:\n\tfmt.Println(\"ch1:\", v)\ncase v := <-ch2:\n\tfmt.Println(\"ch2:\", v) // this one: ch2 is ready first\ncase <-time.After(1 * time.Second):\n\tfmt.Println(\"timeout\")\n}\n```\n\nCommon patterns:\n- **Timeout**: `case <-time.After(d):` to enforce a deadline.\n- **Cancellation**: `case <-ctx.Done():` to exit when context is canceled.\n- **Graceful shutdown**: `close(done)` to signal all waiting goroutines.\n\n### Synchronization: WaitGroup, Mutex, RWMutex\n\n**sync.WaitGroup** waits for a collection of goroutines to finish:\n\n```go\nvar wg sync.WaitGroup\nfor i := range 10 {\n\twg.Add(1)\n\tgo func(i int) {\n\t\tdefer wg.Done()\n\t\tfmt.Println(\"Worker\", i)\n\t}(i)  // pass i; don't capture it\n}\nwg.Wait()\n```\n\nGotcha: `wg.Add(1)` must be called *before* spawning the goroutine (in the parent goroutine), never inside the spawned goroutine. Otherwise a race exists between `Wait` and the late `Add`.\n\n**sync.Mutex** protects shared data:\n\n```go\nvar mu sync.Mutex\nvar count int\nvar wg sync.WaitGroup\n\nfor range 1000 {\n\twg.Add(1)\n\tgo func() {\n\t\tdefer wg.Done()\n\t\tmu.Lock()\n\t\tdefer mu.Unlock()\n\t\tcount++\n\t}()\n}\nwg.Wait()\nfmt.Println(count) // always 1000. Remove the Lock/Unlock and it usually isn't.\n```\n\nRules:\n- Always use `defer mu.Unlock()` to ensure the lock is released, even on panic.\n- Keep critical sections small; do not do I/O or send on channels while holding a lock.\n- `func (c *Counter) Value()` should not call other methods that lock the mutex; avoid nested locks.\n\n**sync.RWMutex** allows many readers or one writer:\n\n```go\nvar mu sync.RWMutex\nvar data int\n\n// Many goroutines can call RLock simultaneously\nfunc read() int {\n\tmu.RLock()\n\tdefer mu.RUnlock()\n\treturn data\n}\n\n// Only one goroutine can call Lock\nfunc write(v int) {\n\tmu.Lock()\n\tdefer mu.Unlock()\n\tdata = v\n}\n\nvar wg sync.WaitGroup\nfor i := range 5 {\n\twg.Add(2)\n\tgo func() { defer wg.Done(); write(i) }()\n\tgo func() { defer wg.Done(); _ = read() }()\n}\nwg.Wait()\nfmt.Println(read()) // one of 0..4: whichever write ran last\n```\n\n### Context: Deadlines and Cancellation\n\n`context.Context` lets you cancel goroutines and set deadlines:\n\n```go\nctx, cancel := context.WithCancel(context.Background())\ndefer cancel()\ndone := make(chan struct{})\n\ngo func() {\n\tdefer close(done)\n\tselect {\n\tcase <-ctx.Done():\n\t\tfmt.Println(\"Canceled:\", ctx.Err())\n\t\treturn\n\tcase <-time.After(10 * time.Second):\n\t\tfmt.Println(\"Timeout\")\n\t}\n}()\n\n// Cancel after 1 second\ntime.Sleep(1 * time.Second)\ncancel()\n<-done // wait, or main may exit before the goroutine prints\n```\n\nRules:\n- Pass `ctx` as the first argument to functions that respect cancellation.\n- Every blocking operation (channel receive, I/O, `time.Sleep`) must also check `ctx.Done()`.\n- `context.WithCancelCause(ctx)` lets the caller set a specific error message.\n\n### Atomics and sync.Once\n\n**sync/atomic** provides atomic operations on single values (no goroutines racing):\n\n```go\nvar count atomic.Int64\n\ncount.Add(1)\ncount.Store(10)\nv := count.Load()\nfmt.Println(v) // 10\n\n// sync/atomic only for single values; use Mutex for multiple related fields\n```\n\n**sync.Once** runs a function exactly once, even if called by many goroutines:\n\n```go\nfunc expensiveComputation() int {\n\tfmt.Println(\"computing...\")\n\treturn 42\n}\n\nvar once sync.Once\nvar value int\n\nfor range 3 {\n\tonce.Do(func() {\n\t\tvalue = expensiveComputation() // runs only the first time\n\t})\n}\nfmt.Println(value) // computing... once, then 42\n```\n\nUse `sync.OnceValue` (Go 1.24) to cache the result:\n\n```go\nfunc expensiveComputation() int {\n\tfmt.Println(\"computing...\")\n\treturn 42\n}\n\nvar getValue = sync.OnceValue(expensiveComputation)\n\nv := getValue() // calls expensive once; subsequent calls return the cached value\nv += getValue()\nfmt.Println(v) // computing... once, then 84\n```\n\n### Common Patterns\n\n**Worker Pool**: fixed number of goroutines process jobs from a channel:\n\n```go\nfunc process(job int) int { return job * job }\n\nvar wg sync.WaitGroup\nvar mu sync.Mutex\nsum := 0\n\njobs := make(chan int)\nfor range 5 {\n\twg.Add(1)\n\tgo func() {\n\t\tdefer wg.Done()\n\t\tfor job := range jobs { // blocks until jobs is closed\n\t\t\tr := process(job)\n\t\t\tmu.Lock()\n\t\t\tsum += r\n\t\t\tmu.Unlock()\n\t\t}\n\t}()\n}\n// Feed jobs from another goroutine\ngo func() {\n\tfor i := range 100 {\n\t\tjobs <- i\n\t}\n\tclose(jobs) // signal workers to stop\n}()\nwg.Wait()\nfmt.Println(sum) // 328350\n```\n\n**Bounded Concurrency via Semaphore**: a buffered channel of `struct{}` tokens:\n\n```go\nfunc work(i int) { time.Sleep(10 * time.Millisecond) }\n\nvar wg sync.WaitGroup\nvar running, peak atomic.Int32\n\nsem := make(chan struct{}, 3) // max 3 concurrent operations\nfor i := range 20 {\n\twg.Add(1)\n\tgo func(i int) {\n\t\tdefer wg.Done()\n\t\tsem <- struct{}{}        // acquire token; blocks if buffer full\n\t\tdefer func() { <-sem }() // release token\n\t\tn := running.Add(1)\n\t\tfor p := peak.Load(); n > p && !peak.CompareAndSwap(p, n); p = peak.Load() {\n\t\t}\n\t\twork(i)\n\t\trunning.Add(-1)\n\t}(i)\n}\nwg.Wait()\nfmt.Println(\"peak concurrency:\", peak.Load()) // 3\n```\n\n**Pipeline**: each stage owns its output channel and closes it:\n\n```go\nfunc generate(nums ...int) <-chan int {\n\tch := make(chan int)\n\tgo func() {\n\t\tdefer close(ch)\n\t\tfor _, n := range nums {\n\t\t\tch <- n\n\t\t}\n\t}()\n\treturn ch\n}\n\nfunc square(in <-chan int) <-chan int {\n\tout := make(chan int)\n\tgo func() {\n\t\tdefer close(out)\n\t\tfor n := range in {\n\t\t\tout <- n * n\n\t\t}\n\t}()\n\treturn out\n}\n\nnums := generate(1, 2, 3)\nsquares := square(nums)\nfor v := range squares {\n\tfmt.Println(v)\n}\n```\n\n**Fan-Out / Fan-In**: one source broadcasts to many workers; workers report back:\n\n```go\n// worker squares each job it receives.\nfunc worker(jobs <-chan int) <-chan int {\n\tout := make(chan int)\n\tgo func() {\n\t\tdefer close(out)\n\t\tfor j := range jobs {\n\t\t\tout <- j * j\n\t\t}\n\t}()\n\treturn out\n}\n\n// Fan-out: distribute work to multiple workers\nfunc distribute(jobs <-chan int, workers int) []<-chan int {\n\tout := make([]<-chan int, workers)\n\tfor i := range workers {\n\t\tout[i] = worker(jobs)\n\t}\n\treturn out\n}\n\n// Fan-in: merge outputs\nfunc merge(cs ...<-chan int) <-chan int {\n\tout := make(chan int)\n\tvar wg sync.WaitGroup\n\tfor _, c := range cs {\n\t\twg.Add(1)\n\t\tgo func(c <-chan int) {\n\t\t\tdefer wg.Done()\n\t\t\tfor v := range c {\n\t\t\t\tout <- v\n\t\t\t}\n\t\t}(c)\n\t}\n\tgo func() {\n\t\twg.Wait()\n\t\tclose(out) // close once all sources are done\n\t}()\n\treturn out\n}\n\nfunc main() {\n\tjobs := make(chan int)\n\tgo func() {\n\t\tfor i := 1; i <= 10; i++ {\n\t\t\tjobs <- i\n\t\t}\n\t\tclose(jobs)\n\t}()\n\tsum := 0\n\tfor v := range merge(distribute(jobs, 3)...) {\n\t\tsum += v\n\t}\n\tfmt.Println(sum) // 385: every square, whichever worker computed it\n}\n```\n\n### Race Detector\n\nEnable the race detector to find data races at runtime:\n\n```bash\ngo test -race ./...\ngo run -race main.go\n```\n\nA data race is any unsynchronized concurrent access to memory where at least one access is a write. The race detector is a powerful tool but cannot find all races (it only instruments code that runs).\n\nExample race:\n\n```go\n// BAD: race condition. The WaitGroup makes main wait; it does NOT\n// synchronize the two writes to count.\nvar count int\nvar wg sync.WaitGroup\nwg.Add(2)\ngo func() { defer wg.Done(); count++ }()\ngo func() { defer wg.Done(); count++ }()\nwg.Wait()\nfmt.Println(count) // usually 2, sometimes 1; `go run -race` reports the DATA RACE\n```\n\nFixed with a mutex:\n\n```go\n// GOOD: no race\nvar mu sync.Mutex\nvar count int\nvar wg sync.WaitGroup\nwg.Add(2)\ngo func() { defer wg.Done(); mu.Lock(); count++; mu.Unlock() }()\ngo func() { defer wg.Done(); mu.Lock(); count++; mu.Unlock() }()\nwg.Wait()\nfmt.Println(count) // always 2\n```\n\n### Goroutine Leaks\n\nA goroutine leak occurs when a goroutine never exits, wasting resources. Common causes:\n\n1. **Blocked send**: a goroutine sends on a channel but no one receives.\n   ```go\n   ch := make(chan int)  // unbuffered\n   go func() { ch <- 1 }()  // blocks forever; main exits before receiving\n\n   time.Sleep(10 * time.Millisecond)\n   fmt.Println(\"goroutines still alive:\", runtime.NumGoroutine()) // 2: main and the stuck sender\n   ```\n\n2. **Blocked receive**: a goroutine waits on a channel that never sends.\n   ```go\n   ch := make(chan int)\n   go func() { <-ch }()  // blocks forever\n\n   time.Sleep(10 * time.Millisecond)\n   fmt.Println(\"goroutines still alive:\", runtime.NumGoroutine()) // 2: main and the stuck receiver\n   ```\n\n3. **Missing context check**: a goroutine loops forever ignoring `ctx.Done()`.\n   ```go\n   go func() {\n       for {  // never exits on cancellation\n           time.Sleep(1 * time.Second)\n       }\n   }()\n\n   time.Sleep(10 * time.Millisecond)\n   fmt.Println(\"goroutines still alive:\", runtime.NumGoroutine()) // 2, and the loop never ends\n   ```\n\nFix: every blocking operation needs a matching cancellation or completion signal.\n\n## Idioms & Best Practices\n\n- **Synchronous APIs, concurrent implementations**: prefer a synchronous function that the caller can wrap in `go` to add concurrency, rather than embedding goroutines in the function.\n  ```go\n  type Item int\n  type Result int\n\n  // GOOD: caller decides concurrency\n  func Process(item Item) Result { return Result(item * 2) }\n\n  // BAD: function spawns its own goroutines; caller has no control\n  func ProcessAsync(item Item) <-chan Result {\n  \tout := make(chan Result, 1)\n  \tgo func() { out <- Process(item) }()\n  \treturn out\n  }\n\n  fmt.Println(Process(1)) // synchronous; the caller can still write `go Process(item)`\n  var wg sync.WaitGroup\n  for _, it := range []Item{2, 3} {\n  \twg.Add(1)\n  \tgo func() { defer wg.Done(); _ = Process(it) }() // the caller chose concurrency\n  }\n  wg.Wait()\n  fmt.Println(<-ProcessAsync(4)) // works, but every call costs a goroutine and a channel\n  ```\n\n- **Goroutines are owned by their spawner**: the goroutine should have a clear exit condition (channel close, `ctx.Done()`, `wg.Done()`) and the spawner should wait for it.\n\n- **Never do I/O or send on channels while holding a mutex**: keep critical sections short and lock-free.\n  ```go\n  type config struct{ URL string }\n\n  var mu sync.Mutex\n  cfg := &config{URL: \"https://example.com\"}\n  fetchFromNetwork := func(url string) string {\n  \ttime.Sleep(50 * time.Millisecond) // slow!\n  \treturn \"body of \" + url\n  }\n\n  // BAD: every other goroutine that needs mu waits 50ms\n  mu.Lock()\n  result := fetchFromNetwork(cfg.URL)\n  mu.Unlock()\n\n  // GOOD\n  mu.Lock()\n  url := cfg.URL // fast\n  mu.Unlock()\n  result = fetchFromNetwork(url) // slow, but no lock held\n  fmt.Println(result)\n  ```\n\n- **Unbuffered channels are simpler**: use them by default. Buffered channels are an optimization, not the norm.\n\n- **Close only from the sender**: if multiple goroutines send on a channel, use a coordination channel or `sync.Once` to close.\n  ```go\n  items := []string{\"a\", \"b\", \"c\"}\n  jobs := make(chan string)\n  done := make(chan struct{})\n\n  // One receiver\n  go func() {\n  \tdefer close(done)\n  \tfor job := range jobs {\n  \t\tfmt.Println(\"processed\", job)\n  \t}\n  }()\n\n  // GOOD: the one sender (main) owns jobs and closes it when done\n  for _, it := range items {\n  \tjobs <- it\n  }\n  close(jobs)\n  <-done\n  ```\n\n- **Prefer context.WithCancelCause for error propagation**: set a cause when canceling to give downstream goroutines a reason.\n  ```go\n  ctx, cancel := context.WithCancelCause(context.Background())\n  err := errors.New(\"disk full\")\n  // ...\n  cancel(fmt.Errorf(\"worker failed: %w\", err))\n\n  // Downstream can call context.Cause(ctx) to get the error\n  <-ctx.Done()\n  fmt.Println(ctx.Err())          // context canceled\n  fmt.Println(context.Cause(ctx)) // worker failed: disk full\n  ```\n\n- **Test with `-race` and timeouts**: concurrency tests must both verify correctness and confirm no leaks.\n  ```go\n  func TestConcurrent(t *testing.T) {\n  \t// t.Context() is canceled when the test ends; add your own deadline on top\n  \tctx, cancel := context.WithTimeout(t.Context(), 10*time.Second)\n  \tdefer cancel()\n\n  \tresults := make(chan int)\n  \tgo func() {\n  \t\tselect {\n  \t\tcase results <- 42:\n  \t\tcase <-ctx.Done(): // never leaks, even if the test stops listening\n  \t\t}\n  \t}()\n  \tselect {\n  \tcase v := <-results:\n  \t\tt.Logf(\"got %d\", v)\n  \tcase <-ctx.Done():\n  \t\tt.Fatal(\"timed out:\", ctx.Err())\n  \t}\n  }\n  ```\n\n## Common Pitfalls\n\n- **Forgetting `defer wg.Done()`**: a goroutine that doesn't call `Done()` never unblocks `Wait()`.\n  ```go expect=runtime-error\n  doWork := func() { fmt.Println(\"working\") }\n\n  var wg sync.WaitGroup\n  wg.Add(1)\n  go func() {\n  \t// defer wg.Done()  // MISSING!\n  \tdoWork()\n  }()\n  wg.Wait() // hangs forever: here the runtime notices and reports a deadlock\n  ```\n\n- **Calling `wg.Add` inside the goroutine**: races with `Wait()`.\n  ```go\n  doWork := func() { fmt.Println(\"work done\") }\n\n  var wg sync.WaitGroup\n  go func() {\n  \twg.Add(1) // BAD: races with Wait()\n  \tdefer wg.Done()\n  \tdoWork()\n  }()\n  wg.Wait() // usually returns at once, before the goroutine even starts\n  fmt.Println(\"Wait returned\") // \"work done\" usually never prints\n  ```\n\n- **Using `time.Sleep` for synchronization in tests**: flaky. Use channels or `sync.WaitGroup`.\n  ```go\n  worker := func() { time.Sleep(10 * time.Millisecond); fmt.Println(\"worker finished\") }\n\n  // BAD: flakey, may timeout on slow systems\n  go worker()\n  time.Sleep(100 * time.Millisecond)\n\n  // GOOD: waits for work to actually finish\n  var wg sync.WaitGroup\n  wg.Add(1)\n  go func() { defer wg.Done(); worker() }()\n  wg.Wait()\n  ```\n\n- **Calling `t.Fatal` from a spawned goroutine**: not allowed (it stops only that goroutine, not the test). Use `t.Error` and send the error back on a channel.\n  ```go\n  func doWork() error { return nil }\n\n  func TestWorker(t *testing.T) {\n  \t// BAD (go vet: call to (*T).Fatal from a non-test goroutine)\n  \t//\n  \t//\tgo func() { t.Fatal(\"error\") }()\n\n  \t// GOOD\n  \tdone := make(chan error, 1)\n  \tgo func() { done <- doWork() }()\n  \tif err := <-done; err != nil {\n  \t\tt.Fatal(err)\n  \t}\n  }\n  ```\n\n- **Copying a `sync.Mutex` or `sync.WaitGroup`**: the copy loses synchronization. Pass by pointer or embed in a struct.\n  ```go\n  type Counter struct {\n  \tmu sync.Mutex\n  \tn  int\n  }\n\n  // BAD\n  c := &Counter{}\n  c.mu.Lock()\n  c2 := *c                     // copy loses sync (go vet: assignment copies lock value)\n  fmt.Println(c2.mu.TryLock()) // false: the copy is a locked mutex nobody will ever unlock\n  c.mu.Unlock()\n\n  // GOOD: always use pointers\n  c3 := c // pointer copy is fine: one shared mutex\n  c3.mu.Lock()\n  c3.n++\n  c3.mu.Unlock()\n  fmt.Println(c.n) // 1\n  ```\n\n- **Setting a channel variable to `nil` by accident**: this disables its `select` case, but is a mistake if unintended.\n  ```go\n  // The deliberate use: a nil channel blocks forever, so setting a closed\n  // channel to nil disables its select case.\n  a, b := make(chan int), make(chan int)\n  go func() { a <- 1; close(a) }()\n  go func() { b <- 2; b <- 3; close(b) }()\n\n  for a != nil || b != nil {\n  \tselect {\n  \tcase v, ok := <-a:\n  \t\tif !ok {\n  \t\t\ta = nil // a is done: stop selecting on it\n  \t\t\tcontinue\n  \t\t}\n  \t\tfmt.Println(\"a\", v)\n  \tcase v, ok := <-b:\n  \t\tif !ok {\n  \t\t\tb = nil\n  \t\t\tcontinue\n  \t\t}\n  \t\tfmt.Println(\"b\", v)\n  \t}\n  }\n  // By accident, the same thing makes a case silently never fire.\n  ```\n\n- **Not checking `ctx.Err()` in loops**: a goroutine may receive buffered values even after `ctx.Done()` is closed; check both.\n  ```go\n  func consume(ctx context.Context, in <-chan int) {\n  \tfor {\n  \t\tselect {\n  \t\tcase v, ok := <-in:\n  \t\t\tif !ok {\n  \t\t\t\treturn\n  \t\t\t}\n  \t\t\tfmt.Println(\"got\", v)\n  \t\tcase <-ctx.Done():\n  \t\t\tfmt.Println(\"stopping:\", ctx.Err())\n  \t\t\treturn // stop even if input is still open\n  \t\t}\n  \t}\n  }\n\n  ctx, cancel := context.WithTimeout(context.Background(), 50*time.Millisecond)\n  defer cancel()\n  in := make(chan int)\n  go func() { in <- 1 }() // one value, and then in stays open forever\n  consume(ctx, in)\n  ```\n\n## Exercises\n\n### Exercise 1: Concurrent-Safe Counter (5-10 min)\n\n**Exercise name**: `counter`\n\n**Directory**: `modules/07-concurrency/exercises/counter/`\n\n**Implement three types**:\n1. `Counter`: guarded by a mutex, with `Inc()`, `Add(delta)`, `Value()`.\n2. `AtomicCounter`: using `sync/atomic`, same interface.\n3. `KeyedCounter`: counts per string key with `Inc(key)`, `Get(key)`, `Snapshot()`.\n\nAll must be safe for concurrent use. Test with `-race`.\n\nRun: `go test -race ./modules/07-concurrency/exercises/counter/`\n\n### Exercise 2: Parallel Sum (5-10 min)\n\n**Exercise name**: `parallelsum`\n\n**Directory**: `modules/07-concurrency/exercises/parallelsum/`\n\n**Implement**:\n1. `Chunks(n, parts)`: splits indices [0, n) into parts contiguous ranges.\n2. `Sum(nums, workers)`: sums `nums` by splitting into chunks and summing each in a goroutine using `sync.WaitGroup`.\n\nRun: `go test ./modules/07-concurrency/exercises/parallelsum/`\n\n### Exercise 3: Worker Pool (10-15 min)\n\n**Exercise name**: `workerpool`\n\n**Directory**: `modules/07-concurrency/exercises/workerpool/`\n\n**Implement** `Map[In, Out](ctx, in, workers, fn)`: applies `fn` to every element of `in` using a pool of `workers` goroutines, returning results in order. Cancels on error or context cancellation with no goroutine leaks.\n\nRun: `go test -race ./modules/07-concurrency/exercises/workerpool/`\n\n### Exercise 4: Pipeline with Cancellation (15-20 min)\n\n**Exercise name**: `pipeline`\n\n**Directory**: `modules/07-concurrency/exercises/pipeline/`\n\n**Implement**:\n1. `Generate(ctx, nums)`: yields values from `nums` on a channel.\n2. `Square(ctx, in)`: reads from `in`, squares each value, yields on output.\n3. `Merge(ctx, cs)`: fans in values from multiple channels.\n4. `SumSquares(ctx, nums, workers)`: builds a pipeline (generate -> fan-out to workers squarers -> merge -> sum), canceling gracefully.\n\nEach stage must check `ctx.Done()` on every blocking operation. No goroutine leaks.\n\nRun: `go test -race ./modules/07-concurrency/exercises/pipeline/`\n\n### Exercise 5: Bounded Fetcher (10-15 min)\n\n**Exercise name**: `fetcher`\n\n**Directory**: `modules/07-concurrency/exercises/fetcher/`\n\n**Implement**:\n1. `FetchAll(ctx, urls, limit, fetch)`: fetches each URL using a semaphore channel to bound concurrent fetches to `limit`.\n2. `Errors(results)`: combines fetch errors into one error via `errors.Join`.\n\nResults are in order; a failed fetch doesn't stop others. No leaks on cancellation.\n\nRun: `go test -race ./modules/07-concurrency/exercises/fetcher/`\n\n## Project\n\nOne project (~45-60 minutes): **Duplicate File Finder** (`dupfind`).\n\nSee `project/README.md` for details.\n\nRun: `go test -race ./modules/07-concurrency/project/... -timeout 60s`\n\n## Submitting for Review\n\nWhen all exercises and the project pass their tests, including `-race -count=3 -timeout 60s`, ask your instructor (Claude) to review `modules/07-concurrency/`.\n\n## Further Reading\n\n- [Effective Go: Concurrency](https://go.dev/doc/effective_go#concurrency)\n- [Go Code Review Comments: Goroutine Lifetimes](https://github.com/golang/go/wiki/CodeReviewComments#goroutine-lifetimes)\n- [Go Memory Model](https://go.dev/ref/mem)\n- [Go Concurrency Patterns](https://go.dev/blog/pipelines)\n- [Channel Axioms](https://dave.cheney.net/2014/03/19/channel-axioms)\n- [The Go Blog: Context](https://go.dev/blog/context)\n- [Sync Package](https://pkg.go.dev/sync)\n- [Sync/Atomic Package](https://pkg.go.dev/sync/atomic)\n- [Race Detector](https://go.dev/doc/articles/race_detector)\n", "units": [{"kind": "exercise", "name": "counter", "dir": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/counter", "doc": "Package counter implements counters that are safe for concurrent use,\nonce with a mutex and once with sync/atomic, plus a per-key counter.", "readme": "", "files": [{"name": "counter.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/counter/counter.go"}, {"name": "counter_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/counter/counter_test.go"}], "cmd": "go test ./modules/07-concurrency/exercises/counter/", "id": "modules/07-concurrency/exercises/counter"}, {"kind": "exercise", "name": "fetcher", "dir": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/fetcher", "doc": "Package fetcher fetches many URLs concurrently while bounding how many\nfetches are in flight at once.", "readme": "", "files": [{"name": "fetcher.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/fetcher/fetcher.go"}, {"name": "fetcher_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/fetcher/fetcher_test.go"}], "cmd": "go test ./modules/07-concurrency/exercises/fetcher/", "id": "modules/07-concurrency/exercises/fetcher"}, {"kind": "exercise", "name": "parallelsum", "dir": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/parallelsum", "doc": "Package parallelsum splits a slice into chunks and sums them in parallel.", "readme": "", "files": [{"name": "parallelsum.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/parallelsum/parallelsum.go"}, {"name": "parallelsum_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/parallelsum/parallelsum_test.go"}], "cmd": "go test ./modules/07-concurrency/exercises/parallelsum/", "id": "modules/07-concurrency/exercises/parallelsum"}, {"kind": "exercise", "name": "pipeline", "dir": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/pipeline", "doc": "Package pipeline builds a cancellable generator -> square -> merge -> sum\npipeline out of goroutines and channels.\n\nEvery stage follows the same rules (https://go.dev/blog/pipelines):\n  - the stage owns its output channel and closes it when it returns;\n  - every send and every receive also selects on ctx.Done(), so a stage\n    can always exit when the context is canceled, even if nobody is reading\n    its output or nobody is writing its input.", "readme": "", "files": [{"name": "pipeline.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/pipeline/pipeline.go"}, {"name": "pipeline_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/pipeline/pipeline_test.go"}], "cmd": "go test ./modules/07-concurrency/exercises/pipeline/", "id": "modules/07-concurrency/exercises/pipeline"}, {"kind": "exercise", "name": "workerpool", "dir": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/workerpool", "doc": "Package workerpool runs a function over a slice with a fixed number of\nworker goroutines, keeping results in input order and stopping at the\nfirst error.", "readme": "", "files": [{"name": "workerpool.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/workerpool/workerpool.go"}, {"name": "workerpool_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/exercises/workerpool/workerpool_test.go"}], "cmd": "go test ./modules/07-concurrency/exercises/workerpool/", "id": "modules/07-concurrency/exercises/workerpool"}, {"kind": "project", "name": "project", "dir": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/project", "doc": "", "readme": "# Project: Duplicate File Finder\n\n## Goal\n\nBuild a command-line tool `dupfind` that walks a directory tree, groups files by size, hashes files that share a size, and reports duplicate files (files with identical contents). Use a bounded worker pool to hash files concurrently.\n\n## Requirements\n\n1. **Core API** (package `dupfind`):\n   - `Find(ctx, root, opts) ([]Group, error)`: walks the directory tree starting at `root` and returns groups of duplicate files.\n   - `Group`: a set of two or more files with the same size and content hash.\n   - `HashFile(ctx, path)`: compute the SHA-256 hash of a file (provided as a stub; implement it).\n   - `Options`: controls the hash function to use (default: `HashFile`), the number of concurrent workers (default: `runtime.GOMAXPROCS(0)`), and a minimum file size filter (empty files are always skipped).\n   - `Wasted(groups)`: returns the number of bytes that could be reclaimed by keeping one copy from each group.\n   - `WriteReport(w, groups)`: writes a human-readable report of duplicates.\n\n2. **Command** (package `main` in `cmd/dupfind`):\n   - Flags: `-workers N` (max concurrent hashes), `-min-size BYTES` (default 1), optional directory (default: current directory).\n   - Graceful shutdown on Ctrl+C via `signal.NotifyContext`.\n   - Exit codes: 0 on success, 1 on file system / hash errors, 2 on invalid flags.\n\n3. **Concurrency**:\n   - Group files by size first (free operation: `os.Stat`); only hash files in size collisions.\n   - Use a bounded worker pool to hash files concurrently; respect the `-workers` limit.\n   - Stop hashing and clean up gracefully on errors or context cancellation.\n   - No goroutine leaks; test with `runtime.NumGoroutine()`.\n\n4. **Testing**:\n   - `go test -race ./modules/07-concurrency/project/... -timeout 60s`\n   - Tests use `t.TempDir()` to create file trees.\n   - Verify correct grouping (size, hash, order), handling of empty files, `MinSize`, custom hash functions.\n   - Verify concurrency bounds and no leaks.\n\n## Report Format\n\nThe report written by `WriteReport` is human-readable, one group per section:\n\n```\ngroup N: M files, S bytes each, hash HHHHHHHH\n  /path/to/file1\n  /path/to/file2\n  ...\nG groups, B bytes reclaimable\n```\n\n- Group number starts at 1.\n- The hash is truncated to 12 hex characters (or the full hash if shorter).\n- File paths are printed as-is (not quoted or escaped).\n- The final line summarizes total groups and wasted bytes.\n- If there are no duplicates, output is just `0 groups, 0 bytes reclaimable\\n`.\n\n## Acceptance Criteria\n\n- All tests pass with `go test -race ./modules/07-concurrency/project/...`.\n- Code is `gofmt`-clean and passes `go vet`.\n- The tool correctly identifies duplicates by size and content hash.\n- Concurrency is bounded: peak active hashes \u2264 `-workers`.\n- Graceful cancellation: test with `-race` confirms no leaks.\n\n## Stretch Goals\n\n- Parallel hashing of very large files (use `io.Reader` chunks).\n- Estimate time remaining by bytes hashed vs. total bytes to hash.\n- Deduplicate by hardlinking (be careful with test setup).\n", "files": [{"name": "README.md", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/project/README.md"}, {"name": "cmd/dupfind/main.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/project/cmd/dupfind/main.go"}, {"name": "cmd/dupfind/main_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/project/cmd/dupfind/main_test.go"}, {"name": "dupfind/dupfind.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/project/dupfind/dupfind.go"}, {"name": "dupfind/dupfind_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/07-concurrency/project/dupfind/dupfind_test.go"}], "cmd": "go test ./modules/07-concurrency/project/...", "id": "modules/07-concurrency/project"}], "review": "# Module 07: Concurrency Review Guide\n\nThis guide covers readable vs. optimized solutions, trade-offs, and grading checklists for each exercise and the project.\n\n## Exercise 1: Counter\n\n### Readable Solution (counter.go)\n\n**What it does**: Three counter types (Mutex-based, Atomic, Keyed) that are safe for concurrent access.\n\n```go\n// Counter with Mutex\ntype Counter struct {\n    mu sync.Mutex\n    n  int64\n}\n\nfunc (c *Counter) Inc() {\n    c.Add(1)\n}\n\nfunc (c *Counter) Add(delta int64) {\n    c.mu.Lock()\n    defer c.mu.Unlock()\n    c.n += delta\n}\n\nfunc (c *Counter) Value() int64 {\n    c.mu.Lock()\n    defer c.mu.Unlock()\n    return c.n\n}\n\nvar c Counter\nvar wg sync.WaitGroup\nfor range 100 {\n\twg.Add(1)\n\tgo func() { defer wg.Done(); c.Inc() }()\n}\nwg.Wait()\nfmt.Println(c.Value()) // 100\n```\n\n**Why it's idiomatic**:\n- Mutex protects a single `int64` field, not shared across methods.\n- Uses `defer mu.Unlock()` to ensure the lock is always released.\n- `Inc()` delegates to `Add()` to avoid duplication.\n\n**Atomic alternative** (fast.go):\n```go\ntype AtomicCounter struct {\n    n atomic.Int64\n}\n\nfunc (c *AtomicCounter) Add(delta int64) {\n    c.n.Add(delta)\n}\n\nfunc (c *AtomicCounter) Value() int64 {\n    return c.n.Load()\n}\n\nvar c AtomicCounter\nvar wg sync.WaitGroup\nfor range 100 {\n\twg.Add(1)\n\tgo func() { defer wg.Done(); c.Add(2) }()\n}\nwg.Wait()\nfmt.Println(c.Value()) // 200\n```\n\n### Trade-off\n\n- **Mutex**: clearer intent, easier to extend (e.g., add per-operation logging), supports arbitrary updates.\n- **Atomic**: faster (no lock/unlock overhead), but only for single values; can't atomically update two related fields.\n\nFor a simple counter, atomic is measurably faster (benchmark shows ~4x throughput on high contention). Use atomic when performance matters and the interface is simple; use Mutex when clarity or complexity matter more.\n\n### KeyedCounter notes\n\n- The zero value must be usable: `c.m` is `nil` initially, so `Get()` must handle reading from `nil` maps (safe in Go).\n- `Snapshot()` must return a copy; mutating the copy must not affect the counter.\n\n### Grading Checklist (Counter)\n\n- [ ] `Counter.Add()` and `Value()` correctly use `mu.Lock()` + `defer mu.Unlock()`.\n- [ ] `AtomicCounter` uses `sync/atomic` (not a Mutex disguised as atomic).\n- [ ] `KeyedCounter.Inc()` initializes the map if needed.\n- [ ] `KeyedCounter.Snapshot()` returns a copy, not the live map.\n- [ ] All three types have pointer receivers (required to avoid copying the Mutex).\n- [ ] Tests pass with `-race` (no data races).\n- [ ] `Inc()` and `Add()` are not nested (no deadlock if `Inc()` calls `Add()`).\n\n---\n\n## Exercise 2: Parallel Sum\n\n### Readable Solution (parallelsum.go)\n\n**What it does**: Splits a slice into chunks and sums each chunk in a goroutine.\n\n```go\nimport \"gocourse/solutions/07-concurrency/exercises/parallelsum\"\n\nvar Chunks = parallelsum.Chunks\n\nfunc Sum(nums []int64, workers int) int64 {\n    if workers < 1 {\n        workers = runtime.GOMAXPROCS(0)\n    }\n    chunks := Chunks(len(nums), workers)\n    partials := make([]int64, len(chunks))  // one slot per goroutine\n\n    var wg sync.WaitGroup\n    for i, r := range chunks {\n        wg.Add(1)\n        go func() {\n            defer wg.Done()\n            var s int64\n            for _, v := range nums[r.Lo:r.Hi] {\n                s += v\n            }\n            partials[i] = s\n        }()\n    }\n    wg.Wait()\n\n    var total int64\n    for _, p := range partials {\n        total += p\n    }\n    return total\n}\n\nfunc main() {\n\tnums := make([]int64, 1_000_000)\n\tfor i := range nums {\n\t\tnums[i] = int64(i)\n\t}\n\tfmt.Println(Sum(nums, 4)) // 499999500000\n}\n```\n\n**Why it's idiomatic**:\n- `wg.Add(1)` is in the parent goroutine before spawning (no race with `Wait()`).\n- Each goroutine writes to its own `partials[i]`, so no contention.\n- `wg.Wait()` acts as a happens-before point: all writes to `partials` are visible.\n- Local accumulation (`var s int64`) before writing the shared slice is an optimization.\n\n**Chunks implementation**:\n- Divides [0, n) evenly among parts. If n % parts != 0, earlier ranges get the extra element.\n\n### Optimizations (fast.go)\n\nNo significant optimization for this pattern; local accumulation is already done. Micro-optimizations like padding to cache line boundaries are not worth the code complexity.\n\n### Trade-off\n\n- **Local accumulation, then one shared write per goroutine**: avoids atomic operations and lock contention.\n- **Atomic adds to a shared counter**: simpler code, slower (~2x overhead per increment due to atomic/memory barriers).\n\nUse local accumulation here; it's both clear and fast.\n\n### Grading Checklist (Parallel Sum)\n\n- [ ] `Chunks(n, parts)` returns nil for n <= 0, otherwise parts non-overlapping ranges.\n- [ ] `Chunks` lengths differ by at most one; earlier ranges are longer when needed.\n- [ ] `Sum` calls `wg.Add(1)` before spawning (no race).\n- [ ] `Sum` passes ranges correctly to chunk sums (correct slice bounds).\n- [ ] `Sum` uses local accumulation (small variable s per goroutine).\n- [ ] Each goroutine writes to its own `partials[i]` (no contention).\n- [ ] `wg.Wait()` waits for all goroutines before summing partials.\n- [ ] Tests pass with `-race` and `-count=3`.\n\n---\n\n## Exercise 3: Worker Pool\n\n### Readable Solution (workerpool.go)\n\n**What it does**: Applies a function to every element of a slice using a fixed number of worker goroutines, keeping results in order.\n\n```go\nimport \"gocourse/solutions/07-concurrency/exercises/workerpool\"\n\nvar ErrInvalidWorkers = workerpool.ErrInvalidWorkers\n\n// Map calls fn on every element of in using at most workers goroutines and\n// returns the results in the same order as in: out[i] = fn(ctx, in[i]).\n//\n// If any call fails, Map cancels the context passed to the calls still\n// running, starts no further calls, waits for every worker to return, and\n// returns (nil, err) with the first error. If ctx is done before all calls\n// finish, Map returns (nil, context.Cause(ctx)), which is ctx.Err() unless the\n// caller canceled with a cause. Map never leaves goroutines running after it\n// returns.\nfunc Map[In, Out any](ctx context.Context, in []In, workers int, fn func(context.Context, In) (Out, error)) ([]Out, error) {\n\tif workers < 1 {\n\t\treturn nil, ErrInvalidWorkers\n\t}\n\tctx, cancel := context.WithCancelCause(ctx)\n\tdefer cancel(nil)\n\n\tout := make([]Out, len(in))\n\tjobs := make(chan int) // indices into in; unbuffered so no job is \"claimed\" early\n\n\tvar wg sync.WaitGroup\n\tfor range min(workers, len(in)) {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tfor i := range jobs {\n\t\t\t\tv, err := fn(ctx, in[i])\n\t\t\t\tif err != nil {\n\t\t\t\t\tcancel(err) // only the first cause sticks; later calls are no-ops\n\t\t\t\t\treturn\n\t\t\t\t}\n\t\t\t\tout[i] = v // each index is written by exactly one worker\n\t\t\t}\n\t\t}()\n\t}\n\n\t// The calling goroutine is the producer, so it owns (and closes) jobs.\nfeed:\n\tfor i := range in {\n\t\tselect {\n\t\tcase jobs <- i:\n\t\tcase <-ctx.Done():\n\t\t\tbreak feed\n\t\t}\n\t}\n\tclose(jobs)\n\twg.Wait()\n\n\tif err := context.Cause(ctx); err != nil {\n\t\treturn nil, err\n\t}\n\treturn out, nil\n}\n\nfunc main() {\n\tdouble := func(ctx context.Context, n int) (int, error) {\n\t\tif n < 0 {\n\t\t\treturn 0, fmt.Errorf(\"negative input %d\", n)\n\t\t}\n\t\treturn 2 * n, nil\n\t}\n\tfmt.Println(Map(context.Background(), []int{1, 2, 3, 4}, 2, double)) // [2 4 6 8] <nil>\n\tfmt.Println(Map(context.Background(), []int{1, -2, 3}, 2, double))   // [] negative input -2\n}\n```\n\n**Why it's idiomatic**:\n- `context.WithCancelCause` lets workers report errors back to the main goroutine.\n- Unbuffered `jobs` channel: if a worker sends an error and cancels, new sends block immediately.\n- Each output element is written by exactly one worker (no contention).\n- The main goroutine is the producer; it owns and closes `jobs`.\n- `select` on `jobs <- i` and `ctx.Done()` allows early exit if cancellation happens.\n\n### Optimizations\n\nNo significant optimization beyond the design shown. The pattern is both clear and efficient.\n\n### Trade-off\n\n- **Cancel on first error**: simple, but stops immediately. Could collect all errors (with a mutex) and return them all at once.\n- **Unbuffered jobs channel**: forces work to proceed in order (roughly); a buffered channel would allow more flexibility but also potential for goroutine leaks if the producer doesn't monitor cancellation.\n\nFor this exercise, cancel on first error is correct and clear. A production version might collect all errors.\n\n### Grading Checklist (Worker Pool)\n\n- [ ] Workers < 1 returns `ErrInvalidWorkers`.\n- [ ] Spawns `min(workers, len(in))` goroutines (don't spawn more than items).\n- [ ] `wg.Add(1)` is in the parent before spawning (no race).\n- [ ] Each goroutine writes to its own `out[i]` (no contention).\n- [ ] `jobs` channel is unbuffered (or buffered with care to avoid leaks).\n- [ ] The main goroutine (producer) closes `jobs` after feeding all indices.\n- [ ] Workers exit the loop when `jobs` closes (via `range jobs`).\n- [ ] Cancellation stops feeding jobs and propagates to workers via `ctx.Done()`.\n- [ ] No goroutines remain after `Map` returns (even on error or cancellation).\n- [ ] Tests pass with `-race` and check no goroutine leaks via `runtime.NumGoroutine()`.\n\n---\n\n## Exercise 4: Pipeline\n\n### Readable Solution (pipeline.go)\n\n**What it does**: Builds a cancellable pipeline using generators, transformers, and mergers.\n\n```go\nfunc Generate(ctx context.Context, nums ...int) <-chan int {\n    out := make(chan int)\n    go func() {\n        defer close(out)\n        for _, n := range nums {\n            select {\n            case out <- n:\n            case <-ctx.Done():\n                return\n            }\n        }\n    }()\n    return out\n}\n\nfunc Square(ctx context.Context, in <-chan int) <-chan int {\n    out := make(chan int)\n    go func() {\n        defer close(out)\n        for {\n            select {\n            case x, ok := <-in:\n                if !ok { return }\n                select {\n                case out <- x * x:\n                case <-ctx.Done():\n                    return\n                }\n            case <-ctx.Done():\n                return\n            }\n        }\n    }()\n    return out\n}\n\nfunc Merge(ctx context.Context, cs ...<-chan int) <-chan int {\n    out := make(chan int)\n    var wg sync.WaitGroup\n    for _, c := range cs {\n        wg.Add(1)\n        go func(c <-chan int) {\n            defer wg.Done()\n            for {\n                select {\n                case v, ok := <-c:\n                    if !ok { return }\n                    select {\n                    case out <- v:\n                    case <-ctx.Done():\n                        return\n                    }\n                case <-ctx.Done():\n                    return\n                }\n            }\n        }(c)\n    }\n    go func() {\n        wg.Wait()\n        close(out)  // close once all senders are done\n    }()\n    return out\n}\n\nfunc SumSquares(ctx context.Context, nums []int, workers int) (int, error) {\n    ctx, cancel := context.WithCancel(ctx)\n    defer cancel()\n\n    src := Generate(ctx, nums...)\n    squares := make([]<-chan int, max(workers, 1))\n    for i := range squares {\n        squares[i] = Square(ctx, src)\n    }\n\n    total := 0\n    for v := range Merge(ctx, squares...) {\n        total += v\n    }\n    if err := ctx.Err(); err != nil {\n        return 0, err\n    }\n    return total, nil\n}\n\nfunc main() {\n\tfmt.Println(SumSquares(context.Background(), []int{1, 2, 3, 4}, 3)) // 30 <nil>\n\tctx, cancel := context.WithCancel(context.Background())\n\tcancel()\n\
