re specific than GET /notes/{id}, so registered first)\n   - GET /notes/{id} \u2014 fetch one note; {id} captures a single path segment\n   - DELETE /notes/{id} \u2014 delete note, returns 204 (no content)\n   - GET /files/{path...} \u2014 serve files; {path...} captures rest of path including slashes\n\n3. **parseID**: Helper that converts r.PathValue(\"id\") to int, validates it's positive, and returns (id, ok).\n   - Returns (0, false) for non-numeric input (client error)\n   - Returns (0, false) for \u22640 (invalid IDs)\n   - Callers use: `id, ok := parseID(r); if !ok { http.Error(...); return }`\n\n4. **writeJSON/writeError**: Helpers to set Content-Type and encode JSON.\n   - writeJSON encodes resp to w; returns error on failure\n   - writeError sends {\"error\": msg} as JSON\n\n**Key insight for Go 1.22+ patterns:**\n- `GET /items/{id}` matches \"GET /items/123\" and makes r.PathValue(\"id\") return \"123\"\n- `GET /items/latest` is **more specific** than `GET /items/{id}` so ServeMux tries it first (no manual ordering needed)\n- `GET /{$}` matches only \"/\" (exact root); without {$}, \"/\" also matches all unregistered paths as a catch-all\n- `GET /files/{path...}` captures \"a/b/c.txt\" from \"GET /files/a/b/c.txt\" \u2192 r.PathValue(\"path\") == \"a/b/c.txt\"\n- Pattern matching is case-sensitive and stops at the first match (most specific wins)\n\n### Optimized Solution\nCurrent solution is already clean. Minor variations:\n- Use a generic handler factory if repeating validation (overkill here)\n- Type switch on error type for detailed messages (adds complexity; simple message is fine)\n\nThe explicit handler methods and parseID helper keep the code maintainable without premature optimization.\n\n### Trade-off\nReadable and optimized are the same. The handler structure is the Go idiomatic way: explicit methods, simple helpers, no reflection.\n\n### Review Checklist\n- [ ] Routes creates an http.ServeMux\n- [ ] Routes returns the mux as http.Handler (or *http.ServeMux, which satisfies the interface)\n- [ ] Registers GET /{$} for exact root (not GET /)\n- [ ] Registers GET /notes (list) before any other /notes/{...} route (handled by ServeMux specificity)\n- [ ] Registers GET /notes/latest before GET /notes/{id} (more specific)\n- [ ] Registers POST /notes for creation (separate from GET /notes for listing)\n- [ ] POST /notes returns 201 Created with Location header pointing to the new note\n- [ ] GET /notes lists all notes; returns [] (empty array) if none exist (not 404 or null)\n- [ ] GET /notes/{id} returns 200 with the note\n- [ ] DELETE /notes/{id} returns 204 No Content (no body)\n- [ ] DELETE and GET /notes/{id} return 400 Bad Request for invalid {id}\n- [ ] parseID validates {id} is numeric and positive; returns (0, false) on error\n- [ ] All error responses are JSON {\"error\": \"message\"}\n- [ ] All success responses have Content-Type: application/json\n- [ ] Handlers use r.PathValue(\"id\") to extract path parameters\n- [ ] GET /files/{path...} correctly captures multi-segment paths (a/b/c.txt)\n- [ ] Root handler returns 200 (or appropriate status); doesn't panic on missing path\n- [ ] Handlers call store methods (Get, Create, Delete, List, Latest) as designed\n- [ ] Handlers respect request context (pass r.Context() to store methods)\n- [ ] Tests verify routing with different methods (GET, POST, DELETE, PUT, PATCH)\n- [ ] Tests verify method-not-allowed (405) for unsupported methods\n- [ ] Tests use httptest.NewRecorder for response inspection\n- [ ] Tests use httptest.NewServer for full integration testing\n- [ ] Tests verify path parameter extraction for various inputs (123, abc, 0, negative)\n- [ ] Tests verify Location header on 201 responses\n- [ ] Tests verify wildcard path capture for {path...}\n\n## Exercise 5: client\n\n### Readable Solution\nA well-behaved HTTP client with three methods:\n\n1. **New(baseURL, timeout)**: Factory that creates a Client.\n   - Stores baseURL with trailing \"/\" removed (so callers can write \"/items/\" and it becomes correct)\n   - Creates an http.Client with the given timeout\n   - Timeout applies to the entire request+response (not just connection establishment)\n   - Timeout is critical: prevents goroutine leaks if server never responds\n\n2. **GetItem(ctx, id)**: Fetches GET {baseURL}/items/{id}.\n   - Uses http.NewRequestWithContext(ctx, ...) to respect caller's timeout/cancellation\n   - Sets Accept: application/json to prefer JSON response\n   - Calls helper do() to handle response\n   - Returns ErrNotFound (typed error) for 404; callers can use errors.Is(err, ErrNotFound)\n\n3. **CreateItem(ctx, it)**: Posts a new item as JSON.\n   - Marshals the item to JSON first (catches errors before making request)\n   - Constructs POST request with Content-Type: application/json\n   - Expects 201 Created; any other 2xx is treated as error\n\n4. **do(ctx, method, path, body)**: Internal helper that:\n   - Constructs the full URL (baseURL + path)\n   - Creates request with http.NewRequestWithContext\n   - Calls c.http.Do(req)\n   - **Always drains the body** even on error (crucial for connection reuse)\n     ```go\n     srv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n     \tfmt.Fprint(w, \"a body nobody reads\")\n     }))\n     defer srv.Close()\n\n     resp, err := http.Get(srv.URL)\n     if err != nil {\n     \tlog.Fatal(err)\n     }\n     defer resp.Body.Close()\n     defer io.Copy(io.Discard, resp.Body) // drain to allow reuse (deferred calls run last-in, first-out: drain, then close)\n     fmt.Println(resp.StatusCode)\n     ```\n   - Checks StatusCode explicitly (404 \u2192 ErrNotFound; others \u2192 StatusError)\n   - Reads body on error for error message (only if small enough)\n   - Decodes JSON on success\n   - Wraps all errors with context (operation: \"get item\" or \"create item\")\n\n**Key insight for draining**: If you don't drain the response body, the TCP connection stays \"blocked\" waiting for you to read it. The HTTP connection is not returned to the pool, so future requests might create new connections. On high-traffic systems, this leaks sockets and eventually exhausts the client's connection pool.\n\n**Key insight for context passing**: The caller's context carries cancellation (e.g., request timeout in a handler). By passing it to NewRequestWithContext, you respect that deadline. If the handler times out, Do() will be canceled and return immediately.\n\n**Key insight for typed errors**: ErrNotFound is a sentinel value, so callers can use:\n```go\nimport \"gocourse/solutions/08-http/exercises/client\"\n\nvar ErrNotFound = client.ErrNotFound\n\nfunc main() {\n\tapi := httptest.NewServer(http.NotFoundHandler()) // an API that has no items\n\tdefer api.Close()\n\tc := client.New(api.URL, time.Second)\n\n\thandler := func(w http.ResponseWriter, r *http.Request) {\n\t\tctx, id := r.Context(), r.PathValue(\"id\")\n\t\titem, err := c.GetItem(ctx, id)\n\t\tif errors.Is(err, ErrNotFound) {\n\t\t\thttp.Error(w, \"item not found\", http.StatusNotFound)\n\t\t\treturn\n\t\t}\n\t\tfmt.Fprintln(w, item)\n\t}\n\tmux := http.NewServeMux()\n\tmux.HandleFunc(\"GET /items/{id}\", handler)\n\trec := httptest.NewRecorder()\n\tmux.ServeHTTP(rec, httptest.NewRequest(\"GET\", \"/items/7\", nil))\n\tfmt.Print(rec.Code, \" \", rec.Body.String()) // 404 item not found\n}\n```\nThis is better than checking error messages (fragile) or error types (verbose).\n\n### Optimized Solution\nCould reduce allocations by:\n- Reusing a bytes.Buffer pool for request bodies (minor; JSON Marshal already allocates)\n- Pre-allocating URL strings (minor; string concatenation is cheap)\n- Caching requests (not safe; http.Request is mutable)\n\nThe standard library's http.Client already uses connection pooling and reuses buffers internally. Further optimization is not worth the complexity.\n\n### Trade-off\nReadable and optimized are the same. The error handling (drain, check status, wrap) and context passing are non-negotiable for correct, production-quality clients.\n\n### Review Checklist\n- [ ] New returns *Client (or Client if no pointers needed)\n- [ ] New trims trailing \"/\" from baseURL (so \"/items/\" becomes \"/items\")\n- [ ] New stores an http.Client with the given timeout\n- [ ] GetItem uses http.NewRequestWithContext (not context.Background)\n- [ ] GetItem constructs URL as baseURL + \"/items/\" + id\n- [ ] GetItem sets Accept: application/json header\n- [ ] GetItem calls do() with \"GET\" method\n- [ ] GetItem returns ErrNotFound (typed error) for 404\n- [ ] GetItem wraps other errors with context (\"get item: ...\")\n- [ ] CreateItem marshals the item to JSON before making request (validates early)\n- [ ] CreateItem constructs POST request with Content-Type: application/json\n- [ ] CreateItem expects 201 Created; 200 is an error\n- [ ] do() creates full URL correctly (baseURL + path)\n- [ ] do() always defers resp.Body.Close()\n- [ ] do() always defers io.Copy(io.Discard, resp.Body) (drains for reuse)\n- [ ] do() checks StatusCode explicitly (not generic 2xx check)\n- [ ] do() reads response body **after** draining (order matters)\n- [ ] do() reads truncated body on error (e.g., first 512 bytes)\n- [ ] do() checks for io.EOF on empty body (empty error response is valid)\n- [ ] do() wraps errors with operation context (\"get item: status 500: server error\")\n- [ ] do() decodes JSON into the destination type\n- [ ] do() returns ErrNotFound as-is (not wrapped)\n- [ ] do() wraps StatusError and other errors with fmt.Errorf(\"%w\", err)\n- [ ] Client respects caller's context (timeout, cancellation)\n- [ ] Client reuses connections (drains allow http.Client to reuse)\n- [ ] Tests use httptest.NewServer (not a real network port)\n- [ ] Tests verify GetItem with valid ID, 404 not found, server error\n- [ ] Tests verify CreateItem with valid item, validation error, conflict\n- [ ] Tests verify context cancellation (handler returns cancelled context)\n- [ ] Tests verify context deadline (handler sleeps past deadline)\n- [ ] Tests verify timeout on http.Client (slow server)\n- [ ] Tests verify connection reuse (concurrent requests use fewer connections)\n- [ ] Tests verify error wrapping (errors.Is works for ErrNotFound)\n\n## Project: URL Shortener\n\n### Readable Solution\nThe project implements a complete URL-shortener HTTP API with three main components:\n\n1. **Server struct and NewServer**: Creates a Server with defaults.\n   - If Store is nil, creates MemoryStore\n   - If Logger is nil, creates slog.New(slog.NewDiscardHandler())\n   - Trims trailing \"/\" from BaseURL\n   - Initializes code generator (random string generator with collision retry)\n\n2. **handleCreate** (POST /links): Validates and creates a shortened link.\n   - Reads and validates Content-Type (application/json)\n   - Caps request body at 4 KiB\n   - Decodes request: {url, code (optional)}\n   - Validates URL: must be http/https, non-empty, \u22642048 chars, has a host\n   - If code provided: validates it (4-32 chars of [A-Za-z0-9_-])\n   - If code omitted: generates random code, retries up to 5 times on collision\n   - Creates Link struct with creation time (time.Now().UTC())\n   - Calls Store.Create; returns 409 on ErrExists (code taken)\n   - Returns 201 with Location header (e.g., \"http://localhost:8080/abc123\") and JSON body\n\n3. **handleRedirect** (GET /{code}): Redirects to the original URL.\n   - Extracts code from r.PathValue(\"code\")\n   - Calls Store.Visit (increments visits, returns updated Link)\n   - Returns 302 Found with Location header pointing to original URL\n   - Returns 404 if code not found\n\n4. **handleStats** (GET /links/{code}/stats): Returns link statistics.\n   - Extracts code from r.PathValue(\"code\")\n   - Calls Store.Get (does NOT increment visits)\n   - Returns 200 with full Link JSON (code, url, short_url, visits, created_at)\n   - Returns 404 if code not found\n\n5. **validateURL**: Validates URLs.\n   - Rejects empty URL\n   - Rejects URL longer than MaxURLLen (2048)\n   - Parses with url.Parse\n   - Checks scheme is http or https\n   - Checks host is non-empty (catches \"/path\", \"http://\")\n   - Optional: reject localhost (for testing, you'd allow it)\n\n6. **validCode**: Validates custom codes.\n   - Checks length: 4-32 characters\n   - Checks characters: [A-Za-z0-9_-] only\n   - Case-sensitive\n\n7. **Store interface and MemoryStore**:\n   ```go\n   import \"gocourse/solutions/08-http/project/shortener\"\n\n   type Link = shortener.Link\n\n   type Store interface {\n   \tCreate(ctx context.Context, l Link) error // returns ErrExists if taken\n   \tGet(ctx context.Context, code string) (Link, error)\n   \tVisit(ctx context.Context, code string) (Link, error) // increments visits\n   }\n\n   func main() {\n   \tvar s Store = shortener.NewMemoryStore()\n   \tctx := context.Background()\n   \ts.Create(ctx, Link{Code: \"go\", URL: \"https://go.dev\"})\n   \tfmt.Println(s.Create(ctx, Link{Code: \"go\"})) // the code is taken: ErrExists\n   \tl, _ := s.Visit(ctx, \"go\")\n   \tfmt.Println(l.Visits) // 1\n   }\n   ```\n   - MemoryStore uses sync.RWMutex to protect links map\n   - Create: returns ErrExists if code already exists\n   - Get: returns ErrNotFound if code doesn't exist\n   - Visit: increments visits atomically, returns ErrNotFound if not found\n\n8. **logRequests**: Middleware that logs every request.\n   - Logs with method, path, status code, and duration\n   - Uses logger.InfoContext to carry context attributes\n   - Wraps handler with statusWriter to capture response status\n\n### Optimized Solution\nCould optimize by:\n- Using sync.Map instead of RWMutex for MemoryStore (overkill for this scale)\n- Using atomic.Int64 for visit counter (unnecessary; RWMutex is simple and clear)\n- Pre-allocating links map with capacity hint (minor; Go's map growth is efficient)\n- Caching validation regex if doing regex-based validation (current approach using url.Parse is simpler)\n\nThe current solution is already efficient. MemoryStore will handle thousands of links without bottleneck.\n\n### Trade-off\n- **Readable and optimized are the same** for this project.\n- **Validation functions are explicit** (validateURL, validCode) for clarity and testability\n- **Inlining would reduce readability** without meaningful performance gain\n- **Use MemoryStore for development**, but the Store interface allows swapping to PostgreSQL/SQLite without changing handlers\n\n### Review Checklist\n- [ ] NewServer creates and returns *Server\n- [ ] NewServer fills defaults: nil Store \u2192 new MemoryStore, nil Logger \u2192 discard handler\n- [ ] NewServer trims trailing \"/\" from BaseURL\n- [ ] handleCreate handles POST /links\n- [ ] handleCreate validates Content-Type is application/json (415 on mismatch)\n- [ ] handleCreate caps request body at 4 KiB with http.MaxBytesReader (413 on overflow)\n- [ ] handleCreate decodes JSON with DisallowUnknownFields (400 on unknown field)\n- [ ] handleCreate validates request body is not empty (400 on missing URL)\n- [ ] handleCreate validates URL is http or https (400 on wrong scheme)\n- [ ] handleCreate validates URL has a host (400 on missing host)\n- [ ] handleCreate validates URL length \u2264 2048 (400 on too long)\n- [ ] handleCreate rejects custom code if invalid (calls validCode; 400 on fail)\n- [ ] handleCreate generates random code if omitted\n- [ ] handleCreate retries generating codes on collision (up to 5 times; 500 if exhausted)\n- [ ] handleCreate returns 201 Created (not 200)\n- [ ] handleCreate sets Location header to short_url (e.g., \"http://localhost/abc\")\n- [ ] handleCreate returns 409 Conflict if code already exists (Store.Create returns ErrExists)\n- [ ] handleCreate encodes response as JSON {code, url, short_url, visits, created_at}\n- [ ] handleRedirect handles GET /{code}\n- [ ] handleRedirect extracts code from r.PathValue(\"code\")\n- [ ] handleRedirect calls Store.Visit (not Get; increments visits)\n- [ ] handleRedirect returns 302 Found with Location header (permanent would be 301)\n- [ ] handleRedirect returns 404 if code not found\n- [ ] handleStats handles GET /links/{code}/stats\n- [ ] handleStats extracts code from r.PathValue(\"code\")\n- [ ] handleStats calls Store.Get (not Visit; does not increment)\n- [ ] handleStats returns 200 with full Link JSON\n- [ ] handleStats returns 404 if code not found\n- [ ] validateURL rejects empty URL (400)\n- [ ] validateURL rejects URL > 2048 chars (400)\n- [ ] validateURL parses URL and checks scheme (http/https only)\n- [ ] validateURL checks host is non-empty (rejects \"/path\", \"http://\")\n- [ ] validCode rejects code < 4 or > 32 chars (400)\n- [ ] validCode rejects invalid characters (only [A-Za-z0-9_-])\n- [ ] validCode is case-sensitive\n- [ ] MemoryStore.Create stores Link and returns ErrExists if taken\n- [ ] MemoryStore.Get returns Link and ErrNotFound if missing\n- [ ] MemoryStore.Visit increments visits and returns updated Link\n- [ ] MemoryStore uses sync.RWMutex to protect links map (concurrent safe)\n- [ ] Visit counter increments only on redirect (GET /{code}), not on stats\n- [ ] Generated codes are random and unpredictable (not sequential)\n- [ ] Time fields use time.Now().UTC() (consistent timezone)\n- [ ] JSON responses include created_at in RFC3339 format (time.Time marshals correctly)\n- [ ] All errors are JSON {error: \"message\"}\n- [ ] Internal errors (code generation, store failures) log details, send generic message\n- [ ] All requests are logged with method, path, status, duration\n- [ ] Tests cover: create with/without code, validation errors, collision, redirect, stats\n- [ ] Tests cover: malformed JSON, unknown fields, body too large, wrong Content-Type\n- [ ] Tests cover: concurrent creates (race detector passes)\n- [ ] Tests use httptest.NewServer (no real network ports)\n- [ ] All tests pass with -race flag\n\n## Common Issues to Watch For\n\n### Context Misuse\n- **Using context.Background() in handlers** instead of r.Context()\n  - Impact: Client cancellations are ignored; unnecessary work continues\n  - Fix: Always use r.Context() for database queries, API calls, long operations\n  \n- **Not passing context to downstream calls**\n  - Impact: Caller's timeout/cancellation doesn't propagate\n  - Fix: Pass r.Context() to db.Query, client.GetItem, etc.\n  \n- **Sharing context across requests**\n  - Impact: Values from one request leak into another; racy behavior\n  - Fix: Derive child contexts in each request, don't reuse the parent\n\n### Panic Handling\n- **Panicking in handlers without recovery middleware**\n  - Impact: Goroutine dies; client gets no response; connection is lost\n  - Fix: Add Recover middleware, or validate input before operations that might panic\n  \n- **Panicking in spawned goroutines**\n  - Impact: Panic in goroutine doesn't reach handler's recover()\n  - Fix: Use error channels or WaitGroup; never assume panic is caught across goroutine boundaries\n  \n- **Forgetting to re-panic http.ErrAbortHandler**\n  - Impact: Framework's abort mechanism is suppressed; connection management breaks\n  - Fix: Defer recovery, and if recover() returns http.ErrAbortHandler, re-panic it\n\n### JSON Encoding/Decoding\n- **Writing status without buffering the response first**\n  - Impact: If encoding fails partway, client sees partial body with wrong status\n  - Fix: Encode to bytes.Buffer first, then write status and complete body atomically\n  \n- **Forgetting to validate Content-Type**\n  - Impact: Client sends binary data claiming it's JSON; Decode silently fails or misinterprets\n  - Fix: Use mime.ParseMediaType(r.Header.Get(\"Content-Type\")) and check mediaType == \"application/json\"\n  \n- **Not capping request body size**\n  - Impact: Client uploads 100 MB \"JSON\" and your process runs out of memory\n  - Fix: Use http.MaxBytesReader(w, r.Body, maxSize) before Decode\n  \n- **Using Decode without checking for trailing values**\n  - Impact: Client sends two JSON documents; only the first is decoded, second is silently ignored\n  - Fix: After Decode, attempt to read one more token; if successful, it's an error\n  \n- **Not calling DisallowUnknownFields()**\n  - Impact: Client typos in field names (user_ids vs user_id) are silently ignored\n  - Fix: Call dec.DisallowUnknownFields() before Decode\n  \n- **Returning errors from json.Decoder without context**\n  - Impact: Client sees opaque \"unexpected character\" errors\n  - Fix: Wrap with context: fmt.Errorf(\"decode request: %w\", err)\n\n### Middleware\n- **Applying middleware in the wrong order**\n  - Impact: Auth runs before logging; unauthorized requests aren't logged\n  - Fix: Chain(h, Logging, Auth) applies Logging outermost (runs first on request)\n  \n- **Forgetting to call next.ServeHTTP**\n  - Impact: Handler never runs; request hangs or times out\n  - Fix: Every middleware must call next.ServeHTTP(w, r) (or return early on error)\n  \n- **Sharing mutable state across requests without synchronization**\n  - Impact: Race conditions in concurrent requests\n  - Fix: Use request context to carry request-scoped data; use sync.Mutex for shared state\n  \n- **Not implementing Unwrap() on wrapper types**\n  - Impact: Code that tries to access underlying writer (via http.ResponseController) fails\n  - Fix: Wrapper types should implement Unwrap() http.ResponseWriter\n  \n- **Logging sensitive data (passwords, API keys)**\n  - Impact: Logs leak credentials; compliance violations\n  - Fix: Filter context values before logging; sanitize request/response bodies\n\n### HTTP Client\n- **Using context.Background() instead of passing caller's context**\n  - Impact: Client request ignores caller's timeout/cancellation\n  - Fix: Use http.NewRequestWithContext(ctx, ...) where ctx is the caller's context\n  \n- **Not draining response bodies**\n  - Impact: TCP connections aren't returned to pool; socket leak; resource exhaustion\n  - Fix: Always defer io.Copy(io.Discard, resp.Body); resp.Body.Close()\n  \n- **Not setting a timeout on http.Client**\n  - Impact: Goroutine hangs forever if server never responds\n  - Fix: client := &http.Client{Timeout: 10*time.Second}\n  \n- **Comparing status code with == instead of checking range**\n  - Impact: Checking resp.StatusCode == 200 fails on valid 201/204/etc responses\n  - Fix: Check StatusCode explicitly for the expected value; wrap non-matching codes as errors\n  \n- **Ignoring write errors when draining**\n  - Impact: Silent failures in cleanup\n  - Fix: Acceptable to ignore only when draining (client is gone); always check other errors\n  \n- **Not reading response body after error**\n  - Impact: Error details lost; harder to debug\n  - Fix: Read (truncated) body on non-2xx status codes for error message\n\n### HTTP Handlers & Routing\n- **Writing status without setting Content-Type**\n  - Impact: Browser treats response as HTML or binary; client can't parse response\n  - Fix: Set Content-Type before WriteHeader: w.Header().Set(\"Content-Type\", \"application/json\")\n  \n- **Calling WriteHeader twice**\n  - Impact: Second call is silently ignored; unexpected status or headers\n  - Fix: Write status once; use helpers to ensure atomic write\n  \n- **Assuming path parameters are non-empty**\n  - Impact: Panics or crashes on edge cases (empty string, negative numbers)\n  - Fix: Validate extracted parameters before using them\n  \n- **Not using /{$} for exact root path**\n  - Impact: GET / matches \"\", which is a catch-all for unregistered paths\n  - Fix: Register GET /{$} for exact match; mux tries more specific patterns first\n  \n- **Forgetting method in pattern**\n  - Impact: Pattern matches all methods (GET, POST, DELETE, etc.)\n  - Fix: Always include method: \"GET /items\", \"POST /items\", \"DELETE /items/{id}\"\n  \n- **Not checking specific error types from database/upstream**\n  - Impact: 500 responses for client errors (validation, not found)\n  - Fix: Switch on error types; return 400 for validation, 404 for not found\n\n### Race Conditions & Concurrency\n- **Sharing maps or slices across requests without sync.Mutex**\n  - Impact: Concurrent requests corrupt data; go test -race detects it\n  - Fix: Protect shared state with sync.RWMutex or use channels\n  \n- **Recording request-scoped data in global variables**\n  - Impact: User A's data appears in User B's response\n  - Fix: Use context.WithValue to carry request data; never use global state\n  \n- **Goroutine spawned in handler doesn't respect cancellation**\n  - Impact: Goroutine continues running after client disconnects or timeout fires\n  - Fix: Pass r.Context() to goroutine; check ctx.Done() or use sync.WaitGroup with timeout\n  \n- **Calling cancel() multiple times**\n  - Impact: Panic on second cancel\n  - Fix: Defer cancel() once; never call it multiple times in one scope\n\n### Testing\n- **Using real network ports in tests (listening on :8080)**\n  - Impact: Tests interfere with each other; port conflicts; flaky on busy systems\n  - Fix: Use httptest.NewServer (dynamic port) or httptest.NewRecorder (no network)\n  \n- **Not using httptest utilities**\n  - Impact: Manual socket setup; tests are slow and fragile\n  - Fix: httptest.NewServer for integration; httptest.NewRecorder for unit tests\n  \n- **Not testing error cases (validation, 404, 500)**\n  - Impact: Hidden bugs in error paths; poor test coverage\n  - Fix: Create subtests for each error case; verify status code and error message\n  \n- **Not running tests with -race**\n  - Impact: Race conditions hide until production\n  - Fix: Run go test -race ./... in CI; catch data races early\n  \n- **Assuming specific error messages from upstream**\n  - Impact: Tests break if upstream error message changes\n  - Fix: Check error type (errors.Is) or status code; don't assert on message text\n", "solDir": "/home/csmith/Workspace/tools/go-course/solutions/08-http", "dir": "/home/csmith/Workspace/tools/go-course/modules/08-http"}, {"slug": "09-performance", "compose": "modules/09-performance/compose.yaml", "services": ["test", "vet", "bench", "cover", "shell", "solutions"], "title": "Module 09: Measure, Profile, Optimize", "lesson": "# Module 09: Measure, Profile, Optimize\n\n## Goals\n\nAfter this module, you'll be able to:\n- Write benchmarks with Go's standard `testing` package and measure allocation counts\n- Use `pprof` (CPU and memory profiling) to identify performance bottlenecks\n- Understand allocation sources: interface boxing, string concatenation, regex compilation, and sub-optimal data structures\n- Optimize code with techniques like buffer reuse, preallocation, and algorithm choice\n- Balance readability against performance using data-driven trade-off analysis\n- Recognize when optimization is premature and when it's essential\n\n## Concepts\n\n### The Golden Rule: Measure First\n\nThe mantra in Go's performance culture is **\"measure first.\"** It's easy to guess wrong about where the time or memory goes.\nOptimize blindly, and you waste hours on the slow path instead of the critical one. Profile, identify the hotspot, then optimize.\n\n```text\n// Guess: \"for loops are slow\"\n// Fact: your parser is calling regexp.MustCompile 1000 times per line\n```\n\nGo gives you excellent tools for this: `testing` benchmarks with built-in allocation reporting,\nand `pprof` for CPU and memory profiling of real workloads.\n\n### Benchmarks: Measuring Throughput and Allocations\n\nGo 1.24 introduced `testing.B.Loop`, which makes benchmarks simpler and more idiomatic:\n\n```go\n// CORRECT (Go 1.24+)\nfunc BenchmarkJoin(b *testing.B) {\n\tparts := makeParts(1000)\n\tb.ReportAllocs()\n\tfor b.Loop() {\n\t\t_ = strings.Join(parts, \",\")\n\t}\n}\n\n// OLD STYLE (still works, but less idiomatic)\nfunc BenchmarkJoinOld(b *testing.B) {\n\tparts := makeParts(1000)\n\tb.ReportAllocs()\n\tb.ResetTimer() // b.N style needs this to exclude the setup; b.Loop does it for you\n\tfor i := 0; i < b.N; i++ {\n\t\t_ = strings.Join(parts, \",\")\n\t}\n}\n\nfunc makeParts(n int) []string {\n\tparts := make([]string, n)\n\tfor i := range parts {\n\t\tparts[i] = \"part\" + strconv.Itoa(i)\n\t}\n\treturn parts\n}\n```\n\nWhen you run `go test -bench=. -benchmem`, you get output like:\n```\nBenchmarkJoin-8    12345    123456 ns/op    45678 B/op    3 allocs/op\n```\n\n- `123456 ns/op`: nanoseconds per operation\n- `45678 B/op`: bytes allocated per operation\n- `3 allocs/op`: number of heap allocations per operation\n\n**Key insight:** Even if an optimization saves only 1 ns per operation, if you shave off one allocation, you save GC\npauses and peak memory in the long run. Allocations matter.\n\n### testing.AllocsPerRun: Gates for Correctness *and* Performance\n\nIn this course, each performance exercise uses `testing.AllocsPerRun` to set a performance *gate*: a test\nthat fails if the code is too slow.\n\n```go\nfunc TestAppendIntsAllocs(t *testing.T) {\n\tnums := testNums(200)\n\tdst := make([]byte, 0, 8192)\n\twant := string(AppendInts(nil, nums, ','))\n\n\tallocs := testing.AllocsPerRun(100, func() {\n\t\tdst = AppendInts(dst[:0], nums, ',')\n\t})\n\n\tif string(dst) != want {\n\t\tt.Fatalf(\"output changed between calls\")\n\t}\n\tif allocs != 0 {\n\t\tt.Errorf(\"AppendInts allocates %.0f times, want 0\", allocs)\n\t}\n}\n\n// AppendInts appends nums to dst, separated by sep.\nfunc AppendInts(dst []byte, nums []int, sep byte) []byte {\n\tfor i, n := range nums {\n\t\tif i > 0 {\n\t\t\tdst = append(dst, sep)\n\t\t}\n\t\tdst = strconv.AppendInt(dst, int64(n), 10)\n\t}\n\treturn dst\n}\n\nfunc testNums(n int) []int {\n\tnums := make([]int, n)\n\tfor i := range nums {\n\t\tnums[i] = i * 7919\n\t}\n\treturn nums\n}\n```\n\nThis test:\n1. Runs the function 100 times (to amortize noise)\n2. Counts the **average** number of allocations per run\n3. Fails the student until they achieve the threshold\n\nThe threshold is set so the starter code clearly fails, and the optimal solution clearly passes.\n\n**Run it:**\n```bash\ngo test ./modules/09-performance/exercises/appendints/ -v\n```\n\nThe test initially fails and shows a hint about the optimization strategy.\n\n### Escape Analysis: When Values Escape to the Heap\n\nSome allocations are hard to spot by reading code. Go's escape analyzer decides whether a variable can live on the stack\nor must be moved (\"escape\") to the heap. Understanding what escapes helps you identify unnecessary allocations.\n\nCompile with `-gcflags=-m` to see escape analysis decisions:\n\n```bash\ngo test -run=^$ -bench=. -gcflags=-m ./modules/09-performance/exercises/appendints/ 2>&1 | head -30\n```\n\nReal output on go1.24.2 for the **starter** (`go build -gcflags=-m ./modules/09-performance/exercises/appendints/`):\n```\nappendints.go:17:17: leaking param: dst to result ~r0 level=0\nappendints.go:17:29: nums does not escape\nappendints.go:22:32: ... argument does not escape\nappendints.go:22:39: n escapes to heap\n```\n\nAnd for the **solution** (`strconv.AppendInt`):\n```\nappendints.go:13:17: leaking param: dst to result ~r0 level=0\nappendints.go:13:29: nums does not escape\n```\n\n**Interpretation:**\n- `n escapes to heap`: passing an `int` to `fmt.Sprintf` boxes it into an `interface{}` (`any`), and that box is heap-allocated on **every call**. This is the hidden allocation in the starter.\n- `... argument does not escape`: the variadic `[]any` slice itself stays on the stack; only the boxed value escapes.\n- `leaking param: dst to result`: `dst` flows into the return value. That is expected for any `append`-style API and costs nothing by itself.\n- `does not escape`: stays on the stack, so it's free for the GC.\n\nIn the solution, the `n escapes to heap` line is simply gone. That's how you confirm an optimization removed an allocation before you even run a benchmark.\n\n### Allocation Sources: The Usual Suspects\n\n#### 1. Interface Boxing\n\nWhen a value is stored in an `interface{}` or a concrete interface, the runtime must \"box\" it:\nallocate a small header holding the type and a pointer to the value.\n\n```go\nfunc TestFormatAllocs(t *testing.T) {\n\tn := 123456\n\tdst := make([]byte, 0, 32)\n\n\t// BAD: fmt.Sprintf boxes n into interface{} and allocates the result string\n\tbad := testing.AllocsPerRun(100, func() { _ = fmt.Sprintf(\"%d\", n) })\n\n\t// GOOD: strconv.AppendInt never allocates (when dst has capacity)\n\tgood := testing.AllocsPerRun(100, func() { dst = strconv.AppendInt(dst[:0], int64(n), 10) })\n\n\tt.Logf(\"Sprintf: %.0f allocs, AppendInt: %.0f allocs\", bad, good) // 2 vs 0: the boxed int and the result string\n}\n```\n\n**Lesson:** Use `strconv` for number formatting, not `fmt`. `strconv.Append*` functions write directly\ninto a `[]byte`, avoiding the intermediate string and the boxing.\n\n#### 2. String Concatenation in Loops\n\nEach `s += x` allocates a new string, copies the old one, and discards the old one. O(n\u00b2) behavior:\n\n```go\nfunc joinBad(words []string) string {\n\t// BAD: quadratic\n\ts := \"\"\n\tfor _, w := range words {\n\t\ts += w + \",\"\n\t}\n\treturn s\n}\n\nfunc joinGood(words []string, estimatedLen int) string {\n\t// GOOD: linear\n\tvar sb strings.Builder\n\tsb.Grow(estimatedLen)\n\tfor i, w := range words {\n\t\tif i > 0 {\n\t\t\tsb.WriteByte(',')\n\t\t}\n\t\tsb.WriteString(w)\n\t}\n\treturn sb.String()\n}\n\nfunc BenchmarkJoin(b *testing.B) {\n\twords := strings.Fields(strings.Repeat(\"lorem ipsum dolor \", 300))\n\tb.Run(\"concat\", func(b *testing.B) {\n\t\tfor b.Loop() {\n\t\t\tjoinBad(words)\n\t\t}\n\t})\n\tb.Run(\"builder\", func(b *testing.B) {\n\t\tfor b.Loop() {\n\t\t\tjoinGood(words, 6*len(words))\n\t\t}\n\t})\n}\n```\n\n`strings.Builder.Grow(n)` preallocates the exact size, then writes to the internal buffer without further allocation.\n\n#### 3. Regular Expression Compilation\n\n`regexp.MustCompile` and `regexp.Compile` are expensive: they parse the pattern and build a finite automaton.\nDoing this once per call is wasteful.\n\n```go\ntype Version struct{ Major, Minor, Patch int }\n\nfunc parseWith(re *regexp.Regexp, s string) (Version, error) {\n\tif !re.MatchString(s) {\n\t\treturn Version{}, fmt.Errorf(\"bad version %q\", s)\n\t}\n\tvar v Version\n\tfmt.Sscanf(s, \"%d.%d.%d\", &v.Major, &v.Minor, &v.Patch)\n\treturn v, nil\n}\n\n// BAD: recompiles every call\nfunc ParseSlow(s string) (Version, error) {\n\tre := regexp.MustCompile(`^\\d+\\.\\d+\\.\\d+$`)\n\treturn parseWith(re, s)\n}\n\n// GOOD: compile once at package init\nvar versionRE = regexp.MustCompile(`^\\d+\\.\\d+\\.\\d+$`)\n\nfunc Parse(s string) (Version, error) {\n\treturn parseWith(versionRE, s)\n}\n\n// EVEN BETTER: avoid regex altogether\nfunc ParseManual(s string) (Version, error) {\n\tvar nums [3]int\n\tfor i := range nums {\n\t\tpart, rest, found := strings.Cut(s, \".\")\n\t\tn, err := strconv.Atoi(part)\n\t\tif err != nil || n < 0 || (i < 2) != found {\n\t\t\treturn Version{}, fmt.Errorf(\"bad version %q\", s)\n\t\t}\n\t\tnums[i], s = n, rest\n\t}\n\treturn Version{nums[0], nums[1], nums[2]}, nil\n}\n\nfunc BenchmarkParse(b *testing.B) {\n\tfor name, parse := range map[string]func(string) (Version, error){\n\t\t\"slow\": ParseSlow, \"precompiled\": Parse, \"manual\": ParseManual,\n\t} {\n\t\tb.Run(name, func(b *testing.B) {\n\t\t\tfor b.Loop() {\n\t\t\t\tparse(\"1.24.2\")\n\t\t\t}\n\t\t})\n\t}\n}\n```\n\n#### 4. Unprealloc'd Maps and Slices\n\nMaps and slices grow by doubling their backing arrays. Each growth allocates and rehashes/copies.\n\n```go\nfunc BenchmarkDedupe(b *testing.B) {\n\titems := make([]string, 500) // mostly distinct, as in a typical dedupe\n\tfor i := range items {\n\t\titems[i] = strconv.Itoa(i % 450)\n\t}\n\n\t// BAD: grow step by step\n\tb.Run(\"grow\", func(b *testing.B) {\n\t\tfor b.Loop() {\n\t\t\tseen := map[string]bool{} // starts empty\n\t\t\tvar out []string\n\t\t\tfor _, x := range items {\n\t\t\t\tif !seen[x] {\n\t\t\t\t\tseen[x] = true\n\t\t\t\t\tout = append(out, x)\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t})\n\n\t// GOOD: preallocate\n\tb.Run(\"prealloc\", func(b *testing.B) {\n\t\tfor b.Loop() {\n\t\t\tseen := make(map[string]bool, len(items))\n\t\t\tout := make([]string, 0, len(items))\n\t\t\tfor _, x := range items {\n\t\t\t\tif !seen[x] {\n\t\t\t\t\tseen[x] = true\n\t\t\t\t\tout = append(out, x)\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t})\n}\n```\n\nWith preallocation, the map is sized to fit all entries and the slice never grows. On this input, allocations drop\nfrom about 25 to 4 per call and the time to about a third. When the input is full of duplicates, though, `len(items)`\noverestimates the result and preallocating can cost more than it saves. Measure with your real data.\n\n#### 5. Reusable Buffers\n\nWhen encoding or building structured output repeatedly (e.g., in a server), keep a `[]byte` buffer in the struct\nand reset it for each operation:\n\n```go\ntype Record struct {\n\tName string\n\tAge  int\n}\n\ntype Encoder struct {\n\tw   io.Writer\n\tbuf []byte // reusable buffer\n}\n\nfunc NewEncoder(w io.Writer) *Encoder {\n\treturn &Encoder{w: w, buf: make([]byte, 0, 4096)}\n}\n\nfunc (e *Encoder) Encode(r Record) error {\n\te.buf = e.buf[:0] // reset, keep capacity\n\te.buf = append(e.buf, \"name=\"...)\n\te.buf = append(e.buf, r.Name...)\n\te.buf = append(e.buf, \" age=\"...)\n\te.buf = strconv.AppendInt(e.buf, int64(r.Age), 10)\n\te.buf = append(e.buf, '\\n')\n\t_, err := e.w.Write(e.buf)\n\treturn err\n}\n\nfunc main() {\n\tenc := NewEncoder(os.Stdout)\n\tenc.Encode(Record{\"Ada\", 36})\n\tenc.Encode(Record{\"Grace\", 85})\n\tallocs := testing.AllocsPerRun(100, func() { NewEncoder(io.Discard).Encode(Record{\"x\", 1}) })\n\tfmt.Println(\"allocs per NewEncoder+Encode:\", allocs) // the buffer; Encode itself adds none\n}\n```\n\nAfter the first call, `Encode` never allocates (assuming records fit in 4 KB).\n\n### CPU Profiling with pprof\n\nBenchmarking tells you throughput and allocation counts, but not *where* the time goes.\nCPU profiling samples the call stack and shows you the hot path.\n\n```bash\ngo test -run=^$ -bench=Summarize -cpuprofile=cpu.out ./modules/09-performance/project/\ngo tool pprof -http=localhost:6060 cpu.out\n```\n\nThis opens an interactive web UI showing:\n- **Flame graph:** the call tree colored by time spent\n- **Top table:** functions consuming the most CPU time\n- **List view:** source code annotated with percentage of time on each line\n\nOr use the text interface:\n```bash\ngo tool pprof cpu.out\n(pprof) top10\n(pprof) list parseLine\n(pprof) exit\n```\n\nThe `-list` command shows the offending function with time percentages next to each line.\n\n### Memory Profiling\n\nTo see where allocations come from:\n\n```bash\ngo test -run=^$ -bench=Summarize -memprofile=mem.out ./modules/09-performance/project/\ngo tool pprof -sample_index=alloc_objects -top mem.out\n```\n\nThis reports the count and size of allocations by call site. The `-sample_index=alloc_objects` flag\ncounts the number of allocations (default is bytes allocated).\n\n```\nType: alloc_objects\nShowing nodes accounting for 4364070, 99.95% of 4366278 total\n      flat  flat%   sum%        cum   cum%\n   2173964 49.79% 49.79%    2173964 49.79%  strings.FieldsFunc\n   2037189 46.66% 96.45%    2037189 46.66%  bufio.(*Scanner).Text\n     54613  1.25% 97.70%      87576  2.01%  fmt.Errorf\n     32768  0.75% 98.45%      32768  0.75%  errors.New (inline)\n```\n\nThe same run's CPU profile (`go tool pprof -top logstats.test cpu.out`) for comparison:\n```\nShowing nodes accounting for 1000ms, 64.52% of 1550ms total\n      flat  flat%   sum%        cum   cum%\n     530ms 34.19% 34.19%      820ms 52.90%  regexp.(*Regexp).doOnePass\n     150ms  9.68% 43.87%      300ms 19.35%  strings.FieldsFunc\n      70ms  4.52% 48.39%       70ms  4.52%  regexp/syntax.(*Inst).MatchRunePos\n      70ms  4.52% 52.90%       70ms  4.52%  strconv.ParseUint\n```\n(Real output from the starter project on go1.24.2 linux/amd64; your numbers will differ.)\n\nRead them together. **Time** is dominated by the regexp engine (53% cumulative), so replace the regex with manual parsing. **Allocations** come almost entirely from `strings.FieldsFunc` (a new `[]string` per line) and `Scanner.Text` (a new `string` per line). Switching to `Scanner.Bytes()` and indexing fields in place removes ~96% of allocations. The two profiles point at *different* fixes, which is why you collect both.\n\n## Idioms & Best Practices\n\n- **Measure first, optimize second.** Profile the real workload, not your guess. Premature optimization wastes time.\n- **Use `testing.B.Loop`** (Go 1.24) for new benchmarks. It's simpler and more idiomatic than the `i := 0; i < b.N` loop.\n- **Report allocations:** always include `b.ReportAllocs()` in benchmarks so you can see allocs/op.\n- **Preallocation is your friend.** `make([]T, 0, n)` and `make(map[K]V, hint)` avoid costly growth during loops.\n- **Hoist expensive operations.** Compile regexes and build lookup tables once at startup or in `var` statements,\nnot per call or per loop iteration.\n- **Use `strings.Builder` for repeated string building.** Grow it to the exact size before writing to avoid\nmultiple allocations.\n- **Reuse buffers in steady-state code.** When the same goroutine processes multiple records, keep a buffer in the\nreceiver struct and reset it between calls.\n- **Choose the right primitive.** `strconv.Append*` over `fmt.Sprintf`, manual parsing over regex when the format is simple,\n`[]byte` over `string` when building, `sync.Pool` for expensive-to-allocate types (but use it carefully: see \u00a78).\n- **Bounds-check elimination** is automatic: if the compiler can prove an index is safe, it skips the check. Don't manually unroll loops.\n- **Data structures matter.** A linked list is O(n) for a random access that a slice does in O(1). A hash table for a small set\nof < 20 items is slower than a linear search of a slice (linear search is cache-friendly).\n\n## Common Pitfalls\n\n- **\"My benchmark is faster than it should be.\"** Dead-code elimination (DCE) can optimize away your entire benchmark\nif the result isn't used. Modern benchmarks use `testing.B.Loop`, which prevents this. With the old style,\nuse a package-level `var sink` and assign the result to it: `sink = myFunc()`.\n- **\"My benchmark varies a lot.\"** Run with `-count=10` or `-count=100` so `benchstat` can calculate statistics.\nA single run is noise. Run on an unloaded machine.\n- **\"I hit an allocation gate, but I don't know how to optimize further.\"** Profile with pprof and\nlook at call sites. The hint in the test message often points you in the right direction. If stuck,\ncompare your code to the solution's fast.go variant.\n- **\"My regex is correct but slow.\"** If the pattern is simple (e.g., digits only), use `strings.Contains`,\n`strings.Index` or manual byte scanning. `regexp` is powerful but has overhead. The Go authors often say,\n\"Regex is fast, but manual parsing is faster.\"\n- **Readable vs. optimized.** Sometimes the readable version is fast enough. A 2x speedup on code that runs\nonce per second is pointless. Optimize code that runs 1000 times per second or more. Use a profile to decide.\n- **Sync.Pool misuse.** `sync.Pool` caches heap-allocated objects to reduce GC pressure, but it only works\nwhen the same goroutine reuses the pool (or you're lucky). For cross-goroutine reuse, a regular buffer in a struct\nis more predictable. Keep Pool items small and zeroed.\n\n## Exercises\n\n### 1. appendints\n\n**What to implement:**\n- Optimize `AppendInts(dst []byte, nums []int, sep byte) []byte` to be allocation-free when dst has spare capacity.\n\n**The slow version** uses `fmt.Sprintf` to format each integer, which boxes the number into `interface{}`,\nallocates a string, and then copies it into dst. The fast version uses `strconv.AppendInt`, which writes digits\nstraight into the slice.\n\n**Run the test:**\n```bash\ngo test ./modules/09-performance/exercises/appendints/ -v\n```\n\nThe test fails with: `AppendInts allocates X times per call, want 0.`\nIt should pass with zero allocations when the buffer is large enough.\n\n---\n\n### 2. csvline\n\n**What to implement:**\n- Optimize `Line(fields []string) string` to allocate at most once, instead of once per field.\n\n**The slow version** uses `s +=` in a loop, which is O(n\u00b2) in the output size. Each operation allocates a new string.\n\n**Run the test:**\n```bash\ngo test ./modules/09-performance/exercises/csvline/ -v\n```\n\nThe test fails with: `Line(40 fields) allocates X times, want <= 1.`\n\n**Hint:** Use `strings.Builder`. Call `Grow(estimatedLen)` first to preallocate the exact size.\n\n---\n\n### 3. dedupe\n\n**What to implement:**\n- Optimize `Unique(items []string) []string` to cut allocations from ~10+ to \u22642.\n\n**The slow version** grows both the map and the result slice with no hint, so each growth allocates and rehashes/copies.\n\n**Run the test:**\n```bash\ngo test ./modules/09-performance/exercises/dedupe/ -v\n```\n\nThe test fails with: `Unique allocates X times, want <= 12.` (The exact threshold depends on the input size.)\n\n**Hint:** Preallocate `make(map[K]V, hint)` and `make([]T, 0, capacity)` using `len(items)` as the bound.\n\n---\n\n### 4. lineenc\n\n**What to implement:**\n- Optimize `Encoder.Encode(r Record) error` to allocate zero times in steady state.\n\n**The slow version** calls `fmt.Sprintf`, which allocates a string, then converts it to `[]byte`, allocating again.\nEvery record triggers two allocations.\n\n**Run the test:**\n```bash\ngo test ./modules/09-performance/exercises/lineenc/ -v\n```\n\nThe test fails with: `Encode allocates X times after warm-up, want 0.`\n\n**Hint:** Add a `[]byte` buffer to the `Encoder` struct. Reset it with `buf = buf[:0]` and format into it using `strconv.AppendQuote`, `strconv.AppendInt`, etc.\n\n---\n\n### 5. semver\n\n**What to implement:**\n- Optimize `Parse(s string) (Version, error)` to be allocation-free for valid input.\n\n**The slow version** compiles a regex on every call and uses `FindStringSubmatch`, which allocates a slice of matches.\n\n**Run the test:**\n```bash\ngo test ./modules/09-performance/exercises/semver/ -v\n```\n\nThe test fails with: `Parse allocates X times, want 0.` (for valid input)\n\n**Hints:**\n- Compile the regex once at package level.\n- Better: skip regex altogether. Use `strings.Cut` and `strings.HasPrefix` to parse manually.\n- Validate component ranges without allocating.\n\n---\n\n## Project: Optimize the Log Parser\n\nSee `project/README.md`.\n\n---\n\n## Submitting for Review\n\nWhen all exercise tests pass, ask your instructor (Claude) to review `modules/09-performance/`.\n\n---\n\n## Further Reading\n\n- [Testing Package - Benchmarking](https://pkg.go.dev/testing#hdr-Benchmarking)\n- [Testing Best Practices - Go blog](https://go.dev/blog/testing-b-loop) (b.Loop intro, Go 1.24)\n- [Profiling Go Programs](https://go.dev/blog/profiling-go-programs)\n- [Diagnostics Guide](https://go.dev/doc/diagnostics)\n- [Effective Go - Profiling and Optimizing](https://go.dev/doc/effective_go#profiling)\n- [Benchstat tool](https://pkg.go.dev/golang.org/x/perf/cmd/benchstat) (not stdlib, but recommended for comparing runs)\n- [100 Go Mistakes - Performance](https://100go.co) (chapters on allocations, regex, preallocation)\n", "units": [{"kind": "exercise", "name": "appendints", "dir": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/appendints", "doc": "Package appendints formats integers into a caller-supplied byte slice.", "readme": "", "files": [{"name": "appendints.go", "path": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/appendints/appendints.go"}, {"name": "appendints_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/appendints/appendints_test.go"}], "cmd": "go test ./modules/09-performance/exercises/appendints/", "id": "modules/09-performance/exercises/appendints"}, {"kind": "exercise", "name": "csvline", "dir": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/csvline", "doc": "Package csvline encodes a single CSV record into a string.", "readme": "", "files": [{"name": "csvline.go", "path": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/csvline/csvline.go"}, {"name": "csvline_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/csvline/csvline_test.go"}], "cmd": "go test ./modules/09-performance/exercises/csvline/", "id": "modules/09-performance/exercises/csvline"}, {"kind": "exercise", "name": "dedupe", "dir": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/dedupe", "doc": "Package dedupe removes duplicate strings while preserving order.", "readme": "", "files": [{"name": "dedupe.go", "path": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/dedupe/dedupe.go"}, {"name": "dedupe_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/dedupe/dedupe_test.go"}], "cmd": "go test ./modules/09-performance/exercises/dedupe/", "id": "modules/09-performance/exercises/dedupe"}, {"kind": "exercise", "name": "lineenc", "dir": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/lineenc", "doc": "Package lineenc writes records as key=value text lines.", "readme": "", "files": [{"name": "lineenc.go", "path": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/lineenc/lineenc.go"}, {"name": "lineenc_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/lineenc/lineenc_test.go"}], "cmd": "go test ./modules/09-performance/exercises/lineenc/", "id": "modules/09-performance/exercises/lineenc"}, {"kind": "exercise", "name": "semver", "dir": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/semver", "doc": "Package semver parses simple MAJOR.MINOR.PATCH version strings.", "readme": "", "files": [{"name": "semver.go", "path": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/semver/semver.go"}, {"name": "semver_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/09-performance/exercises/semver/semver_test.go"}], "cmd": "go test ./modules/09-performance/exercises/semver/", "id": "modules/09-performance/exercises/semver"}, {"kind": "project", "name": "project", "dir": "/home/csmith/Workspace/tools/go-course/modules/09-performance/project", "doc": "Package logstats summarizes HTTP access logs.\n\nEach log line has six fields separated by one or more spaces or tabs:\n\n\t<timestamp> <method> <path> <status> <duration_ms> <bytes>\n\t2026-10-11T12:00:00Z GET /api/users 200 12 5120\n\nThe timestamp is treated as an opaque token (it is not validated).", "readme": "# Project: Optimize the Log Parser\n\n## Overview\n\nYou're given a correct but slow HTTP access log parser. Your job is to optimize it to:\n1. **Pass the allocation gate:** \u226460 allocations for 2000 log lines\n2. **Non-scaling allocations:** allocations should not grow with the number of lines\n3. **Reach \u22655x speedup** on a benchmark (measure with `-benchstat`)\n\nThe starter code is a working implementation with three regex-based validators and a naive parser.\nIt's correct but slow because:\n- It validates with `regexp.MatchString` on every line\n- It uses `strings.FieldsFunc` to split fields\n- Every operation that looks simple allocates\n\nYour optimization must keep the behavior identical.\n\n## Specification\n\nThe `Summarize` function reads HTTP access logs from an `io.Reader` and aggregates statistics.\n\nEach log line has **exactly six fields** separated by spaces or tabs:\n```\n<timestamp> <method> <path> <status> <duration_ms> <bytes>\n2026-10-11T12:00:00Z GET /api/users 200 12 5120\n```\n\nA **well-formed** line has:\n- Exactly 6 fields (non-empty, separated by ` ` or `\\t`)\n- Method: one or more uppercase ASCII letters (A-Z)\n- Path: must start with `/`\n- Status: exactly three digits in 100\u2013599\n- Duration and bytes: unsigned decimal integers fitting in `int64`\n\n**Blank lines** (after trimming spaces, tabs, and carriage returns) are skipped and not counted.\n\n**Malformed lines** are counted but otherwise ignored. They don't affect the summary statistics.\n\nThe function returns:\n- `Lines`: count of all non-blank lines (well-formed + malformed)\n- `Malformed`: count of rejected lines\n- `Methods`: map of HTTP method \u2192 count\n- `Status`: map of HTTP status code \u2192 count\n- `Paths`: map of path \u2192 aggregated statistics (Count, TotalMillis, MaxMillis, Bytes)\n\n## Acceptance Criteria\n\n\u2705 **Correctness:**\n- All tests pass: `go test ./modules/09-performance/project/`\n- No data race: `go test -race ./modules/09-performance/project/`\n\n\u2705 **Performance gate:**\n- `TestSummarizeAllocs` passes: \u226460 allocations for 2000 lines\n- `TestSummarizeAllocsDoNotScale` passes: allocations don't scale with line count\n\n\u2705 **Benchmark improvement:**\n- Create a `project/RESULTS.md` file documenting before/after benchmarks\n- Show at least 5x speedup (or close to it)\n\n## How to Approach This\n\n### Step 1: Measure the Slow Version\n\nRun the starter code's benchmark to see the baseline:\n\n```bash\ncd /home/csmith/Workspace/tools/go-course\ngo test -run=^$ -bench=Summarize -benchmem ./modules/09-performance/project/\n```\n\nOutput (approximate):\n```\nBenchmarkSummarize    500    2500000 ns/op   1024 B/op   150 allocs/op\n```\n\nNote: your baseline will differ, but it's likely in the thousands of allocations.\n\n### Step 2: Profile for Hotspots\n\nUse pprof to see where time and allocations come from:\n\n```bash\ngo test -run=^$ -bench=Summarize -memprofile=mem.out ./modules/09-performance/project/\ngo tool pprof -sample_index=alloc_objects -top mem.out\n```\n\nOr use the interactive UI:\n```bash\ngo tool pprof -http=localhost:6060 mem.out\n```\n\nLook at the \"top\" allocators. You'll likely see:\n- `regexp` package functions (each MatchString call allocates)\n- `strings.FieldsFunc` (allocates a slice of fields)\n- Maybe `fmt` or `strings` functions if the code isn't optimal yet\n\n### Step 3: Optimize\n\n**Common optimizations for this problem:**\n\n#### 3a. Skip Regex Validation\n\nThe three regex validators can be replaced with simple character checks:\n\n```go\n// OLD: regexes on every line\n//\n//\tif !methodRE.MatchString(f[1]) { ... }\n//\tif !statusRE.MatchString(f[3]) { ... }\n//\tif !numberRE.MatchString(f[4]) { ... }\n\n// NEW: manual validation\nfunc isMethod(s string) bool {\n\tif len(s) == 0 {\n\t\treturn false\n\t}\n\tfor _, c := range s {\n\t\tif c < 'A' || c > 'Z' {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn true\n}\n\nfunc isStatus(s string) bool {\n\treturn len(s) == 3 && s[0] >= '1' && s[0] <= '5' &&\n\t\ts[1] >= '0' && s[1] <= '9' && s[2] >= '0' && s[2] <= '9'\n}\n\nfunc isDecimal(s string) bool {\n\tif len(s) == 0 {\n\t\treturn false\n\t}\n\tfor _, c := range s {\n\t\tif c < '0' || c > '9' {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn true\n}\n\nfmt.Println(isMethod(\"GET\"), isMethod(\"get\"), isStatus(\"404\"), isStatus(\"600\"), isDecimal(\"120\"), isDecimal(\"-1\"))\n// true false true false true false\n```\n\n(The existing regex compilation is static, but calling MatchString still allocates. Skipping regex entirely is better.)\n\n#### 3b. Replace FieldsFunc with Manual Parsing\n\n`strings.FieldsFunc` allocates a slice of fields. Instead, find field boundaries manually:\n\n```go\nline := \"2026-10-11T12:00:00Z GET /api/users 200 12 5120\"\n\n// OLD: allocates a []string for every line\nf := strings.FieldsFunc(line, func(r rune) bool { return r == ' ' || r == '\\t' })\nfmt.Println(f[1], f[2])\n\n// NEW: record field boundaries in a fixed-size array (no allocation)\ntype field struct{ start, end int }\nvar fields [6]field\nn, inField := 0, false\nfor i := 0; i <= len(line) && n <= 6; i++ {\n\tsep := i == len(line) || line[i] == ' ' || line[i] == '\\t'\n\tswitch {\n\tcase !sep && !inField: // a field starts\n\t\tif n < 6 {\n\t\t\tfields[n].start = i\n\t\t}\n\t\tinField = true\n\tcase sep && inField: // a field ends\n\t\tif n < 6 {\n\t\t\tfields[n].end = i\n\t\t}\n\t\tn++\n\t\tinField = false\n\t}\n}\nmethod := line[fields[1].start:fields[1].end] // substrings share line's memory: no copy\npath := line[fields[2].start:fields[2].end]\nfmt.Println(method, path, n == 6)\n```\n\nOr use a simpler approach: count separators and extract fields by index:\n\n```go\n// entry is one parsed log line (as in logstats.go).\ntype entry struct {\n\tmethod   string\n\tpath     string\n\tstatus   int\n\tduration int64\n\tbytes    int64\n}\n\nfunc parseLineManual(line string) (entry, error) {\n\tvar parts [6]string\n\tpartIdx := 0\n\tstart := 0\n\n\tfor i := 0; i <= len(line); i++ {\n\t\tif i == len(line) || line[i] == ' ' || line[i] == '\\t' {\n\t\t\tif i > start { // non-empty field\n\t\t\t\tif partIdx == 6 {\n\t\t\t\t\treturn entry{}, errors.New(\"too many fields\")\n\t\t\t\t}\n\t\t\t\tparts[partIdx] = line[start:i]\n\t\t\t\tpartIdx++\n\t\t\t}\n\t\t\tstart = i + 1\n\t\t}\n\t}\n\tif partIdx != 6 {\n\t\treturn entry{}, errors.New(\"too few fields\")\n\t}\n\t// validate and extract parts[0..5] (validation left to you)\n\tstatus, _ := strconv.Atoi(parts[3])\n\tdur, _ := strconv.ParseInt(parts[4], 10, 64)\n\tsize, _ := strconv.ParseInt(parts[5], 10, 64)\n\treturn entry{method: parts[1], path: parts[2], status: status, duration: dur, bytes: size}, nil\n}\n\nfunc main() {\n\tfmt.Println(parseLineManual(\"2026-10-11T12:00:00Z GET /api/users 200 12 5120\"))\n\tfmt.Println(parseLineManual(\"2026-10-11T12:00:00Z GET /api/users 200\"))\n}\n```\n\n#### 3c. Use strconv Directly\n\nWhen parsing integers, `strconv.Atoi` is simpler than `strconv.ParseInt`. But don't parse unless you've validated the format:\n\n```go\nparts := [6]string{\"2026-10-11T12:00:00Z\", \"GET\", \"/\", \"404\", \"3\", \"0\"}\n// Only call Atoi if isStatus/isDecimal returned true:\nstatus, _ := strconv.Atoi(parts[3]) // safe, no error possible if validated\nfmt.Println(status)                 // 404\n```\n\nOr use `strconv.ParseInt` with error handling as a fallback.\n\n#### 3d. Preallocate Maps\n\nThe maps `Methods`, `Status`, and `Paths` start empty and grow. If you can estimate their final size, preallocate:\n\n```go\n// The types, from logstats.go:\nimport logstats \"gocourse/modules/09-performance/project\"\n\ntype (\n\tSummary   = logstats.Summary\n\tPathStats = logstats.PathStats\n)\n\ns := Summary{\n\tMethods: make(map[string]int, 10),        // guess: ~10 distinct methods\n\tStatus:  make(map[int]int, 10),           // guess: ~10 distinct status codes\n\tPaths:   make(map[string]PathStats, 100), // guess: ~100 distinct paths\n}\nfmt.Println(len(s.Methods), len(s.Paths)) // 0 0: sized, but still empty\n```\n\nIn tests, this reduces growth-related allocations.\n\n### Step 4: Verify\n\nRun the tests and benchmark again:\n\n```bash\ngo test ./modules/09-performance/project/ -v\ngo test -race ./modules/09-performance/project/\ngo test -run=^$ -bench=Summarize -benchmem ./modules/09-performance/project/\n```\n\n### Step 5: Document Results\n\nCreate `project/RESULTS.md` with before/after benchmarks:\n\n```markdown\n# Optimization Results\n\n## Before (Slow)\n- 2500 ns/op, 1024 B/op, 150 allocs/op\n- Profile: most time in regexp, most allocations in FieldsFunc + regex\n\n## After (Optimized)\n- 400 ns/op, 64 B/op, 40 allocs/op\n- Speedup: 6.25x\n- Profile: most time in field parsing and map updates (acceptable)\n\n## Changes\n1. Removed regexes for method/status/number validation\n2. Replaced strings.FieldsFunc with manual field parsing\n3. Prealloc'd maps with hints\n```\n\n## Tips\n\n- **Start simple:** remove the regexes first. That's the biggest win.\n- **Profile before and after:** compare the \"top\" output to see what you've fixed.\n- **Test stability:** run with `-count=10` to see variance. If it's huge, you might be on a noisy machine.\n- **Readable code:** the solution's approach is still readable. Don't sacrifice too much clarity.\n- **Edge cases:** the test suite is comprehensive. If you introduce a bug, the tests will catch it.\n\n## Expected Performance\n\nWith all optimizations applied, you should see:\n- **Allocations:** 30\u201360 per 2000 lines (depending on distinct paths/methods)\n- **Speed:** 5\u201310x faster than the starter code\n- **Allocations do not scale:** 1000 lines and 4000 lines should have roughly the same alloc count\n\n## Stretch Goal\n\nAfter optimizing, can you identify any remaining allocations using pprof? Some are unavoidable (e.g., storing new\nmap keys), but the goal is to show that the per-line cost approaches zero as the number of lines grows.\n\n## Run the Test Command\n\nThe exact test command to verify everything works:\n\n```bash\ngo test ./modules/09-performance/project/ -v -race\n```\n\nAll tests must pass before you consider the project complete.\n", "files": [{"name": "README.md", "path": "/home/csmith/Workspace/tools/go-course/modules/09-performance/project/README.md"}, {"name": "logstats.go", "path": "/home/csmith/Workspace/tools/go-course/modules/09-performance/project/logstats.go"}, {"name": "logstats_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/09-performance/project/logstats_test.go"}], "cmd": "go test ./modules/09-performance/project/...", "id": "modules/09-performance/project"}], "review": "# Review Guide: Module 09 Solutions\n\nThis guide explains the readable and optimized solutions for each exercise and the project,\nalong with a grading checklist.\n\n---\n\n## Exercise 1: appendints\n\n### Readable Solution\n\n```go\n// appendints.go\nfunc AppendInts(dst []byte, nums []int, sep byte) []byte {\n    for i, n := range nums {\n        if i > 0 {\n            dst = append(dst, sep)\n        }\n        dst = strconv.AppendInt(dst, int64(n), 10)\n    }\n    return dst\n}\n\nfmt.Println(string(AppendInts(nil, []int{3, -1, 42}, ','))) // 3,-1,42\n```\n\n**Why it's idiomatic:**\n- `strconv.AppendInt` is the standard way to append a formatted integer to a `[]byte`\n- No intermediate string allocation\n- No interface boxing\n- Direct write to the slice\n\n### Optimized Solution\n\nThe readable solution *is* the optimized one. There's no slower-but-more-readable variant here,\nbecause the obvious approach is already optimal.\n\nThe starter code used `fmt.Sprintf`, which is slow because:\n1. It boxes the integer into `interface{}`\n2. It allocates a new string\n3. It converts the string to `[]byte` for appending (another allocation)\n\nThe solution avoids all three.\n\n### Benchmark Results\n\n**Starter (slow):**\n```\nBenchmarkAppendInts-20    80280    14775 ns/op    3202 B/op    400 allocs/op\n```\n(measured on go1.24.2 linux/amd64)\n\n**Solution (optimized):**\n```\nBenchmarkAppendInts-20   535849     2198 ns/op       0 B/op      0 allocs/op\n```\n(measured on go1.24.2 linux/amd64)\n\n**Speedup:** 6.72x, zero allocations when dst has capacity.\n\n### Trade-off\n\n**Use the optimized version always.** `strconv.AppendInt` is not less readable than `fmt.Sprintf`;\nit's actually clearer about intent (formatting into a buffer, not a string).\n\n### Review Checklist\n\n- [ ] Student chose `strconv.AppendInt` over `fmt.Sprintf`\n- [ ] No intermediate string allocation\n- [ ] Handles negative numbers correctly (test includes negatives)\n- [ ] Preserves dst prefix (test includes prefix case)\n- [ ] Separators placed correctly (no leading/trailing separator)\n- [ ] Works with empty nums (returns dst unchanged)\n- [ ] AllocsPerRun test passes (0 allocations)\n\n---\n\n## Exercise 2: csvline\n\n### Readable Solution\n\n```go\n// csvline.go\nfunc Line(fields []string) string {\n    var sb strings.Builder\n    sb.Grow(estimateLen(fields))\n    for i, f := range fields {\n        if i > 0 {\n            sb.WriteByte(',')\n        }\n        if strings.ContainsAny(f, \",\\\"\\r\\n\") {\n            sb.WriteByte('\"')\n            for _, c := range f {\n                sb.WriteRune(c)\n                if c == '\"' {\n                    sb.WriteRune('\"')  // double quotes\n                }\n            }\n            sb.WriteByte('\"')\n        } else {\n            sb.WriteString(f)\n        }\n    }\n    return sb.String()\n}\n\nfunc estimateLen(fields []string) int {\n    total := len(fields) - 1  // separators\n    for _, f := range fields {\n        total += len(f)\n        if strings.ContainsAny(f, \",\\\"\\r\\n\") {\n            total += 2  // quotes\n            total += strings.Count(f, \"\\\"\")  // extra quotes\n        }\n    }\n    return total\n}\n\nfunc main() {\n\tfmt.Println(Line([]string{\"plain\", \"with,comma\", `say \"hi\"`})) // plain,\"with,comma\",\"say \"\"hi\"\"\"\n}\n```\n\n**Why it's idiomatic:**\n- Uses `strings.Builder` to avoid repeated allocations\n- Calls `Grow` to preallocate the exact size (no growth during writes)\n- Clear control flow: quoted vs. unquoted fields\n\n### Fast Variant (in fast.go)\n\n```go\n// fast.go\nfunc AppendLine(dst []byte, fields []string) []byte {\n    for i, f := range fields {\n        if i > 0 {\n            dst = append(dst, ',')\n        }\n        quote := false\n        for j := 0; j < len(f); j++ {\n            if c := f[j]; c == ',' || c == '\"' || c == '\\r' || c == '\\n' {\n                quote = true\n                break\n            }\n        }\n        if !quote {\n            dst = append(dst, f...)\n            continue\n        }\n        dst = append(dst, '\"')\n        start := 0\n        for j := 0; j < len(f); j++ {\n            if f[j] == '\"' {\n                dst = append(dst, f[start:j+1]...)\n                dst = append(dst, '\"')\n                start = j + 1\n            }\n        }\n        dst = append(dst, f[start:]...)\n        dst = append(dst, '\"')\n    }\n    return dst\n}\n\nfunc main() {\n\tfmt.Println(string(AppendLine(nil, []string{\"plain\", \"with,comma\", `say \"hi\"`})))\n}\n```\n\n**Why it's faster:**\n- Returns `[]byte` instead of `string`, so the caller can reuse the buffer\n- Scans each field byte-by-byte instead of calling `ContainsAny` and `Count`\n- Avoids the string `\u2192 rune` conversion in quoted fields\n- For servers handling many records, the buffer can be reused, eliminating allocation\n\n### Benchmark Results\n\n**Starter:**\n```\nBenchmarkLine-20    153298     8255 ns/op   18320 B/op    118 allocs/op\n```\n(measured on go1.24.2 linux/amd64)\n\n**Readable (strings.Builder):**\n```\nBenchmarkLine-20    389277     2767 ns/op     448 B/op      1 alloc/op\n```\n(measured on go1.24.2 linux/amd64)\n\n**Fast (AppendLine):**\n```\nBenchmarkLineFast/AppendLine-20   2480949    483.5 ns/op     0 B/op      0 allocs/op\n```\n(measured on go1.24.2 linux/amd64)\n\n**Speedup:** ~2.98x from starter to readable; ~5.72x from readable to fast; ~17.07x from starter to fast.\n\n### Trade-off\n\n- **Readable:** Use when `Line` is called rarely or in isolation. One allocation per call is acceptable.\n- **Fast:** Use when encoding many records in a loop (e.g., server endpoint). Reuse the buffer:\n  ```go\n  import \"gocourse/solutions/09-performance/exercises/csvline\"\n\n  var AppendLine = csvline.AppendLine\n\n  func main() {\n  \trecords := []struct{ Fields []string }{{[]string{\"a\", \"b,c\"}}, {[]string{`say \"hi\"`, \"\"}}}\n  \tw := os.Stdout\n\n  \tbuf := make([]byte, 0, 4096)\n  \tfor _, rec := range records {\n  \t\tbuf = AppendLine(buf[:0], rec.Fields)\n  \t\tbuf = append(buf, '\\n') // AppendLine adds no line terminator\n  \t\tw.Write(buf)\n  \t}\n  }\n  ```\n\n### Review Checklist\n\n- [ ] Student chose `strings.Builder` over `+=` loop\n- [ ] Calls `Builder.Grow` with estimated size (no growth during writes)\n- [ ] Handles quoted fields correctly (commas, quotes, newlines)\n- [ ] Doubles internal quotes (`\"` \u2192 `\"\"`)\n- [ ] Produces valid CSV (RFC 4180 compliant)\n- [ ] Empty fields handled correctly\n- [ ] AllocsPerRun test passes (\u22641 allocation)\n\n---\n\n## Exercise 3: dedupe\n\n### Readable Solution\n\n```go\n// dedupe.go\nfunc Unique(items []string) []string {\n    seen := make(map[string]bool, len(items))\n    out := make([]string, 0, len(items))\n    for _, it := range items {\n        if !seen[it] {\n            seen[it] = true\n            out = append(out, it)\n        }\n    }\n    return out\n}\n\nfmt.Println(Unique([]string{\"b\", \"a\", \"b\", \"c\"})) // [b a c]\n```\n\n**Why it's idiomatic:**\n- Prealloc'd map and slice with capacity hints (no growth)\n- Simple logic: track seen items, append new ones\n- Returns a slice (consumer-friendly)\n\n### Optimized Solution\n\nThe readable solution *is* already well-optimized. The starter code's main inefficiency is the lack of preallocation.\n\n**Comparison:**\n\n**Starter (no prealloc):**\n```go\nitems := []string{\"b\", \"a\", \"b\", \"c\"}\nseen := map[string]bool{} // empty, will grow\nvar out []string          // nil, will grow\nfor _, it := range items {\n\tif !seen[it] {\n\t\tseen[it] = true\n\t\tout = append(out, it)\n\t}\n}\nfmt.Println(out) // [b a c]\n```\n\n**Optimized (prealloc):**\n```go\nitems := []string{\"b\", \"a\", \"b\", \"c\"}\nseen := make(map[string]bool, len(items)) // size hint\nout := make([]string, 0, len(items))      // capacity\nfor _, it := range items {\n\tif !seen[it] {\n\t\tseen[it] = true\n\t\tout = append(out, it)\n\t}\n}\nfmt.Println(out, cap(out)) // [b a c] 4\n```\n\nWith preallocation, the map is sized upfront, and the slice grows at most once or twice.\nWithout it, both grow repeatedly, causing multiple allocations and rehashing.\n\n### Benchmark Results\n\n**Starter (2000 items, 1000 distinct):**\n```\nBenchmarkUnique-20    10000    102688 ns/op    143946 B/op    31 allocs/op\n```\n(measured on go1.24.2 linux/amd64)\n\n**Optimized:**\n```\nBenchmarkUnique-20    24372     55409 ns/op    141985 B/op    10 allocs/op\n```\n(measured on go1.24.2 linux/amd64)\n\n**Speedup:** 1.85x, allocations drop from 31 to 10.\n\n### Trade-off\n\nAlways use the optimized version (with preallocation). The readability is unchanged; you're just adding capacity hints.\n\n### Review Checklist\n\n- [ ] Map prealloc'd with `make(map[...], len(items))`\n- [ ] Slice prealloc'd with `make([]..., 0, len(items))`\n- [ ] Preserves order of first occurrence\n- [ ] Handles nil/empty input correctly (returns nil or empty slice)\n- [ ] No duplicates in output\n- [ ] AllocsPerRun test passes (\u226412 allocs for typical input)\n\n---\n\n## Exercise 4: lineenc\n\n### Readable Solution\n\n```go\n// Record is one result row.\ntype Record struct {\n\tName   string\n\tScore  int\n\tPassed bool\n}\n\n// lineenc.go\ntype Encoder struct {\n    w   io.Writer\n    buf []byte\n}\n\nfunc NewEncoder(w io.Writer) *Encoder {\n    return &Encoder{w: w, buf: make([]byte, 0, 4096)}\n}\n\nfunc (e *Encoder) Encode(r Record) error {\n    e.buf = e.buf[:0]  // reset, keep capacity\n\n    e.buf = append(e.buf, \"name=\"...)\n    e.buf = strconv.AppendQuote(e.buf, r.Name)\n    e.buf = append(e.buf, \" score=\"...)\n    e.buf = strconv.AppendInt(e.buf, int64(r.Score), 10)\n    e.buf = append(e.buf, \" passed=\"...)\n    e.buf = strconv.AppendBool(e.buf, r.Passed)\n    e.buf = append(e.buf, '\\n')\n\n    _, err := e.w.Write(e.buf)\n    return err\n}\n\nfunc main() {\n\tenc := NewEncoder(os.Stdout)\n\tenc.Encode(Record{Name: \"Ada\", Score: 97, Passed: true})\n\tenc.Encode(Record{Name: `Bob \"the builder\"`, Score: 41})\n}\n```\n\n**Why it's idiomatic:**\n- Reuses a buffer in the Encoder (steady-state allocation-free)\n- Uses `strconv.Append*` functions (no intermediate strings)\n- Resets with `buf[:0]` to keep capacity\n- Clear and straightforward\n\n### Optimized Variant (in fast.go)\n\nThe readable solution is already near-optimal. A minor speedup could be:\n- Using `unsafe` to avoid a final `string()` conversion (not recommended for this module)\n- Preallocating larger if records are typically large\n- Using `io.WriteString` for string literals (avoids `append(..., []byte...)`)\n\n**Minor optimization:**\n```go\nimport \"gocourse/solutions/09-performance/exercises/lineenc\"\n\ntype Record = lineenc.Record\n\n// AppendRecord appends the encoded line for r to dst. It is the building block\n// for both Encoder.Encode and WriteRecord, and lets callers batch many records\n// into one buffer before a single Write.\nfunc AppendRecord(dst []byte, r Record) []byte {\n\tdst = append(dst, \"name=\"...)\n\tdst = strconv.AppendQuote(dst, r.Name)\n\tdst = append(dst, \" score=\"...)\n\tdst = strconv.AppendInt(dst, int64(r.Score), 10)\n\tdst = append(dst, \" passed=\"...)\n\tdst = strconv.AppendBool(dst, r.Passed)\n\treturn append(dst, '\\n')\n}\n\n// bufPool holds *[]byte, not []byte: putting a slice header directly into an\n// interface would itself allocate (staticcheck SA6002).\nvar bufPool = sync.Pool{\n\tNew: func() any {\n\t\tb := make([]byte, 0, 128)\n\t\treturn &b\n\t},\n}\n\n// maxPooledCap stops one huge record from pinning a huge buffer in the pool\n// forever (see golang/go#23199).\nconst maxPooledCap = 4 << 10\n\n// WriteRecord is a stateless, goroutine-safe alternative to Encoder: it\n// borrows a buffer from a sync.Pool. Use it when there is no natural owner for\n// a buffer (e.g. many goroutines writing records to different writers).\n// In single-goroutine code the Encoder is simpler and at least as fast.\nfunc WriteRecord(w io.Writer, r Record) error {\n\tbp := bufPool.Get().(*[]byte)\n\tb := AppendRecord((*bp)[:0], r)\n\t_, err := w.Write(b)\n\tif cap(b) <= maxPooledCap {\n\t\t*bp = b\n\t\tbufPool.Put(bp)\n\t}\n\tif err != nil {\n\t\treturn fmt.Errorf(\"lineenc: write record: %w\", err)\n\t}\n\treturn nil\n}\n\nfunc main() {\n\tWriteRecord(os.Stdout, Record{Name: \"Ada\", Score: 97, Passed: true})\n\tfmt.Println(testing.AllocsPerRun(100, func() { WriteRecord(io.Discard, Record{Name: \"x\"}) })) // 0\n}\n```\n\nThe fast.go file in solutions shows this pattern, which shaves off a few percent.\n\n### Benchmark Results\n\n**Starter:**\n```\nBenchmarkEncode-20    3659322    305.3 ns/op    152 B/op    4 allocs/op\n```\n(measured on go1.24.2 linux/amd64)\n\n**Readable (with buffer reuse):**\n```\nBenchmarkEncode-20   15327054     78.06 ns/op      0 B/op    0 allocs/op\n```\n(measured on go1.24.2 linux/amd64)\n\n**Speedup:** 3.91x, zero allocations in steady state.\n\n### Trade-off\n\nAlways use the buffer-reuse approach. It's not less readable, and it's essential for servers that encode many records.\n\n### Review Checklist\n\n- [ ] Added `buf []byte` field to Encoder\n- [ ] Buffer prealloc'd to reasonable size (e.g., 4 KB)\n- [ ] Resets with `buf[:0]` to keep capacity\n- [ ] Uses `strconv.AppendQuote` for the name\n- [ ] Uses `strconv.AppendInt` for the score\n- [ ] Uses `strconv.AppendBool` for the passed flag\n- [ ] Appends `\\n` at the end\n- [ ] AllocsPerRun test passes (0 allocations in steady state)\n- [ ] Output format is exact (space separators, no extra spaces)\n\n---\n\n## Exercise 5: semver\n\n### Readable Solution (fast.go)\n\nInstead of a regex, manual parsing is simpler and faster:\n\n```go\nimport \"gocourse/solutions/09-performance/exercises/semver\"\n\ntype Version = semver.Version\n\nvar ErrInvalid = semver.ErrInvalid\n\n// fast.go\nfunc Parse(s string) (Version, error) {\n    // Strip optional \"v\" prefix\n    if len(s) > 0 && s[0] == 'v' {\n        s = s[1:]\n    }\n\n    // Find the first dot\n    dot1 := strings.Index(s, \".\")\n    if dot1 == -1 {\n        return Version{}, fmt.Errorf(\"semver: parse %q: %w\", s, ErrInvalid)\n    }\n\n    major, err := strconv.Atoi(s[:dot1])\n    if err != nil || major < 0 {\n        return Version{}, fmt.Errorf(\"semver: parse %q: %w\", s, ErrInvalid)\n    }\n\n    // Find the second dot\n    dot2 := strings.Index(s[dot1+1:], \".\")\n    if dot2 == -1 {\n        return Version{}, fmt.Errorf(\"semver: parse %q: %w\", s, ErrInvalid)\n    }\n    dot2 += dot1 + 1\n\n    minor, err := strconv.Atoi(s[dot1+1 : dot2])\n    if err != nil || minor < 0 {\n        return Version{}, fmt.Errorf(\"semver: parse %q: %w\", s, ErrInvalid)\n    }\n\n    patch, err := strconv.Atoi(s[dot2+1:])\n    if err != nil || patch < 0 {\n        return Version{}, fmt.Errorf(\"semver: parse %q: %w\", s, ErrInvalid)\n    }\n\n    return Version{Major: major, Minor: minor, Patch: patch}, nil\n}\n\nfunc main() {\n\tfmt.Println(Parse(\"v1.24.2\")) // {1 24 2} <nil>\n\tfmt.Println(Parse(\"1.x.2\"))   // semver: parse \"1.x.2\": invalid version\n}\n```\n\n**Why it's better:**\n- No regex compilation\n- No `FindStringSubmatch` allocation\n- `strings.Index` and `strconv.Atoi` are fast and well-optimized\n- Simpler error messages\n\n### Optimized Variant (even more compact)\n\nUsing `strings.Cut` (Go 1.18+) makes it cleaner:\n\n```go\nimport \"gocourse/solutions/09-performance/exercises/semver\"\n\ntype Version = semver.Version\n\nvar ErrInvalid = semver.ErrInvalid\n\n// Slightly cleaner version\nfunc Parse(s string) (Version, error) {\n    if len(s) > 0 && s[0] == 'v' {\n        s = s[1:]\n    }\n\n    before, after, ok := strings.Cut(s, \".\")\n    if !ok {\n        return Version{}, fmt.Errorf(\"semver: parse %q: %w\", s, ErrInvalid)\n    }\n    major, err := strconv.Atoi(before)\n    if err != nil || major < 0 {\n        return Version{}, fmt.Errorf(\"semver: parse %q: %w\", s, ErrInvalid)\n    }\n\n    before, patch, ok := strings.Cut(after, \".\")\n    if !ok {\n        return Version{}, fmt.Errorf(\"semver: parse %q: %w\", s, ErrInvalid)\n    }\n    minor, err := strconv.Atoi(before)\n    if err != nil || minor < 0 {\n        return Version{}, fmt.Errorf(\"semver: parse %q: %w\", s, ErrInvalid)\n    }\n\n    patchInt, err := strconv.Atoi(patch)\n    if err != nil || patchInt < 0 {\n        return Version{}, fmt.Errorf(\"semver: parse %q: %w\", s, ErrInvalid)\n    }\n\n    return Version{Major: major, Minor: minor, Patch: patchInt}, nil\n}\n\nfunc main() {\n\tfmt.Println(Parse(\"v1.24.2\")) // {1 24 2} <nil>\n\tfmt.Println(Parse(\"1.2\"))     // semver: parse \"1.2\": invalid version\n}\n```\n\n### Benchmark Results\n\n**Starter (regex compiled per call):**\n```\nBenchmarkParse-20    152104     11656 ns/op   11257 B/op    136 allocs/op\n```\n(measured on go1.24.2 linux/amd64)\n\n**Readable (manual parsing with strings.Cut):**\n```\nBenchmarkParse-20   31144882      39.46 ns/op      0 B/op      0 allocs/op\n```\n(measured on go1.24.2 linux/amd64)\n\n**Speedup:** 295.2x, zero allocations.\n\n### Trade-off\n\nThe manual parsing version is actually *more* readable than the regex, because the format is simple.\nAlways prefer it.\n\n### Review Checklist\n\n- [ ] Student removed the regex or hoisted it to a package variable\n- [ ] Uses `strings.Index` or `strings.Cut` to find dots\n- [ ] Validates component format (no leading zeros, valid range)\n- [ ] Handles optional \"v\" prefix\n- [ ] Uses `strconv.Atoi` for parsing (or error handling if Atoi fails)\n- [ ] Rejects invalid formats (wrong number of dots, non-decimal characters)\n- [ ] AllocsPerRun test passes (0 allocations for valid input)\n- [ ] Error messages are clear\n\n---\n\n## Project: Optimize the Log Parser\n\n### Readable Solution (in logstats.go)\n\nThe starter code validates with regexes and parses with `strings.FieldsFunc`.\nThe readable solution keeps the same structure but:\n\n1. **Compile regexes once** at package level\n2. **Keep the FieldsFunc approach** (it's fast enough once regexes aren't the bottleneck)\n\n```go\n// entry is one parsed log line.\ntype entry struct {\n\tmethod   string\n\tpath     string\n\tstatus   int\n\tduration int64\n\tbytes    int64\n}\n\nfunc isSep(r rune) bool { return r == ' ' || r == '\\t' }\n\n// logstats.go (partial)\nvar (\n    metho
