` arguments to read from stdin\n\n### Stretch Goals\n\n- Add a `-latency-percentiles` flag to report custom percentiles (e.g., `p99`)\n- Filter logs by IP or user: `-ip 10.0.0.2` or `-user bob`\n- Output detailed stats per status code (e.g., average latency for 200 vs 500)\n- Add color output for text reports (for terminals)\n", "files": [{"name": "README.md", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/project/README.md"}, {"name": "cmd/loganalyzer/main.go", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/project/cmd/loganalyzer/main.go"}, {"name": "loganalyzer/loganalyzer.go", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/project/loganalyzer/loganalyzer.go"}, {"name": "loganalyzer/loganalyzer_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/05-io/project/loganalyzer/loganalyzer_test.go"}], "cmd": "go test ./modules/05-io/project/...", "id": "modules/05-io/project"}], "review": "# Code Review: Module 05 (I/O, Readers, Writers, Files & Encoding)\n\nThis document contains reference solutions and grading criteria for each exercise and the project.\n\n## Exercise 1: rot13\n\n### Readable Solution\n\n```go\n// Reader wraps another io.Reader and ROT13-encodes every ASCII letter that is\n// read through it. All other bytes (digits, punctuation, UTF-8 continuation\n// bytes, ...) pass through unchanged.\n//\n// Because ROT13 is its own inverse, a Reader also decodes.\ntype Reader struct {\n\tr io.Reader\n}\n\n// NewReader returns a Reader that ROT13-transforms the bytes read from r.\nfunc NewReader(r io.Reader) *Reader {\n\treturn &Reader{r: r}\n}\n\nfunc (r *Reader) Read(p []byte) (int, error) {\n\tn, err := r.r.Read(p)\n\tfor i, b := range p[:n] {\n\t\tp[i] = rot13(b)\n\t}\n\treturn n, err\n}\n\nfunc rot13(b byte) byte {\n\tswitch {\n\tcase 'a' <= b && b <= 'z':\n\t\treturn 'a' + (b-'a'+13)%26\n\tcase 'A' <= b && b <= 'Z':\n\t\treturn 'A' + (b-'A'+13)%26\n\tdefault:\n\t\treturn b\n\t}\n}\n\nfunc main() {\n\tio.Copy(os.Stdout, NewReader(strings.NewReader(\"Uryyb, Tbcure!\\n\"))) // Hello, Gopher!\n}\n```\n\nThe key insight is transforming exactly the n bytes that were read, then returning both n and the error (even if err != nil and n > 0, as the io.Reader contract allows).\n\n### Optimized Solution (fast.go)\n\nThe optimized variant uses a 256-entry lookup table instead of branching on every byte:\n\n```go\n// table maps every byte to its ROT13 image. It is computed once at package\n// initialisation by a pure function (no side effects), which is fine.\nvar table = func() (t [256]byte) {\n\tfor i := range t {\n\t\tt[i] = rot13(byte(i))\n\t}\n\treturn t\n}()\n\n// FastReader is like Reader but uses a 256-entry lookup table instead of\n// branching on every byte.\ntype FastReader struct {\n\tr io.Reader\n}\n\n// Read implements io.Reader.\nfunc (r *FastReader) Read(p []byte) (int, error) {\n\tn, err := r.r.Read(p)\n\tp = p[:n] // lets the compiler prove i < len(p) below (bounds-check elimination)\n\tfor i, b := range p {\n\t\tp[i] = table[b] // byte index into [256]byte: no bounds check needed\n\t}\n\treturn n, err\n}\n\n// rot13, from rot13.go:\n\n// rot13 rotates an ASCII letter 13 places, preserving case.\nfunc rot13(b byte) byte {\n\tswitch {\n\tcase 'a' <= b && b <= 'z':\n\t\treturn 'a' + (b-'a'+13)%26\n\tcase 'A' <= b && b <= 'Z':\n\t\treturn 'A' + (b-'A'+13)%26\n\tdefault:\n\t\treturn b\n\t}\n}\n\nfunc main() {\n\tio.Copy(os.Stdout, &FastReader{r: strings.NewReader(\"Uryyb, Tbcure!\\n\")}) // Hello, Gopher!\n}\n```\n\n**Trade-off:** The table version is ~4x faster on large inputs (measured 1294838 ns/op vs 316673 ns/op on go1.24.2 linux/amd64) because it eliminates branch misprediction and allows inlining. The readability cost is minimal: the lookup is still understandable. For small reads or latency-sensitive code, the branching version's better cache behavior (smaller code) might win.\n\n### Review Checklist\n\n- \u2713 Transforms exactly `p[:n]`, not all of `p`\n- \u2713 Returns both `n` and `err` without losing either\n- \u2713 Correctly handles `io.EOF` together with data\n- \u2713 Works with `io.Copy` and `iotest.TestReader`\n- \u2713 Handles all byte values (0\u2013255)\n- \u2713 ROT13 is its own inverse (double application is identity)\n- \u2713 Tests verify partial reads (`TestOnlyTransformsReadBytes`)\n- \u2713 Tests verify error propagation (`TestPropagatesErrors`)\n- \u2713 No unnecessary allocations\n\n## Exercise 2: linecount\n\n### Readable Solution\n\nUses `bufio.Reader.ReadLine` to handle lines of any length:\n\n```go\nimport \"gocourse/solutions/05-io/exercises/linecount\"\n\ntype Stats = linecount.Stats\n\nfunc Count(r io.Reader) (Stats, error) {\n\tbr := bufio.NewReader(r)\n\tvar (\n\t\ts       Stats\n\t\tlineLen int\n\t\tpartial bool\n\t)\n\tfor {\n\t\tchunk, isPrefix, err := br.ReadLine()\n\t\tif err != nil {\n\t\t\tif errors.Is(err, io.EOF) {\n\t\t\t\tif partial {\n\t\t\t\t\ts.Lines++\n\t\t\t\t\ts.Longest = max(s.Longest, lineLen)\n\t\t\t\t}\n\t\t\t\treturn s, nil\n\t\t\t}\n\t\t\treturn s, err\n\t\t}\n\t\tlineLen += len(chunk)\n\t\tpartial = isPrefix\n\t\tif isPrefix {\n\t\t\tcontinue\n\t\t}\n\t\ts.Lines++\n\t\ts.Longest = max(s.Longest, lineLen)\n\t\tlineLen = 0\n\t}\n}\n\nfunc main() {\n\tfmt.Println(Count(strings.NewReader(\"one\\r\\ntwo\\n\" + strings.Repeat(\"x\", 100_000)))) // {3 100000} <nil>\n}\n```\n\n`ReadLine` returns chunks of a line (when `isPrefix == true`, more is coming) and strips both `\\n` and `\\r\\n`. This avoids the 64 KiB limit of `Scanner` while still handling line boundaries correctly.\n\n### Optimized Solution (fast.go)\n\nReads in fixed chunks and scans for `\\n` manually:\n\n```go\nimport \"gocourse/solutions/05-io/exercises/linecount\"\n\ntype Stats = linecount.Stats\n\n// CountFast is a performance-tuned Count. Instead of asking bufio for one\n// line at a time, it reads large chunks and uses bytes.IndexByte (which is\n// implemented in assembly with SIMD on common platforms) to jump from one\n// '\\n' to the next. The only allocation is the 64 KiB read buffer.\nfunc CountFast(r io.Reader) (Stats, error) {\n\tvar (\n\t\ts       Stats\n\t\tbuf     = make([]byte, 64*1024)\n\t\tlineLen int  // bytes of the current, unfinished line\n\t\tlastCR  bool // the last content byte of the current line is '\\r'\n\t)\n\tfor {\n\t\tn, err := r.Read(buf)\n\t\tb := buf[:n]\n\t\tfor len(b) > 0 {\n\t\t\ti := bytes.IndexByte(b, '\\n')\n\t\t\tif i < 0 {\n\t\t\t\tlineLen += len(b)\n\t\t\t\tlastCR = b[len(b)-1] == '\\r'\n\t\t\t\tbreak\n\t\t\t}\n\t\t\tlineLen += i\n\t\t\tif i > 0 {\n\t\t\t\tlastCR = b[i-1] == '\\r'\n\t\t\t}\n\t\t\tif lastCR {\n\t\t\t\tlineLen-- // \"\\r\\n\" terminator: the '\\r' is not content\n\t\t\t}\n\t\t\ts.Lines++\n\t\t\ts.Longest = max(s.Longest, lineLen)\n\t\t\tlineLen, lastCR = 0, false\n\t\t\tb = b[i+1:]\n\t\t}\n\t\tif err != nil {\n\t\t\tif !errors.Is(err, io.EOF) {\n\t\t\t\treturn s, err\n\t\t\t}\n\t\t\tif lineLen > 0 { // unterminated last line; a trailing '\\r' is content\n\t\t\t\ts.Lines++\n\t\t\t\ts.Longest = max(s.Longest, lineLen)\n\t\t\t}\n\t\t\treturn s, nil\n\t\t}\n\t}\n}\n\nfunc main() {\n\tfmt.Println(CountFast(strings.NewReader(\"one\\r\\ntwo\\n\" + strings.Repeat(\"x\", 100_000)))) // {3 100000} <nil>\n}\n```\n\n**Trade-off:** This version avoids the syscall overhead of many small reads by using a larger buffer, but is more complex and error-prone (manual handling of `\\r\\n`). The readable version is often fast enough; only profile before optimizing.\n\n### Review Checklist\n\n- \u2713 Handles lines longer than 64 KiB without error\n- \u2713 Correctly counts final unterminated lines\n- \u2713 Distinguishes `\\n` and `\\r\\n` terminators\n- \u2713 Does not include terminators in `Longest`\n- \u2713 Uses fixed memory, not proportional to file size\n- \u2713 Propagates read errors correctly\n- \u2713 Tests verify edge cases: empty input, single newline, CRLF, unterminated final line\n\n## Exercise 3: csvjson\n\n### Readable Solution\n\n```go\nimport \"gocourse/solutions/05-io/exercises/csvjson\"\n\nvar (\n\tErrNoHeader  = csvjson.ErrNoHeader\n\tErrBadHeader = csvjson.ErrBadHeader\n)\n\nfunc Convert(dst io.Writer, src io.Reader) error {\n\tr := csv.NewReader(src)\n\n\t// Read and validate header\n\theader, err := r.Read()\n\tif err != nil {\n\t\tif errors.Is(err, io.EOF) {\n\t\t\treturn fmt.Errorf(\"%w: no header row\", ErrNoHeader)\n\t\t}\n\t\treturn fmt.Errorf(\"read header: %w\", err)\n\t}\n\n\t// Validate header\n\tseen := make(map[string]bool)\n\tfor i, name := range header {\n\t\tif name = strings.TrimSpace(name); name == \"\" {\n\t\t\treturn fmt.Errorf(\"%w: column %d is empty\", ErrBadHeader, i+1)\n\t\t}\n\t\tif seen[name] {\n\t\t\treturn fmt.Errorf(\"%w: column %q appears twice\", ErrBadHeader, name)\n\t\t}\n\t\tseen[name] = true\n\t\theader[i] = name\n\t}\n\n\tenc := json.NewEncoder(dst)\n\n\t// Read and encode data rows\n\tfor {\n\t\trecord, err := r.Read()\n\t\tif err != nil {\n\t\t\tif errors.Is(err, io.EOF) {\n\t\t\t\treturn nil\n\t\t\t}\n\t\t\treturn fmt.Errorf(\"read record: %w\", err)\n\t\t}\n\n\t\tobj := make(map[string]string)\n\t\tfor i, val := range record {\n\t\t\tif i < len(header) {\n\t\t\t\tobj[header[i]] = val\n\t\t\t}\n\t\t}\n\t\tif err := enc.Encode(obj); err != nil {\n\t\t\treturn fmt.Errorf(\"encode record: %w\", err)\n\t\t}\n\t}\n}\n\nfunc main() {\n\terr := Convert(os.Stdout, strings.NewReader(\"name, age\\nAda,36\\nLinus,\\n\"))\n\tfmt.Println(err) // <nil>, after one JSON object per row\n\tfmt.Println(Convert(os.Stdout, strings.NewReader(\"a,a\\n1,2\\n\")))\n}\n```\n\nKey points:\n- Streams with `Reader.Read` in a loop, not `ReadAll`\n- Validates header before processing data\n- Wraps errors with context and original error type\n- Uses `json.Encoder` which appends newlines\n\n### Optimized Solution (fast.go)\n\nA faster variant might reuse the object map to reduce allocations:\n\n```go\nfunc Convert(dst io.Writer, src io.Reader) error {\n\tr := csv.NewReader(src)\n\n\t// Read the header (the readable version's validation is omitted here)\n\theader, err := r.Read()\n\tif err != nil {\n\t\treturn fmt.Errorf(\"read header: %w\", err)\n\t}\n\n\tenc := json.NewEncoder(dst)\n\tobj := make(map[string]string, len(header))\n\n\tfor {\n\t\trecord, err := r.Read()\n\t\tif err != nil {\n\t\t\tif errors.Is(err, io.EOF) {\n\t\t\t\treturn nil\n\t\t\t}\n\t\t\treturn fmt.Errorf(\"read record: %w\", err)\n\t\t}\n\n\t\t// Clear and reuse the map\n\t\tfor k := range obj {\n\t\t\tdelete(obj, k)\n\t\t}\n\t\tfor i, val := range record {\n\t\t\tif i < len(header) {\n\t\t\t\tobj[header[i]] = val\n\t\t\t}\n\t\t}\n\t\tif err := enc.Encode(obj); err != nil {\n\t\t\treturn fmt.Errorf(\"encode record: %w\", err)\n\t\t}\n\t}\n}\n\nfunc main() {\n\terr := Convert(os.Stdout, strings.NewReader(\"name,age\\nAda,36\\nLinus,54\\n\"))\n\tfmt.Println(err) // one JSON object per row, then <nil>\n}\n```\n\n**Trade-off:** Reusing the map reduces allocations significantly (measured 92% fewer allocs and 87% fewer bytes on go1.24.2 linux/amd64), but the readable version is simpler and the improvement is often not noticeable for small datasets. Profile before choosing.\n\n### Review Checklist\n\n- \u2713 Streams with `csv.Reader.Read`, not `ReadAll`\n- \u2713 Validates header: no empty names, no duplicates\n- \u2713 Wraps CSV parse errors preserving the `*csv.ParseError`\n- \u2713 Wraps `ErrNoHeader` and `ErrBadHeader` appropriately\n- \u2713 Outputs one JSON object per line with `enc.Encode`\n- \u2713 Handles empty input (returns `ErrNoHeader`)\n- \u2713 Handles blank input lines (CSV reader skips them)\n- \u2713 Strips BOM if present (set `r.FieldsPerRecord = -1`)\n- \u2713 Tests verify header validation (empty names, duplicates)\n- \u2713 Tests verify error wrapping (call `errors.As` to check type)\n\n## Exercise 4: tail\n\n### Readable Solution\n\nUses a ring buffer of strings:\n\n```go\nimport \"gocourse/solutions/05-io/exercises/tail\"\n\nconst MaxLineLength = tail.MaxLineLength\n\nfunc Tail(r io.Reader, n int) ([]string, error) {\n\tif n <= 0 {\n\t\treturn []string{}, nil\n\t}\n\n\tsc := bufio.NewScanner(r)\n\tsc.Buffer(make([]byte, 0, 64*1024), MaxLineLength)\n\n\tbuf := make([]string, n)\n\tidx := 0\n\tcount := 0\n\n\tfor sc.Scan() {\n\t\tbuf[idx] = sc.Text()\n\t\tidx = (idx + 1) % n\n\t\tcount++\n\t}\n\tif err := sc.Err(); err != nil {\n\t\tif err == bufio.ErrTooLong {\n\t\t\treturn nil, fmt.Errorf(\"line too long: %w\", err)\n\t\t}\n\t\treturn nil, err\n\t}\n\n\tif count == 0 {\n\t\treturn []string{}, nil\n\t}\n\n\t// Copy in order (oldest first)\n\tresult := make([]string, min(count, n))\n\tfor i := range result {\n\t\tresult[i] = buf[(idx+i)%n]\n\t}\n\treturn result, nil\n}\n\nfunc main() {\n\tfmt.Println(Tail(strings.NewReader(\"1\\n2\\n3\\n4\\n5\\n\"), 2)) // [4 5] <nil>\n}\n```\n\nThe ring buffer avoids allocating a huge slice upfront, and stores only the last n lines.\n\n### A Simpler Alternative\n\nAvoids allocating the full ring buffer upfront:\n\n```go\nimport \"gocourse/solutions/05-io/exercises/tail\"\n\nconst MaxLineLength = tail.MaxLineLength\n\nfunc Tail(r io.Reader, n int) ([]string, error) {\n\tif n <= 0 {\n\t\treturn []string{}, nil\n\t}\n\n\tsc := bufio.NewScanner(r)\n\tsc.Buffer(make([]byte, 0, 64*1024), MaxLineLength)\n\n\tbuf := make([]string, 0, min(n, 1000))  // start small\n\n\tfor sc.Scan() {\n\t\tbuf = append(buf, sc.Text())\n\t\tif len(buf) > n {\n\t\t\tbuf = buf[1:]  // trim oldest\n\t\t}\n\t}\n\tif err := sc.Err(); err != nil {\n\t\tif err == bufio.ErrTooLong {\n\t\t\treturn nil, fmt.Errorf(\"line too long: %w\", err)\n\t\t}\n\t\treturn nil, err\n\t}\n\n\treturn buf, nil\n}\n\nfunc main() {\n\tfmt.Println(Tail(strings.NewReader(\"1\\n2\\n3\\n4\\n5\\n\"), 2)) // [4 5] <nil>\n}\n```\n\n**Trade-off:** This is simpler and avoids modulo arithmetic, but with very large n it reallocates during append. The ring buffer is more memory-efficient for large n. For typical use (n \u2264 100), this simpler version is fine.\n\n### Review Checklist\n\n- \u2713 Returns the last n lines, oldest first\n- \u2713 Uses a ring buffer or similar fixed-memory structure for n <= limit\n- \u2713 Does not allocate based on n (e.g., no `make([]string, n)` if n is huge)\n- \u2713 Raises the scanner limit to handle long lines (with `sc.Buffer`)\n- \u2713 Returns error if any line exceeds `MaxLineLength`, wrapped with context\n- \u2713 Handles empty input (returns empty slice, not nil)\n- \u2713 Tests verify n > 0, n < file lines, n = 0, n < 0\n\n## Exercise 5: config\n\n### Readable Solution\n\n```go\n// ErrInvalid is wrapped by every validation error returned by Validate.\nvar ErrInvalid = errors.New(\"invalid config\")\n\n// Duration is a time.Duration that is written in JSON as a string such as\n// \"1m30s\" (see time.ParseDuration), instead of as an opaque nanosecond count.\ntype Duration time.Duration\n\n// Config is the service configuration.\ntype Config struct {\n\tName     string   `json:\"name\"`           // required, not blank\n\tListen   string   `json:\"listen\"`         // host:port, port 1-65535; default \":8080\"\n\tTimeout  Duration `json:\"timeout\"`        // > 0; default 30s\n\tMaxConns int      `json:\"max_conns\"`      // 1-10000; default 100\n\tTags     []string `json:\"tags,omitempty\"` // optional; no empty tags\n\tDebug    bool     `json:\"debug\"`          // default false\n}\n\nfunc (d *Duration) UnmarshalJSON(b []byte) error {\n\tvar s string\n\tif err := json.Unmarshal(b, &s); err != nil {\n\t\treturn fmt.Errorf(\"duration must be a string, not %T\", b)\n\t}\n\tdur, err := time.ParseDuration(s)\n\tif err != nil {\n\t\treturn fmt.Errorf(\"invalid duration %q: %w\", s, err)\n\t}\n\t*d = Duration(dur)\n\treturn nil\n}\n\nfunc (d Duration) MarshalJSON() ([]byte, error) {\n\treturn json.Marshal(time.Duration(d).String())\n}\n\nfunc Default() Config {\n\treturn Config{\n\t\tListen:   \":8080\",\n\t\tTimeout:  Duration(30 * time.Second),\n\t\tMaxConns: 100,\n\t}\n}\n\nfunc Load(r io.Reader) (Config, error) {\n\tcfg := Default()\n\tdec := json.NewDecoder(r)\n\tdec.DisallowUnknownFields()\n\tif err := dec.Decode(&cfg); err != nil {\n\t\treturn Config{}, fmt.Errorf(\"decode config: %w\", err)\n\t}\n\tif dec.More() {\n\t\treturn Config{}, errors.New(\"unexpected trailing data\")\n\t}\n\tif err := cfg.Validate(); err != nil {\n\t\treturn Config{}, err\n\t}\n\treturn cfg, nil\n}\n\nfunc LoadFile(path string) (Config, error) {\n\tf, err := os.Open(path)\n\tif err != nil {\n\t\treturn Config{}, fmt.Errorf(\"open %s: %w\", path, err)\n\t}\n\tdefer f.Close()\n\tcfg, err := Load(f)\n\tif err != nil {\n\t\treturn Config{}, fmt.Errorf(\"%s: %w\", path, err)\n\t}\n\treturn cfg, nil\n}\n\nfunc (c Config) Validate() error {\n\tvar errs []error\n\n\tif strings.TrimSpace(c.Name) == \"\" {\n\t\terrs = append(errs, fmt.Errorf(\"name: %w\", ErrInvalid))\n\t}\n\n\tif c.Listen == \"\" {\n\t\terrs = append(errs, fmt.Errorf(\"listen: %w\", ErrInvalid))\n\t} else {\n\t\t_, port, err := net.SplitHostPort(c.Listen)\n\t\tif err != nil {\n\t\t\terrs = append(errs, fmt.Errorf(\"listen: invalid format: %w\", ErrInvalid))\n\t\t} else {\n\t\t\tportNum, err := strconv.Atoi(port)\n\t\t\tif err != nil || portNum < 1 || portNum > 65535 {\n\t\t\t\terrs = append(errs, fmt.Errorf(\"listen: port out of range: %w\", ErrInvalid))\n\t\t\t}\n\t\t}\n\t}\n\n\tif c.Timeout <= 0 {\n\t\terrs = append(errs, fmt.Errorf(\"timeout: must be positive: %w\", ErrInvalid))\n\t}\n\n\tif c.MaxConns < 1 || c.MaxConns > 10000 {\n\t\terrs = append(errs, fmt.Errorf(\"max_conns: out of range: %w\", ErrInvalid))\n\t}\n\n\tfor i, tag := range c.Tags {\n\t\tif strings.TrimSpace(tag) == \"\" {\n\t\t\terrs = append(errs, fmt.Errorf(\"tags[%d]: empty: %w\", i, ErrInvalid))\n\t\t}\n\t}\n\n\tif len(errs) > 0 {\n\t\treturn errors.Join(errs...)\n\t}\n\treturn nil\n}\n\nfunc main() {\n\tcfg, err := Load(strings.NewReader(`{\"name\": \"api\", \"listen\": \":9000\", \"timeout\": \"5s\"}`))\n\tfmt.Printf(\"%+v %v\\n\", cfg, err)\n\t_, err = Load(strings.NewReader(`{\"name\": \"\", \"listen\": \"nope\", \"timeout\": \"-1s\"}`))\n\tfmt.Println(err)\n}\n```\n\nKey points:\n- `Default()` populates all default values\n- `Load()` starts with `Default()` so absent fields keep defaults\n- `DisallowUnknownFields()` catches typos\n- `Validate()` joins all errors, not just the first\n- Each error wraps `ErrInvalid` so callers can use `errors.Is`\n\n### Optimized Solution\n\nThe readable solution is already quite good. A minor optimization is to avoid creating []string with make for Tags when not needed, but that's micro-optimization territory.\n\n### Review Checklist\n\n- \u2713 `Default()` returns correct defaults: `Listen: \":8080\"`, `Timeout: 30s`, `MaxConns: 100`\n- \u2713 `Load()` uses `Default()` as starting point\n- \u2713 Explicit zeros in JSON (e.g., `\"max_conns\": 0`) override defaults and are validated\n- \u2713 `DisallowUnknownFields()` rejects unknown keys\n- \u2713 Trailing junk after the JSON object is detected\n- \u2713 Custom `Duration` type uses `json.Unmarshaler` correctly\n- \u2713 `Validate()` reports ALL errors with `errors.Join`, not just first\n- \u2713 Each validation error wraps `ErrInvalid`\n- \u2713 `Listen` validation uses `net.SplitHostPort` and checks port range\n- \u2713 `Timeout` must be > 0, not >= 0\n- \u2713 `MaxConns` range is 1\u201310000\n- \u2713 `Tags` with empty strings are rejected (with index, e.g., `tags[1]`)\n- \u2713 `LoadFile()` adds the path to error messages\n- \u2713 Tests verify `errors.As(err, new(*json.UnmarshalTypeError))` for wrong types\n- \u2713 Tests verify `errors.As(err, new(*json.SyntaxError))` for bad JSON\n\n## Project: Log Analyzer\n\n### Readable Solution (Parse)\n\n```go\nimport \"gocourse/solutions/05-io/project/loganalyzer\"\n\ntype LogEntry = loganalyzer.LogEntry\n\n// Parse decodes one line of Apache Combined Log Format.\n// The format is: IP IDENT USERID [TIMESTAMP] \"METHOD PATH HTTP/VERSION\" STATUS BYTES LATENCY\nfunc Parse(line string) (*LogEntry, error) {\n\t// Find timestamp brackets\n\tbracketStart := strings.IndexByte(line, '[')\n\tif bracketStart == -1 {\n\t\treturn nil, errors.New(\"parse: missing timestamp bracket\")\n\t}\n\tbracketEnd := strings.IndexByte(line[bracketStart:], ']')\n\tif bracketEnd == -1 {\n\t\treturn nil, errors.New(\"parse: missing closing timestamp bracket\")\n\t}\n\tbracketEnd += bracketStart\n\n\t// Find quoted request line\n\tquoteStart := strings.IndexByte(line[bracketEnd:], '\"')\n\tif quoteStart == -1 {\n\t\treturn nil, errors.New(\"parse: missing request line quote\")\n\t}\n\tquoteStart += bracketEnd\n\tquoteEnd := strings.IndexByte(line[quoteStart+1:], '\"')\n\tif quoteEnd == -1 {\n\t\treturn nil, errors.New(\"parse: missing closing request line quote\")\n\t}\n\tquoteEnd += quoteStart + 1\n\n\t// Parse IP and user info\n\tbeforeTS := strings.Fields(line[:bracketStart])\n\tif len(beforeTS) < 3 {\n\t\treturn nil, errors.New(\"parse: not enough fields before timestamp\")\n\t}\n\n\tip := beforeTS[0]\n\tuserid := beforeTS[2]\n\tif userid == \"-\" {\n\t\tuserid = \"\"\n\t}\n\n\t// Parse timestamp\n\ttsStr := line[bracketStart+1 : bracketEnd]\n\tts, err := time.Parse(\"02/Jan/2006:15:04:05 -0700\", tsStr)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"parse timestamp %q: %w\", tsStr, err)\n\t}\n\n\t// Parse request line\n\treqStr := line[quoteStart+1 : quoteEnd]\n\treqParts := strings.Fields(reqStr)\n\tif len(reqParts) != 3 {\n\t\treturn nil, fmt.Errorf(\"parse: malformed request line %q\", reqStr)\n\t}\n\n\tmethod := reqParts[0]\n\tpathWithQuery := reqParts[1]\n\tpath, _, _ := strings.Cut(pathWithQuery, \"?\")\n\n\t// Parse status, bytes, latency\n\tafterReq := strings.Fields(line[quoteEnd+1:])\n\tif len(afterReq) < 3 {\n\t\treturn nil, errors.New(\"parse: not enough fields after request\")\n\t}\n\n\tstatus, err := strconv.Atoi(afterReq[0])\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"parse status %q: %w\", afterReq[0], err)\n\t}\n\n\tvar bytes int64\n\tif afterReq[1] != \"-\" {\n\t\tb, err := strconv.ParseInt(afterReq[1], 10, 64)\n\t\tif err != nil {\n\t\t\treturn nil, fmt.Errorf(\"parse bytes %q: %w\", afterReq[1], err)\n\t\t}\n\t\tbytes = b\n\t}\n\n\tlatencyFloat, err := strconv.ParseFloat(afterReq[2], 64)\n\tif err != nil {\n\t\treturn nil, fmt.Errorf(\"parse latency %q: %w\", afterReq[2], err)\n\t}\n\tlatency := time.Duration(latencyFloat * float64(time.Second))\n\n\treturn &LogEntry{\n\t\tIP:        ip,\n\t\tUserID:    userid,\n\t\tTimestamp: ts,\n\t\tMethod:    method,\n\t\tPath:      path,\n\t\tStatus:    status,\n\t\tBytes:     bytes,\n\t\tLatency:   latency,\n\t}, nil\n}\n\nfunc main() {\n\te, err := Parse(`10.0.0.3 - ada [11/Oct/2026:13:00:01 +0000] \"GET /api/items?page=2 HTTP/1.1\" 200 512 0.120`)\n\tfmt.Printf(\"%+v %v\\n\", *e, err)\n}\n```\n\nThis is a bit verbose because of the bracket and quote handling, but it's clear and robust.\n\n### Analyzer\n\n```go\nimport \"gocourse/solutions/05-io/project/loganalyzer\"\n\ntype (\n\tStatusCount  = loganalyzer.StatusCount\n\tPathCount    = loganalyzer.PathCount\n\tLatencyStats = loganalyzer.LatencyStats\n)\n\nvar Parse = loganalyzer.Parse\n\ntype Analyzer struct {\n\tstatusCounts map[int]int\n\tpathCounts   map[string]int\n\tlatencies    []time.Duration\n}\n\nfunc NewAnalyzer() *Analyzer {\n\treturn &Analyzer{\n\t\tstatusCounts: make(map[int]int),\n\t\tpathCounts:   make(map[string]int),\n\t\tlatencies:    []time.Duration{},\n\t}\n}\n\nfunc (a *Analyzer) ProcessLine(line string) error {\n\tentry, err := Parse(line)\n\tif err != nil {\n\t\treturn err\n\t}\n\ta.statusCounts[entry.Status]++\n\ta.pathCounts[entry.Path]++\n\ta.latencies = append(a.latencies, entry.Latency)\n\treturn nil\n}\n\nfunc (a *Analyzer) StatusCounts() []StatusCount {\n\tvar counts []StatusCount\n\tfor status, count := range a.statusCounts {\n\t\tcounts = append(counts, StatusCount{Status: status, Count: count})\n\t}\n\tslices.SortFunc(counts, func(a, b StatusCount) int {\n\t\treturn b.Count - a.Count\n\t})\n\treturn counts\n}\n\nfunc (a *Analyzer) TopPaths(n int) []PathCount {\n\tif n <= 0 {\n\t\treturn []PathCount{}\n\t}\n\tvar paths []PathCount\n\tfor path, count := range a.pathCounts {\n\t\tpaths = append(paths, PathCount{Path: path, Count: count})\n\t}\n\tslices.SortFunc(paths, func(a, b PathCount) int {\n\t\treturn b.Count - a.Count\n\t})\n\tif n < len(paths) {\n\t\tpaths = paths[:n]\n\t}\n\treturn paths\n}\n\nfunc (a *Analyzer) Latency() LatencyStats {\n\tif len(a.latencies) == 0 {\n\t\treturn LatencyStats{}\n\t}\n\tslices.Sort(a.latencies)\n\tn := len(a.latencies)\n\treturn LatencyStats{\n\t\tP50: a.latencies[(n-1)*50/100],\n\t\tP95: a.latencies[(n-1)*95/100],\n\t\tMax: a.latencies[n-1],\n\t}\n}\n\nvar lines = []string{\n\t`10.0.0.2 - - [11/Oct/2026:13:00:00 +0000] \"GET /api/items/7 HTTP/1.1\" 200 1024 0.034`,\n\t`10.0.0.3 - ada [11/Oct/2026:13:00:01 +0000] \"GET /api/items?page=2 HTTP/1.1\" 200 512 0.120`,\n\t`10.0.0.2 - - [11/Oct/2026:13:00:02 +0000] \"POST /api/items HTTP/1.1\" 500 - 1.500`,\n\t`not a log line`,\n}\n\nfunc main() {\n\ta := NewAnalyzer()\n\tfor _, line := range lines {\n\t\tif err := a.ProcessLine(line); err != nil {\n\t\t\tfmt.Println(\"skipped:\", err)\n\t\t}\n\t}\n\tfmt.Println(a.StatusCounts(), a.TopPaths(1))\n\tfmt.Printf(\"%+v\\n\", a.Latency())\n}\n```\n\n### CLI (main.go)\n\n```go\nimport \"gocourse/solutions/05-io/project/loganalyzer\"\n\nfunc run(args []string, stdin io.Reader, stdout, stderr io.Writer) error {\n\tfs := flag.NewFlagSet(\"loganalyzer\", flag.ContinueOnError)\n\tfs.SetOutput(stderr)\n\tformat := fs.String(\"format\", \"text\", \"output format (text or json)\")\n\ttop := fs.Int(\"top\", 10, \"number of top paths\")\n\tif err := fs.Parse(args); err != nil {\n\t\treturn err\n\t}\n\n\tvar input io.Reader = stdin\n\tif len(fs.Args()) > 0 {\n\t\tfilename := fs.Args()[0]\n\t\tif filename != \"-\" {\n\t\t\tf, err := os.Open(filename)\n\t\t\tif err != nil {\n\t\t\t\treturn fmt.Errorf(\"open %s: %w\", filename, err)\n\t\t\t}\n\t\t\tdefer f.Close()\n\t\t\tinput = f\n\t\t}\n\t}\n\n\ta := loganalyzer.NewAnalyzer()\n\tsc := bufio.NewScanner(input)\n\tfor sc.Scan() {\n\t\tif err := a.ProcessLine(sc.Text()); err != nil {\n\t\t\tfmt.Fprintf(stderr, \"parse error: %v\\n\", err)\n\t\t}\n\t}\n\tif err := sc.Err(); err != nil {\n\t\treturn fmt.Errorf(\"read error: %w\", err)\n\t}\n\n\tswitch *format {\n\tcase \"text\":\n\t\treturn outputText(stdout, a, *top)\n\tcase \"json\":\n\t\treturn outputJSON(stdout, a, *top)\n\tdefault:\n\t\treturn fmt.Errorf(\"unknown format: %s\", *format)\n\t}\n}\n\nfunc outputText(w io.Writer, a *loganalyzer.Analyzer, top int) error {\n\tfmt.Fprintf(w, \"Status Codes:\\n\")\n\tfor _, sc := range a.StatusCounts() {\n\t\tfmt.Fprintf(w, \"  %d: %d\\n\", sc.Status, sc.Count)\n\t}\n\n\tfmt.Fprintf(w, \"\\nTop Paths:\\n\")\n\tfor _, pc := range a.TopPaths(top) {\n\t\tfmt.Fprintf(w, \"  %s: %d\\n\", pc.Path, pc.Count)\n\t}\n\n\tlat := a.Latency()\n\tfmt.Fprintf(w, \"\\nLatency:\\n\")\n\tfmt.Fprintf(w, \"  p50: %v\\n\", lat.P50)\n\tfmt.Fprintf(w, \"  p95: %v\\n\", lat.P95)\n\tfmt.Fprintf(w, \"  max: %v\\n\", lat.Max)\n\n\treturn nil\n}\n\nfunc outputJSON(w io.Writer, a *loganalyzer.Analyzer, top int) error {\n\tout := jsonOutput{\n\t\tStatusCodes: make([]statusCodeJSON, 0),\n\t\tTopPaths:    make([]topPathJSON, 0),\n\t}\n\n\tfor _, sc := range a.StatusCounts() {\n\t\tout.StatusCodes = append(out.StatusCodes, statusCodeJSON{Status: sc.Status, Count: sc.Count})\n\t}\n\n\tfor _, pc := range a.TopPaths(top) {\n\t\tout.TopPaths = append(out.TopPaths, topPathJSON{Path: pc.Path, Count: pc.Count})\n\t}\n\n\tlat := a.Latency()\n\tout.Latency = latencyJSON{\n\t\tP50Ms: int64(lat.P50.Milliseconds()),\n\t\tP95Ms: int64(lat.P95.Milliseconds()),\n\t\tMaxMs: int64(lat.Max.Milliseconds()),\n\t}\n\n\tenc := json.NewEncoder(w)\n\tenc.SetIndent(\"\", \"  \")\n\treturn enc.Encode(out)\n}\n\n// The JSON output types, from cmd/loganalyzer/main.go:\n\n// These helper types are for JSON marshaling\ntype jsonOutput struct {\n\tStatusCodes []statusCodeJSON `json:\"status_codes\"`\n\tTopPaths    []topPathJSON    `json:\"top_paths\"`\n\tLatency     latencyJSON      `json:\"latency\"`\n}\n\ntype statusCodeJSON struct {\n\tStatus int `json:\"status\"`\n\tCount  int `json:\"count\"`\n}\n\ntype topPathJSON struct {\n\tPath  string `json:\"path\"`\n\tCount int    `json:\"count\"`\n}\n\ntype latencyJSON struct {\n\tP50Ms int64 `json:\"p50_ms\"`\n\tP95Ms int64 `json:\"p95_ms\"`\n\tMaxMs int64 `json:\"max_ms\"`\n}\n\nfunc main() {\n\tlogs := `10.0.0.2 - - [11/Oct/2026:13:00:00 +0000] \"GET /api/items/7 HTTP/1.1\" 200 1024 0.034\n10.0.0.2 - - [11/Oct/2026:13:00:02 +0000] \"POST /api/items HTTP/1.1\" 500 - 1.500\n`\n\tif err := run([]string{\"-top\", \"1\"}, strings.NewReader(logs), os.Stdout, os.Stderr); err != nil {\n\t\tfmt.Println(err)\n\t}\n}\n```\n\n### Review Checklist\n\n- \u2713 `Parse` handles Apache Combined Log Format correctly\n- \u2713 Extracts path without query string\n- \u2713 Parses timestamp with time zone\n- \u2713 Handles `-` for missing userid and bytes\n- \u2713 Converts latency (seconds as float) to `time.Duration`\n- \u2713 Returns errors with context for malformed lines\n- \u2713 `Analyzer` streams logs, not loading all into memory\n- \u2713 `ProcessLine` skips errors (with stderr warning) and continues\n- \u2713 `StatusCounts` and `TopPaths` sorted by count descending\n- \u2713 `Latency` computes p50, p95 correctly from sorted latencies\n- \u2713 CLI reads from file or stdin (`-` or omitted)\n- \u2713 CLI supports `-format text|json` and `-top N`\n- \u2713 Text output is readable with section headers\n- \u2713 JSON output has correct structure with millisecond latencies\n- \u2713 Tests include edge cases (empty input, malformed lines, large n)\n- \u2713 Tests verify that malformed lines are skipped (not crashing)\n- \u2713 Integration test processes provided testdata\n\n## Common Mistakes (Cross-Exercise)\n\n1. **Ignoring n in `Read` when err != nil:** Many students forget that `Read` can return both data and an error. They need to process the n bytes even if err != nil.\n\n2. **Not checking `sc.Err()` after Scanner loop:** This is the classic mistake. The scanner silently stops at 64 KiB without checking `sc.Err()`.\n\n3. **Using `io.ReadAll` on untrusted input:** Students should limit input size with `io.LimitReader`.\n\n4. **Forgetting to check Close/Flush errors on writers:** Data may only hit disk/network on Close, so the error is important.\n\n5. **Buffering entire logs when asked to stream:** For the Log Analyzer, storing all log entries is wrong. Aggregating statistics incrementally is the point.\n\n6. **Mishandling JSON unmarshaling errors:** Not preserving the original error type (e.g., `*json.SyntaxError`) so callers can't use `errors.As`.\n\n7. **Not handling case-insensitive JSON field matching:** Students assume JSON keys are case-sensitive and are surprised when `\"NAME\": \"x\"` matches a `Name` field.\n\n8. **Using `nil` maps or slices:** Several exercises involve maps or slices that must be initialized.\n\n## Grading Scale\n\nFor each exercise, award full credit if:\n- The implementation correctly solves the stated problem\n- Tests pass (including edge cases)\n- Code is gofmt-clean and passes go vet\n- Error handling is idiomatic (wrapping with %w, checking all errors)\n- No unnecessary allocations or buffering\n\nDeduct points for:\n- Off-by-one errors in percentile calculation (-10%)\n- Not streaming (loading whole file into memory) (-20%)\n- Ignoring errors (-15% per error)\n- Not checking sc.Err() (-20%)\n- Buffered output not flushed (-10%)\n", "solDir": "/home/csmith/Workspace/tools/go-course/solutions/05-io", "dir": "/home/csmith/Workspace/tools/go-course/modules/05-io"}, {"slug": "06-generics", "compose": "modules/06-generics/compose.yaml", "services": ["test", "vet", "bench", "cover", "shell", "solutions"], "title": "Module 06: Generics & Iterators", "lesson": "# Module 06: Generics & Iterators\n\nGo went ten years without generics, and the language still leans hard on interfaces\nand plain loops. When generics arrived in Go 1.18 they were deliberately small: type\nparameters on functions and types, constraints written as interfaces, and not much\nmore. Go 1.23 added **range-over-func iterators**, which let you write lazy sequences\nthat work in an ordinary `for ... range` loop.\n\nThis module covers both features, and also teaches you when to leave them alone.\n\n> **Version note.** This course pins Go 1.24, and all code here compiles with it. The\n> current release (October 2026) is Go 1.27, which added some generics features (see\n> [What changed after 1.24](#what-changed-after-124)). They are mentioned where\n> relevant but never used.\n\n---\n\n## 1. Goals\n\nAfter this module you will be able to:\n\n- write generic functions and types with type parameters, and read signatures like\n  `func Map[S ~[]E, E, R any](s S, f func(E) R) []R` fluently;\n- choose the right constraint: `any`, `comparable`, `cmp.Ordered`, or your own union\n  with `~`;\n- predict when type inference works and when you have to write type arguments;\n- recognise when an interface or a plain function is a better tool than a type\n  parameter;\n- write correct `iter.Seq` / `iter.Seq2` iterators that stop when the consumer stops,\n  and compose them into lazy pipelines;\n- use the iterator-aware standard library: `slices.Collect`, `slices.Sorted`,\n  `slices.Values`, `maps.Keys`, `maps.Values` and `maps.All`.\n\n---\n\n## 2. Concepts\n\n### 2.1 The problem generics solve\n\nBefore Go 1.18, writing \"the same function for several types\" meant choosing between\nthree options, all bad:\n\n```go\n// 1. Copy and paste.\nfunc SumInts(xs []int) int {\n\ttotal := 0\n\tfor _, x := range xs {\n\t\ttotal += x\n\t}\n\treturn total\n}\n\nfunc SumFloats(xs []float64) float64 { // the same body again, with float64\n\ttotal := 0.0\n\tfor _, x := range xs {\n\t\ttotal += x\n\t}\n\treturn total\n}\n\n// 2. interface{} plus type assertions: no compile-time safety, allocations for boxing.\nfunc SumAny(xs []interface{}) interface{} {\n\ttotal := 0\n\tfor _, x := range xs {\n\t\ttotal += x.(int) // panics on anything that isn't an int\n\t}\n\treturn total\n}\n\n// 3. Reflection: slow, and errors appear at run time.\nfunc SumReflect(xs interface{}) interface{} {\n\tv := reflect.ValueOf(xs)\n\ttotal := 0.0\n\tfor i := range v.Len() {\n\t\ttotal += v.Index(i).Convert(reflect.TypeOf(0.0)).Float()\n\t}\n\treturn total\n}\n\nfmt.Println(SumInts([]int{1, 2}), SumFloats([]float64{1.5}))\nfmt.Println(SumAny([]interface{}{1, 2}))      // 3, but SumAny([]interface{}{\"x\"}) would panic\nfmt.Println(SumReflect([]int{1, 2, 3}))       // 6, as a float64 inside an interface{}\n```\n\nA **type parameter** lets you write the function once and have the compiler check\nevery use:\n\n```go\nfunc Sum[T int | float64](xs []T) T {\n\tvar total T\n\tfor _, x := range xs {\n\t\ttotal += x\n\t}\n\treturn total\n}\n\nfmt.Println(Sum([]int{1, 2, 3}))      // 6, T = int\nfmt.Println(Sum([]float64{1.5, 2.5})) // 4, T = float64\n// Sum([]string{\"a\"})                 // compile error: string does not satisfy int | float64 (uncomment to see)\n```\n\n### 2.2 Anatomy of a type parameter list\n\n```go\nfunc Map[S ~[]E, E, R any](s S, f func(E) R) []R {\n\t//  \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\t//   type parameters, each with a constraint\n\tout := make([]R, 0, len(s))\n\tfor _, v := range s {\n\t\tout = append(out, f(v))\n\t}\n\treturn out\n}\n\nfmt.Printf(\"%q\\n\", Map([]int{1, 2, 3}, strconv.Itoa)) // [\"1\" \"2\" \"3\"]\n```\n\n- The list sits in **square brackets** between the name and the ordinary parameters.\n- Each type parameter has a **constraint**, which is an interface type. Adjacent\n  parameters can share one: `E, R any` means both `E` and `R` are constrained by `any`.\n- Parameters can refer to each other. `S ~[]E` says \"S is any type whose underlying\n  type is a slice of E\".\n\nCalling a generic function **instantiates** it: the compiler substitutes concrete type\narguments, checks they satisfy the constraints, and then type-checks the body as if\nyou had written that version by hand. You can instantiate explicitly\n(`Map[[]int, int, string](xs, strconv.Itoa)`), but you rarely need to.\n\n### 2.3 Constraints are interfaces (with type sets)\n\nThe Go spec defines an interface by its **type set**: the set of types that implement\nit. For an ordinary method interface like `io.Reader`, that's every type with a\n`Read` method. Since 1.18, an interface can also list types directly:\n\n```go\ntype Integer interface {\n\t~int | ~int8 | ~int16 | ~int32 | ~int64 |\n\t\t~uint | ~uint8 | ~uint16 | ~uint32 | ~uint64 | ~uintptr\n}\n\ntype Float interface{ ~float32 | ~float64 }\n\ntype Number interface{ Integer | Float } // the union of two type sets\n\nfunc Sum[T Number](xs ...T) T {\n\tvar total T\n\tfor _, x := range xs {\n\t\ttotal += x\n\t}\n\treturn total\n}\n\ntype Celsius float64\n\nfmt.Println(Sum(1, 2, 3), Sum[uint8](200, 50), Sum(Celsius(1.5), 2)) // 6 250 3.5\n```\n\nThe constraint does two jobs at once:\n\n1. **It restricts callers.** Only types in the set can be type arguments.\n2. **It gives the body permissions.** An operation is allowed on a `T` only if it's\n   valid for *every* type in `T`'s type set. `+` works on every `Number`, so\n   `total += x` compiles. `%` doesn't work on floats, so `x % 2` fails for a `Number`,\n   but it would compile for an `Integer`.\n\nInterfaces with type elements (`int | float64`, `~string`) are **constraints only**.\nYou can't declare a variable of such a type:\n\n```go expect=compile-error\ntype Number interface{ ~int | ~float64 }\n\nvar n Number // cannot use type Number outside a type constraint: interface contains type constraints\n```\n\n#### Built-in and standard constraints\n\n| Constraint | Type set | Lets you |\n|---|---|---|\n| `any` | every type (alias for `interface{}`) | assign, pass around, take address, declare `var zero T`. **Not** `==`. |\n| `comparable` | types that support `==` and `!=` | use `==`, use `T` as a map key |\n| `cmp.Ordered` (Go 1.21) | all integer, float and string types (with `~`) | `<`, `<=`, `>`, `>=`, and `min`/`max` builtins |\n| `fmt.Stringer` (or any method interface) | types with that method | call the method |\n\nTry `==` under `any` and you get:\n\n```go expect=compile-error\nfunc Eq[T any](a, b T) bool { return a == b }\n// invalid operation: a == b (incomparable types in type set)\n```\n\nThat error is correct: slices, maps and funcs are in `any`'s type set and can't be\ncompared. Use `comparable` instead.\n\n> `golang.org/x/exp/constraints` (with `constraints.Ordered`, `constraints.Integer`) is\n> not in the standard library. Use `cmp.Ordered`, or write a small union as shown\n> above. Don't add a dependency for one line of code.\n\n#### The tilde: `~T` means \"underlying type T\"\n\nGo programs are full of named types: `type Celsius float64`,\n`type Duration int64`, `type UserID string`. Without the `~`, a constraint matches\n**only** the exact type:\n\n```go expect=compile-error\ntype Celsius float64\n\nfunc Sum[T int | float64](xs ...T) T {\n\tvar total T\n\tfor _, x := range xs {\n\t\ttotal += x\n\t}\n\treturn total\n}\n\nfunc main() {\n\tSum(Celsius(1), Celsius(2))\n\t// Celsius does not satisfy int | float64 (possibly missing ~ for float64 in int | float64)\n}\n```\n\n`~float64` means \"any type whose *underlying type* is `float64`\", which includes\n`Celsius`. Write `~` on every basic type in your own unions unless you have a specific\nreason not to. The standard library's `cmp.Ordered` does.\n\n### 2.4 Type inference\n\nYou almost never write type arguments, because the compiler infers them from the\nordinary arguments:\n\n```go\nfunc Map[S ~[]E, E, R any](s S, f func(E) R) []R {\n\tout := make([]R, 0, len(s))\n\tfor _, v := range s {\n\t\tout = append(out, f(v))\n\t}\n\treturn out\n}\n\nfmt.Printf(\"%q\\n\", Map([]int{1, 2}, strconv.Itoa)) // S=[]int, E=int (from S ~[]E), R=string (from f)\n```\n\nInference fails when a type parameter appears **only in the result** or in nothing at\nall:\n\n```go expect=compile-error\nfunc Zero[T any]() T { var z T; return z }\n\nfunc main() {\n\t_ = Zero[int]() // fine\n\t_ = Zero()      // in call to Zero, cannot infer T\n}\n```\n\nThis is why constructors of generic containers need explicit type arguments:\n`lru.New[string, int](100)`, `new(Set[int])`. It's also why `Of[int]()` (an empty\nvariadic call) needs one, while `Of(1, 2, 3)` doesn't.\n\nYou can supply a **prefix** of the type arguments and let inference fill in the rest:\n`Convert[float64](xs)` for `func Convert[To, From Number](xs []From) []To`. Order your\ntype parameters so that the ones callers must spell out come first.\n\n### 2.5 The `S ~[]E` pattern\n\nCompare two signatures for `Filter`:\n\n```go\nfunc Filter1[E any](s []E, keep func(E) bool) []E {\n\tvar out []E\n\tfor _, v := range s {\n\t\tif keep(v) {\n\t\t\tout = append(out, v)\n\t\t}\n\t}\n\treturn out\n}\n\nfunc Filter2[S ~[]E, E any](s S, keep func(E) bool) S {\n\tvar out S\n\tfor _, v := range s {\n\t\tif keep(v) {\n\t\t\tout = append(out, v)\n\t\t}\n\t}\n\treturn out\n}\n\ntype Names []string\n\nnames := Names{\"ada\", \"bob\", \"al\"}\nshort := func(s string) bool { return len(s) <= 2 }\nfmt.Printf(\"%T %T\\n\", Filter1(names, short), Filter2(names, short)) // []string main.Names\n```\n\nBoth accept a `Names` (where `type Names []string`). Only `Filter2` **returns** a\n`Names`. `Filter1` returns a plain `[]string`, so the caller loses the named type and\nany methods declared on it:\n\n```go expect=compile-error\nfunc Filter1[E any](s []E, keep func(E) bool) []E {\n\tvar out []E\n\tfor _, v := range s {\n\t\tif keep(v) {\n\t\t\tout = append(out, v)\n\t\t}\n\t}\n\treturn out\n}\n\nfunc Filter2[S ~[]E, E any](s S, keep func(E) bool) S {\n\tvar out S\n\tfor _, v := range s {\n\t\tif keep(v) {\n\t\t\tout = append(out, v)\n\t\t}\n\t}\n\treturn out\n}\n\ntype Names []string\n\nfunc (n Names) Join() string { return strings.Join(n, \", \") }\n\nfunc main() {\n\tnames := Names{\"ada\", \"bob\", \"al\"}\n\tkeep := func(s string) bool { return strings.HasPrefix(s, \"a\") }\n\tfmt.Println(Filter2(names, keep).Join()) // ok\n\tfmt.Println(Filter1(names, keep).Join()) // compile error: []string has no method Join\n}\n```\n\nEvery function in the `slices` package uses this pattern for that reason. Use it\nwhenever you return \"the same kind of slice you were given\".\n\n### 2.6 Generic types\n\nTypes can have type parameters too:\n\n```go\ntype Stack[T any] struct {\n\titems []T\n}\n\nfunc (s *Stack[T]) Push(v T) { s.items = append(s.items, v) }\n\nfunc (s *Stack[T]) Pop() (T, bool) {\n\tvar zero T // the zero value of whatever T is\n\tif len(s.items) == 0 {\n\t\treturn zero, false\n\t}\n\tlast := len(s.items) - 1\n\tv := s.items[last]\n\ts.items[last] = zero // let the GC reclaim it if T holds pointers\n\ts.items = s.items[:last]\n\treturn v, true\n}\n\nvar s Stack[string] // instantiate when you name the type\ns.Push(\"hi\")\n\ns.Push(\"there\")\nv, ok := s.Pop()\nfmt.Println(v, ok) // there true\nv, ok = s.Pop()\nv2, ok2 := s.Pop() // empty: the zero value of string, and false\nfmt.Printf(\"%s %v %q %v\\n\", v, ok, v2, ok2) // hi true \"\" false\n```\n\nThings to notice:\n\n- In the method receiver you write `Stack[T]`, which re-declares the receiver's type\n  parameter names. You can't add constraints there; they come from the type\n  declaration.\n- **Methods cannot declare their own type parameters** in Go 1.24 (see\n  \u00a72.10). `func (s *Stack[T]) Map[U any](...)` is a compile error\n  (`method must have no type parameters`). Write a top-level function instead:\n  `func MapStack[T, U any](s *Stack[T], f func(T) U) *Stack[U]`.\n- A method can't *tighten* the receiver's constraint either. A `Set[T comparable]`\n  can't have a `Sorted()` method that needs `T cmp.Ordered`. That's why\n  `set.Sorted[T cmp.Ordered](s *Set[T]) []T` in Exercise 2 is a function.\n- `var zero T` is the idiomatic way to get a zero value. `*new(T)` also works but reads\n  worse.\n\n**Generic type aliases** have been fully supported since Go 1.24:\n`type Set[T comparable] = map[T]struct{}`. An alias is the *same* type, so it can't\nhave methods of its own. Most of the time you want a defined type\n(`type Set[T comparable] struct{...}` or `map[...]...`), which can.\n\n### 2.7 How generics are compiled (and why you shouldn't assume they're fast)\n\nGo doesn't create a separate copy of each generic function for every type argument,\nas C++ templates do. It uses **GC-shape stenciling with dictionaries**: one copy of\nthe code per \"GC shape\" (all pointer types share one shape), plus a hidden dictionary\nargument that describes the concrete types. Consequences:\n\n- Code size stays reasonable.\n- A generic function called with a pointer or interface type argument can be **slower**\n  than the equivalent interface-based code, because method calls go through the\n  dictionary and may not be inlined.\n- For value types like `int` and `float64` you typically get code as good as\n  handwritten code.\n\nUse generics for **type safety and to avoid duplication**. Don't use them for speed.\nIf speed matters, measure (module 09).\n\n### 2.8 When NOT to use generics\n\nIan Lance Taylor's rule ([When To Use Generics](https://go.dev/blog/when-generics)):\n*\"Write Go programs by writing code, not by defining types.\"* Start concrete. Reach for\ntype parameters when you notice you're writing the same code a second time and only\nthe types differ.\n\n**Good fits:**\n\n- functions over slices, maps and channels of any element type (`Map`, `Filter`,\n  `Keys`, `Merge`);\n- general-purpose containers: sets, stacks, queues, trees, caches, ring buffers;\n- the case where every type would share the *identical* implementation.\n\n**Poor fits:**\n\n```go\n// BAD: a type parameter whose only use is to call a method. An interface does the\n// same thing, more simply, and the caller can pass any io.Writer at run time.\nfunc WriteAllGeneric[W io.Writer](w W, data []byte) error { _, err := w.Write(data); return err }\n\n// GOOD\nfunc WriteAll(w io.Writer, data []byte) error { _, err := w.Write(data); return err }\n\nWriteAllGeneric(os.Stdout, []byte(\"same result\\n\"))\nWriteAll(os.Stdout, []byte(\"same result\\n\"))\n```\n\n- **You only call methods on the value.** Use an interface.\n- **The implementation differs per type.** Use an interface with per-type methods. If\n  you find yourself writing `switch any(v).(type)` inside a generic function, that's a\n  sign generics were the wrong choice.\n- **The operation is about the *structure* of arbitrary types** (encoding, deep\n  equality). That's reflection's job; see `encoding/json`.\n- **The standard library already has it.** Don't wrap `slices.Index`,\n  `slices.Contains`, `slices.SortFunc`, `slices.Max`, `maps.Clone` or `min`/`max`.\n\n### 2.9 Iterators: range over functions (Go 1.23)\n\n#### The shape\n\nAn iterator is just a function that takes a `yield` callback:\n\n```go\n// From package iter (Go 1.23):\n//\n//\ttype Seq[V any] func(yield func(V) bool)\n//\ttype Seq2[K, V any] func(yield func(K, V) bool)\n//\n// Any function with that shape is an iterator:\nvar letters iter.Seq[string] = func(yield func(string) bool) {\n\tfor _, s := range []string{\"a\", \"b\", \"c\"} {\n\t\tif !yield(s) {\n\t\t\treturn\n\t\t}\n\t}\n}\n\nvar indexed iter.Seq2[int, string] = func(yield func(int, string) bool) {\n\tfor i, s := range []string{\"x\", \"y\"} {\n\t\tif !yield(i, s) {\n\t\t\treturn\n\t\t}\n\t}\n}\n\nfor s := range letters {\n\tfmt.Print(s, \" \") // a b c\n}\nfor i, s := range indexed {\n\tfmt.Print(i, s, \" \") // 0x 1y\n}\nfmt.Println()\n```\n\nThe iterator calls `yield` once per element. `yield` returns `false` when the consumer\nwants to stop (the loop hit `break`, `return`, or a panic). Go 1.23 lets you `range`\nover such a function directly:\n\n```go\nfunc Countdown(n int) iter.Seq[int] {\n\treturn func(yield func(int) bool) {\n\t\tfor i := n; i > 0; i-- {\n\t\t\tif !yield(i) {\n\t\t\t\treturn // the consumer is done: stop immediately\n\t\t\t}\n\t\t}\n\t}\n}\n\nfor v := range Countdown(10) {\n\tif v < 8 {\n\t\tbreak\n\t}\n\tfmt.Println(v) // 10, 9, 8\n}\n```\n\nThe compiler rewrites the loop body into the `yield` function. `break` becomes\n`return false`, and `continue` becomes `return true`. A `return` from the enclosing\nfunction also works: the compiler records it, makes `yield` return `false`, and\ncompletes the return once the iterator has returned.\n\n#### The one rule\n\n> **When `yield` returns `false`, the iterator must return, and must never call\n> `yield` again.**\n\nBreak that rule and the program panics at run time:\n\n```go expect=runtime-error\nfunc bad() iter.Seq[int] {\n\treturn func(yield func(int) bool) {\n\t\tfor i := range 3 {\n\t\t\tyield(i) // result ignored\n\t\t}\n\t}\n}\n\nfor v := range bad() {\n\tif v == 1 {\n\t\tbreak\n\t}\n}\n// panic: runtime error: range function continued iteration after function for loop body returned false\n```\n\nEvery iterator you write should contain the `if !yield(v) { return }` line. If you\nhave nested loops, `return` (not `break`) is what you want.\n\n#### Push iterators are lazy and composable\n\nNothing runs until someone ranges over the sequence, and the iterator only produces\nas many values as the consumer asks for. That makes adapters cheap to stack:\n\n```go\nfunc Filter[T any](seq iter.Seq[T], keep func(T) bool) iter.Seq[T] {\n\treturn func(yield func(T) bool) {\n\t\tfor v := range seq {\n\t\t\tif keep(v) && !yield(v) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\n// Naturals yields 0, 1, 2, ... forever.\nfunc Naturals() iter.Seq[int] {\n\treturn func(yield func(int) bool) {\n\t\tfor i := 0; ; i++ {\n\t\t\tif !yield(i) {\n\t\t\t\treturn\n\t\t\t}\n\t\t}\n\t}\n}\n\nfunc isEven(n int) bool { return n%2 == 0 }\n\n// Even numbers from an infinite source: fine, because the consumer stops.\nfor v := range Filter(Naturals(), isEven) {\n\tif v > 10 {\n\t\tbreak\n\t}\n\tfmt.Print(v, \" \") // 0 2 4 6 8 10\n}\nfmt.Println()\n```\n\nWhen the outer consumer breaks, `yield` returns false in `Filter`. `Filter` returns\nfrom its `range seq` loop, and that loop's own `yield` returns false into `Naturals`,\nwhich returns too. The stop signal travels all the way back to the source.\n\n#### Iterators should be reusable\n\nAn `iter.Seq` is a value; callers may range over it more than once. Keep per-iteration\nstate (counters, cursors) **inside** the returned function, not in the enclosing one:\n\n```go\n// BAD: the counter is shared by every range over the returned Seq.\nfunc TakeBad[T any](seq iter.Seq[T], n int) iter.Seq[T] {\n\ttaken := 0\n\treturn func(yield func(T) bool) {\n\t\tfor v := range seq {\n\t\t\tif taken >= n || !yield(v) {\n\t\t\t\treturn\n\t\t\t}\n\t\t\ttaken++\n\t\t}\n\t}\n}\n\n// GOOD: each range starts fresh.\nfunc Take[T any](seq iter.Seq[T], n int) iter.Seq[T] {\n\treturn func(yield func(T) bool) {\n\t\ttaken := 0\n\t\tfor v := range seq {\n\t\t\tif taken >= n || !yield(v) {\n\t\t\t\treturn\n\t\t\t}\n\t\t\ttaken++\n\t\t}\n\t}\n}\n\nabc := slices.Values([]string{\"a\", \"b\", \"c\"})\nbad, good := TakeBad(abc, 2), Take(abc, 2)\nfmt.Println(slices.Collect(bad), slices.Collect(bad))   // [a b] []: the second range gets nothing\nfmt.Println(slices.Collect(good), slices.Collect(good)) // [a b] [a b]\n```\n\nSome sequences are inherently single-use, such as one that reads from a network\nstream. Document that when it's the case.\n\n#### Pull iterators\n\nSometimes you need to drive the iteration yourself, for example to walk two\nsequences in lockstep. `iter.Pull` converts a push iterator into a `next` function:\n\n```go\nseq := slices.Values([]string{\"a\", \"b\", \"c\"})\nother := slices.Values([]int{1, 2, 3})\n\nnext, stop := iter.Pull(seq)\ndefer stop() // always: releases the iterator's resources\n\n// Walk two sequences in lockstep: pull from seq while ranging over other.\nfor n := range other {\n\tv, ok := next()\n\tif !ok {\n\t\tbreak\n\t}\n\tfmt.Print(v, n, \" \") // a1 b2 c3\n}\nfmt.Println()\n```\n\n`Pull` runs the iterator in a separate coroutine, so it costs much more than ranging\nover the sequence. Use it only when push style genuinely can't express what you need.\n\n#### Iterators in the standard library\n\n| Function | Returns | Since |\n|---|---|---|\n| `slices.All(s)` | `iter.Seq2[int, E]` (index, value) | 1.23 |\n| `slices.Values(s)` | `iter.Seq[E]` | 1.23 |\n| `slices.Backward(s)` | `iter.Seq2[int, E]`, from the end | 1.23 |\n| `slices.Collect(seq)` | `[]E` (nil for an empty seq) | 1.23 |\n| `slices.AppendSeq(s, seq)` | `[]E` | 1.23 |\n| `slices.Sorted(seq)` / `SortedFunc` | sorted `[]E` | 1.23 |\n| `slices.Chunk(s, n)` | `iter.Seq[[]E]` | 1.23 |\n| `maps.Keys(m)` / `maps.Values(m)` | `iter.Seq[K]` / `iter.Seq[V]` (**not slices!**) | 1.23 |\n| `maps.All(m)` | `iter.Seq2[K, V]` | 1.23 |\n| `maps.Collect(seq2)` / `maps.Insert(m, seq2)` | build a map from a `Seq2` | 1.23 |\n| `strings.Lines`, `SplitSeq`, `FieldsSeq` (and `bytes.*`) | `iter.Seq[string]` | 1.24 |\n\nThe most common use, sorted map keys, is now one line:\n\n```go\nm := map[string]int{\"b\": 2, \"a\": 1, \"c\": 3}\nfor _, k := range slices.Sorted(maps.Keys(m)) {\n\tfmt.Println(k, m[k]) // a 1, b 2, c 3\n}\n```\n\n> `maps.Keys` returns an **iterator**, not a slice. Many blog posts from 2022 show\n> `golang.org/x/exp/maps.Keys`, which returned a slice. That version never made it into\n> the standard library, and the `maps` package in 1.21 had no `Keys` at all. If you see\n> `cannot use maps.Keys(m) (value of type iter.Seq[string]) as []string`, wrap it in\n> `slices.Collect` (or `slices.Sorted`).\n\n**Naming conventions** (from the standard library): a method that iterates over\neverything is called `All`. Variants are named after what they yield (`Keys`,\n`Values`, `Backward`). A function that returns an iterator version of an existing\nslice-returning function gets a `Seq` suffix (`strings.Split` \u2192 `strings.SplitSeq`).\n\n#### Iterators versus slices\n\nIterators aren't free. Each element is a call through a function value, and the\nclosures usually escape to the heap. A plain `for` loop over a slice is still the\nfastest thing in Go. In this module's solutions, a `Filter`\u2192`Map` iterator pipeline\nover 10,000 ints ran about **5x slower** than the equivalent hand-written loop (see\nthe `iterx` benchmark in the review notes). Use iterators when you need laziness\n(infinite or huge sources, early exit), when you need to expose a container's\ncontents without exposing its internals, or when composing would otherwise mean\nbuilding intermediate slices. Don't use them to replace every loop.\n\n### 2.10 What changed after 1.24\n\nYou'll meet these in newer codebases. Don't use them in this course.\n\n- **Go 1.26:** self-referential generic constraints, e.g.\n  `type Adder[A Adder[A]] interface{ Add(A) A }`.\n- **Go 1.27:** **generic methods**. A method can now declare its own type parameters,\n  so `func (l List[T]) Map[U any](f func(T) U) List[U]` compiles in Go 1.27+. (Interface\n  methods still can't have type parameters, so a generic method can't satisfy an\n  interface method.) Go 1.27 also generalised function type inference. With the\n  course's Go 1.24 toolchain, the top-level-function workaround from \u00a72.6 is still the\n  only option, and you'll see it throughout older code.\n\n---\n\n## 3. Idioms & Best Practices\n\n- **Start concrete, generalise on the second copy.**\n  ```go\n  // BAD: designed generic up front for one caller\n  //\n  //\ttype Repository[T Entity, ID comparable, Q Query[T]] interface { ... }\n  //\n  // GOOD: write UserStore. Make it generic if a second store turns out to be identical.\n  type User struct{ ID, Name string }\n\n  type UserStore struct{ users map[string]User }\n\n  func (s *UserStore) Get(id string) (User, bool) { u, ok := s.users[id]; return u, ok }\n\n  s := &UserStore{users: map[string]User{\"1\": {\"1\", \"Ada\"}}}\n  fmt.Println(s.Get(\"1\"))\n  ```\n\n- **Prefer the standard library's generic helpers to your own.**\n  ```go\n  xs, v := []string{\"go\", \"rust\"}, \"go\"\n\n  // BAD\n  func Contains[T comparable](xs []T, v T) bool {\n  \tfor _, x := range xs {\n  \t\tif x == v {\n  \t\t\treturn true\n  \t\t}\n  \t}\n  \treturn false\n  }\n\n  fmt.Println(Contains(xs, v))\n  // GOOD\n  fmt.Println(slices.Contains(xs, v))\n  ```\n\n- **Use `~` in your own unions.**\n  ```go\n  type NumberBad interface{ int | int64 | float64 } // BAD: rejects time.Duration, Celsius, ...\n  type Number interface{ ~int | ~int64 | ~float64 } // GOOD\n\n  func Double[T Number](x T) T { return x * 2 }\n\n  type Celsius float64\n\n  fmt.Println(Double(Celsius(21.5)), Double(3*time.Second)) // 43 6s\n  ```\n\n- **Use the weakest constraint that compiles.** `any` < `comparable` < `cmp.Ordered`.\n  A function that only stores values shouldn't demand `comparable`.\n\n- **Pass a function instead of requiring a method or a stronger constraint.** That's\n  why `slices.SortFunc` exists alongside `slices.Sort`.\n  ```go\n  func MaxBy[T any](xs []T, less func(a, b T) bool) T { // works for any T\n  \tbest := xs[0]\n  \tfor _, x := range xs[1:] {\n  \t\tif less(best, x) {\n  \t\t\tbest = x\n  \t\t}\n  \t}\n  \treturn best\n  }\n\n  type point struct{ X, Y int } // not ordered: no < on structs\n  far := MaxBy([]point{{1, 1}, {3, 4}, {2, 2}}, func(a, b point) bool {\n  \treturn a.X*a.X+a.Y*a.Y < b.X*b.X+b.Y*b.Y\n  })\n  fmt.Println(far) // {3 4}\n  ```\n\n- **Return the caller's slice type with `S ~[]E`.**\n  ```go\n  func FilterLoose[E any](s []E, f func(E) bool) []E { // loses named types\n  \tvar out []E\n  \tfor _, v := range s {\n  \t\tif f(v) {\n  \t\t\tout = append(out, v)\n  \t\t}\n  \t}\n  \treturn out\n  }\n\n  func Filter[S ~[]E, E any](s S, f func(E) bool) S { // GOOD\n  \tvar out S\n  \tfor _, v := range s {\n  \t\tif f(v) {\n  \t\t\tout = append(out, v)\n  \t\t}\n  \t}\n  \treturn out\n  }\n\n  type IDs []int\n  ids := IDs{1, 2, 3}\n  odd := func(n int) bool { return n%2 == 1 }\n  fmt.Printf(\"%T %T\\n\", FilterLoose(ids, odd), Filter(ids, odd)) // []int main.IDs\n  ```\n\n- **Make the zero value of generic containers useful.** Lazily `make` the map in `Add`\n  so that `var s Set[string]` just works, as `bytes.Buffer` and `sync.Mutex` do.\n\n- **Clear vacated slots in containers.**\n  ```go\n  type Stack[T any] struct{ items []T }\n\n  func (s *Stack[T]) PopLeaky() T {\n  \tv := s.items[len(s.items)-1]\n  \ts.items = s.items[:len(s.items)-1] // BAD: old value still referenced\n  \treturn v\n  }\n\n  func (s *Stack[T]) Pop() T {\n  \tlast := len(s.items) - 1\n  \tv := s.items[last]\n  \tvar zero T\n  \ts.items[last] = zero; s.items = s.items[:last] // GOOD\n  \treturn v\n  }\n\n  big := &Stack[*[1 << 20]byte]{}\n  big.items = append(big.items, new([1 << 20]byte), new([1 << 20]byte))\n  big.PopLeaky()\n  big.Pop()\n  fmt.Println(big.items[:2][1] != nil, big.items[:2][0] != nil) // true false: PopLeaky kept 1 MiB alive\n  ```\n\n- **Iterators: check `yield`'s result every time.** `if !yield(v) { return }`.\n\n- **Expose container contents with `All() iter.Seq[...]`** rather than returning the\n  internal slice or map, which callers could mutate, or copying everything into a new\n  slice.\n\n- **Use short type parameter names.** `T`, `K`, `V`, `E` (element), `S` (slice), `R`\n  (result). Use longer names only when a function has several unrelated parameters\n  and one-letter names would confuse.\n\n- **Don't put constraint interfaces where they'll be mistaken for ordinary\n  interfaces.** Name them for what they describe (`Number`, `Integer`) and keep them\n  near their uses.\n\n---\n\n## 4. Common Pitfalls\n\n1. **Forgetting `~`.** `Celsius does not satisfy int | float64 (possibly missing ~ for\n   float64 ...)`. The compiler error tells you what's wrong, but it's better to avoid\n   it in the first place.\n\n2. **Using `==` under `any`.** Switch the constraint to `comparable`.\n\n3. **`comparable` is satisfied by interface types, and `==` on them can panic.** Since\n   Go 1.20, `any` satisfies `comparable` ([blog](https://go.dev/blog/comparable)). So\n   this compiles, and panics at run time:\n   ```go expect=runtime-error\n   func Eq[T comparable](a, b T) bool { return a == b }\n   var x, y any = []int{1}, []int{1}\n   Eq(x, y) // panic: runtime error: comparing uncomparable type []int\n   ```\n   The same holds for a `map[any]V` or a `Set[any]`. If you key a set by `any`, every\n   element must have a comparable dynamic type.\n\n4. **Trying to add type parameters to a method.** In Go 1.24: `method must have no\n   type parameters`. Use a top-level function. (Go 1.27 lifted this, but this course\n   targets 1.24.)\n\n5. **Type-switching on a type parameter.** `switch v.(type)` with `v T` is rejected:\n   `cannot use type switch on type parameter value v`. `switch any(v).(type)` compiles,\n   but if you need it, an interface was probably the right tool.\n\n6. **Expecting inference from return types.** `Zero()` \u2192 `cannot infer T`. Write\n   `Zero[int]()`.\n\n7. **Treating `maps.Keys` as returning a slice.** It returns `iter.Seq[K]`. Wrap it:\n   `slices.Collect(maps.Keys(m))`, or `slices.Sorted(maps.Keys(m))` for deterministic\n   output.\n\n8. **Ignoring `yield`'s return value.** This triggers a runtime panic as soon as a\n   consumer breaks early. Tests that always consume the whole sequence won't catch it,\n   so always test an early `break`.\n\n9. **Iterator state outside the closure.** The second `range` over the same `Seq`\n   silently yields nothing (or continues from where the first left off).\n\n10. **`Filter` in place by accident.** `out := s[:0]` reuses the caller's backing\n    array and overwrites their data. That's fine when you own `s` (it's what\n    `slices.DeleteFunc` does), but it's a bug in a function documented as \"returns a\n    new slice\".\n\n11. **Holding on to popped values.** Reslicing `s[:n-1]` or `s[1:]` leaves the old\n    element reachable from the backing array, so the GC can't free whatever it points\n    to.\n\n12. **Overflow in generic arithmetic.** `Sum[uint8](200, 100)` is `44`. The type\n    parameter doesn't widen anything. If you need a wider accumulator, convert\n    explicitly (as `Mean` does with `float64(x)`).\n\n13. **NaN with ordered comparisons.** `cmp.Ordered` includes floats. `<` with a NaN is\n    always false, so hand-written `if a < b` comparisons give inconsistent orderings.\n    `cmp.Compare` and `cmp.Less` treat NaN as less than everything, which gives a\n    consistent order.\n\n---\n\n## 5. Exercises\n\nEach exercise is a package under `modules/06-generics/exercises/`. The tests are\ncomplete; make them pass without editing them. Run all of them at once with\n`go test ./modules/06-generics/exercises/...`.\n\n| # | Package | What you implement | Command |\n|---|---|---|---|\n| 1 | `funcs` | `Map`, `Filter`, `Reduce`, `GroupBy` over slices, using the `S ~[]E` pattern. `Filter` must not touch its input's backing array. | `go test ./modules/06-generics/exercises/funcs/` |\n| 2 | `set` | `Set[T comparable]` with a usable zero value, nil-safe reads, `Add`/`Remove`/`Contains`/`Len`, `Union`/`Intersect`/`Difference`, an `All() iter.Seq[T]` iterator, and a `Sorted` function (and an answer to why it isn't a method). | `go test ./modules/06-generics/exercises/set/` |\n| 3 | `stackqueue` | Generic `Stack[T]` and `Queue[T]` with `Push`/`Pop`/`Peek`/`Len`. Returning a zero value of `T`; not leaking popped values. | `go test ./modules/06-generics/exercises/stackqueue/` |\n| 4 | `numeric` | `Sum`, `SumBy`, `Mean`, `Clamp` over `Integer`/`Float`/`Number` constraints with `~`, plus `cmp.Ordered`. Start with the experiment in the package doc. | `go test ./modules/06-generics/exercises/numeric/` |\n| 5 | `iterx` | Lazy iterator adapters: `Naturals`, `Filter`, `Map`, `Take`, `Enumerate` (`iter.Seq2`). The tests check laziness, early stop and reusability. | `go test ./modules/06-generics/exercises/iterx/` |\n\nSuggested order: 1 \u2192 4 \u2192 3 \u2192 2 \u2192 5. Exercise 2 uses an iterator; read \u00a72.9 first.\n\nWhen a test fails, run it verbose for the full message, for example\n`go test -run TestTake -v ./modules/06-generics/exercises/iterx/`.\n\n---\n\n## 6. Project\n\n**Generic LRU Cache** (`modules/06-generics/project/`). Build\n`Cache[K comparable, V any]` with O(1) `Get`/`Put`/`Delete`, capacity-based eviction,\noptional TTL with an injectable clock, and an `All()` iterator in recency order. The\nspec, hints and stretch goals (including a zero-allocation version) are in\n[`project/README.md`](project/README.md). Run the tests with\n`go test ./modules/06-generics/project/`.\n\n---\n\n## 7. Submitting for Review\n\nWhen tests pass, ask your instructor (Claude) to review `modules/06-generics/`.\n\nBefore you ask, run:\n\n```sh\ngofmt -l modules/06-generics        # should print nothing\ngo vet ./modules/06-generics/...\ngo test ./modules/06-generics/...\n```\n\nThe review covers more than passing tests. It also looks at constraint choice,\nzero-value handling, iterator correctness, doc comments, and whether each type\nparameter earns its place.\n\n---\n\n## 8. Further Reading\n\n- [Tutorial: Getting started with generics](https://go.dev/doc/tutorial/generics)\n- [An Introduction To Generics](https://go.dev/blog/intro-generics), Robert Griesemer & Ian Lance Taylor\n- [When To Use Generics](https://go.dev/blog/when-generics), Ian Lance Taylor\n- [All your comparable types](https://go.dev/blog/comparable) covers why `any` satisfies `comparable` since 1.20\n- [Deconstructing Type Parameters](https://go.dev/blog/deconstructing-type-parameters) explains the `S ~[]E` pattern in `slices`\n- [Range Over Function Types](https://go.dev/blog/range-functions), Ian Lance Taylor\n- [What's in an (Alias) Name?](https://go.dev/blog/alias-names) covers generic type aliases\n- Go spec: [Type parameter declarations](https://go.dev/ref/spec#Type_parameter_declarations),\n  [Interface types / type sets](https://go.dev/ref/spec#Interface_types),\n  [For statements with range clause](https://go.dev/ref/spec#For_range)\n- Package docs: [`iter`](https://pkg.go.dev/iter), [`slices`](https://pkg.go.dev/slices),\n  [`maps`](https://pkg.go.dev/maps), [`cmp`](https://pkg.go.dev/cmp),\n  [`container/list`](https://pkg.go.dev/container/list)\n- [100 Go Mistakes](https://100go.co/), #9 \"Being confused about when to use generics\"\n- [Go Code Review Comments](https://go.dev/wiki/CodeReviewComments)\n", "units": [{"kind": "exercise", "name": "funcs", "dir": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/funcs", "doc": "Package funcs implements the classic higher-order helpers Map, Filter,\nReduce and GroupBy as generic functions over slices.\n\nRead the \"Type parameters\" and \"The S ~[]E pattern\" sections of the module\nREADME before starting. Run the tests with:\n\n\tgo test ./modules/06-generics/exercises/funcs/", "readme": "", "files": [{"name": "funcs.go", "path": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/funcs/funcs.go"}, {"name": "funcs_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/funcs/funcs_test.go"}], "cmd": "go test ./modules/06-generics/exercises/funcs/", "id": "modules/06-generics/exercises/funcs"}, {"kind": "exercise", "name": "iterx", "dir": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/iterx", "doc": "Package iterx provides lazy adapters over iter.Seq: the building blocks of\niterator pipelines.\n\nEvery function here is lazy: it does no work until the returned sequence\nis ranged over, and it pulls from its source only as many elements as the\nconsumer asks for.\n\nRun the tests with:\n\n\tgo test ./modules/06-generics/exercises/iterx/\n\nThe one rule you must not break: when yield returns false, return\nimmediately and never call yield again.", "readme": "", "files": [{"name": "iterx.go", "path": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/iterx/iterx.go"}, {"name": "iterx_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/iterx/iterx_test.go"}], "cmd": "go test ./modules/06-generics/exercises/iterx/", "id": "modules/06-generics/exercises/iterx"}, {"kind": "exercise", "name": "numeric", "dir": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/numeric", "doc": "Package numeric provides generic arithmetic helpers built on type-set\nconstraints.\n\nRun the tests with:\n\n\tgo test ./modules/06-generics/exercises/numeric/\n\nThe constraints are given to you because the tests cannot even compile\nwithout them. Before you start, do this experiment: delete the ~ in front\nof int64 below and run the tests. Read the compiler error (it mentions\nCents and time.Duration), then put the ~ back. That error is the whole\nreason ~ exists.", "readme": "", "files": [{"name": "numeric.go", "path": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/numeric/numeric.go"}, {"name": "numeric_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/numeric/numeric_test.go"}], "cmd": "go test ./modules/06-generics/exercises/numeric/", "id": "modules/06-generics/exercises/numeric"}, {"kind": "exercise", "name": "set", "dir": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/set", "doc": "Package set provides a generic hash set.\n\nRun the tests with:\n\n\tgo test ./modules/06-generics/exercises/set/", "readme": "", "files": [{"name": "set.go", "path": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/set/set.go"}, {"name": "set_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/set/set_test.go"}], "cmd": "go test ./modules/06-generics/exercises/set/", "id": "modules/06-generics/exercises/set"}, {"kind": "exercise", "name": "stackqueue", "dir": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/stackqueue", "doc": "Package stackqueue provides generic LIFO and FIFO containers.\n\nRun the tests with:\n\n\tgo test ./modules/06-generics/exercises/stackqueue/", "readme": "", "files": [{"name": "stackqueue.go", "path": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/stackqueue/stackqueue.go"}, {"name": "stackqueue_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/06-generics/exercises/stackqueue/stackqueue_test.go"}], "cmd": "go test ./modules/06-generics/exercises/stackqueue/", "id": "modules/06-generics/exercises/stackqueue"}, {"kind": "project", "name": "project", "dir": "/home/csmith/Workspace/tools/go-course/modules/06-generics/project", "doc": "Package lru implements a generic least-recently-used cache with optional\nper-entry time-to-live.\n\nSee README.md in this directory for the full specification. Run the tests\nwith:\n\n\tgo test ./modules/06-generics/project/", "readme": "# Project: Generic LRU Cache\n\n**Time budget:** 45 to 60 minutes.\n\nYou will build `Cache[K comparable, V any]`, a fixed-capacity cache that evicts the\n**least recently used** entry when it is full. Entries can optionally expire after a\ntime-to-live (TTL), and the cache exposes its contents as an `iter.Seq2[K, V]` in\nrecency order.\n\nLRU caches are a classic interview question for good reason: they need two data\nstructures working together, and the invariants between them are easy to break. They\nare also a natural fit for generics, because the algorithm does not care what the keys\nand values are.\n\n## Getting started\n\nEverything lives in `modules/06-generics/project/`:\n\n| File | What it is |\n|---|---|\n| `lru.go` | Starter code. The option plumbing (`Option`, `WithTTL`, `WithClock`) is done. Fill in the `Cache` fields and every method marked `TODO`. |\n| `lru_test.go` | The acceptance tests. Don't edit them. |\n\nRun the tests with:\n\n```sh\ngo test ./modules/06-generics/project/\n```\n\nRun a single test while you work:\n\n```sh\ngo test -run 'TestEvictsLeastRecentlyUsed' -v ./modules/06-generics/project/\n```\n\n## Specification\n\n### Construction\n\n```go\n// The signature, already in lru.go:\n//\n//\tfunc New[K comparable, V any](capacity int, opts ...Option) *Cache[K, V]\n//\n// This runs YOUR cache:\nimport lru \"gocourse/modules/06-generics/project\"\n\nc := lru.New[string, int](2, lru.WithTTL(time.Minute))\nc.Put(\"a\", 1)\nc.Put(\"b\", 2)\nc.Put(\"c\", 3) // evicts \"a\", the least recently used\n_, okA := c.Get(\"a\")\nvc, okC := c.Get(\"c\")\nfmt.Println(okA, vc, okC, c.Len()) // when you're done: false 3 true 2\n```\n\n- `capacity` is the maximum number of entries. `New` **panics** if `capacity < 1`. A\n  non-positive capacity is a bug in the caller, not a condition they can recover from\n  at run time. `make([]int, -1)` panics for the same reason.\n- Options:\n  - `WithTTL(d)`: each entry expires `d` after it was last **Put**. `d <= 0` means no\n    expiry (the default).\n  - `WithClock(now)`: the cache uses `now()` instead of `time.Now()`. The tests pass a\n    fake clock so they never sleep.\n- Call sites must spell out the type arguments, e.g. `lru.New[string, int](100)`,\n  because `K` and `V` appear in no parameter and so can't be inferred. That's normal\n  for constructors of generic containers.\n\n### Operations\n\n| Method | Behaviour |\n|---|---|\n| `Get(key) (V, bool)` | Returns the value and `true`, and marks the entry most recently used. A missing key returns the zero `V` and `false`. If the entry has expired, `Get` **removes it** and reports it as missing. `Get` does **not** extend the TTL. |\n| `Put(key, value)` | Inserts or replaces. The entry becomes most recently used and its TTL restarts. Replacing an existing key never evicts anything. Inserting a new key into a full cache first evicts the least recently used entry. |\n| `Delete(key) bool` | Removes the entry, expired or not. Reports whether it was present. |\n| `Len() int` | Number of stored entries. Expired entries **still count** until something removes them (`Get`, `Delete`, or eviction). Purging them eagerly would make `Len` O(n). |\n| `All() iter.Seq2[K, V]` | Yields live (unexpired) entries from **most to least** recently used. It must not change recency, must stop as soon as `yield` returns false, and the returned sequence must be reusable. |\n\nAn entry is expired when `now >= putTime + ttl`, so at exactly `ttl` it is already gone.\n\n### Complexity\n\n`Get`, `Put` and `Delete` must be **O(1)**. `All` is O(n). A slice that you shift or\nsearch on every access doesn't meet this requirement, even though it passes the tests.\n\n### Concurrency\n\n`Cache` is **not** safe for concurrent use, and you shouldn't add a mutex in this\nproject. Concurrency is the topic of module 07. Note that even `Get` *writes* (it moves\nthe entry to the front), so a `sync.RWMutex` with `RLock` in `Get` would be a data race.\n\n## Hints\n\n<details>\n<summary>Hint 1: which data structures?<\/summary>\n\nUse a `map[K]*list.Element` for O(1) lookup, plus a `container/list` doubly linked\nlist ordered by recency (front = most recent). `MoveToFront`, `PushFront`, `Back` and\n`Remove` are all O(1).\n\n<\/details>\n\n<details>\n<summary>Hint 2: what goes in the list element?<\/summary>\n\n`list.Element.Value` has type `any`. Store a pointer to your own generic struct:\n\n```go\ntype entry[K comparable, V any] struct {\n\tkey     K\n\tvalue   V\n\texpires time.Time\n}\n\ne := entry[string, int]{key: \"a\", value: 1, expires: time.Now().Add(time.Minute)}\nfmt.Println(e.key, e.value, time.Now().Before(e.expires)) // a 1 true\n```\n\nYou need the **key** in the entry. When you evict `ll.Back()`, you have to delete that\nkey from the map, and the list element is all you have at that point. Read it back with\na type assertion: `el.Value.(*entry[K, V])`.\n\n<\/details>\n\n<details>\n<summary>Hint 3: TTL<\/summary>\n\nCompute `expires := now().Add(ttl)` in `Put` when `ttl > 0`, and leave it as the zero\n`time.Time` otherwise. An entry is expired if `!expires.IsZero() && !now.Before(expires)`.\n\n<\/details>\n\n## Acceptance criteria\n\n- [ ] `go test ./modules/06-generics/project/` passes.\n- [ ] `go vet ./modules/06-generics/project/` is clean and the code is `gofmt`ed.\n- [ ] `Get`/`Put`/`Delete` are O(1).\n- [ ] No exported identifiers beyond those in the starter.\n- [ ] Every exported identifier has a doc comment that starts with its name.\n- [ ] Every nontrivial piece of logic (eviction, expiry check, removal) exists exactly\n      once. For example, a `removeElement` helper that removes from both the list and\n      the map.\n\n## Stretch goals\n\nDo these only once the tests pass. Add your own tests for each.\n\n1. **`Peek(key) (V, bool)`**: like `Get` but doesn't change recency. Should it remove\n   expired entries? Pick an answer and document it.\n2. **Eviction callback**: `WithOnEvict` can't be a plain `Option`, because the callback\n   needs `K` and `V` (`func(K, V)`). Find a design that works. One approach is a generic\n   option type, `type CacheOption[K comparable, V any] func(*Cache[K, V])`. What does\n   that do to call sites?\n3. **Prefer expired victims**: when the cache is full, evict an expired entry (if there\n   is one) before the true LRU entry. What does that do to `Put`'s complexity? Is there\n   a cheap approximation?\n4. **Zero-allocation version**: replace `container/list` with a slice of nodes linked by\n   `int32` indices, and reuse the evicted node's slot. Write a benchmark with `b.Loop()`\n   and compare `-benchmem` output with the `container/list` version.\n5. **Thread safety** (preview of module 07): add a `sync.Mutex`, then run the tests\n   with `-race` while several goroutines `Get` and `Put`.\n\n## Submitting\n\nWhen the tests pass, ask your instructor (Claude) to review `modules/06-generics/`.\n", "files": [{"name": "README.md", "path": "/home/csmith/Workspace/tools/go-course/modules/06-generics/project/README.md"}, {"name": "lru.go", "path": "/home/csmith/Workspace/tools/go-course/modules/06-generics/project/lru.go"}, {"name": "lru_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/06-generics/project/lru_test.go"}], "cmd": "go test ./modules/06-generics/project/...", "id": "modules/06-generics/project"}], "review": "# Review: Generics & Iterators\n\nThis document provides reference solutions and grading rubrics for the 06-generics module. Every exercise and the project are covered with readable and optimized implementations, trade-off analysis, and specific review checklists to help instructors grade consistently.\n\n---\n\n## Exercise 1: `funcs` \u2014 Higher-order functions\n\n### Readable solution\n\nThe readable versions of these functions use the straightforward idiom: iterate the input, transform/filter, and collect results. `Map` pre-allocates the result slice to the input length. `Filter` appends conditionally to a fresh slice (not the caller's backing array) to avoid modifying or corrupting the input. `Reduce` threads an accumulator through the elements and returns it unchanged when the slice is empty. `GroupBy` builds a map keyed by the `key` function's return value, ensuring it always returns a non-nil map.\n\nThe constraint pattern `S ~[]E` preserves the caller's slice type in the result, so `Filter` applied to a `type Names []string` returns `Names`, not plain `[]string`. This is crucial for maintaining type identity.\n\n### Optimized solution\n\nThree optimized variants exist beyond the readable `Map` and `Filter`:\n\n- **MapFast:** Instead of `append` into a slic
