iver-type)\n- [Go Code Review Comments: Getters](https://go.dev/wiki/CodeReviewComments#getters-and-setters)\n- [Google: Accept interfaces, return concrete types](https://google.github.io/styleguide/go/decisions#accept-interface-return-concrete)\n- [Dave Cheney: Functional options for friendly APIs](https://dave.cheney.net/2014/10/17/functional-options-for-friendly-apis)\n- [The Go Blog: Methods, Interfaces and Embedded Types](https://go.dev/blog/methods)\n- [io package documentation](https://pkg.go.dev/io)\n- [fmt.Stringer documentation](https://pkg.go.dev/fmt#Stringer)\n- [100 Go Mistakes](https://100go.co) \u2014 sections on receivers (#42), interfaces (#5\u2013#8), and embedding (#10).\n", "units": [{"kind": "exercise", "name": "describe", "dir": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/describe", "doc": "Package describe practises type switches, type assertions and the\n\"nil interface vs nil pointer\" gotcha.", "readme": "", "files": [{"name": "describe.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/describe/describe.go"}, {"name": "describe_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/describe/describe_test.go"}], "cmd": "go test ./modules/03-types-interfaces/exercises/describe/", "id": "modules/03-types-interfaces/exercises/describe"}, {"kind": "exercise", "name": "logging", "dir": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/logging", "doc": "Package logging practises composition with embedding: promoting methods\nfrom an embedded type, overriding some of them, and delegating to the\nembedded value explicitly.", "readme": "", "files": [{"name": "logging.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/logging/logging.go"}, {"name": "logging_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/logging/logging_test.go"}], "cmd": "go test ./modules/03-types-interfaces/exercises/logging/", "id": "modules/03-types-interfaces/exercises/logging"}, {"kind": "exercise", "name": "server", "dir": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/server", "doc": "Package server practises constructors and the functional options pattern\nby building an (inert) server configuration.", "readme": "", "files": [{"name": "server.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/server/server.go"}, {"name": "server_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/server/server_test.go"}], "cmd": "go test ./modules/03-types-interfaces/exercises/server/", "id": "modules/03-types-interfaces/exercises/server"}, {"kind": "exercise", "name": "shapes", "dir": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/shapes", "doc": "Package shapes models simple 2-D shapes behind a small interface.", "readme": "", "files": [{"name": "shapes.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/shapes/shapes.go"}, {"name": "shapes_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/shapes/shapes_test.go"}], "cmd": "go test ./modules/03-types-interfaces/exercises/shapes/", "id": "modules/03-types-interfaces/exercises/shapes"}, {"kind": "exercise", "name": "stack", "dir": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/stack", "doc": "Package stack implements a LIFO stack of ints whose zero value is ready\nto use.", "readme": "", "files": [{"name": "stack.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/stack/stack.go"}, {"name": "stack_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/exercises/stack/stack_test.go"}], "cmd": "go test ./modules/03-types-interfaces/exercises/stack/", "id": "modules/03-types-interfaces/exercises/stack"}, {"kind": "project", "name": "project", "dir": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/project", "doc": "", "readme": "# Inventory Manager\n\n## Overview\n\nThe Inventory Manager is a business-logic layer for managing product stock. You'll implement:\n\n1. **Product**: a value type representing a stock-keeping unit (SKU) with name, price, quantity and reorder level.\n2. **Store**: an interface for persisting products, with an in-memory implementation.\n3. **Inventory**: a service layer on top of the store that sells, restocks, filters, sorts and reports products.\n4. **Alerter**: an interface for notifying when products enter low-stock status.\n\nThis project exercises struct methods, interfaces, embedding, error handling, sorting and threading safety.\n\n## Requirements\n\n### Product Type\n\n`Product` is a value type with fields: `SKU`, `Name`, `Category`, `PriceCents`, `Quantity`, `ReorderLevel`.\n\n- **SKU** (string): a unique identifier, never empty.\n- **Name** (string): the product's name, never empty.\n- **PriceCents** (int64): the price in cents (not dollars). Always non-negative. Use int64 to avoid floating-point precision issues.\n- **Quantity** (int): units in stock, non-negative.\n- **ReorderLevel** (int): the threshold below which a product is \"low stock\", non-negative.\n- **Category** (string): the product's category (may be empty).\n\nImplement:\n\n- **`Validate() error`**: validates all fields. Return an error wrapping `ErrInvalid` if any field is invalid. The error message must mention the offending field name. Check fields in this order: SKU, Name, PriceCents, Quantity, ReorderLevel.\n\n- **`Value() int64`**: returns the total stock value (PriceCents \u00d7 Quantity). Mind integer overflow for very large quantities.\n\n- **`LowStock() bool`**: returns true if Quantity <= ReorderLevel.\n\n- **`String() string`**: formats the product as `` `SKU \"Name\" qty=N @ $X.YY` ``, e.g., `` `A-1 \"Widget\" qty=3 @ $1.99` ``. Use the `FormatCents` function to format prices.\n\n- **`FormatCents(cents int64) string`** (package function): formats an amount of cents as a dollar string. Examples:\n  - 199 \u2192 \"$1.99\"\n  - 5 \u2192 \"$0.05\"\n  - -250 \u2192 \"-$2.50\"\n  - 123456 \u2192 \"$1234.56\"\n  - 0 \u2192 \"$0.00\"\n  - Math.MinInt64 and other edge cases must be handled correctly.\n\n### Store Interface and MemoryStore Implementation\n\nThe `Store` interface defines CRUD operations for products:\n\n```go\n// Checks the interface against YOUR MemoryStore (project/store.go).\nimport inventory \"gocourse/modules/03-types-interfaces/project\"\n\ntype Product = inventory.Product\n\ntype Store interface {\n\tAdd(p Product) error\n\tGet(sku string) (Product, error)\n\tUpdate(p Product) error\n\tDelete(sku string) error\n\tList() []Product\n}\n\nvar s Store = inventory.NewMemoryStore() // compiles: the method set matches\nerr := s.Add(Product{SKU: \"A-1\", Name: \"Widget\", PriceCents: 199, Quantity: 10})\nfmt.Println(\"Add:\", err, \"List:\", s.List()) // \"not implemented\" until you write it\n```\n\n- **`Add(p Product) error`**: inserts a new product. Return an error wrapping `ErrDuplicate` if the SKU already exists.\n\n- **`Get(sku string) (Product, error)`**: returns the product with the given SKU. Return an error wrapping `ErrNotFound` if not found.\n\n- **`Update(p Product) error`**: replaces the product with the given SKU. Return an error wrapping `ErrNotFound` if the SKU doesn't exist.\n\n- **`Delete(sku string) error`**: removes the product. Return an error wrapping `ErrNotFound` if not found.\n\n- **`List() []Product`**: returns all products sorted by SKU (ascending). Return a newly allocated slice (not the internal backing store).\n\n**MemoryStore** is an in-memory implementation. It must:\n\n- Use a map to store products by SKU.\n- Protect the map with a `sync.Mutex` for concurrent safety.\n- Return copies of products, never references to internal state.\n- Add a compile-time assertion proving `*MemoryStore` implements `Store`.\n\n### Alerter Interface\n\nThe `Alerter` interface notifies when a product enters low-stock status:\n\n```go\nimport inventory \"gocourse/modules/03-types-interfaces/project\"\n\ntype Product = inventory.Product\n\ntype Alerter interface {\n\tLowStock(p Product)\n}\n\nvar _ Alerter = inventory.AlerterFunc(nil) // YOUR AlerterFunc satisfies it\n\nvar a Alerter = inventory.AlerterFunc(func(p Product) { fmt.Println(\"low stock:\", p.SKU) })\na.LowStock(Product{SKU: \"A-1\"}) // low stock: A-1 (once your AlerterFunc calls f)\n```\n\nImplement **`AlerterFunc`**: a function adapter like `http.HandlerFunc`. It should allow a function to satisfy the `Alerter` interface.\n\n```go\ntype Product struct {\n\tSKU      string\n\tQuantity int\n}\n\ntype AlerterFunc func(Product)\n\nfunc (f AlerterFunc) LowStock(p Product) {\n\tf(p)\n}\n\n// Usage:\nalerter := AlerterFunc(func(p Product) {\n\tfmt.Printf(\"Low stock: %v\\n\", p)\n})\nalerter.LowStock(Product{SKU: \"A-1\", Quantity: 2}) // Low stock: {A-1 2}\n```\n\n### Inventory Service\n\nThe `Inventory` type is a service layer on top of a `Store`. It manages products and optionally notifies an `Alerter` when products become low stock.\n\n**Concurrency note**: the `Store` is concurrent-safe, but the `Inventory` methods (`Sell`, `Receive`) do a Get-then-Update. This sequence is not atomic\u2014a concurrent sale could lose updates. Add a `sync.Mutex` to the `Inventory` to make Sell/Receive atomic.\n\nImplement:\n\n- **`New(store Store, alerter Alerter) *Inventory`**: construct an Inventory. The alerter may be nil (no alerts).\n\n- **`AddProduct(p Product) error`**: validates the product and adds it to the store. Return the error from `Validate()` or `store.Add()`.\n\n- **`Receive(sku string, qty int) error`**: adds `qty` units to a product's quantity. Errors:\n  - `qty` must be positive (else an error wrapping `ErrInvalid` mentioning \"quantity\").\n  - SKU must exist (else `store.Get()` error).\n  - Never triggers an alert (even if it moves the product into low stock after receiving, don't alert).\n\n- **`Sell(sku string, qty int) error`**: removes `qty` units from a product's quantity. Errors:\n  - `qty` must be positive (else an error wrapping `ErrInvalid` mentioning \"quantity\").\n  - SKU must exist (else `store.Get()` error).\n  - If selling `qty` exceeds the current quantity, return an error wrapping `ErrInsufficientStock` that mentions the SKU, and change nothing.\n  - If the sale moves the product from not-low-stock to low-stock (before the sale `!LowStock()`, after the sale `LowStock()`), call the alerter (if any) with the updated product.\n\n- **`Filter(keep func(Product) bool) []Product`**: returns products for which the filter function returns true, sorted by SKU. Return an empty (non-nil) slice if no products match.\n\n- **`LowStock() []Product`**: returns low-stock products sorted by SKU. Implement as a one-liner using `Filter`.\n\n- **`TotalValue() int64`**: returns the sum of `Value()` over all products.\n\n- **`Sorted(key SortKey) ([]Product, error)`**: returns all products in the order specified by the sort key. Errors:\n  - Unknown `SortKey` returns an error wrapping `ErrInvalid`.\n  - Orders:\n    - `BySKU`: ascending SKU.\n    - `ByName`: ascending Name.\n    - `ByValue`: descending Value (highest first).\n    - `ByQuantity`: ascending Quantity.\n  - Ties are always broken by ascending SKU for deterministic output.\n\n- **`SortKey.String() string`**: returns the lowercase name of the key (\"sku\", \"name\", \"value\", \"quantity\") or \"SortKey(N)\" for unknown values.\n\n- **`WriteReport(w io.Writer, key SortKey) error`**: writes a formatted stock report to `w`. Format and layout:\n\n```\nSKU      NAME                   QTY      PRICE        VALUE\nA-1      Widget                  10      $1.99       $19.90\nA-2      Gadget                  20      $0.50       $10.00\nTOTAL                            30                  $29.90\nlow stock: A-1, A-2\n```\n\n- Each line follows the format: `\"%-8s %-20s %5s %10s %12s\\n\"` (left-aligned SKU and NAME, right-aligned the rest).\n- Rows: SKU, Name, Quantity (as string), FormatCents(PriceCents), FormatCents(Value()).\n- TOTAL line: empty SKU, empty NAME, total quantity, empty PRICE, total value. Use spaces or empty strings for the NAME and PRICE columns.\n- Last line: `\"low stock: \"` followed by low-stock SKUs in ascending order, comma-separated. If no products are low stock, use `\"none\"`.\n- Unknown sort keys return an error wrapping `ErrInvalid` and write nothing.\n- The first write error (if any) is returned.\n\n## Acceptance Criteria\n\n- [ ] All types (`Product`, `Store`, `Inventory`) are defined and compile.\n- [ ] All methods are implemented and tested.\n- [ ] Errors wrap sentinel errors with `%w` where specified.\n- [ ] `Product.Validate()` checks fields in the specified order.\n- [ ] `MemoryStore` is concurrent-safe (uses `sync.Mutex`).\n- [ ] `Inventory.Sell()` and `Receive()` are atomic (use `sync.Mutex`).\n- [ ] `Inventory.Sell()` alerts only when moving from not-low to low stock.\n- [ ] `Sorted()` and `WriteReport()` produce deterministic output (ties broken by SKU).\n- [ ] `FormatCents` handles all int64 values correctly (including `math.MinInt64`).\n- [ ] All tests pass: `go test ./modules/03-types-interfaces/project/`.\n- [ ] Code is gofmt-clean and passes `go vet`.\n\n## Stretch Goals\n\n- Add a `Delete(sku string) error` method to `Inventory` that removes a product and any associated alerts.\n- Add an `Audit(before, after time.Time) ([]Transaction, error)` method that logs and returns a history of changes (requires a transaction log in `MemoryStore`).\n- Implement a second `Store` backend, e.g., using a slice instead of a map (good for small inventories that are frequently iterated).\n\n## Testing\n\nThe test file includes table-driven tests for all Product methods, Store operations, Inventory business logic, sorting, reporting, and alerting. Tests verify:\n\n- Correct computation of area, perimeter, formatting.\n- Proper error handling and wrapping.\n- Concurrent safety (with a race detector check).\n- Deterministic sorting and output.\n- Alerter behavior.\n\n**Run the project tests with:** `go test ./modules/03-types-interfaces/project/`\n\n**Run with the race detector:** `go test -race ./modules/03-types-interfaces/project/`\n", "files": [{"name": "README.md", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/project/README.md"}, {"name": "inventory.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/project/inventory.go"}, {"name": "inventory_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/project/inventory_test.go"}, {"name": "product.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/project/product.go"}, {"name": "product_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/project/product_test.go"}, {"name": "store.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/project/store.go"}, {"name": "store_test.go", "path": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces/project/store_test.go"}], "cmd": "go test ./modules/03-types-interfaces/project/...", "id": "modules/03-types-interfaces/project"}], "review": "# Review Guide: Structs, Methods & Interfaces\n\nThis document contains reference solutions, optimization notes, and grading checklists for each exercise and the project.\n\n---\n\n## Exercise 1: Shapes\n\n### Learning Goals\n- Implement the `Shape` interface with multiple types.\n- Use the `fmt.Stringer` interface for custom formatting.\n- Understand compile-time interface assertions.\n- Sort with `slices.SortFunc` and `cmp.Compare`.\n\n### Readable Solution\n\n```go\nimport \"gocourse/solutions/03-types-interfaces/exercises/shapes\"\n\n// Shape and ErrInvalidTriangle, from shapes.go:\ntype Shape = shapes.Shape\n\nvar ErrInvalidTriangle = shapes.ErrInvalidTriangle\n\n// All three types (Circle, Rect, Triangle) implement Shape with value receivers\n// because they are immutable and small.\n\ntype Circle struct {\n\tRadius float64\n}\n\nfunc (c Circle) Area() float64 { return math.Pi * c.Radius * c.Radius }\nfunc (c Circle) Perimeter() float64 { return 2 * math.Pi * c.Radius }\nfunc (c Circle) String() string { return \"Circle(r=\" + ftoa(c.Radius) + \")\" }\n\ntype Rect struct {\n\tWidth, Height float64\n}\n\nfunc (r Rect) Area() float64 { return r.Width * r.Height }\nfunc (r Rect) Perimeter() float64 { return 2 * (r.Width + r.Height) }\nfunc (r Rect) String() string { return \"Rect(\" + ftoa(r.Width) + \"x\" + ftoa(r.Height) + \")\" }\n\ntype Triangle struct {\n\tA, B, C float64\n}\n\nfunc NewTriangle(a, b, c float64) (Triangle, error) {\n\tif a <= 0 || b <= 0 || c <= 0 {\n\t\treturn Triangle{}, fmt.Errorf(\"sides must be positive: %w\", ErrInvalidTriangle)\n\t}\n\tif a+b <= c || a+c <= b || b+c <= a {\n\t\treturn Triangle{}, fmt.Errorf(\"triangle inequality violation: %w\", ErrInvalidTriangle)\n\t}\n\treturn Triangle{A: a, B: b, C: c}, nil\n}\n\nfunc (t Triangle) Area() float64 {\n\ts := t.Perimeter() / 2\n\treturn math.Sqrt(s * (s - t.A) * (s - t.B) * (s - t.C))\n}\n\nfunc (t Triangle) Perimeter() float64 { return t.A + t.B + t.C }\nfunc (t Triangle) String() string {\n\treturn \"Triangle(\" + ftoa(t.A) + \", \" + ftoa(t.B) + \", \" + ftoa(t.C) + \")\"\n}\n\n// Helper to format floats like %g (shortest round-trip form)\nfunc ftoa(f float64) string {\n\treturn strconv.FormatFloat(f, 'g', -1, 64)\n}\n\n// TotalArea returns the sum of the areas of shapes.\nfunc TotalArea(shapes []Shape) float64 {\n\tvar total float64\n\tfor _, s := range shapes {\n\t\ttotal += s.Area()\n\t}\n\treturn total\n}\n\n// Largest returns the shape with the greatest area.\nfunc Largest(shapes []Shape) (Shape, bool) {\n\tif len(shapes) == 0 {\n\t\treturn nil, false\n\t}\n\tlargest := shapes[0]\n\tfor _, s := range shapes {\n\t\tif s.Area() > largest.Area() {\n\t\t\tlargest = s\n\t\t}\n\t}\n\treturn largest, true\n}\n\n// SortByArea sorts shapes by area (stable sort preserves ties by SKU/input order).\nfunc SortByArea(shapes []Shape) {\n\tslices.SortStableFunc(shapes, func(a, b Shape) int {\n\t\treturn cmp.Compare(a.Area(), b.Area())\n\t})\n}\n\n// Compile-time assertions: prove every type satisfies both interfaces.\nvar (\n\t_ Shape        = Circle{}\n\t_ Shape        = Rect{}\n\t_ Shape        = Triangle{}\n\t_ fmt.Stringer = Circle{}\n\t_ fmt.Stringer = Rect{}\n\t_ fmt.Stringer = Triangle{}\n)\n\nfunc main() {\n\ttri, err := NewTriangle(3, 4, 5)\n\tfmt.Println(tri, err) // Triangle(3, 4, 5) <nil>\n\tall := []Shape{Circle{Radius: 1}, Rect{Width: 2, Height: 3}, tri}\n\tSortByArea(all)\n\tbig, _ := Largest(all)\n\tfmt.Printf(\"%v total=%.2f largest=%v\\n\", all, TotalArea(all), big)\n\t_, err = NewTriangle(1, 1, 5)\n\tfmt.Println(err) // triangle inequality violation: invalid triangle\n}\n```\n\n### Optimized Solution\n\nThe readable solution is already well-optimized. The only micro-optimization would be avoiding the string concatenation in `String()` methods by using `fmt.Sprintf`, but the concatenation version is more efficient in terms of allocations.\n\nA minor optimization for `TotalArea` and `Largest` would be inlining the iteration, but the code is clear and the compiler likely inlines the loops anyway.\n\n### Trade-off\n\nThe readable solution is the optimal one here. Simplicity, clarity, and performance are aligned. String formatting with concatenation is faster than `fmt.Sprintf` for constant templates.\n\n### Review Checklist\n\n**Correctness:**\n- [ ] All three types satisfy `Shape` and `fmt.Stringer`.\n- [ ] Compile-time assertions are present and correct.\n- [ ] `NewTriangle` validates the triangle inequality strictly (\u2264 fails, not <).\n- [ ] Area calculations are correct (using Heron's formula for triangles).\n- [ ] `String()` outputs match the expected format exactly (e.g., \"Circle(r=2)\").\n- [ ] `TotalArea` returns 0 for nil or empty slices.\n- [ ] `Largest` returns the first shape when all areas are equal (not nil).\n\n**Receiver Types:**\n- [ ] All methods use value receivers (Circle, Rect, Triangle are immutable).\n- [ ] No pointer receivers where they shouldn't be.\n\n**Error Handling:**\n- [ ] `NewTriangle` errors wrap `ErrInvalidTriangle` with `%w`.\n- [ ] Error messages mention the offending values.\n\n**Sorting:**\n- [ ] Uses `slices.SortStableFunc` (stable sort preserves input order for ties).\n- [ ] Comparison function uses `cmp.Compare`.\n- [ ] Sorting is in-place.\n\n**Code Style:**\n- [ ] `ftoa` helper is defined and used consistently.\n- [ ] No magic numbers in string formatting.\n- [ ] No infinite recursion in `String()` (no `fmt.Sprintf(\"%v\", c)`).\n\n---\n\n## Exercise 2: Stack\n\n### Learning Goals\n- Understand the difference between value and pointer receivers.\n- Design mutable types with consistent receiver types.\n- Implement `Clone` and return copies to avoid leaking internal state.\n- Implement `fmt.Stringer` for custom printing.\n\n### Readable Solution\n\n```go\n// Stack uses all pointer receivers because it mutates.\n// The zero value is a ready-to-use empty stack.\n\ntype Stack struct {\n\titems []int\n}\n\nfunc (s *Stack) Push(v int) {\n\ts.items = append(s.items, v)\n}\n\nfunc (s *Stack) Pop() (v int, ok bool) {\n\tif len(s.items) == 0 {\n\t\treturn 0, false\n\t}\n\tlast := len(s.items) - 1\n\tv = s.items[last]\n\ts.items = s.items[:last]\n\treturn v, true\n}\n\nfunc (s *Stack) Peek() (v int, ok bool) {\n\tif len(s.items) == 0 {\n\t\treturn 0, false\n\t}\n\treturn s.items[len(s.items)-1], true\n}\n\nfunc (s *Stack) Len() int {\n\treturn len(s.items)\n}\n\n// Values returns a copy, not the internal slice.\nfunc (s *Stack) Values() []int {\n\treturn slices.Clone(s.items)\n}\n\n// Clone returns an independent copy of the stack.\nfunc (s *Stack) Clone() *Stack {\n\treturn &Stack{items: slices.Clone(s.items)}\n}\n\n// String formats the stack.\nfunc (s *Stack) String() string {\n\treturn fmt.Sprintf(\"Stack%v\", s.items)\n}\n\nvar s Stack // the zero value works\ns.Push(1)\ns.Push(2)\nc := s.Clone()\nv, _ := s.Pop()\nfmt.Println(v, s.String(), c.String(), s.Len()) // 2 Stack[1] Stack[1 2] 1\n```\n\n### Optimized Solution\n\nThe readable solution is already very efficient. One minor alternative for `String()` uses a strings.Builder to avoid the allocation from `fmt.Sprintf`, but for a small slice it's unlikely to matter:\n\n```go\ntype Stack struct{ items []int }\n\n// Micro-optimization: avoid fmt.Sprintf allocation\nfunc (s *Stack) String() string {\n\tvar sb strings.Builder\n\tsb.WriteString(\"Stack[\")\n\tfor i, v := range s.items {\n\t\tif i > 0 {\n\t\t\tsb.WriteByte(' ')\n\t\t}\n\t\tsb.WriteString(strconv.Itoa(v))\n\t}\n\tsb.WriteByte(']')\n\treturn sb.String()\n}\n\nfunc main() {\n\tfmt.Println(&Stack{items: []int{1, 2, 3}}) // Stack[1 2 3]\n}\n```\n\nBut this is more complex and the readable version is almost certainly faster in practice (fmt is optimized, and the slice is usually small). The benchmark difference would be negligible.\n\n### Trade-off\n\n**Readable:** `fmt.Sprintf(\"Stack%v\", s.items)` is clear and concise.\n\n**Optimized:** Manual formatting with `strings.Builder` avoids formatting overhead.\n\n**Recommendation:** Use the readable version. The overhead is minimal, and clarity is more important than micro-optimizations here.\n\n### Review Checklist\n\n**Receiver Types:**\n- [ ] All methods use pointer receivers (Stack is mutable).\n- [ ] Consistent use of `*Stack`, no value receivers.\n\n**Correctness:**\n- [ ] `Push` adds an element and increases the stack.\n- [ ] `Pop` removes and returns the top element.\n- [ ] `Pop` returns (0, false) when empty, not a panic.\n- [ ] `Peek` returns the top element without removing it.\n- [ ] `Len` returns the correct length.\n- [ ] `Values()` returns a *copy*, not a reference to the internal slice. Mutating the result does not affect the stack.\n- [ ] `Clone()` returns an independent copy. Modifying one does not affect the other.\n- [ ] The zero value `var s Stack` is ready to use (no need for `NewStack`).\n\n**String Formatting:**\n- [ ] `String()` output matches \"Stack[1 2 3]\" format (spaces between elements).\n- [ ] Empty stack prints as \"Stack[]\".\n- [ ] Using `fmt.Sprintf` is acceptable; no need for manual formatting.\n\n**Memory Safety:**\n- [ ] `Values()` and `Clone()` use `slices.Clone` to avoid slice aliasing.\n- [ ] Internal `items` slice is never leaked to callers.\n\n---\n\n## Exercise 3: Describe\n\n### Learning Goals\n- Implement a comprehensive type switch to inspect `interface{}` values.\n- Handle many types with proper priority (error before Stringer).\n- Understand the \"nil interface vs nil pointer\" gotcha.\n- Implement recursive formatting for slices and maps.\n\n### Readable Solution\n\n```go\nfunc Describe(v any) string {\n\tswitch v := v.(type) {\n\tcase nil:\n\t\treturn \"nil\"\n\tcase error:\n\t\t// Error must be checked BEFORE Stringer, since a type can implement both.\n\t\treturn \"error: \" + v.Error()\n\tcase fmt.Stringer:\n\t\treturn \"Stringer: \" + v.String()\n\tcase bool:\n\t\treturn \"bool \" + strconv.FormatBool(v)\n\tcase int, int8, int16, int32, int64, uint, uint8, uint16, uint32, uint64:\n\t\t// Multi-type case: v keeps type any, so let fmt %T figure out the actual type.\n\t\treturn fmt.Sprintf(\"%T %d\", v, v)\n\tcase float32:\n\t\treturn \"float32 \" + strconv.FormatFloat(float64(v), 'g', -1, 32)\n\tcase float64:\n\t\treturn \"float64 \" + strconv.FormatFloat(v, 'g', -1, 64)\n\tcase string:\n\t\treturn \"string \" + strconv.Quote(v)\n\tcase []byte:\n\t\treturn \"[]byte len=\" + strconv.Itoa(len(v))\n\tcase []any:\n\t\tparts := make([]string, len(v))\n\t\tfor i, elem := range v {\n\t\t\tparts[i] = Describe(elem)\n\t\t}\n\t\treturn \"[\" + strings.Join(parts, \", \") + \"]\"\n\tcase map[string]any:\n\t\t// Sort keys for deterministic output.\n\t\tkeys := make([]string, 0, len(v))\n\t\tfor k := range v {\n\t\t\tkeys = append(keys, k)\n\t\t}\n\t\tslices.Sort(keys)\n\t\tparts := make([]string, len(keys))\n\t\tfor i, k := range keys {\n\t\t\tparts[i] = k + \": \" + Describe(v[k])\n\t\t}\n\t\treturn \"map[\" + strings.Join(parts, \", \") + \"]\"\n\tdefault:\n\t\treturn fmt.Sprintf(\"unknown %T\", v)\n\t}\n}\n\n// ValidationError carries structured error information.\ntype ValidationError struct {\n\tValue  int\n\tReason string\n}\n\nfunc (e *ValidationError) Error() string {\n\treturn \"invalid value \" + strconv.Itoa(e.Value) + \": \" + e.Reason\n}\n\n// Validate returns nil (untyped) on success, or a *ValidationError on failure.\n// Key: return the untyped nil literal, not a nil pointer.\nfunc Validate(n int) error {\n\tswitch {\n\tcase n < 0:\n\t\treturn &ValidationError{Value: n, Reason: \"negative\"}\n\tcase n > 100:\n\t\treturn &ValidationError{Value: n, Reason: \"greater than 100\"}\n\t}\n\treturn nil // untyped nil, not (*ValidationError)(nil)\n}\n\nfmt.Println(Describe(nil))\nfmt.Println(Describe(errors.New(\"boom\")))\nfmt.Println(Describe(time.Second))\nfmt.Println(Describe(uint8(7)))\nfmt.Println(Describe([]any{\"a\", 1.5, map[string]any{\"z\": true, \"a\": nil}}))\nfmt.Println(Validate(50) == nil, Validate(-1)) // true invalid value -1: negative\n```\n\n### Optimized Solution\n\nThe readable solution is already well-optimized. The only potential micro-optimization would be:\n- Pre-allocate the `parts` slice with `make([]string, len(v))` instead of building it incrementally, which this solution already does.\n- Cache sorted keys if maps are frequently described, but that's premature.\n\nNo optimization is needed for correctness or typical performance.\n\n### Trade-off\n\n**Readable:** The solution above is clear, correct, and handles all cases with proper priority.\n\n**Optimized:** Caching sorted keys or precomputing parts would only help in a tight loop over many maps.\n\n**Recommendation:** The readable version is optimal here.\n\n### Review Checklist\n\n**Type Switch Order:**\n- [ ] `nil` case handled first.\n- [ ] `error` case checked *before* `fmt.Stringer` (priority matters when a type implements both).\n- [ ] `fmt.Stringer` case before primitives.\n- [ ] Default case last.\n\n**Output Format:**\n- [ ] `nil`: `\"nil\"`.\n- [ ] `error`: `\"error: \" + message`.\n- [ ] `Stringer`: `\"Stringer: \" + String()` output.\n- [ ] `bool`: `\"bool true\"` or `\"bool false\"`.\n- [ ] Integer types: `\"<type> <value>\"` with correct type name (e.g., `\"int8 -3\"`).\n- [ ] `float32`/`float64`: shortest representation (e.g., `\"float64 2.5\"`).\n- [ ] `string`: uses `strconv.Quote` for proper escaping (e.g., `` string \"a\\\"b\" ``).\n- [ ] `[]byte`: `\"[]byte len=N\"`.\n- [ ] `[]any`: `\"[elem1, elem2, ...]\"` with recursive description.\n- [ ] `map[string]any`: `\"map[k1: desc, k2: desc]\"` with sorted keys and recursive values.\n- [ ] Unknown types: `\"unknown <type>\"` where `<type>` is from `%T`.\n\n**Recursion:**\n- [ ] `[]any` elements are recursively described.\n- [ ] `map[string]any` values are recursively described.\n- [ ] Nested slices/maps format correctly, e.g., `\"[map[k: int 1]]\"`.\n\n**The Nil Gotcha:**\n- [ ] `Validate` returns the untyped `nil` literal, not a nil pointer.\n- [ ] A nil `*ValidationError` would return a non-nil error interface (both cases are tested).\n\n**Edge Cases:**\n- [ ] Empty slices: `[]any{}` \u2192 `\"[]\"`.\n- [ ] Empty maps: `map[string]any{}` \u2192 `\"map[]\"`.\n- [ ] `[]byte(nil)` and `[]byte{}` are distinct (both should work).\n- [ ] Negative numbers format correctly.\n- [ ] Very large integers (int64.MinValue) format correctly.\n\n---\n\n## Exercise 4: Logging\n\n### Learning Goals\n- Understand method promotion through embedding.\n- Design composition vs inheritance patterns.\n- Implement interfaces that compose embedded types.\n\n### Readable Solution\n\n```go\n// Logger is an unexported type that logs messages.\ntype Logger struct {\n\tprefix string\n}\n\nfunc (l Logger) Log(msg string) {\n\tfmt.Println(l.prefix + msg)\n}\n\n// Animal embeds a Logger and uses its methods.\ntype Animal struct {\n\tLogger // embedded: Log is promoted\n\tName   string\n\tSound  string\n}\n\n// Speak uses the promoted Log method.\nfunc (a Animal) Speak() string {\n\tmsg := a.Name + \" says \" + a.Sound\n\ta.Log(msg) // promoted method\n\treturn msg\n}\n\na := Animal{Logger: Logger{prefix: \"[zoo] \"}, Name: \"Rex\", Sound: \"woof\"}\na.Speak() // [zoo] Rex says woof\n```\n\n### Optimized Solution\n\nThe readable solution is optimal. Embedding is the idiomatic Go pattern here.\n\n### Trade-off\n\nEmbedding is cleaner than composition for this use case because `Log` is promoted. If you wanted to hide `Log`, you'd use a named field instead.\n\n### Review Checklist\n\n**Embedding:**\n- [ ] Logger is unexported (lowercase `type Logger`).\n- [ ] Animal embeds Logger (not a named field).\n- [ ] Log method is promoted to Animal.\n- [ ] Animal can call `a.Log(...)` without `a.Logger.Log(...)`.\n\n**Implementation:**\n- [ ] `Speak()` returns the correct string.\n- [ ] `Speak()` calls `Log()` to record the action.\n- [ ] Log output includes the correct prefix.\n\n**Design:**\n- [ ] No mixing of embedded fields with other logic.\n- [ ] Methods are placed correctly (on the type that owns them).\n\n---\n\n## Exercise 5: Server\n\n### Learning Goals\n- Implement the functional options pattern.\n- Validate configuration options and report errors.\n- Design immutable configuration types.\n- Use constructors to enforce invariants.\n\n### Readable Solution\n\n```go\nimport \"gocourse/solutions/03-types-interfaces/exercises/server\"\n\n// The defaults and the sentinel, from server.go:\nconst (\n\tDefaultPort         = server.DefaultPort\n\tDefaultReadTimeout  = server.DefaultReadTimeout\n\tDefaultWriteTimeout = server.DefaultWriteTimeout\n\tDefaultMaxConns     = server.DefaultMaxConns\n)\n\nvar ErrInvalidOption = server.ErrInvalidOption\n\ntype Server struct {\n\thost         string\n\tport         int\n\treadTimeout  time.Duration\n\twriteTimeout time.Duration\n\tmaxConns     int\n\tcertFile     string\n\tkeyFile      string\n}\n\ntype Option func(*Server) error\n\nfunc WithPort(port int) Option {\n\treturn func(s *Server) error {\n\t\tif port < 1 || port > 65535 {\n\t\t\treturn fmt.Errorf(\"port %d: %w\", port, ErrInvalidOption)\n\t\t}\n\t\ts.port = port\n\t\treturn nil\n\t}\n}\n\nfunc WithTimeouts(read, write time.Duration) Option {\n\treturn func(s *Server) error {\n\t\tif read <= 0 || write <= 0 {\n\t\t\treturn fmt.Errorf(\"timeout must be positive: %w\", ErrInvalidOption)\n\t\t}\n\t\ts.readTimeout = read\n\t\ts.writeTimeout = write\n\t\treturn nil\n\t}\n}\n\nfunc WithMaxConns(n int) Option {\n\treturn func(s *Server) error {\n\t\tif n < 1 {\n\t\t\treturn fmt.Errorf(\"max conns %d must be >= 1: %w\", n, ErrInvalidOption)\n\t\t}\n\t\ts.maxConns = n\n\t\treturn nil\n\t}\n}\n\nfunc WithTLS(certFile, keyFile string) Option {\n\treturn func(s *Server) error {\n\t\tif certFile == \"\" || keyFile == \"\" {\n\t\t\treturn fmt.Errorf(\"TLS cert and key must be non-empty: %w\", ErrInvalidOption)\n\t\t}\n\t\ts.certFile = certFile\n\t\ts.keyFile = keyFile\n\t\treturn nil\n\t}\n}\n\nfunc New(host string, opts ...Option) (*Server, error) {\n\ts := &Server{\n\t\thost:         host,\n\t\tport:         DefaultPort,\n\t\treadTimeout:  DefaultReadTimeout,\n\t\twriteTimeout: DefaultWriteTimeout,\n\t\tmaxConns:     DefaultMaxConns,\n\t}\n\tfor _, opt := range opts {\n\t\tif opt == nil {\n\t\t\tcontinue\n\t\t}\n\t\tif err := opt(s); err != nil {\n\t\t\treturn nil, fmt.Errorf(\"server: %w\", err)\n\t\t}\n\t}\n\treturn s, nil\n}\n\nfunc (s *Server) Addr() string {\n\treturn net.JoinHostPort(s.host, fmt.Sprint(s.port))\n}\n\nfunc (s *Server) ReadTimeout() time.Duration { return s.readTimeout }\nfunc (s *Server) WriteTimeout() time.Duration { return s.writeTimeout }\nfunc (s *Server) MaxConns() int { return s.maxConns }\nfunc (s *Server) TLS() bool { return s.certFile != \"\" }\n\nfunc (s *Server) String() string {\n\tscheme := \"http\"\n\tif s.TLS() {\n\t\tscheme = \"https\"\n\t}\n\taddr := s.Addr()\n\treturn fmt.Sprintf(\"%s://%s (read %v, write %v, max %d conns)\", scheme, addr, s.readTimeout, s.writeTimeout, s.maxConns)\n}\n\nfunc main() {\n\ts, err := New(\"localhost\", WithPort(9000), WithTLS(\"cert.pem\", \"key.pem\"))\n\tfmt.Println(s, err) // https://localhost:9000 (read 5s, write 10s, max 100 conns) <nil>\n\t_, err = New(\"localhost\", WithMaxConns(0))\n\tfmt.Println(err, errors.Is(err, ErrInvalidOption))\n}\n```\n\n### Optimized Solution\n\nThe readable solution is already optimized. No changes needed.\n\n### Trade-off\n\nThe functional options pattern trades a small amount of complexity for a very clean, extensible API. It's the right choice here.\n\n### Review Checklist\n\n**Functional Options Pattern:**\n- [ ] `Option` is a function type that takes `*Server` and returns `error`.\n- [ ] Each option function is defined (WithPort, WithTimeouts, etc.).\n- [ ] Options are applied in order.\n- [ ] Nil options are skipped.\n- [ ] The first failing option stops construction.\n\n**Validation:**\n- [ ] Port range: 1\u201365535.\n- [ ] Timeouts: both must be positive.\n- [ ] MaxConns: must be >= 1.\n- [ ] TLS: both cert and key must be non-empty.\n\n**Error Handling:**\n- [ ] Errors wrap `ErrInvalidOption`.\n- [ ] Error messages mention the offending field or value.\n- [ ] `New` wraps option errors with \"server: \" prefix.\n\n**Getters:**\n- [ ] No `Get` prefix (e.g., `ReadTimeout()`, not `GetReadTimeout()`).\n- [ ] All getters return the configured value or the default.\n\n**String Formatting:**\n- [ ] Uses \"http\" or \"https\" based on TLS.\n- [ ] Includes host:port (uses `net.JoinHostPort` for IPv6 bracketing).\n- [ ] Includes timeouts and max conns in a readable format.\n\n**Type Safety:**\n- [ ] Server fields are unexported (lowercase).\n- [ ] Can only be created through `New`.\n\n---\n\n## Project: Inventory Manager\n\n### Learning Goals\n- Design multiple types that work together (Product, Store, Inventory).\n- Implement an interface with a concrete implementation.\n- Use embedding and composition appropriately.\n- Implement sorting and formatting for reports.\n- Practice concurrency safety with mutexes.\n- Implement error handling with custom types and wrapping.\n\n### Readable Solution\n\nSee the solution files for the complete implementation. Below are key design points:\n\n#### Product Type (Readable)\n\n```go\nimport inventory \"gocourse/solutions/03-types-interfaces/project\"\n\nvar ErrInvalid = inventory.ErrInvalid\n\ntype Product struct {\n\tSKU          string\n\tName         string\n\tCategory     string\n\tPriceCents   int64\n\tQuantity     int\n\tReorderLevel int\n}\n\nfunc (p Product) Validate() error {\n\tif p.SKU == \"\" {\n\t\treturn fmt.Errorf(\"SKU: %w\", ErrInvalid)\n\t}\n\tif p.Name == \"\" {\n\t\treturn fmt.Errorf(\"name: %w\", ErrInvalid)\n\t}\n\tif p.PriceCents < 0 {\n\t\treturn fmt.Errorf(\"price: %w\", ErrInvalid)\n\t}\n\tif p.Quantity < 0 {\n\t\treturn fmt.Errorf(\"quantity: %w\", ErrInvalid)\n\t}\n\tif p.ReorderLevel < 0 {\n\t\treturn fmt.Errorf(\"reorder: %w\", ErrInvalid)\n\t}\n\treturn nil\n}\n\nfunc (p Product) Value() int64 { return p.PriceCents * int64(p.Quantity) }\nfunc (p Product) LowStock() bool { return p.Quantity <= p.ReorderLevel }\n\nfunc (p Product) String() string {\n\treturn fmt.Sprintf(\"%s %q qty=%d @ %s\", p.SKU, p.Name, p.Quantity, FormatCents(p.PriceCents))\n}\n\nfunc FormatCents(cents int64) string {\n\tif cents < 0 {\n\t\treturn \"-\" + FormatCents(-cents)\n\t}\n\tdollars := cents / 100\n\tfraction := cents % 100\n\treturn fmt.Sprintf(\"$%d.%02d\", dollars, fraction)\n}\n\nfunc main() {\n\tp := Product{SKU: \"A-1\", Name: \"Widget\", PriceCents: 199, Quantity: 10, ReorderLevel: 2}\n\tfmt.Println(p, p.Validate(), FormatCents(p.Value())) // A-1 \"Widget\" qty=10 @ $1.99 <nil> $19.90\n\tfmt.Println(Product{SKU: \"B-2\"}.Validate())          // name: invalid product\n}\n```\n\n#### Store Interface and MemoryStore (Readable)\n\n```go\nimport inventory \"gocourse/solutions/03-types-interfaces/project\"\n\ntype Product = inventory.Product\n\nvar (\n\tErrDuplicate = inventory.ErrDuplicate\n\tErrNotFound  = inventory.ErrNotFound\n)\n\ntype Store interface {\n\tAdd(p Product) error\n\tGet(sku string) (Product, error)\n\tUpdate(p Product) error\n\tDelete(sku string) error\n\tList() []Product\n}\n\ntype MemoryStore struct {\n\tmu       sync.Mutex\n\tproducts map[string]Product\n}\n\nvar _ Store = (*MemoryStore)(nil) // compile-time assertion\n\nfunc NewMemoryStore() *MemoryStore {\n\treturn &MemoryStore{products: make(map[string]Product)}\n}\n\nfunc (m *MemoryStore) Add(p Product) error {\n\tm.mu.Lock()\n\tdefer m.mu.Unlock()\n\tif _, exists := m.products[p.SKU]; exists {\n\t\treturn fmt.Errorf(\"sku %s: %w\", p.SKU, ErrDuplicate)\n\t}\n\tm.products[p.SKU] = p\n\treturn nil\n}\n\nfunc (m *MemoryStore) Get(sku string) (Product, error) {\n\tm.mu.Lock()\n\tdefer m.mu.Unlock()\n\tp, exists := m.products[sku]\n\tif !exists {\n\t\treturn Product{}, fmt.Errorf(\"sku %s: %w\", sku, ErrNotFound)\n\t}\n\treturn p, nil\n}\n\nfunc (m *MemoryStore) Update(p Product) error {\n\tm.mu.Lock()\n\tdefer m.mu.Unlock()\n\tif _, exists := m.products[p.SKU]; !exists {\n\t\treturn fmt.Errorf(\"sku %s: %w\", p.SKU, ErrNotFound)\n\t}\n\tm.products[p.SKU] = p\n\treturn nil\n}\n\nfunc (m *MemoryStore) Delete(sku string) error {\n\tm.mu.Lock()\n\tdefer m.mu.Unlock()\n\tif _, exists := m.products[sku]; !exists {\n\t\treturn fmt.Errorf(\"sku %s: %w\", sku, ErrNotFound)\n\t}\n\tdelete(m.products, sku)\n\treturn nil\n}\n\nfunc (m *MemoryStore) List() []Product {\n\tm.mu.Lock()\n\tdefer m.mu.Unlock()\n\tskus := slices.Collect(maps.Keys(m.products))\n\tslices.Sort(skus)\n\tresult := make([]Product, len(skus))\n\tfor i, sku := range skus {\n\t\tresult[i] = m.products[sku]\n\t}\n\treturn result\n}\n\nfunc main() {\n\ts := NewMemoryStore()\n\ts.Add(Product{SKU: \"B-2\", Name: \"Gadget\"})\n\ts.Add(Product{SKU: \"A-1\", Name: \"Widget\"})\n\tfmt.Println(s.Add(Product{SKU: \"A-1\"})) // sku A-1: product already exists\n\tfmt.Println(s.List())                   // sorted by SKU\n}\n```\n\n#### Inventory Type (Readable)\n\n```go\nimport inventory \"gocourse/solutions/03-types-interfaces/project\"\n\ntype (\n\tProduct = inventory.Product\n\tStore   = inventory.Store\n\tAlerter = inventory.Alerter\n)\n\nvar (\n\tErrInvalid           = inventory.ErrInvalid\n\tErrInsufficientStock = inventory.ErrInsufficientStock\n)\n\ntype Inventory struct {\n\tmu      sync.Mutex // guards the sequence of Get-Update operations\n\tstore   Store\n\talerter Alerter\n}\n\nfunc New(store Store, alerter Alerter) *Inventory {\n\treturn &Inventory{store: store, alerter: alerter}\n}\n\nfunc (inv *Inventory) Sell(sku string, qty int) error {\n\tif qty <= 0 {\n\t\treturn fmt.Errorf(\"quantity: %w\", ErrInvalid)\n\t}\n\tinv.mu.Lock()\n\tdefer inv.mu.Unlock()\n\n\tp, err := inv.store.Get(sku)\n\tif err != nil {\n\t\treturn err\n\t}\n\tif p.Quantity < qty {\n\t\treturn fmt.Errorf(\"sku %s: %w\", sku, ErrInsufficientStock)\n\t}\n\n\twasLowStock := p.LowStock()\n\tp.Quantity -= qty\n\n\tif err := inv.store.Update(p); err != nil {\n\t\treturn err\n\t}\n\n\tif !wasLowStock && p.LowStock() && inv.alerter != nil {\n\t\tinv.alerter.LowStock(p)\n\t}\n\treturn nil\n}\n\nfunc main() {\n\tstore := inventory.NewMemoryStore()\n\tstore.Add(Product{SKU: \"A-1\", Name: \"Widget\", Quantity: 5, ReorderLevel: 2})\n\tinv := New(store, inventory.AlerterFunc(func(p Product) { fmt.Println(\"ALERT low stock:\", p.SKU) }))\n\tfmt.Println(inv.Sell(\"A-1\", 2)) // <nil>\n\tfmt.Println(inv.Sell(\"A-1\", 1)) // ALERT low stock: A-1, then <nil>\n\tfmt.Println(inv.Sell(\"A-1\", 9)) // sku A-1: insufficient stock\n}\n```\n\n#### Sorting and Reporting (Readable)\n\n```go\nimport inventory \"gocourse/solutions/03-types-interfaces/project\"\n\n// The rest of the package, from product.go and store.go:\ntype (\n\tProduct = inventory.Product\n\tStore   = inventory.Store\n)\n\nvar (\n\tErrInvalid  = inventory.ErrInvalid\n\tFormatCents = inventory.FormatCents\n)\n\ntype Inventory struct{ store Store }\n\nfunc (inv *Inventory) LowStock() []Product {\n\tvar low []Product\n\tfor _, p := range inv.store.List() {\n\t\tif p.LowStock() {\n\t\t\tlow = append(low, p)\n\t\t}\n\t}\n\treturn low\n}\n\n// SortKey selects the order used by Sorted and WriteReport.\ntype SortKey int\n\n// Sort orders. Every order breaks ties by ascending SKU so output is\n// deterministic.\nconst (\n\tBySKU      SortKey = iota // ascending SKU\n\tByName                    // ascending Name\n\tByValue                   // descending Value()\n\tByQuantity                // ascending Quantity\n)\n\n// String returns the lower-case name of the key (\"sku\", \"name\", \"value\",\n// \"quantity\") or \"SortKey(N)\" for unknown values.\nfunc (k SortKey) String() string {\n\tswitch k {\n\tcase BySKU:\n\t\treturn \"sku\"\n\tcase ByName:\n\t\treturn \"name\"\n\tcase ByValue:\n\t\treturn \"value\"\n\tcase ByQuantity:\n\t\treturn \"quantity\"\n\t}\n\treturn fmt.Sprintf(\"SortKey(%d)\", int(k))\n}\n\n// compare returns the comparison function for k, or nil for unknown keys.\nfunc (k SortKey) compare() func(a, b Product) int {\n\tswitch k {\n\tcase BySKU:\n\t\treturn func(a, b Product) int { return cmp.Compare(a.SKU, b.SKU) }\n\tcase ByName:\n\t\treturn func(a, b Product) int {\n\t\t\treturn cmp.Or(cmp.Compare(a.Name, b.Name), cmp.Compare(a.SKU, b.SKU))\n\t\t}\n\tcase ByValue:\n\t\treturn func(a, b Product) int {\n\t\t\treturn cmp.Or(cmp.Compare(b.Value(), a.Value()), cmp.Compare(a.SKU, b.SKU))\n\t\t}\n\tcase ByQuantity:\n\t\treturn func(a, b Product) int {\n\t\t\treturn cmp.Or(cmp.Compare(a.Quantity, b.Quantity), cmp.Compare(a.SKU, b.SKU))\n\t\t}\n\t}\n\treturn nil\n}\n\n// Sorted returns all products in the order given by key. Unknown keys\n// return an error wrapping ErrInvalid.\nfunc (inv *Inventory) Sorted(key SortKey) ([]Product, error) {\n\tcompare := key.compare()\n\tif compare == nil {\n\t\treturn nil, fmt.Errorf(\"unknown sort key %v: %w\", key, ErrInvalid)\n\t}\n\tps := inv.store.List()\n\tslices.SortFunc(ps, compare)\n\treturn ps, nil\n}\n\n// reportLine is the format shared by the header, rows and total line.\nconst reportLine = \"%-8s %-20s %5s %10s %12s\\n\"\n\n// WriteReport writes a fixed-width stock report to w, ordered by key:\n//\n//\tSKU      NAME                   QTY      PRICE        VALUE\n//\tA-1      Widget                  10      $1.99       $19.90\n//\tTOTAL                            10                  $19.90\n//\tlow stock: none\n//\n// Every line uses the format \"%-8s %-20s %5s %10s %12s\\n\". Rows contain\n// SKU, Name, Quantity, FormatCents(PriceCents) and FormatCents(Value()); the\n// TOTAL line has the total quantity and total value with empty NAME and\n// PRICE columns. The last line is \"low stock: \" followed by the low-stock\n// SKUs in ascending order joined by \", \", or \"none\". Long values are not\n// truncated. The first write error (if any) is returned.\nfunc (inv *Inventory) WriteReport(w io.Writer, key SortKey) error {\n\tps, err := inv.Sorted(key)\n\tif err != nil {\n\t\treturn err\n\t}\n\tew := &errWriter{w: w}\n\tew.printf(reportLine, \"SKU\", \"NAME\", \"QTY\", \"PRICE\", \"VALUE\")\n\tvar totalQty int\n\tvar totalValue int64\n\tvar low []string\n\tfor _, p := range ps {\n\t\tew.printf(reportLine, p.SKU, p.Name, fmt.Sprint(p.Quantity), FormatCents(p.PriceCents), FormatCents(p.Value()))\n\t\ttotalQty += p.Quantity\n\t\ttotalValue += p.Value()\n\t\tif p.LowStock() {\n\t\t\tlow = append(low, p.SKU)\n\t\t}\n\t}\n\tew.printf(reportLine, \"TOTAL\", \"\", fmt.Sprint(totalQty), \"\", FormatCents(totalValue))\n\tslices.Sort(low) // rows may be in another order\n\tlowStr := \"none\"\n\tif len(low) > 0 {\n\t\tlowStr = strings.Join(low, \", \")\n\t}\n\tew.printf(\"low stock: %s\\n\", lowStr)\n\treturn ew.err\n}\n\n// errWriter remembers the first write error and turns later writes into\n// no-ops, so the report code can stay linear (see \"Errors are values\",\n// https://go.dev/blog/errors-are-values).\ntype errWriter struct {\n\tw   io.Writer\n\terr error\n}\n\nfunc (ew *errWriter) printf(format string, args ...any) {\n\tif ew.err != nil {\n\t\treturn\n\t}\n\t_, ew.err = fmt.Fprintf(ew.w, format, args...)\n}\n\nfunc main() {\n\ts := inventory.NewMemoryStore()\n\ts.Add(Product{SKU: \"A-1\", Name: \"Widget\", PriceCents: 199, Quantity: 10, ReorderLevel: 2})\n\ts.Add(Product{SKU: \"B-2\", Name: \"Gadget\", PriceCents: 1250, Quantity: 1, ReorderLevel: 3})\n\tinv := &Inventory{store: s}\n\tfmt.Println(inv.WriteReport(os.Stdout, ByValue))\n}\n```\n\n### Optimized Solution\n\nA performance-optimized version might:\n\n1. **Avoid allocations in List()** by using a preallocated slice:\n   ```go\n   import inventory \"gocourse/solutions/03-types-interfaces/project\"\n\n   type Product = inventory.Product\n\n   type MemoryStore struct {\n   \tmu       sync.Mutex\n   \tproducts map[string]Product\n   }\n\n   func (m *MemoryStore) List() []Product {\n   \tm.mu.Lock()\n   \tdefer m.mu.Unlock()\n   \tresult := make([]Product, 0, len(m.products)) // one allocation\n   \tfor _, p := range m.products {\n   \t\tresult = append(result, p)\n   \t}\n   \tslices.SortFunc(result, func(a, b Product) int { return cmp.Compare(a.SKU, b.SKU) })\n   \treturn result\n   }\n\n   func main() {\n   \tm := &MemoryStore{products: map[string]Product{\"B\": {SKU: \"B\"}, \"A\": {SKU: \"A\"}}}\n   \tfor _, p := range m.List() {\n   \t\tfmt.Print(p.SKU, \" \") // A B\n   \t}\n   \tfmt.Println()\n   }\n   ```\n   It saves the separate key slice, but `List` still sorts on every call.\n\n2. **Cache sorted keys in MemoryStore** to avoid repeated sorting:\n   ```go\n   type Product struct{ SKU string }\n\n   type MemoryStore struct {\n   \tmu         sync.Mutex\n   \tproducts   map[string]Product\n   \tsortedSKUs []string // cached sorted list of keys; nil when stale\n   }\n\n   func (m *MemoryStore) Add(p Product) {\n   \tm.mu.Lock()\n   \tdefer m.mu.Unlock()\n   \tm.products[p.SKU] = p\n   \tm.sortedSKUs = nil // every write must invalidate the cache\n   }\n\n   func (m *MemoryStore) SKUs() []string {\n   \tm.mu.Lock()\n   \tdefer m.mu.Unlock()\n   \tif m.sortedSKUs == nil {\n   \t\tm.sortedSKUs = slices.Sorted(maps.Keys(m.products))\n   \t}\n   \treturn slices.Clone(m.sortedSKUs)\n   }\n\n   func main() {\n   \tm := &MemoryStore{products: map[string]Product{}}\n   \tm.Add(Product{\"B\"})\n   \tm.Add(Product{\"A\"})\n   \tfmt.Println(m.SKUs()) // [A B]\n   }\n   ```\n   This adds complexity and only helps if `List()` is called repeatedly.\n\n3. **Use sync.RWMutex instead of sync.Mutex** if reads heavily outnumber writes:\n   ```go\n   type Product struct{ SKU string }\n\n   type MemoryStore struct {\n   \tmu       sync.RWMutex\n   \tproducts map[string]Product\n   }\n\n   func (m *MemoryStore) Get(sku string) (Product, bool) {\n   \tm.mu.RLock() // many readers at once\n   \tdefer m.mu.RUnlock()\n   \tp, ok := m.products[sku]\n   \treturn p, ok\n   }\n\n   func (m *MemoryStore) Add(p Product) {\n   \tm.mu.Lock() // writers are exclusive\n   \tdefer m.mu.Unlock()\n   \tm.products[p.SKU] = p\n   }\n\n   func main() {\n   \tm := &MemoryStore{products: map[string]Product{}}\n   \tm.Add(Product{\"A-1\"})\n   \tfmt.Println(m.Get(\"A-1\")) // {A-1} true\n   }\n   ```\n   But the added complexity may not be worth it unless profiling shows contention.\n\n### Trade-off\n\n**Readable:** The solution above is clear, correct, and maintainable. The performance is adequate for most inventory use cases.\n\n**Optimized:** Cache sorted keys, use RWMutex. These add complexity without major benefit unless profiling shows real bottlenecks.\n\n**Recommendation:** Start with the readable version. Optimize only if profiling shows the need.\n\n### Review Checklist\n\n**Product Type:**\n- [ ] Validates all fields in the correct order (SKU, Name, Price, Quantity, Reorder).\n- [ ] Error messages mention the offending field.\n- [ ] Errors wrap `ErrInvalid`.\n- [ ] `Value()` correctly computes PriceCents \u00d7 Quantity.\n- [ ] `LowStock()` returns true if Quantity <= ReorderLevel.\n- [ ] `String()` formats correctly: `` `SKU \"Name\" qty=N @ $X.YY` ``.\n- [ ] `FormatCents` handles all int64 values (including negative and min/max).\n\n**Store Interface & MemoryStore:**\n- [ ] All methods are implemented.\n- [ ] Store operations are concurrent-safe (use `sync.Mutex`).\n- [ ] `List()` returns products sorted by SKU in a newly allocated slice.\n- [ ] `Get()` and other methods return copies, never references to internal state.\n- [ ] Errors wrap the appropriate sentinel error (`ErrDuplicate`, `ErrNotFound`).\n- [ ] Compile-time assertion proves `*MemoryStore` implements `Store`.\n\n**Alerter & AlerterFunc:**\n- [ ] `AlerterFunc` is a function type.\n- [ ] `LowStock` method on AlerterFunc calls the underlying function.\n- [ ] Alerter may be nil (checked with `if inv.alerter != nil`).\n\n**Inventory Service:**\n- [ ] All methods are implemented.\n- [ ] `Sell` and `Receive` are atomic (use `sync.Mutex`).\n- [ ] `Sell` validates qty > 0.\n- [ ] `Sell` checks for insufficient stock before modifying.\n- [ ] `Sell` alerts only on transition from not-low to low stock (not always, not never).\n- [ ] `Receive` validates qty > 0.\n- [ ] `Receive` never triggers an alert.\n- [ ] `Filter` returns products sorted by SKU.\n- [ ] `LowStock` is implemented as a one-liner using `Filter`.\n- [ ] `TotalValue` sums the value of all products.\n- [ ] `Sorted` produces deterministic output (ties broken by SKU).\n- [ ] `Sorted` returns an error for unknown sort keys.\n- [ ] `WriteReport` produces fixed-width, aligned output.\n- [ ] `WriteReport` includes the TOTAL line.\n- [ ] `WriteReport` includes the \"low stock\" line.\n\n**Error Handling:**\n- [ ] All errors wrap sentinel errors with `%w`.\n- [ ] Error messages mention the context (e.g., SKU, field name).\n- [ ] No double-logging (errors are returned, not logged and returned).\n\n**Testing:**\n- [ ] All tests pass.\n- [ ] Tests are run with `-race` (no data races).\n- [ ] Tests cover edge cases (empty store, single product, ties in sorting).\n", "solDir": "/home/csmith/Workspace/tools/go-course/solutions/03-types-interfaces", "dir": "/home/csmith/Workspace/tools/go-course/modules/03-types-interfaces"}, {"slug": "04-testing", "compose": "modules/04-testing/compose.yaml", "services": ["test", "vet", "bench", "cover", "shell", "solutions", "fuzz"], "title": "Module 04 \u2014 Testing Like a Gopher", "lesson": "# Module 04 \u2014 Testing Like a Gopher\n\nThis module turns the course around. Until now you were given tests and wrote\ncode. Here you get **code with planted bugs and almost no tests**, and your job\nis to write the tests that expose the bugs, watch them fail, and only then fix\nthe code. That is how testing works in real life: nobody hands you the failing\ntest.\n\nEvery package tells you how many bugs it has. The starter tests that ship\nwith each exercise **pass**. That is deliberate: weak tests pass against\nbuggy code, and you are about to find out how.\n\n## Goals\n\nAfter this module you will be able to:\n\n- Write table-driven tests with named subtests, and run a single case from the command line.\n- Write failure messages that make a bug obvious without opening the test file.\n- Use the `testing` helpers correctly: `t.Helper`, `t.Cleanup`, `t.TempDir`, `t.Setenv`, `t.Context`, `t.Parallel`.\n- Choose between `package foo` (white-box) and `package foo_test` (black-box) tests.\n- Test code that depends on time and the outside world with **fakes** injected through small interfaces.\n- Write golden-file tests with an `-update` flag, and review golden files critically.\n- Write fuzz tests with real **properties** (round-trip, oracle, invariants) and turn fuzzer findings into regression tests.\n- Write `Example` functions that are documentation *and* tests.\n- Write benchmarks with Go 1.24's `b.Loop()`, read `-benchmem` output, and pin allocation promises with `testing.AllocsPerRun`.\n- Measure coverage and read a coverage report to find untested branches.\n\n## Concepts\n\n### 1. The mechanics: what `go test` actually does\n\n`go test` compiles each package **together with its `_test.go` files** into a\ntest binary and runs it. Inside `_test.go` files:\n\n| Function shape | Kind | Runs on plain `go test`? |\n|---|---|---|\n| `func TestXxx(t *testing.T)` | test | yes |\n| `func ExampleXxx()` with `// Output:` | example | yes (output compared) |\n| `func ExampleXxx()` without `// Output:` | example | **compiled only** |\n| `func BenchmarkXxx(b *testing.B)` | benchmark | only with `-bench` |\n| `func FuzzXxx(f *testing.F)` | fuzz test | seeds + corpus only; fuzzes with `-fuzz` |\n| `func TestMain(m *testing.M)` | setup hook | wraps everything (rarely needed) |\n\nUseful flags (all commands are run from the course root):\n\n```bash\ngo test ./modules/04-testing/...               # every package below this dir\ngo test -v ./modules/04-testing/exercises/paginate/   # verbose: every test, every log\ngo test -run 'TestBounds/page_zero' ./...      # one subtest (regexp per level, split on /)\ngo test -count=1 ./...                         # bypass the test result cache\ngo test -shuffle=on ./...                      # random test order: finds hidden coupling\ngo test -race ./...                            # data race detector\ngo test -failfast ./...                        # stop at the first failure\n```\n\n`go test` caches passing results. `(cached)` in the output means nothing\nwas re-run. Use `-count=1` when a test reads files or the environment that\nGo can't track.\n\n### 2. Table-driven tests and subtests\n\nThe idiomatic Go test is a **table**: a slice of cases, and one loop that runs\neach case as a named subtest.\n\n```go\nfunc TestPages(t *testing.T) {\n\ttests := []struct {\n\t\tname           string\n\t\ttotal, perPage int\n\t\twant           int\n\t}{\n\t\t{\"no items\", 0, 10, 0},\n\t\t{\"partial page\", 5, 10, 1},\n\t\t{\"exact multiple\", 20, 10, 2},\n\t\t{\"one over\", 21, 10, 3},\n\t\t{\"bad page size\", 10, 0, 0},\n\t}\n\tfor _, tt := range tests {\n\t\tt.Run(tt.name, func(t *testing.T) {\n\t\t\tif got := Pages(tt.total, tt.perPage); got != tt.want {\n\t\t\t\tt.Errorf(\"Pages(%d, %d) = %d, want %d\", tt.total, tt.perPage, got, tt.want)\n\t\t\t}\n\t\t})\n\t}\n}\n\n// Pages returns how many pages of perPage items hold total items.\nfunc Pages(total, perPage int) int {\n\tif perPage <= 0 {\n\t\treturn 0\n\t}\n\treturn (total + perPage - 1) / perPage\n}\n```\n\nWhy this shape wins:\n\n- **Adding a case is one line.** Edge cases stop being \"too much effort\".\n- **Subtests are independent.** A `t.Fatal` in one case stops only that case.\n- **Each case has a name**, so `go test -run 'TestPages/exact_multiple'` runs\n  just that one. Spaces in names become underscores.\n- Since **Go 1.22** each loop iteration has its own `tt`, so the old\n  `tt := tt` line is no longer needed, even with `t.Parallel()`\n  ([Go blog: Fixing For Loops in Go 1.22](https://go.dev/blog/loopvar-preview)).\n\nUse **named fields** in the table (`{name: \"x\", line: \"...\", wantErr: ErrSyntax}`)\nonce a case has more than three or four fields, or when most cases leave some\nfields at their zero value.\n\n#### `t.Error` vs `t.Fatal`\n\n- `t.Errorf` records a failure and **keeps going**: you see every wrong field\n  at once.\n- `t.Fatalf` records a failure and **stops this test or subtest** (via\n  `runtime.Goexit`). Use it when continuing makes no sense, e.g. the call\n  returned an error so the result is meaningless.\n- Call `t.Fatal*` only from the goroutine running the test. From another\n  goroutine, it cannot stop the test. Send the error back on a channel instead.\n\n#### Failure messages\n\nThe [Go Code Review Comments](https://go.dev/wiki/CodeReviewComments#useful-test-failures)\nconvention: **function, input, got, want**, in that order.\n\n```go expect=runtime-error\n// This test fails on purpose, so you can compare the messages.\nfunc TestMessages(t *testing.T) {\n\tline, got, want := \"a,b\", []string{\"a\"}, []string{\"a\", \"b\"}\n\n\t// Good: tells you everything without opening the file.\n\tt.Errorf(\"Split(%q) = %q, want %q\", line, got, want)\n\n\t// Bad: which input? which value is which?\n\tt.Errorf(\"wrong result\")\n\tt.Errorf(\"expected %v but got %v\", want, got) // backwards, no input\n}\n```\n\nUse `%q` for strings: it makes empty strings, spaces, quotes and newlines\nvisible. A failing message like `Join([\"a\" \"\"]) = \"a\", want \"a,\"` is half the\ndebugging done for you.\n\n#### Comparing values\n\n- Comparable values: `==`.\n- Slices: `slices.Equal(got, want)`; maps: `maps.Equal(got, want)`.\n- Structs containing slices or maps: `reflect.DeepEqual`. It works, but its\n  failure output is poor, so print both sides with `%+v`. (Outside the standard\n  library, `github.com/google/go-cmp/cmp.Diff` is the usual choice.)\n- Errors: **`errors.Is(err, ErrX)`**, never `err == ErrX` (breaks when\n  wrapped) and never `err.Error() == \"...\"` (breaks when reworded).\n\n### 3. Helpers and lifecycle\n\nA **helper** is a function your tests call that itself reports failures. Mark\nit with `t.Helper()` so failures point at the *caller's* line:\n\n```go\nfunc assertPages(t *testing.T, total, perPage, want int) {\n\tt.Helper() // without this, every failure points at the line below\n\tif got := Pages(total, perPage); got != want {\n\t\tt.Errorf(\"Pages(%d, %d) = %d, want %d\", total, perPage, got, want)\n\t}\n}\n\nfunc TestPagesHelper(t *testing.T) {\n\tassertPages(t, 21, 10, 3)\n\tassertPages(t, 0, 10, 0)\n\t// Change a want above: the failure then names this line, not the helper's.\n}\n\n// Pages returns how many pages of perPage items hold total items.\nfunc Pages(total, perPage int) int {\n\tif perPage <= 0 {\n\t\treturn 0\n\t}\n\treturn (total + perPage - 1) / perPage\n}\n```\n\nThe `testing.T` toolbox for setup and teardown:\n\n```go\nfunc TestImport(t *testing.T) {\n\tdir := t.TempDir()           // fresh dir, removed after the test\n\tt.Setenv(\"APP_MODE\", \"test\") // restored after the test\n\tctx := t.Context()           // Go 1.24: cancelled just before Cleanup funcs run\n\tdb := openTestDB(t, dir)     // a helper that registers its own cleanup\n\tt.Logf(\"db at %s, mode %s, ctx err %v\", db.path, os.Getenv(\"APP_MODE\"), ctx.Err())\n}\n\nfunc openTestDB(t *testing.T, dir string) *DB {\n\tt.Helper()\n\tdb, err := Open(filepath.Join(dir, \"test.db\"))\n\tif err != nil {\n\t\tt.Fatalf(\"Open: %v\", err)\n\t}\n\tt.Cleanup(func() { db.Close() }) // runs when the *test* ends, not when this helper returns\n\treturn db\n}\n\n// A stand-in database: just a file.\ntype DB struct {\n\tpath string\n\tf    *os.File\n}\n\nfunc Open(path string) (*DB, error) {\n\tf, err := os.Create(path)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\treturn &DB{path: path, f: f}, nil\n}\n\nfunc (db *DB) Close() error { return db.f.Close() }\n```\n\nWhy `t.Cleanup` instead of `defer`? A `defer` inside `openTestDB` would run\nwhen the **helper** returns, closing the database before the test uses it.\n`t.Cleanup` runs when the **test** (and all its subtests) finishes, in\nlast-in-first-out order. Inside the test function itself, `defer` and\n`t.Cleanup` both work; in helpers only `t.Cleanup` does.\n\n(`t.Context` and `t.Chdir` are new in Go 1.24.)\n\n### 4. Parallel tests\n\n`t.Parallel()` marks a test or subtest as safe to run alongside other parallel\ntests. It pays off for slow, independent cases. For microsecond-fast table\ncases, the gain is negligible.\n\n```go\nfunc TestFetch(t *testing.T) {\n\tsrv := startFakeServer(t) // shared, read-only fixture\n\tt.Cleanup(srv.Close)      // NOT defer, see below\n\ttests := []struct{ name, path, want string }{\n\t\t{\"root\", \"/\", \"hello /\"},\n\t\t{\"page\", \"/about\", \"hello /about\"},\n\t}\n\tfor _, tt := range tests {\n\t\tt.Run(tt.name, func(t *testing.T) {\n\t\t\tt.Parallel()\n\t\t\tresp, err := http.Get(srv.URL + tt.path)\n\t\t\tif err != nil {\n\t\t\t\tt.Fatal(err)\n\t\t\t}\n\t\t\tdefer resp.Body.Close()\n\t\t\tbody, _ := io.ReadAll(resp.Body)\n\t\t\tif got := string(body); got != tt.want {\n\t\t\t\tt.Errorf(\"GET %s = %q, want %q\", tt.path, got, tt.want)\n\t\t\t}\n\t\t})\n\t}\n}\n\nfunc startFakeServer(t *testing.T) *httptest.Server {\n\tt.Helper()\n\treturn httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tfmt.Fprintf(w, \"hello %s\", r.URL.Path)\n\t}))\n}\n```\n\nThe trap: when a subtest calls `t.Parallel()`, it **pauses until the parent\ntest function returns**. So `defer srv.Close()` in the parent would run\n*before* the parallel subtests do. `t.Cleanup` waits for the subtests.\n\nDon't parallelise tests that share mutable state (package variables, the\nworking directory, environment variables). `t.Setenv` and `t.Chdir` panic in\nparallel tests for exactly this reason. Run `go test -race` on anything\nparallel.\n\n### 5. White-box vs black-box tests\n\nA `_test.go` file in directory `semver/` can declare either package:\n\n- `package semver`: **white-box**. Sees unexported identifiers. Good for\n  testing a tricky private helper (`money`, `checkIdents`).\n- `package semver_test`: **black-box**. Must import the package like any\n  user would, and sees only the exported API:\n\n```go\npackage semver_test\n\nimport (\n\t\"testing\"\n\n\t\"gocourse/modules/04-testing/project/semver\"\n)\n\nfunc TestParse(t *testing.T) {\n\tv, err := semver.Parse(\"1.2.3\")\n\tif err != nil {\n\t\tt.Fatalf(\"Parse(%q) error: %v\", \"1.2.3\", err)\n\t}\n\tif got := v.String(); got != \"1.2.3\" {\n\t\tt.Errorf(\"Parse(%q).String() = %q, want %q\", \"1.2.3\", got, \"1.2.3\")\n\t}\n\t// v.checkIdents(...) would not compile here: semver_test sees only the exported API.\n}\n```\n\nPrefer black-box tests for a package's public behaviour: they survive\nrefactoring, and they read like documentation. `Example` functions are almost\nalways black-box. Both kinds can live in the same directory.\n\n### 6. Fakes: testing code that touches time and the world\n\nCode that calls `time.Now()` or sends real email directly is hard to test.\nThe fix is the same one you met in module 03: depend on a **small interface**,\nand pass a **fake** in tests.\n\n```go\n// production code\ntype Clock interface{ Now() time.Time }\n\n// test code\ntype fakeClock struct{ now time.Time }\n\nfunc (c *fakeClock) Now() time.Time          { return c.now }\nfunc (c *fakeClock) Advance(d time.Duration) { c.now = c.now.Add(d) }\n\nvar _ Clock = (*fakeClock)(nil) // compile-time check: fakeClock implements Clock\n\nfunc TestFakeClock(t *testing.T) {\n\tclk := &fakeClock{now: time.Date(2026, 1, 1, 9, 0, 0, 0, time.UTC)}\n\tvar c Clock = clk // production code only sees the interface\n\tclk.Advance(90 * time.Minute)\n\tif got := c.Now().Format(\"15:04\"); got != \"10:30\" {\n\t\tt.Errorf(\"Now() = %s, want 10:30\", got)\n\t}\n}\n```\n\nA **fake** is a tiny working implementation: it records what happened, and the\ntest inspects its state afterwards. A **mock** is scripted with expected\ncalls in advance. Go code mostly prefers fakes: they are simpler, and tests\ncheck *outcomes* rather than the exact sequence of calls, so they break less\noften when the implementation changes.\n\nRules of thumb:\n\n- **Never `time.Sleep` in a test** to \"wait until something is due\". Advance\n  the fake clock instead. Tests become instant and deterministic.\n- Make the fake able to **fail** (e.g. a map of recipient \u2192 error) so you can\n  test error paths.\n- Build fresh fakes in every test (a `newTestX(t)` helper), never share them.\n\n(Go 1.25 adds `testing/synctest`, which runs goroutines in a bubble with a fake\nclock. It is out of scope here, since this course targets Go 1.24, but worth\nknowing about.)\n\n### 7. Golden files\n\nFor large outputs (rendered tables, generated code, JSON), writing the\nexpected string inline is painful. A **golden file** stores the expected\noutput under `testdata/`. The `go` tool ignores `testdata` directories when\nbuilding, so they are the conventional place for test inputs and outputs.\n\n```go\nvar update = flag.Bool(\"update\", false, \"rewrite golden files\")\n\nfunc assertGolden(t *testing.T, path string, got []byte) {\n\tt.Helper()\n\tif *update {\n\t\tif err := os.WriteFile(path, got, 0o644); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\treturn\n\t}\n\twant, err := os.ReadFile(path)\n\tif err != nil {\n\t\tt.Fatalf(\"reading golden file (run with -update to create it): %v\", err)\n\t}\n\tif !bytes.Equal(got, want) {\n\t\tt.Errorf(\"output differs from %s:\\ngot:\\n%s\\nwant:\\n%s\", path, got, want)\n\t}\n}\n\nfunc TestReport(t *testing.T) {\n\tgot := []byte(\"total: 3 items\\n\")\n\tpath := filepath.Join(t.TempDir(), \"report.golden\") // normally testdata/report.golden\n\tos.WriteFile(path, []byte(\"total: 3 items\\n\"), 0o644) // as if a reviewed -update run made it\n\tassertGolden(t, path, got)\n}\n```\n\nThe workflow:\n\n1. Write the test. Run it with `-update` to create the files:\n   `go test ./modules/04-testing/exercises/report/ -update`\n2. **Open every golden file and check it by eye against the spec.** This is\n   the step people skip, and it is the whole point.\n3. Run without `-update`: from now on, any change in output fails the test.\n\nThe danger is that **`-update` records whatever the code produces, bugs\nincluded.** If you run it on buggy code and don't read the result, your test\nnow *guarantees* the bug. Pair golden tests with a few small, targeted\nassertions (a unit test for a formatting helper, a check of one specific\nline) that do not depend on the golden file.\n\n### 8. Example functions\n\n```go\n// This example uses the reference semver. Point the import at\n// gocourse/modules/04-testing/project/semver to check yours.\nimport \"gocourse/solutions/04-testing/project/semver\"\n\nfunc ExampleCompare() {\n\ta := semver.MustParse(\"1.0.0-rc.1\")\n\tb := semver.MustParse(\"1.0.0\")\n\tfmt.Println(semver.Compare(a, b))\n\t// Output: -1\n}\n```\n\n- `go test` runs the example and compares its stdout with the `// Output:`\n  comment (leading and trailing whitespace ignored). It fails if they differ.\n- **No `// Output:` comment \u2192 the example is compiled but never run.**\n- `// Unordered output:` compares lines in any order (for map iteration).\n- Naming links the example to an identifier in `go doc` and pkg.go.dev:\n  `Example` (package), `ExampleCompare` (function), `ExampleVersion_String`\n  (method), `ExampleCompare_prerelease` (a second example; the suffix starts\n  lowercase).\n\nExamples are the best documentation you can write, because they cannot go\nstale: they are tested.\n\n### 9. Fuzzing\n\nA table test checks the inputs **you** thought of. A fuzz test states a\n**property** that must hold for *every* input, and lets the fuzzer search for\nan input that breaks it ([Go fuzzing docs](https://go.dev/doc/security/fuzz)).\n\n```go\nfunc FuzzReverse(f *testing.F) {\n\tf.Add(\"hello\") // seed corpus: ordinary examples\n\tf.Add(\"\")\n\tf.Fuzz(func(t *testing.T, s string) {\n\t\tif !utf8.ValidString(s) {\n\t\t\tt.Skip() // property only defined for valid UTF-8\n\t\t}\n\t\tif got := Reverse(Reverse(s)); got != s {\n\t\t\tt.Errorf(\"Reverse(Reverse(%q)) = %q\", s, got)\n\t\t}\n\t})\n}\n\n// Reverse reverses s rune by rune.\nfunc Reverse(s string) string {\n\tr := []rune(s)\n\tslices.Reverse(r)\n\treturn string(r)\n}\n```\n\n```bash\ngo test ./pkg/                                     # runs seeds + testdata corpus only (fast)\ngo test ./pkg/ -run='^$' -fuzz='^FuzzReverse$' -fuzztime=20s   # actually fuzz\n```\n\nWhat you need to know:\n\n- `-fuzz` works on **one package and one fuzz target** at a time; the regexp\n  must match exactly one `FuzzXxx`. `-run='^$'` skips the normal tests.\n- Fuzz arguments may only be: `string`, `[]byte`, `bool`, `float32`,\n  `float64`, and the integer types (`int`, `int8`\u2026`int64`, `uint`,\n  `uint8`\u2026`uint64`, plus `byte` and `rune`). Build structs inside the fuzz\n  function from these.\n- When the fuzzer finds a failure, it **minimises** the input and writes it to\n  `testdata/fuzz/FuzzXxx/<hash>`. From then on, plain `go test` replays it as\n  a regression test. **Commit these files.** Then copy the input into a\n  table test with a `// Found by FuzzXxx` comment so humans can read it.\n- A panic inside the target counts as a failure. You don't need to `recover`.\n\nGood fuzz properties, from strongest to weakest:\n\n1. **Round-trip**: `Decode(Encode(x)) == x`; `Parse(v.String()) == v`.\n2. **Oracle / differential**: the result equals a slow-but-obviously-correct\n   implementation (`strings.Join`, the readable version of a fast function).\n3. **Invariants**: output is sorted; `Compare(a, b) == -Compare(b, a)`;\n   errors are always one of the documented sentinels.\n4. **Doesn't panic**: the weakest property, but still finds real bugs.\n\nA fuzz target that checks nothing except \"doesn't panic\" will miss every bug\nthat returns a wrong answer quietly.\n\n### 10. Benchmarks\n\n```go\nfunc BenchmarkJoin(b *testing.B) {\n\telems := makeElems(100, 8) // setup: runs once, not timed\n\tb.ReportAllocs()\n\tfor b.Loop() {\n\t\tstrings.Join(elems, \",\")\n\t}\n}\n\n// makeElems returns n strings of the given length.\nfunc makeElems(n, size int) []string {\n\telems := make([]string, n)\n\tfor i := range elems {\n\t\telems[i] = strings.Repeat(\"x\", size)\n\t}\n\treturn elems\n}\n```\n\n```bash\ngo test ./pkg/ -run='^$' -bench=. -benchmem -count=5\n```\n\n`for b.Loop()` (new in Go 1.24, see the [Go blog post](https://go.dev/blog/testing-b-loop))\nreplaces the old `for i := 0; i < b.N; i++`:\n\n- The benchmark function runs **once** per `-count`, so setup before the loop\n  runs once too. You no longer need `b.ResetTimer()`: the timer starts at the\n  first `b.Loop()` call.\n- Calls in the loop body are **kept alive**: the compiler cannot optimise\n  away `strings.Join(...)` just because the result is unused. No more\n  `var sink string` tricks.\n\nReading the output:\n\n```\nBenchmarkJoin/Builder/n=100-20   790906   1511 ns/op   1024 B/op   1 allocs/op\n```\n\nThat line shows: the name with sub-benchmark and `GOMAXPROCS`, the iterations\nrun, time per op, bytes allocated per op, and allocations per op.\n**Allocations are often the real cost:** each one costs time now and\ngarbage-collector work later.\n\n- Use `b.Run(\"name\", ...)` for sub-benchmarks (sizes, implementations).\n- Benchmarks are noisy. Run `-count=5` or more, and compare runs with\n  `benchstat` (from `golang.org/x/perf`, an external tool):\n  `benchstat old.txt new.txt`.\n- **Pin performance promises in tests.** If a doc comment says \"allocates\n  once\", enforce it in a test that runs on every `go test`:\n\n```go\nfunc TestJoinBuilderAllocatesOnce(t *testing.T) {\n\telems := makeElems(100, 10)\n\tif n := testing.AllocsPerRun(100, func() { JoinBuilder(elems, \",\") }); n > 1 {\n\t\tt.Errorf(\"JoinBuilder allocated %.1f times per call, want at most 1\", n)\n\t}\n}\n\n// JoinBuilder is strings.Join with one up-front allocation.\nfunc JoinBuilder(elems []string, sep string) string {\n\tn := len(sep) * max(len(elems)-1, 0)\n\tfor _, e := range elems {\n\t\tn += len(e)\n\t}\n\tvar b strings.Builder\n\tb.Grow(n)\n\tfor i, e := range elems {\n\t\tif i > 0 {\n\t\t\tb.WriteString(sep)\n\t\t}\n\t\tb.WriteString(e)\n\t}\n\treturn b.String()\n}\n\nfunc makeElems(n, size int) []string {\n\telems := make([]string, n)\n\tfor i := range elems {\n\t\telems[i] = strings.Repeat(\"x\", size)\n\t}\n\treturn elems\n}\n```\n\n### 11. Coverage\n\n```bash\ngo test -cover ./modules/04-testing/project/semver/\ngo test -coverprofile=c.out ./modules/04-testing/project/semver/\ngo tool cover -func=c.out    # percentage per function\ngo tool cover -html=c.out    # source view: green = run, red = never run\n```\n\nCoverage tells you which lines **never ran**. It cannot tell you whether the\nlines that ran were *checked*. A test that calls every function and asserts\nnothing has 100% coverage and catches nothing. Use the HTML view to find\nuntested branches, then ask \"what input reaches that branch, and what should\nhappen?\". Aim for high coverage of logic; chasing the last few percent on\ntrivial code is rarely worth it.\n\n## Idioms & Best Practices\n\n- **Table-driven + `t.Run`** for anything with more than two cases.\n  ```go\n  // Good: one table, one loop, named subtests\n  func TestPages(t *testing.T) {\n  \ttests := []struct {\n  \t\tname               string\n  \t\ttotal, per, want int\n  \t}{\n  \t\t{\"partial\", 5, 10, 1},\n  \t\t{\"one over\", 21, 10, 3},\n  \t}\n  \tfor _, tt := range tests {\n  \t\tt.Run(tt.name, func(t *testing.T) {\n  \t\t\tif got := Pages(tt.total, tt.per); got != tt.want {\n  \t\t\t\tt.Errorf(\"Pages(%d, %d) = %d, want %d\", tt.total, tt.per, got, tt.want)\n  \t\t\t}\n  \t\t})\n  \t}\n  }\n\n  // Bad: one function per case, copy-pasted\n  func TestPages1(t *testing.T) {\n  \tif Pages(5, 10) != 1 {\n  \t\tt.Error(\"fail\")\n  \t}\n  }\n  func TestPages2(t *testing.T) {\n  \tif Pages(21, 10) != 3 {\n  \t\tt.Error(\"fail\")\n  \t}\n  }\n\n  // Pages returns how many pages of perPage items hold total items.\n  func Pages(total, perPage int) int {\n  \tif perPage <= 0 {\n  \t\treturn 0\n  \t}\n  \treturn (total + perPage - 1) / perPage\n  }\n  ```\n- **Function, input, got, want** in every failure message.\n  ```go expect=runtime-error\n  // Fails on purpose: compare the two messages.\n  func TestMessage(t *testing.T) {\n  \ttotal, per, want := 21, 10, 3\n  \tgot := 2\n  \tt.Errorf(\"Pages(%d, %d) = %d, want %d\", total, per, got, want) // good\n  \tt.Errorf(\"got %d\", got)                                        // bad\n  }\n  ```\n- **`t.Helper()` first line** of every helper that calls `t.Error*`/`t.Fatal*`.\n- **`t.Cleanup` in helpers**, never `defer` (a deferred close in a helper runs too early).\n- **`errors.Is` / `errors.As`** for errors.\n  ```go\n  var ErrInvalidPage = errors.New(\"page out of range\")\n\n  err := fmt.Errorf(\"bounds(total=5, page=3): %w\", ErrInvalidPage)\n  fmt.Println(errors.Is(err, ErrInvalidPage))     // true: good\n  fmt.Println(err.Error() == \"page out of range\") // false: bad, breaks on rewording or wrapping\n  ```\n- **Inject dependencies** (clock, sender, filesystem via `fs.FS`, `io.Writer`) instead of reaching for globals.\n  ```go\n  type Clock interface{ Now() time.Time }\n  type Sender interface{ Send(to, body string) error }\n\n  type Scheduler struct {\n  \tclock  Clock\n  \tsender Sender\n  \tdue    time.Time\n  }\n\n  func New(clock Clock, sender Sender) *Scheduler { return &Scheduler{clock: clock, sender: sender} }\n\n  // Good: the time comes from the injected clock, so a test controls it.\n  func (s *Scheduler) Flush() error {\n  \tif s.clock.Now().Before(s.due) {\n  \t\treturn nil\n  \t}\n  \treturn s.sender.Send(\"ada\", \"time's up\")\n  }\n\n  // Bad would be `if time.Now().Before(s.due)`: an untestable boundary.\n\n  // Fakes for a test:\n  type fixedClock time.Time\n\n  func (c fixedClock) Now() time.Time { return time.Time(c) }\n\n  type printSender struct{}\n\n  func (printSender) Send(to, body string) error { fmt.Println(\"to\", to+\":\", body); return nil }\n\n  start := time.Date(2026, 1, 1, 9, 0, 0, 0, time.UTC)\n  s := New(fixedClock(start), printSender{}) // good: test passes fakes\n  s.due = start.Add(time.Hour)\n  s.Flush() // not due: prints nothing\n  s.clock = fixedClock(start.Add(2 * time.Hour))\n  s.Flush() // to ada: time's up\n  ```\n- **Fakes over mocks**: assert on outcomes, not on call sequences.\n- **Test against an oracle** when one exists: `strings.Join`, the spec's example list, a slow reference implementation.\n- **`testdata/`** for fixtures and golden files; never write test output next to source files.\n- **Fuzz anything that parses.** A round-trip property is usually one line.\n- **Commit fuzz findings** (`testdata/fuzz/...`) and copy them into a readable table case.\n- **`b.Loop()`, `b.ReportAllocs()`**, setup outside the loop.\n- **Write the failing test first** when fixing a bug: it proves the bug exists and that your fix fixed it.\n\n## Common Pitfalls\n\n- **Tests that cannot fail.** The test passes against the buggy code too.\n  The only way to know is to see it fail: write the test *before* the fix and\n  watch it go red. If you fixed first, temporarily put the bug back.\n- **Testing the implementation instead of the spec.** If you derive the\n  expected values by reading the code, you copy its bugs into your tests.\n  Derive them from the doc comment or the spec.\n- **Missing boundaries.** Off-by-one bugs live at `0`, `1`, `n-1`, `n`,\n  `n+1`, at \"exactly equal\" times, and in empty inputs. Test both sides of\n  every boundary.\n- **Blind `-update`.** Regenerating golden files on buggy code and committing\n  them unread turns a bug into a test requirement.\n- **Byte length vs rune count.** `len(\"\u00e9\") == 2`. Text layout tests need\n  non-ASCII input.\n- **`defer` in a test helper**, or in a parent test with parallel subtests:\n  it runs too early. Use `t.Cleanup`.\n- **`t.Fatal` from a spawned goroutine**: it can't stop the test. Report\n  through a channel, or use `t.Error`.\n- **Shared state between tests**: package-level fakes, environment variables,\n  the working directory. `go test -shuffle=on` and `-count=2` flush these out.\n- **`time.Sleep` in tests**: slow and flaky. Inj
